: 4, "ct": "Capítulo II", "t": "Hallward ficou lívido e segurou a mão dele. – Dorian! Dorian! – ele exclamou –, não fale assim. Nunca tive um amigo como você e nunca mais terei outro. Você não tem ciúmes de coisas materiais, tem? – você é mais belo que qualquer uma delas!", "h": 0}, {"i": 228, "c": 4, "ct": "Capítulo II", "t": "– Tenho ciúme de tudo cuja beleza não morre. Estou com ciúme do retrato que você fez de mim. Por que ele há de conservar aquilo que eu hei de perder? Cada momento que passa leva embora algo de mim e dá algo a ele. Oh, se ao menos fosse o contrário! Se o quadro pudesse mudar, e eu pudesse ser sempre o que sou agora! Por que você o pintou? Algum dia ele há de zombar de mim – zombar horrivelmente! – Lágrimas quentes brotaram de seus olhos; ele afastou a mão do amigo e, atirando-se no divã, afundou o rosto nas almofadas, como se estivesse rezando.", "h": 0}, {"i": 229, "c": 4, "ct": "Capítulo II", "t": "– Isso é culpa sua, Harry – disse o pintor, amargamente.", "h": 0}, {"i": 230, "c": 4, "ct": "Capítulo II", "t": "Lorde Henry deu de ombros. – Esse é o verdadeiro Dorian Gray – apenas isso.", "h": 0}, {"i": 231, "c": 4, "ct": "Capítulo II", "t": "– Não é.", "h": 0}, {"i": 232, "c": 4, "ct": "Capítulo II", "t": "– Se não é, o que eu tenho a ver com isso?", "h": 0}, {"i": 233, "c": 4, "ct": "Capítulo II", "t": "– Você devia ter ido embora quando eu pedi – ele murmurou.", "h": 0}, {"i": 234, "c": 4, "ct": "Capítulo II", "t": "– Eu fiquei quando você me pediu para ficar – foi a resposta de lorde Henry.", "h": 0}, {"i": 235, "c": 4, "ct": "Capítulo II", "t": "– Harry, não quero brigar com os meus dois melhores amigos de uma vez, mas vocês dois me fizeram odiar o melhor quadro que eu já fiz, e agora vou destruí-lo. O que é um quadro além de tela e tinta? Não deixarei que esse retrato se interponha entre nós três e prejudique as nossas vidas.", "h": 0}, {"i": 236, "c": 4, "ct": "Capítulo II", "t": "Dorian Gray ergueu a cabeça dourada da almofada e, com rosto pálido e olhos marejados de lágrimas, olhou para ele, enquanto ele caminhava até a mesa de pintura que ficava embaixo de uma janela de longas cortinas. O que ele estava fazendo ali? Seus dedos tateavam, entre restos de bisnagas de alumínio e pincéis secos, em busca de alguma coisa. Sim, era a espátula longa da paleta, com sua lâmina fina de aço flexível. Finalmente encontrou-a. Ele iria rasgar a tela.", "h": 0}, {"i": 237, "c": 4, "ct": "Capítulo II", "t": "Contendo um soluço, o rapaz se ergueu do divã e, correndo até Hallward, arrancou a espátula da mão dele e atirou-a do outro lado do estúdio. – Não, Basil, não! – ele exclamou. – Seria um crime!", "h": 0}, {"i": 238, "c": 4, "ct": "Capítulo II", "t": "– Fico contente que você goste finalmente do meu quadro, Dorian – disse o pintor, friamente, depois de se recuperar da surpresa. – Pensei que você jamais gostaria dele.", "h": 0}, {"i": 239, "c": 4, "ct": "Capítulo II", "t": "– Gostar? Eu estou apaixonado por ele, Basil. Ele é uma parte de mim. Eu sinto isso.", "h": 0}, {"i": 240, "c": 4, "ct": "Capítulo II", "t": "– Bem, assim que você secar, será envernizado, emoldurado e enviado para casa. Lá você poderá fazer o que quiser consigo mesmo. – Ele atravessou o estúdio e tocou a sineta para pedir o chá. – Você também quer chá, não, Dorian? E você também, Harry? Ou você tem alguma objeção aos prazeres mais simples?", "h": 0}, {"i": 241, "c": 4, "ct": "Capítulo II", "t": "– Adoro os prazeres mais simples – disse lorde Henry. – Eles são o último refúgio dos mais complexos. Mas eu não gosto de cenas, exceto no teatro. Como vocês são absurdos, vocês dois! Eu gostaria de saber quem foi que disse que o homem é um animal racional. Foi a definição mais prematura jamais formulada. O homem pode ser muitas coisas, mas não é racional. Ainda bem que não é, aliás; mas vocês não deveriam brigar por causa do quadro. Seria muito melhor que você me deixasse ficar com ele, Basil. Esse menino bobo não quer efetivamente o quadro, e eu efetivamente quero.", "h": 0}, {"i": 242, "c": 4, "ct": "Capítulo II", "t": "– Se você der para qualquer pessoa além de mim, Basil, jamais o perdoarei! – exclamou Dorian Gray –; e eu não permito que me chamem de menino bobo.", "h": 0}, {"i": 243, "c": 4, "ct": "Capítulo II", "t": "– Você sabe muito bem que o quadro é seu, Dorian. Eu lhe dei antes mesmo de pintá-lo.", "h": 0}, {"i": 244, "c": 4, "ct": "Capítulo II", "t": "– E você sabe que foi um pouco tolo, senhor Gray, e que, na verdade, você não se importa de ser lembrado de que é extremamente jovem.", "h": 0}, {"i": 245, "c": 4, "ct": "Capítulo II", "t": "– Eu deveria ter feito objeção hoje pela manhã, lorde Henry.", "h": 0}, {"i": 246, "c": 4, "ct": "Capítulo II", "t": "– Ah! Esta manhã! Você começou a viver de lá para cá.", "h": 0}, {"i": 247, "c": 4, "ct": "Capítulo II", "t": "Bateram na porta, e o mordomo entrou com uma bandeja de chá carregada e a deixou sobre uma pequena mesa japonesa. Ouviu-se o entrechocar das xícaras e pires e o ciciar de um bule canelado georgiano. Dois pratos de porcelana em forma de globos foram trazidos por um pajem. Dorian Gray foi até lá e serviu o chá. Os dois passaram languidamente à mesa e examinaram o que havia sob as redomas.", "h": 0}, {"i": 248, "c": 4, "ct": "Capítulo II", "t": "– Vamos ao teatro hoje à noite – disse lorde Henry. – Deve haver alguma coisa em cartaz, em algum lugar. Prometi jantar no White’s, mas é apenas um velho amigo, de modo que posso telegrafar avisando que estou doente, ou que não poderei ir por ter marcado um compromisso para depois. Creio que seria uma bela desculpa: teria toda a surpresa da candura.", "h": 0}, {"i": 249, "c": 4, "ct": "Capítulo II", "t": "– É tão maçante vestir casaca – murmurou Hallward. – E, depois que a vestimos, é sempre um horror.", "h": 0}, {"i": 250, "c": 4, "ct": "Capítulo II", "t": "– Sim – respondeu lorde Henry, sonhadoramente –, a indumentária do século XIX é detestável. É tão sombria, tão deprimente. O pecado é o único elemento colorido real que sobrou na vida moderna.", "h": 0}, {"i": 251, "c": 4, "ct": "Capítulo II", "t": "– Você realmente não deveria dizer essas coisas na frente do Dorian, Harry.", "h": 0}, {"i": 252, "c": 4, "ct": "Capítulo II", "t": "– Na frente de qual Dorian? O que está nos servindo o chá, ou o do quadro?", "h": 0}, {"i": 253, "c": 4, "ct": "Capítulo II", "t": "– De nenhum deles.", "h": 0}, {"i": 254, "c": 4, "ct": "Capítulo II", "t": "– Eu gostaria de ir ao teatro com você, lorde Henry – disse o rapaz.", "h": 0}, {"i": 255, "c": 4, "ct": "Capítulo II", "t": "– Então você irá; e você vai também, não é, Basil?", "h": 0}, {"i": 256, "c": 4, "ct": "Capítulo II", "t": "– Na verdade, não posso. Nem poderei tão cedo. Tenho muito trabalho a fazer.", "h": 0}, {"i": 257, "c": 4, "ct": "Capítulo II", "t": "– Bem, então, você e eu vamos sozinhos, senhor Gray.", "h": 0}, {"i": 258, "c": 4, "ct": "Capítulo II", "t": "– Eu realmente adoraria.", "h": 0}, {"i": 259, "c": 4, "ct": "Capítulo II", "t": "O pintor se conteve e caminhou, com a xícara na mão, até o quadro. – Ficarei com o verdadeiro Dorian – ele disse, tristonho.", "h": 0}, {"i": 260, "c": 4, "ct": "Capítulo II", "t": "– Será mesmo esse o verdadeiro Dorian? – exclamou o original do retrato, aproximando-se do artista. – Eu sou realmente assim?", "h": 0}, {"i": 261, "c": 4, "ct": "Capítulo II", "t": "– Sim; você é exatamente assim.", "h": 0}, {"i": 262, "c": 4, "ct": "Capítulo II", "t": "– Que maravilha, Basil!", "h": 0}, {"i": 263, "c": 4, "ct": "Capítulo II", "t": "– Pelo menos na aparência, você é. Mas este não se transformará nunca – suspirou Hallward. – Já é alguma coisa.", "h": 0}, {"i": 264, "c": 4, "ct": "Capítulo II", "t": "– As pessoas fazem tanto estardalhaço sobre a fidelidade! – exclamou lorde Henry. – Ora, até mesmo o amor é puramente uma questão de fisiologia. Não tem nada a ver com a nossa vontade. Os jovens querem ser fiéis e não são; os velhos querem ser infiéis e não conseguem: isso é tudo o que se pode dizer.", "h": 0}, {"i": 265, "c": 4, "ct": "Capítulo II", "t": "– Não vá ao teatro hoje à noite, Dorian – disse Hallward. – Passe aqui e jante comigo.", "h": 0}, {"i": 266, "c": 4, "ct": "Capítulo II", "t": "– Não posso, Basil.", "h": 0}, {"i": 267, "c": 4, "ct": "Capítulo II", "t": "– Por quê?", "h": 0}, {"i": 268, "c": 4, "ct": "Capítulo II", "t": "– Porque prometi ao lorde Henry Wotton sair com ele.", "h": 0}, {"i": 269, "c": 4, "ct": "Capítulo II", "t": "– Ele não vai gostar mais de você por manter sua promessa. Ele sempre descumpre as dele. Eu imploro: não vá.", "h": 0}, {"i": 270, "c": 4, "ct": "Capítulo II", "t": "Dorian Gray deu risada e balançou a cabeça.", "h": 0}, {"i": 271, "c": 4, "ct": "Capítulo II", "t": "– Eu suplico.", "h": 0}, {"i": 272, "c": 4, "ct": "Capítulo II", "t": "O rapaz hesitou e olhou para lorde Henry, que os observava da mesa de chá com um sorriso divertido.", "h": 0}, {"i": 273, "c": 4, "ct": "Capítulo II", "t": "– Preciso ir, Basil – ele respondeu.", "h": 0}, {"i": 274, "c": 4, "ct": "Capítulo II", "t": "– Muito bem – disse Hallward; e ele deu alguns passos e depôs a xícara na bandeja. – Está ficando tarde e, como vocês precisam se trocar, é melhor não perderem mais tempo. Adeus, Harry. Adeus, Dorian. Venha me ver logo. Venha amanhã.", "h": 0}, {"i": 275, "c": 4, "ct": "Capítulo II", "t": "– Certamente.", "h": 0}, {"i": 276, "c": 4, "ct": "Capítulo II", "t": "– Você não vai esquecer?", "h": 0}, {"i": 277, "c": 4, "ct": "Capítulo II", "t": "– Não, é claro que não – exclamou Dorian.", "h": 0}, {"i": 278, "c": 4, "ct": "Capítulo II", "t": "– E… Harry!", "h": 0}, {"i": 279, "c": 4, "ct": "Capítulo II", "t": "– Sim, Basil?", "h": 0}, {"i": 280, "c": 4, "ct": "Capítulo II", "t": "– Lembre-se do que eu lhe pedi, quando estávamos no jardim esta manhã.", "h": 0}, {"i": 281, "c": 4, "ct": "Capítulo II", "t": "– Eu me esqueci.", "h": 0}, {"i": 282, "c": 4, "ct": "Capítulo II", "t": "– Confio em você.", "h": 0}, {"i": 283, "c": 4, "ct": "Capítulo II", "t": "– Quem dera eu confiasse em mim mesmo – disse lorde Henry, dando risada. – Vamos, senhor Gray, minha carruagem está lá fora e posso deixá-lo em sua casa. Adeus, Basil. Foi uma tarde muito interessante.", "h": 0}, {"i": 284, "c": 4, "ct": "Capítulo II", "t": "E, quando a porta se fechou atrás deles, o pintor se atirou no sofá, e uma expressão de dor se formou em seu semblante.", "h": 0}, {"i": 285, "c": 5, "ct": "Capítulo III", "t": "Capítulo III", "h": 1}, {"i": 286, "c": 5, "ct": "Capítulo III", "t": "Ao meio-dia e meia do dia seguinte, lorde Henry Wotton caminhou de Curzon Street até o Albany para visitar seu tio, lorde Fermor, um velho solteirão, simpático, ainda que algo brutal, que o mundo exterior julgava egoísta porque não tirava dele nenhum benefício, mas que era considerado generoso pela alta sociedade, pois ele alimentava quem o divertia. O pai dele havia sido embaixador em Madri quando Isabel era jovem, e não se cogitava o general Prim, mas se aposentara do Serviço Diplomático em um momento caprichoso de irritação, ao não lhe ser oferecida a embaixada em Paris, posto a que julgava ter direito por seu nome, por sua indolência, pelo bom inglês de seus despachos e sua desordenada paixão pelo prazer. O filho, que havia sido secretário do pai, demitira-se com o chefe, um tanto impensadamente, como se comentou na época, e ao sucedê-lo meses depois no título, pusera-se a estudar seriamente a grande arte aristocrática de não fazer absolutamente nada. Tinha duas casas grandes na cidade, mas preferia morar em quartos de hotel, pois dava menos trabalho, e fazia a maioria das refeições no clube. Dedicava alguma atenção à administração de suas minas de carvão em Midland, perdoando-se essa nódoa de indústria com o argumento de que a única vantagem de ser dono de mina era que permitia a um cavalheiro a decência de usar lenha na própria lareira. Em política, era um tóri, exceto quando os tóris estavam no poder, período em que ele abertamente os criticava por serem um bando de radicais. Era um herói para seu valete, que lhe tratava mal, e um terror para a maioria de seus conhecidos, que por sua vez era ele quem maltratava. Somente a Inglaterra poderia produzir alguém como ele, e ele sempre dizia que o país estava indo ladeira abaixo. Seus princípios eram antiquados, mas havia muito o que dizer sobre seus preconceitos.", "h": 0}, {"i": 287, "c": 5, "ct": "Capítulo III", "t": "Quando lorde Henry entrou no recinto, encontrou o tio sentado, com um rústico casaco de caça, fumando um charuto e resmungando com o Times aberto. – Bem, Harry – disse o velho cavalheiro –, o que o traz aqui tão cedo? Eu achava que vocês, dândis, nunca se levantavam antes das duas e que não saíam de casa antes das cinco.", "h": 0}, {"i": 288, "c": 5, "ct": "Capítulo III", "t": "– Pura afeição familiar, eu lhe garanto, tio George. Eu queria lhe pedir uma coisa.", "h": 0}, {"i": 289, "c": 5, "ct": "Capítulo III", "t": "– Dinheiro, imagino – disse lorde Fermor, com expressão contrariada. – Bem, sente-se e conte-me do que se trata. Os jovens hoje em dia pensam que o dinheiro é tudo na vida.", "h": 0}, {"i": 290, "c": 5, "ct": "Capítulo III", "t": "– Sim – murmurou lorde Henry, fechando um botão do casaco –; e quando envelhecem, eles têm certeza. Mas eu não quero dinheiro. Só as pessoas que pagam as próprias contas precisam de dinheiro, tio George, e eu nunca pago as minhas contas. O crédito é o capital de um filho caçula, e vive-se muito bem assim. Além do mais, eu negocio sempre com os intermediários do Dartmoor, e consequentemente ninguém nunca me cria problemas. O que eu preciso é de informação; não de informações úteis, é claro; informações inúteis.", "h": 0}, {"i": 291, "c": 5, "ct": "Capítulo III", "t": "– Bem, posso lhe dizer tudo o que já foi publicado nos Livros Azuis do Parlamento , Harry, embora esses sujeitos hoje em dia escrevam um bocado de bobagens. Quando eu estava na diplomacia, as coisas eram muito melhores. Mas ouvi dizer que agora eles entram por exame. O que você pode esperar disso? Exames, meu caro, são puro embuste, do começo ao fim. Se o sujeito for um cavalheiro, ele já sabe o suficiente e, se não for, tudo o que souber será ruim para ele.", "h": 0}, {"i": 292, "c": 5, "ct": "Capítulo III", "t": "– O senhor Dorian Gray não está nesses Livros Azuis , tio George – disse lorde Henry, languidamente.", "h": 0}, {"i": 293, "c": 5, "ct": "Capítulo III", "t": "– Dorian Gray? Quem é ele? – perguntou lorde Fermor, cofiando suas volumosas sobrancelhas brancas.", "h": 0}, {"i": 294, "c": 5, "ct": "Capítulo III", "t": "– Era isso que eu vim aqui saber, tio George. Ou melhor, eu sei quem ele é. Ele é o neto mais novo de lorde Kelso. A mãe era Devereux; lady Margaret Devereux. Eu queria que o senhor me falasse sobre a mãe dele. Como ela era? Com quem ela se casou? O senhor conheceu praticamente todo mundo da sua época, e talvez a tenha conhecido. Estou muito interessado no senhor Gray no momento. Acabei de conhecê-lo.", "h": 0}, {"i": 295, "c": 5, "ct": "Capítulo III", "t": "– Neto do Kelso! – ecoou o velho cavalheiro. – Neto do Kelso!… Mas é claro… conheci intimamente a mãe desse rapaz. Acho que fui até no batizado. Era uma menina extraordinariamente bonita, Margaret Devereux; e todos os homens ficaram loucos quando ela fugiu com um rapaz que não tinha onde cair morto; um joão-ninguém, meu caro, um subalterno da infantaria, ou coisa que o valha. Sem dúvida. Lembro como se fosse ontem. O pobre coitado foi morto em um duelo em Spa, poucos meses depois do casamento. Foi uma história horrível. Dizem que Kelso contratou um malandro aventureiro, um brutamontes belga, para ofender o genro em público; que pagou o sujeito, meu caro, pagou para ele fazer isso; e que o sujeito baleou o coitado como se fosse um pombo. A coisa foi abafada, mas, ora, Kelso comeu suas costeletas sozinho no clube por um bom tempo depois disso. Ele trouxe a filha de volta, segundo me disseram, e ela nunca mais falou com o pai. Oh, sim; foi um mau negócio. A menina morreu também; morreu no mesmo ano. Quer dizer que ela deixou um filho? Eu tinha me esquecido disso. Como é esse menino? Se for como a mãe, deve ser um rapaz bonito.", "h": 0}, {"i": 296, "c": 5, "ct": "Capítulo III", "t": "– Ele é muito bonito – concordou lorde Henry.", "h": 0}, {"i": 297, "c": 5, "ct": "Capítulo III", "t": "– Espero que ele esteja em boas mãos – continuou o velho. – Ele deve ter herdado um bocado de dinheiro, se Kelso fez o que é certo. A mãe também tinha muito dinheiro. Toda a propriedade de Selby ficou para ela, pelo lado do avô. O avô odiava o Kelso, achava-o um cão mesquinho. Ele era mesmo. Ele veio a Madri uma vez quando eu estava lá. Credo, fiquei com vergonha dele. A rainha chegou a me perguntar sobre aquele nobre inglês que sempre regateava o preço da corrida com os cocheiros. Criou-se uma confusão com isso. Não tive coragem de dar as caras na corte por um mês. Espero que ele tenha tratado o neto melhor do que tratava os boleeiros.", "h": 0}, {"i": 298, "c": 5, "ct": "Capítulo III", "t": "– Eu não sei – respondeu lorde Henry. – Imagino que o rapaz seja rico. Ele ainda não tem idade. Ele é dono de Selby, isso eu sei. Porque ele me disse. E… a mãe dele era muito bonita?", "h": 0}, {"i": 299, "c": 5, "ct": "Capítulo III", "t": "– Margaret Devereux foi uma das criaturas mais adoráveis que eu já conheci, Harry. O que a levou a fazer o que ela fez, eu nunca consegui entender. Ela poderia ter se casado com quem quisesse. Carlington estava louco atrás dela. Mas ela era romântica. Todas as mulheres da família eram. Os homens eram de dar dó, mas as mulheres eram maravilhosas. Carlington ficou de joelhos por ela. Ele mesmo me contou. Ela deu risada dele, e na época não havia uma garota em Londres que não estivesse interessada nele. E por falar em casamentos absurdos, Harry, que palhaçada é essa que seu pai contou de o Dartmoor querer se casar com uma americana? As garotas inglesas não são boas o bastante para ele?", "h": 0}, {"i": 300, "c": 5, "ct": "Capítulo III", "t": "– Está na moda agora se casar com americana, tio George.", "h": 0}, {"i": 301, "c": 5, "ct": "Capítulo III", "t": "– Eu defenderei sempre as inglesas contra o resto do mundo, Harry – disse lorde Fermor, batendo na mesa com o punho.", "h": 0}, {"i": 302, "c": 5, "ct": "Capítulo III", "t": "– As apostas agora estão com as americanas.", "h": 0}, {"i": 303, "c": 5, "ct": "Capítulo III", "t": "– Elas não duram muito, ouvi dizer – murmurou o tio.", "h": 0}, {"i": 304, "c": 5, "ct": "Capítulo III", "t": "– Elas se cansam dos longos relacionamentos, mas são ótimas nas provas com obstáculos. Captam tudo no ar. Não creio que Dartmoor tenha a menor chance.", "h": 0}, {"i": 305, "c": 5, "ct": "Capítulo III", "t": "– Quem são os pais dela? – resmungou o velho cavalheiro. – Ela tem família?", "h": 0}, {"i": 306, "c": 5, "ct": "Capítulo III", "t": "Lorde Henry balançou a cabeça. – As americanas são tão boas em esconder os pais quanto as inglesas em esconder o próprio passado – ele disse, levantando-se para ir embora.", "h": 0}, {"i": 307, "c": 5, "ct": "Capítulo III", "t": "– Devem ser comerciantes de porco, imagino?", "h": 0}, {"i": 308, "c": 5, "ct": "Capítulo III", "t": "– Espero que sim, tio George, pelo bem do Dartmoor. Ouvi dizer que o comércio de porco é o negócio mais lucrativo na América, depois da política.", "h": 0}, {"i": 309, "c": 5, "ct": "Capítulo III", "t": "– Ela é bonita?", "h": 0}, {"i": 310, "c": 5, "ct": "Capítulo III", "t": "– Ela age como se fosse bonita. A maioria das americanas faz isso. É o segredo do encanto delas.", "h": 0}, {"i": 311, "c": 5, "ct": "Capítulo III", "t": "– Por que essas americanas não ficam no país delas? Sempre ouço dizer que lá é o paraíso das mulheres.", "h": 0}, {"i": 312, "c": 5, "ct": "Capítulo III", "t": "– É mesmo. É por isso que, como Eva, elas estão sempre aflitas para saírem de lá – disse lorde Henry. – Adeus, tio George. Vou me atrasar para o almoço, se demorar mais. Obrigado por me dar a informação de que eu precisava. Eu sempre gosto de saber tudo sobre meus novos amigos e nada sobre os velhos amigos.", "h": 0}, {"i": 313, "c": 5, "ct": "Capítulo III", "t": "– Onde você vai almoçar, Harry?", "h": 0}, {"i": 314, "c": 5, "ct": "Capítulo III", "t": "– Na tia Agatha. Eu me convidei com o senhor Gray. Ele é o novo protégé dela.", "h": 0}, {"i": 315, "c": 5, "ct": "Capítulo III", "t": "– Arre! Diga a sua tia Agatha, Harry, que não me peça mais doações para as caridades dela. Estou cheio disso. Ora, ela pensa que eu não tenho nada para fazer além de preencher cheques para esses caprichos idiotas.", "h": 0}, {"i": 316, "c": 5, "ct": "Capítulo III", "t": "– Está certo, tio George, vou dizer a ela, mas isso de nada adiantará. Os filantropos perdem toda a sensibilidade humanitária. Essa é a característica que os distingue.", "h": 0}, {"i": 317, "c": 5, "ct": "Capítulo III", "t": "O velho cavalheiro grunhiu em aprovação e tocou a sineta para chamar o criado. Lorde Henry passou pelo arco baixo e chegou a Burlington Street, então direcionou seus passos para Berkeley Square.", "h": 0}, {"i": 318, "c": 5, "ct": "Capítulo III", "t": "Então essa era a história da família de Dorian Gray. Com toda crueza com que lhe fora contada, ainda assim o abalara pelo que continha de sugestão de um romance estranho, quase moderno. Uma bela mulher arriscando tudo por uma louca paixão. Algumas poucas semanas de felicidade interrompidas por um crime hediondo e traiçoeiro. Meses de uma agonia muda, e depois uma criança nascida com dores. A mãe levada subitamente pela morte, o menino deixado à solidão e à tirania de um velho sem amor. Sim; eram antecedentes interessantes. Posicionavam o rapaz, tornando-o mais perfeito ainda. Por trás de cada coisa bela existente, havia algo de trágico. Era preciso o trabalho de mundos inteiros para que a mínima flor pudesse brotar… E como ele estivera encantador no jantar da noite passada, como, com olhos arregalados e lábios entreabertos de prazer assustado, ele se sentara à sua frente no clube, a penumbra avermelhada das luminárias esmaecendo em um rosa mais claro o alumbramento recém-desperto de seu rosto. Conversar com ele era como tocar um magnífico violino. Ele respondia a cada toque e a cada excitação do arco… Havia algo terrivelmente cativante no exercício da influência. Não havia outra atividade igual. Projetar a própria alma dentro de alguma forma graciosa e deixar que se demorasse ali por um momento; ouvir as próprias opiniões intelectuais ecoando de volta acrescidas de toda a música da paixão e da juventude; transferir o próprio temperamento para um outro como se fosse um fluido sutil ou um estranho perfume; havia uma alegria genuína naquilo – talvez a alegria mais satisfatória que nos restou em uma era tão limitada e vulgar como a nossa, uma era grosseiramente carnal em seus prazeres e grosseiramente banal em seus objetivos… Ele era também um tipo maravilhoso, aquele rapaz que por curioso acaso encontrara no estúdio do Basil; ou alguém que poderia ser transformado em um tipo maravilhoso, de todo modo. Tinha a graça natural e a alva pureza da meninice, e uma beleza como só a que nos foi conservada nos mármores gregos. Não havia nada que não se pudesse fazer dele. Ele daria um titã ou um brinquedo. Que pena de tanta beleza fadada a perecer! E quanto a Basil? Do ponto de vista psicológico, como ele era interessante! O novo estilo da arte, o modo novo de olhar a vida, sugerido tão estranhamente pela mera presença visível de alguém inteiramente inconsciente disso; o espírito silencioso que vivia na penumbra do bosque, e caminhava invisível no campo aberto, de repente se mostrara, como uma dríade, sem medo, pois na alma daquele que a persegue havia despertado a maravilhosa visão para a qual só as coisas maravilhosas se revelam; e os meros formatos e padrões das coisas se tornavam refinados e ganhavam uma espécie de valor simbólico, como se fossem eles mesmos padrões de alguma outra forma mais perfeita cuja sombra eles tornavam real: como era estranho tudo aquilo! Ele se lembrava de algo parecido na história. Não teria sido Platão, artista do pensamento, o primeiro a analisar aquilo? Não teria sido Buonarotti que esculpira aquilo nos mármores coloridos de um soneto? Mas em nosso próprio século aquilo era estranho… Sim; ele tentaria ser para Dorian Gray o que, sem saber, o rapaz fora para o pintor que fizera o maravilhoso retrato. Tentaria dominá-lo – tinha já, na verdade, meio caminho andado. Tornaria seu aquele maravilhoso espírito. Havia algo fascinante naquele filho do amor e da morte.", "h": 0}, {"i": 319, "c": 5, "ct": "Capítulo III", "t": "De repente parou e olhou para as casas. Descobriu que havia passado um pouco da casa da tia e, sorrindo consigo mesmo, voltou. Quando entrou no vestíbulo um tanto sombrio, o mordomo lhe disse que já haviam se sentado para almoçar. Ele entregou a cartola e a bengala ao criado e passou à sala de jantar.", "h": 0}, {"i": 320, "c": 5, "ct": "Capítulo III", "t": "– Atrasado como sempre, Harry – exclamou a tia, balançando a cabeça para ele.", "h": 0}, {"i": 321, "c": 5, "ct": "Capítulo III", "t": "Ele inventou uma desculpa qualquer, e, sentando-se na cadeira vaga ao lado dela, olhou ao redor para ver quem estava lá. Dorian fez uma tímida mesura da ponta da mesa, e um rubor involuntário de prazer se instalou em suas maçãs. Do outro lado da mesa, estava a duquesa de Harley; dama amável e bem-humorada, querida por todos que a conheciam, e senhora daquelas amplas proporções arquitetônicas, que, em mulheres que não são duquesas, os historiadores contemporâneos descrevem como corpulência. Ao lado dela, à direita, sir Thomas Burdon, radical do Parlamento, que seguia seu líder na vida pública e, na vida privada, seguia os melhores cozinheiros, jantando com os tóris e pensando com os liberais, segundo uma regra sábia e bem conhecida. O lugar à esquerda dela estava ocupado pelo senhor Erskine de Treadley, um velho cavalheiro de consideráveis encanto e cultura, que adquirira, no entanto, o mau hábito do silêncio, depois de, como explicou uma vez a lady Agatha, ter dito tudo o que tinha para dizer antes dos trinta. Vizinha a ele, estava a senhora Vandeleur, uma das amigas mais antigas da tia, uma perfeita santa entre as mulheres, mas tão pavorosamente vestida que lembrava um hinário de igreja mal encadernado. Para sorte dele, ela tinha do outro lado lorde Faudel, um medíocre de meia-idade muito inteligente, calvo como um pronunciamento ministerial na Câmara dos Comuns, com quem ela estava conversando à sua maneira intensamente franca que era o único erro imperdoável, como ele observou consigo mesmo, que todas as pessoas boas de verdade sempre cometem e nunca conseguem evitar cometer.", "h": 0}, {"i": 322, "c": 5, "ct": "Capítulo III", "t": "– Estamos falando sobre o pobre do Dartmoor, lorde Henry – exclamou a duquesa, com uma mesura simpática do outro lado da mesa. – Você acha que ele vai mesmo casar com essa jovem fascinante?", "h": 0}, {"i": 323, "c": 5, "ct": "Capítulo III", "t": "– Acho que ela já se decidiu a pedir a mão dele, duquesa.", "h": 0}, {"i": 324, "c": 5, "ct": "Capítulo III", "t": "– Que horror! – exclamou lady Agatha. – Francamente, alguém deveria intervir.", "h": 0}, {"i": 325, "c": 5, "ct": "Capítulo III", "t": "– Sei, de fonte fidedigna, que o pai dela tem um armazém americano – disse sir Thomas Burdon, com ar de superioridade.", "h": 0}, {"i": 326, "c": 5, "ct": "Capítulo III", "t": "– Meu tio já sugeriu comerciante de porco, sir Thomas.", "h": 0}, {"i": 327, "c": 5, "ct": "Capítulo III", "t": "– Armazém americano! O que é afinal um armazém americano? – perguntou a duquesa, erguendo espantada suas mãos grandes, acentuando o verbo.", "h": 0}, {"i": 328, "c": 5, "ct": "Capítulo III", "t": "– Romances americanos – respondeu lorde Henry, servindo-se de codorna.", "h": 0}, {"i": 329, "c": 5, "ct": "Capítulo III", "t": "A duquesa parecia intrigada.", "h": 0}, {"i": 330, "c": 5, "ct": "Capítulo III", "t": "– Não o leve a sério, minha querida – sussurrou lady Agatha. – Ele nunca fala nada a sério.", "h": 0}, {"i": 331, "c": 5, "ct": "Capítulo III", "t": "– Quando a América foi descoberta – disse o radical, e começou a fornecer dados entediantes. Como toda pessoa que tenta esgotar um assunto, ele esgotou a paciência de seus ouvintes. A duquesa suspirou e excerceu seu privilégio de interrompê-lo. – Quem dera nunca tivesse sido descoberta! – exclamou ela. – Realmente, nossas garotas não têm a menor chance hoje em dia. É muita injustiça.", "h": 0}, {"i": 332, "c": 5, "ct": "Capítulo III", "t": "– Talvez, afinal, a América nunca tenha sido descoberta – disse o senhor Erskine. – Eu diria que ela foi meramente detectada.", "h": 0}, {"i": 333, "c": 5, "ct": "Capítulo III", "t": "– Oh, mas eu já vi alguns espécimes de seus habitantes – respondeu a duquesa, com vagueza. – Devo confessar que a maioria é extremamente bela. E elas também se vestem muito bem. Só compram vestidos em Paris. Quem dera eu pudesse fazer o mesmo.", "h": 0}, {"i": 334, "c": 5, "ct": "Capítulo III", "t": "– Dizem, quando os bons americanos morrem, que eles vão a Paris – gargalhou sir Thomas, dono de todo um arsenal de velhas tiradas.", "h": 0}, {"i": 335, "c": 5, "ct": "Capítulo III", "t": "– Realmente! E aonde vão os americanos maus quando morrem? – inquiriu a duquesa.", "h": 0}, {"i": 336, "c": 5, "ct": "Capítulo III", "t": "– Eles vão à América – murmurou lorde Henry.", "h": 0}, {"i": 337, "c": 5, "ct": "Capítulo III", "t": "Sir Thomas franziu o cenho. – Receio que seu sobrinho tenha preconceito contra esse grande país – ele disse a lady Agatha. – Eu viajei pelo país inteiro, em carros fornecidos pelos diretores, que, nesses casos, são extremamente corretos. Eu lhe garanto que é uma visita muito educativa.", "h": 0}, {"i": 338, "c": 5, "ct": "Capítulo III", "t": "– Mas será mesmo preciso conhecer Chicago para sermos educados? – perguntou o senhor Erskine, com voz descontente. – Não me sinto disposto a tanta viagem.", "h": 0}, {"i": 339, "c": 5, "ct": "Capítulo III", "t": "Sir Thomas fez um gesto com a mão. – O senhor Erskine de Treadley tem o mundo em suas estantes. Nós, homens práticos, gostamos de ver as coisas, não de ler sobre elas. Os americanos são um povo extremamente interessante. Eles são absolutamente sensatos. Creio que é sua principal característica. Sim, senhor Erskine, um povo absolutamente sensato. Eu lhe asseguro que os americanos não têm nada de absurdo.", "h": 0}, {"i": 340, "c": 5, "ct": "Capítulo III", "t": "– Que coisa pavorosa! – exclamou lorde Henry. – Eu posso aceitar a força bruta, mas a razão bruta é absolutamente insuportável. É um pouco injusta a forma de seu uso. É um golpe baixo intelectual.", "h": 0}, {"i": 341, "c": 5, "ct": "Capítulo III", "t": "– Não consigo entendê-lo – disse sir Thomas, ficando um tanto corado.", "h": 0}, {"i": 342, "c": 5, "ct": "Capítulo III", "t": "– Eu consigo, lorde Henry – murmurou o senhor Erskine, com um sorriso.", "h": 0}, {"i": 343, "c": 5, "ct": "Capítulo III", "t": "– Os paradoxos têm lá sua graça… – retomou o baronete.", "h": 0}, {"i": 344, "c": 5, "ct": "Capítulo III", "t": "– Mas será que isso era um paradoxo? – perguntou o senhor Erskine. – Eu acho que não. Talvez. Bem, o caminho da verdade passa pelos paradoxos. Para testar a realidade devemos vê-la na corda bamba. Quando as verdades se tornam acrobatas, podemos julgá-las.", "h": 0}, {"i": 345, "c": 5, "ct": "Capítulo III", "t": "– Ai, meu Deus! – disse lady Agatha –, como vocês, homens, discutem! Não vou entender nunca do que vocês estão falando. Oh, Harry, estou muito chateada com você. Por que você tentou convencer o nosso simpático senhor Dorian Gray a desistir do East End? Eu lhe garanto que ele seria de um valor inestimável. Eles adorariam ouvi-lo tocar.", "h": 0}, {"i": 346, "c": 5, "ct": "Capítulo III", "t": "– Eu quero que ele toque para mim – exclamou lorde Henry, sorrindo; olhou para os convidados e notou um olhar esfuziante de resposta.", "h": 0}, {"i": 347, "c": 5, "ct": "Capítulo III", "t": "– Mas a vida é tão triste lá em Whitechapel – continuou lady Agatha.", "h": 0}, {"i": 348, "c": 5, "ct": "Capítulo III", "t": "– Sou capaz de me solidarizar com tudo, menos com o sofrimento – disse lorde Henry, dando de ombros. – Não consigo ter compaixão pelo sofrimento. É feio demais, horrível demais, aflitivo demais. Há algo de terrivelmente mórbido na compaixão moderna pela dor. Deveríamos nos solidarizar com a cor, com a beleza, com a alegria de viver. Quanto menos falarmos das feridas da vida, melhor.", "h": 0}, {"i": 349, "c": 5, "ct": "Capítulo III", "t": "– Ainda assim o East End é um problema muito sério – observou sir Thomas, com um grave meneio de cabeça.", "h": 0}, {"i": 350, "c": 5, "ct": "Capítulo III", "t": "– Muito – respondeu o jovem lorde. – É o problema da escravidão, e nós tentamos resolvê-lo divertindo os escravos.", "h": 0}, {"i": 351, "c": 5, "ct": "Capítulo III", "t": "O político arregalou os olhos para ele. – Então que mudança você propõe que se faça? – ele perguntou.", "h": 0}, {"i": 352, "c": 5, "ct": "Capítulo III", "t": "Lorde Henry deu risada. – Não desejo mudar nada na Inglaterra, exceto o clima – ele respondeu. – Eu me contento com a contemplação filosófica. Mas, como o século XIX foi à bancarrota pelo excesso de gastos com solidariedade, eu sugeriria que recorrêssemos à ciência para nos mostrar o caminho certo. A vantagem das emoções é que elas nos desviam do caminho, e a vantagem da ciência é que ela não é emocional.", "h": 0}, {"i": 353, "c": 5, "ct": "Capítulo III", "t": "– Mas nós temos responsabilidades muito sérias – arriscou a senhora Vandeleur, timidamente.", "h": 0}, {"i": 354, "c": 5, "ct": "Capítulo III", "t": "– Terrivelmente sérias – ecoou lady Agatha.", "h": 0}, {"i": 355, "c": 5, "ct": "Capítulo III", "t": "Lorde Henry olhou para o senhor Erskine. – A humanidade se leva a sério demais. Este é o pecado original de todo mundo. Se o homem das cavernas tivesse aprendido a rir, a história teria sido diferente.", "h": 0}, {"i": 356, "c": 5, "ct": "Capítulo III", "t": "– É muito reconfortante que você diga isso – gorjeou a duquesa. – Sempre me sinto culpada quando venho visitar a sua querida tia, pois não tenho nenhum interesse no East End. Futuramente conseguirei olhar para ela sem corar de vergonha.", "h": 0}, {"i": 357, "c": 5, "ct": "Capítulo III", "t": "– Um pouco de rubor lhe cai bem, duquesa – observou lorde Henry.", "h": 0}, {"i": 358, "c": 5, "ct": "Capítulo III", "t": "– Apenas quando se é jovem – ela respondeu. – Quando uma velha como eu cora, é um sinal muito ruim. Ah! Lorde Henry, queria que você me dissesse como fazer para voltar a ser jovem.", "h": 0}, {"i": 359, "c": 5, "ct": "Capítulo III", "t": "Ele pensou por um momento. – A senhora se lembra de algum grande erro que tenha cometido na juventude, duquesa? – ele perguntou, olhando para ela do outro lado da mesa.", "h": 0}, {"i": 360, "c": 5, "ct": "Capítulo III", "t": "– Receio que muitos – ela exclamou.", "h": 0}, {"i": 361, "c": 5, "ct": "Capítulo III", "t": "– Pois então cometa-os mais uma vez – ele disse, gravemente. – Para recuperar a juventude, basta repetir as próprias loucuras.", "h": 0}, {"i": 362, "c": 5, "ct": "Capítulo III", "t": "– Que teoria deliciosa! – ela exclamou. – Preciso colocá-la em prática.", "h": 0}, {"i": 363, "c": 5, "ct": "Capítulo III", "t": "– Que teoria perigosa! – ouviu-se dos lábios franzidos de sir Thomas. Lady Agatha balançou a cabeça, mas não pôde evitar de achar graça. O senhor Erskine ficou ouvindo.", "h": 0}, {"i": 364, "c": 5, "ct": "Capítulo III", "t": "– Sim – ele continuou –, esse é um dos grandes segredos da vida. Hoje em dia a maioria das pessoas morre de uma espécie rasteira de bom senso e descobre tarde demais que as únicas coisas das quais nunca nos arrependemos são os erros que cometemos.", "h": 0}, {"i": 365, "c": 5, "ct": "Capítulo III", "t": "Todos à mesa riram.", "h": 0}, {"i": 366, "c": 5, "ct": "Capítulo III", "t": "Ele se divertiu com a ideia e ficou inspirado; lançou-a no ar e a transformou; deixou-a escapar e a recapturou; tornou-a iridescente de imaginação, alada com paradoxos. O elogio da loucura, conforme ele prosseguiu, voou rumo à filosofia, e a própria filosofia se tornou jovem e, captando a música louca do prazer, trajando, como se podia imaginar, seu vestido manchado de vinho e sua coroa de hera, dançou como uma bacante nas colinas da vida e zombou do lento Sileno por estar sóbrio. Os fatos fugiam diante dela como seres assustados da floresta. Seus pés brancos pisavam a imensa prensa onde o sábio Omar se sentava, até que o sumo fervilhante das uvas chegou às suas pernas nuas em ondas de bolhas purpúreas, ou transbordou em espuma vermelha, gotejando, pelos flancos inclinados da tina negra. Foi uma improvisação extraordinária. Ele sentia que os olhos de Dorian Gray fitavam-no fixamente, e a consciência de que entre seus ouvintes havia um cujo temperamento ele desejava fascinar parecia aguçar sua sagacidade e emprestar cor à sua imaginação. Ele foi brilhante, fantástico, irresponsável. Encantou seus ouvintes, atraindo-os para fora de si mesmos, e eles seguiram sorridentes seu flautim. Dorian Gray não tirou os olhos dele, mas ficou sentado como em transe, deixando escapar sorrisos dos lábios, e o deslumbramento foi ficando mais grave, escurecendo seus olhos.", "h": 0}, {"i": 367, "c": 5, "ct": "Capítulo III", "t": "Por fim, trajando a libré da época, a realidade entrou na sala na forma de um criado que avisou a duquesa de que sua carruagem havia chegado. Ela trançou os dedos fingindo desespero. – Que pena! – ela exclamou. – Preciso ir. Devo encontrar meu marido no clube, para levá-lo a uma reunião descabida em Willi’s Rooms, onde ele vai presidir uma sessão. Se eu me atrasar, certamente ele ficará furioso, e eu não posso ir com esse arranjo. É muito delicado. Uma palavra ríspida seria capaz de arruiná-lo. Não, preciso ir, querida Agatha. Adeus, lorde Henry, você é uma delícia de pessoa e terrivelmente desconcertante. Não sei nem o que dizer sobre as suas opiniões. Você precisa aparecer e jantar conosco algum dia desses. Terça-feira? Você está livre na terça?", "h": 0}, {"i": 368, "c": 5, "ct": "Capítulo III", "t": "– Pela senhora, eu desmarcaria qualquer compromisso, duquesa – disse lorde Henry, com uma mesura.", "h": 0}, {"i": 369, "c": 5, "ct": "Capítulo III", "t": "– Ah! Que bom e que feio da sua parte – ela exclamou –; pois então venha – e ela deixou a sala, seguida por lady Agatha e as outras senhoras.", "h": 0}, {"i": 370, "c": 5, "ct": "Capítulo III", "t": "Quando lorde Henry voltou a sentar, o senhor Erskine se aproximou e, sentando na cadeira ao lado dele, pôs a mão em seu braço.", "h": 0}, {"i": 371, "c": 5, "ct": "Capítulo III", "t": "– Você fala melhor que muitos livros – ele disse –; por que você não escreve um?", "h": 0}, {"i": 372, "c": 5, "ct": "Capítulo III", "t": "– Gosto demais de ler para me dar ao trabalho de escrever, senhor Erskine. Certamente eu gostaria de escrever um romance; um romance que fosse tão adorável e tão irreal quanto um tapete persa. Mas não existe um público literário na Inglaterra, exceto para jornais, catecismos e enciclopédias. De todos os povos do mundo, o inglês é o que tem menos noção da beleza da literatura.", "h": 0}, {"i": 373, "c": 5, "ct": "Capítulo III", "t": "– Receio que você esteja certo – respondeu o senhor Erskine. – Eu mesmo costumava ter ambição literária, mas desisti há muitos anos. E hoje, meu querido jovem amigo, se você me permitir chamá-lo assim, posso saber se você realmente acredita em tudo o que disse no almoço?", "h": 0}, {"i": 374, "c": 5, "ct": "Capítulo III", "t": "– Eu praticamente me esqueci do que falei – sorriu lorde Henry. – Eu disse algo muito ruim?", "h": 0}, {"i": 375, "c": 5, "ct": "Capítulo III", "t": "– Muito ruim mesmo. A bem dizer, considero-o extremamente perigoso, e se algo acontecer à nossa boa duquesa, todos o consideraremos o principal responsável. Mas eu gostaria de conversar com você sobre a vida. A minha geração era muito entediante. Um dia desses, quando você estiver cansado de Londres, venha me visitar em Treadley e me explicar a sua filosofia do prazer, regada ao admirável borgonha que tenho a sorte de possuir na adega.", "h": 0}, {"i": 376, "c": 5, "ct": "Capítulo III", "t": "– Será um prazer. Visitá-lo em Treadley seria uma grande honra. É um lugar perfeito e com uma biblioteca perfeita.", "h": 0}, {"i": 377, "c": 5, "ct": "Capítulo III", "t": "– Você irá completá-la – respondeu o velho cavalheiro, com uma mesura cortês. – E agora devo me despedir de sua excelente tia. Estão me esperando no Athenaeum. É a hora do nosso cochilo por lá.", "h": 0}, {"i": 378, "c": 5, "ct": "Capítulo III", "t": "– Vocês todos, senhor Erskine?", "h": 0}, {"i": 379, "c": 5, "ct": "Capítulo III", "t": "– Quarenta membros, em quarenta poltronas. Estamos praticando para ingressar na Academia Inglesa de Letras.", "h": 0}, {"i": 380, "c": 5, "ct": "Capítulo III", "t": "Lorde Henry deu risada e se levantou. – Vou ao parque – ele exclamou.", "h": 0}, {"i": 381, "c": 5, "ct": "Capítulo III", "t": "Quando ele estava saindo pela porta, Dorian Gray tocou seu braço. – Deixe-me ir com você – ele murmurou.", "h": 0}, {"i": 382, "c": 5, "ct": "Capítulo III", "t": "– Mas pensei que você havia prometido ao Basil Hallward ir visitá-lo – respondeu lorde Henry.", "h": 0}, {"i": 383, "c": 5, "ct": "Capítulo III", "t": "– Eu preferiria ir com você; sim, sinto que devo ir com você. Deixe-me ir junto. E você promete que falará comigo o tempo inteiro? Ninguém fala tão maravilhosamente quanto você.", "h": 0}, {"i": 384, "c": 5, "ct": "Capítulo III", "t": "– Ah! Eu já falei o suficiente por hoje – disse lorde Henry, sorrindo. – Tudo o que eu quero agora é olhar a vida. Você pode vir e olhar comigo, se quiser.", "h": 0}, {"i": 385, "c": 6, "ct": "Capítulo IV", "t": "Capítulo IV", "h": 1}, {"i": 386, "c": 6, "ct": "Capítulo IV", "t": "Certa tarde, um mês depois, Dorian Gray estava reclinado em uma luxuosa poltrona, na pequena biblioteca da casa de lorde Henry em Mayfair. Era, à sua maneira, um ambiente muito encantador, revestido com altos painéis de carvalho com manchas verde-oliva, frisos creme e teto em relevos de gesso entalhado, carpete de feltro em tom tijolo juncado de tapetes persas de seda de longas franjas. Em uma minúscula mesinha de mogno, havia uma estatueta de Clodion e, ao lado dela, um exemplar de Les cent nouvelles , encadernado para Marguerite de Valois por Clovis Ève e salpicado das margaridas douradas que a rainha escolheu para sua divisa. Alguns jarros grandes de porcelana azul e tulipas estavam alinhados sobre o console, e através dos caixilhos de chumbo dos vidros da janela infiltrava-se a luz adamascada de um dia de verão londrino.", "h": 0}, {"i": 387, "c": 6, "ct": "Capítulo IV", "t": "Lorde Henry ainda não havia chegado. Ele estava sempre, por princípio, atrasado, sendo este princípio o de que a pontualidade era ladra do tempo. De modo que o rapaz tinha o semblante um tanto acabrunhado, enquanto com dedos inquietos virava as páginas de um edição sofisticadamente ilustrada de Manon Lescaut que havia encontrado em uma das estantes. O toque formal e monótono do relógio à Luís XIV o irritou. Pensou uma ou duas vezes em ir embora.", "h": 0}, {"i": 388, "c": 6, "ct": "Capítulo IV", "t": "Por fim, ouviu passos do lado de fora, e a porta se abriu.", "h": 0}, {"i": 389, "c": 6, "ct": "Capítulo IV", "t": "– Você está muito atrasado, Harry! – ele murmurou.", "h": 0}, {"i": 390, "c": 6, "ct": "Capítulo IV", "t": "– Receio que não seja o Harry, senhor Gray – respondeu uma voz estridente.", "h": 0}, {"i": 391, "c": 6, "ct": "Capítulo IV", "t": "Rapidamente, ele olhou para o lado e se levantou.", "h": 0}, {"i": 392, "c": 6, "ct": "Capítulo IV", "t": "– Eu sinto muito. Pensei que…", "h": 0}, {"i": 393, "c": 6, "ct": "Capítulo IV", "t": "– Você pensou que fosse o meu marido. É apenas a esposa. Permita-me que eu me apresente. Já o conheço bem por fotografias. Creio que meu marido tenha umas dezessete fotografias do senhor.", "h": 0}, {"i": 394, "c": 6, "ct": "Capítulo IV", "t": "– Não podem ser dezessete, lady Henry!", "h": 0}, {"i": 395, "c": 6, "ct": "Capítulo IV", "t": "– Bem, umas dezoito, então. E eu o vi com ele outra noite na ópera – ela riu nervosamente enquanto falava e o observou com seus vagos olhos azuis de miosótis. Era uma mulher curiosa, cujos vestidos sempre pareciam ter sido cortados em um acesso de fúria e vestidos durante uma tempestade. Geralmente, estava apaixonada por alguém e, como sua paixão nunca era correspondida, ela guardara para si todas as suas ilusões. Tentava parecer pitoresca, mas só conseguia ficar desarrumada. Seu nome era Victoria e tinha uma verdadeira mania de frequentar a igreja.", "h": 0}, {"i": 396, "c": 6, "ct": "Capítulo IV", "t": "– Creio então que foi no Lohengrin?", "h": 0}, {"i": 397, "c": 6, "ct": "Capítulo IV", "t": "– Sim; foi no meu adorado Lohengrin. Gosto da música de Wagner acima de qualquer outra. É tão alta que se pode conversar o tempo inteiro que ninguém mais ouve o que a gente diz. É uma grande vantagem: o senhor também não acha, senhor Gray?", "h": 0}, {"i": 398, "c": 6, "ct": "Capítulo IV", "t": "O mesmo riso nervoso em staccato escapou dos lábios finos dela, e seus dedos começaram a brincar com uma longa espátula para cartas de casco de tartaruga.", "h": 0}, {"i": 399, "c": 6, "ct": "Capítulo IV", "t": "Dorian sorriu e balançou a cabeça: – Receio que não, lady Henry. Eu nunca converso durante a música, pelo menos durante a boa música. Quando se ouve música ruim, é um dever afogá-la em conversas.", "h": 0}, {"i": 400, "c": 6, "ct": "Capítulo IV", "t": "– Ah! eis uma opinião do Harry, não é, senhor Gray? Sempre ouço opiniões do Harry da boca de seus amigos. É a única maneira de eu ficar sabendo o que ele pensa. Mas não vá pensar que eu não aprecio a boa música. Eu adoro, mas tenho medo. Ela me deixa romântica demais. Eu simplesmente idolatro pianistas – às vezes mais de um ao mesmo tempo, segundo o Harry. Não sei o que eles têm. Talvez seja porque eles são estrangeiros. São todos estrangeiros, não é? Mesmo os nascidos na Inglaterra, depois de algum tempo viram estrangeiros, não é? É tão inteligente da parte deles, e um verdadeiro elogio à arte. Torna a arte algo bastante cosmopolita, não? O senhor nunca esteve nas minhas festas, não é, senhor Gray? Você precisa vir. Não tenho dinheiro para orquídeas, mas não faço economia com estrangeiros. Eles tornam nossos ambientes muito pitorescos. Mas o Harry chegou! Harry, entrei procurando você, para lhe pedir alguma coisa que esqueci o que era e encontrei o senhor Gray. Tivemos uma adorável conversa sobre música. Temos ideias muito parecidas. Não; creio que nossas ideias sejam muito diferentes. Mas ele foi muito simpático. Fiquei contente ao vê-lo.", "h": 0}, {"i": 401, "c": 6, "ct": "Capítulo IV", "t": "– Que bom, meu amor, que bom – disse lorde Henry, erguendo as sobrancelhas escuras e arqueadas e olhando para ambos com um sorriso divertido. – Sinto muito pelo atraso, Dorian. Fui atrás de um velho brocado em Wardour Street e precisei ficar horas negociando o preço. Hoje em dia as pessoas sabem o preço de tudo e o valor de nada.", "h": 0}, {"i": 402, "c": 6, "ct": "Capítulo IV", "t": "– Infelizmente preciso ir – exclamou lady Henry, rompendo um silêncio constrangido com seu riso tolo e repentino. – Prometi que sairia com a duquesa. Adeus, senhor Gray. Adeus, Harry. Imagino que você vá jantar fora, não? Eu vou. Talvez nos encontremos na casa de lady Thornbury.", "h": 0}, {"i": 403, "c": 6, "ct": "Capítulo IV", "t": "– Certamente, querida – disse lorde Henry, fechando a porta atrás dela, enquanto, como uma ave-do-paraíso que passou a noite inteira na chuva, ela saía da sala, deixando no ar um discreto odor de jasmim-manga. Então ele acendeu um cigarro e se atirou no sofá.", "h": 0}, {"i": 404, "c": 6, "ct": "Capítulo IV", "t": "– Nunca se case com uma mulher de cabelos cor de palha, Dorian – ele disse, após algumas tragadas.", "h": 0}, {"i": 405, "c": 6, "ct": "Capítulo IV", "t": "– Por quê, Harry?", "h": 0}, {"i": 406, "c": 6, "ct": "Capítulo IV", "t": "– Porque elas são muito sentimentais.", "h": 0}, {"i": 407, "c": 6, "ct": "Capítulo IV", "t": "– Mas eu gosto de pessoas sentimentais.", "h": 0}, {"i": 408, "c": 6, "ct": "Capítulo IV", "t": "– Jamais se case, Dorian. Os homens se casam porque ficam cansados; as mulheres, porque são curiosas; ambos acabam se frustrando.", "h": 0}, {"i": 409, "c": 6, "ct": "Capítulo IV", "t": "– Não é provável que eu vá me casar, Henry. Estou apaixonado demais para isso. Esse é outro dos seus aforismos. Estou colocando-o em prática, como faço com tudo o que você diz.", "h": 0}, {"i": 410, "c": 6, "ct": "Capítulo IV", "t": "– Por quem você está apaixonado? – perguntou lorde Henry, depois de uma pausa.", "h": 0}, {"i": 411, "c": 6, "ct": "Capítulo IV", "t": "– Por uma atriz – disse Dorian Gray, corando.", "h": 0}, {"i": 412, "c": 6, "ct": "Capítulo IV", "t": "Lorde Henry deu de ombros. – É um clichê e tanto para um début amoroso.", "h": 0}, {"i": 413, "c": 6, "ct": "Capítulo IV", "t": "– Você não diria isso se a visse, Harry.", "h": 0}, {"i": 414, "c": 6, "ct": "Capítulo IV", "t": "– Quem é ela?", "h": 0}, {"i": 415, "c": 6, "ct": "Capítulo IV", "t": "– O nome dela é Sibyl Vane.", "h": 0}, {"i": 416, "c": 6, "ct": "Capítulo IV", "t": "– Nunca ouvi falar.", "h": 0}, {"i": 417, "c": 6, "ct": "Capítulo IV", "t": "– Ninguém a conhece. Mas um dia as pessoas a conhecerão. Ela é genial.", "h": 0}, {"i": 418, "c": 6, "ct": "Capítulo IV", "t": "– Meu caro menino, nenhuma mulher é genial. As mulheres são um sexo decorativo. Nunca têm nada para dizer, mas sempre dizem com certa graça. As mulheres representam o triunfo da matéria sobre o intelecto, assim como os homens representam o triunfo do intelecto sobre a moral.", "h": 0}, {"i": 419, "c": 6, "ct": "Capítulo IV", "t": "– Harry, como você pode dizer isso?", "h": 0}, {"i": 420, "c": 6, "ct": "Capítulo IV", "t": "– Meu caro Dorian, é a pura verdade. Estou atualmente estudando as mulheres, de modo que eu deveria saber do que estou falando. O tema não é tão absurdo quanto achei que seria. Descobri que, em última análise, existem dois tipos de mulheres, as comuns e as pintadas. As mulheres comuns são muito úteis. Se você quer conquistar uma reputação de respeitabilidade, basta convidá-las para jantar. As outras mulheres são muito encantadoras. Mas cometem um equívoco. Elas se pintam para tentar parecer jovens. Nossas avós se pintavam para tentar conversar com brilhantismo. Rouge e esprit costumavam combinar. Hoje isso tudo acabou. Contanto que a mulher consiga parecer dez anos mais jovem do que a própria filha, ela ficará plenamente satisfeita. Quanto à conversa, só existem cinco mulheres em Londres com quem vale a pena conversar, e duas delas não são admitidas na alta sociedade. No entanto, fale-me mais sobre esse gênio que você conheceu. Há quanto tempo você a conhece?", "h": 0}, {"i": 421, "c": 6, "ct": "Capítulo IV", "t": "– Ah! Harry, as suas opiniões me aterrorizam.", "h": 0}, {"i": 422, "c": 6, "ct": "Capítulo IV", "t": "– Não se incomode com isso. Há quanto tempo você a conhece?", "h": 0}, {"i": 423, "c": 6, "ct": "Capítulo IV", "t": "– Há umas três semanas.", "h": 0}, {"i": 424, "c": 6, "ct": "Capítulo IV", "t": "– E onde você a conheceu?", "h": 0}, {"i": 425, "c": 6, "ct": "Capítulo IV", "t": "– Vou lhe contar, Harry; mas você não pode ser tão impiedoso nesse caso. Afinal, nada disso teria acontecido se eu não tivesse conhecido você. Você me encheu de um desejo incontrolável de conhecer tudo sobre a vida. Durante alguns dias depois de conhecer você, parecia haver algo pulsando nas minhas veias. Quando eu me sentava no parque, ou passeava por Piccadilly, costumava olhar para todos que passavam e me perguntava, com louca curiosidade, que tipo de vida aquelas pessoas levavam. Algumas me fascinavam. Outras me enchiam de terror. Havia no ar um veneno peculiar. Senti uma paixão por sensações… Bem, certa noite, por volta das sete horas, resolvi sair em busca de alguma aventura. Senti que nessa nossa Londres, cinzenta e monstruosa, com miríades de pessoas, sórdidos pecadores e seus esplêndidos pecados, como você disse um dia, devia haver algo reservado para mim. Fantasiei mil coisas. O mero perigo me deu uma sensação de prazer. Lembrei-me do que você me disse naquela noite em que jantamos juntos pela primeira vez, sobre a busca da beleza ser o verdadeiro segredo da vida. Não sei o que eu esperava, mas saí e perambulei rumo ao leste e logo me perdi em um labirinto de ruas sujas e escuras, praças barrentas, sem gramado. Por volta das oito e meia, passei por um teatrinho absurdo, com grandes luminosos de gás e cartazes espalhafatosos. Um judeu hediondo, com o colete mais bizarro que já vi na vida, estava parado na entrada, fumando um charuto barato. Ele usava anéis sebosos e um enorme diamante cintilava no peito da camisa manchada. “Camarote, meu lorde?” – ele disse ao me ver, e tirou a cartola com um ar de magnífica submissão. Havia algo no sujeito, Harry, que me entreteve. Ele era um verdadeiro monstro. Você pode até rir, eu sei, mas a verdade é que entrei e paguei um guinéu pelo camarote vizinho ao palco. Até hoje não sei por que fiz isso; e, no entanto, se eu não o fizesse… meu caro Harry, eu teria perdido o maior romance da minha vida. Estou vendo que você está rindo. Que horrível da sua parte!", "h": 0}, {"i": 426, "c": 6, "ct": "Capítulo IV", "t": "– Não estou rindo, Dorian; pelo menos não de você. Mas você não deveria dizer que é o maior romance da sua vida. Você devia dizer que é o primeiro romance da sua vida. Você sempre será amado e sempre se apaixonará pelo amor. Uma grande passion é privilégio das pessoas que não têm nada para fazer. Essa é a única utilidade das classes ociosas de um país. Não tenha medo. Você terá coisas magníficas pela frente. Isso é só o começo.", "h": 0}, {"i": 427, "c": 6, "ct": "Capítulo IV", "t": "– Você me considera uma pessoa tão superficial assim? – exclamou Dorian Gray, irritadiço.", "h": 0}, {"i": 428, "c": 6, "ct": "Capítulo IV", "t": "– Não, considero você uma pessoa profunda.", "h": 0}, {"i": 429, "c": 6, "ct": "Capítulo IV", "t": "– Como assim?", "h": 0}, {"i": 430, "c": 6, "ct": "Capítulo IV", "t": "– Meu caro menino, as pessoas que só amam uma vez na vida é que são na verdade superficiais. Aquilo que elas chamam de lealdade e fidelidade, eu chamo de letargia do hábito ou de falta de imaginação. A fidelidade é na vida emocional o que a coerência é na vida intelectual – mera confissão do fracasso. Fidelidade! Um dia preciso estudar isso. A paixão pela propriedade está incluída nela. Quantas coisas não jogaríamos fora se não tivéssemos medo de que outras pessoas fossem recolhê-las? Mas não quero interrompê-lo. Continue a história.", "h": 0}, {"i": 431, "c": 6, "ct": "Capítulo IV", "t": "– Bem, eu me vi sentado em um pequeno camarote horrível, com um pano de cena vulgar me encarando de frente. Desviei o olhar da cortina e avaliei o teatro. Era muito espalhafatoso, cheio de cupidos e cornucópias, parecia um bolo de casamento de terceira categoria. A galeria e o fosso estavam lotados, mas as duas fileiras de poltronas escusas estavam praticamente vazias, e também não havia ninguém naquilo que imagino que eles chamassem de mezanino. Passavam mulheres vendendo laranjas e cerveja de gengibre, e havia um consumo desenfreado de amendoins.", "h": 0}, {"i": 432, "c": 6, "ct": "Capítulo IV", "t": "– Deve ter sido um espetáculo digno do apogeu do drama inglês.", "h": 0}, {"i": 433, "c": 6, "ct": "Capítulo IV", "t": "– Exatamente, imagino, e muito deprimente. Comecei a me peguntar o que diabos eu devia fazer, quando deparei com o cartaz. Que peça você acha que era, Harry?", "h": 0}, {"i": 434, "c": 6, "ct": "Capítulo IV", "t": "– Eu diria O menino idiota , ou Parvo mas inocente . Creio que nossos pais costumavam gostar desse tipo de peça. Quanto mais eu vivo, Dorian, mais agudamente sinto que tudo o que era bom o suficiente para os nossos pais não é bom o suficiente para nós. Em arte, em política, les grandpères ont toujours tort [os avós estão sempre errados].", "h": 0}, {"i": 435, "c": 6, "ct": "Capítulo IV", "t": "– Mas a peça era uma de que ainda gostamos, Harry. Era Romeu e Julieta . Devo admitir que fiquei um tanto contrariado com a ideia de assistir Shakespeare encenado naquela maldita espelunca. Ainda assim, eu me interessei, de certa maneira. De todo modo, decidi esperar pelo primeiro ato. Havia uma orquestra pavorosa, regida por um jovem judeu sentado a um piano estropiado, que quase me faz levantar e ir embora, mas por fim a cortina subiu e a peça começou. Romeu era um parrudo cavalheiro de idade, com sobrancelhas de carvão, uma voz rouca trágica e o perfil de um barril de cerveja. Mercúcio era tão ruim ou pior que Romeu. Era interpretado por um comediante popular, que introduzira sua próprias piadas e tratava com intimidade a plateia. Ambos eram tão grotescos quanto o cenário, que parecia ter saído de uma barraca de feira. Mas Julieta! Harry, imagine uma menina, menos de dezessete anos, com um rosto que parece uma florzinha, uma pequena cabeça grega de cachos trançados castanho-escuros, olhos que são dois poços violetas de paixão, lábios que eram pétalas de rosa. Ela é a coisa mais adorável que eu já vi na vida. Você me disse uma vez que a compaixão não o comovia, mas que a beleza, a mera beleza, era capaz de levá-lo às lágrimas. Pois eu lhe digo, Harry, mal conseguia enxergar a garota, tamanho o nevoeiro de lágrimas que se formou em mim. E aquela voz – ela tem uma voz como nunca ouvi. Muito baixa a princípio, com notas graves e suaves, que pareciam feitas apenas para o nosso ouvido. Depois ficou um pouco mais alta e soou como uma flauta ou um oboé distante. Na cena do jardim, tinha todo o êxtase trêmulo que se ouve pouco antes da alvorada quando estão cantando os rouxinóis. Em alguns momentos, mais adiante, tinha a louca paixão dos violinos. Você sabe como uma voz é capaz de nos abalar. A sua voz e a voz de Sibyl Vane são duas coisas de que jamais me esquecerei. Quando fecho os olhos, posso ouvi-las, e cada uma delas diz uma coisa diferente. Não sei a qual seguir. Por que eu não deveria amá-la? Harry, eu a amo. Ela é tudo para mim na vida. Tenho ido assisti-la toda sessão. Uma noite ela é Rosalinda e, na noite seguinte, Imogênia. Já a vi morrer na escuridão de um túmulo italiano, tomando o veneno dos lábios do amante. Assisti quando ela perambulou pela floresta de Arden, disfarçada de um belo menino de bragas e gibão e touca. Ela já foi louca, já esteve na presença de um rei culpado, fazendo-o vestir o remorso e provar ervas amargas. Já foi inocente, e as mãos negras do ciúme esmagaram sua garganta de junco. Já a vi com todas as idades e com todos os trajes. As mulheres comuns não me falam à imaginação. Estão limitadas a seu século. Nenhum fascínio jamais as transfigura. Conhecemos seus espíritos conhecendo seus chapéus. Sempre se pode encontrá-las. Não há nenhum mistério em nenhuma delas. Elas cavalgam pelo parque de manhã e conversam durante o chá da tarde. Possuem sorrisos estereotipados e modos elegantes. São muito óbvias. Mas uma atriz! Como as atrizes são diferentes! Harry! Por que você não me disse que a única coisa que valia a pena amar era uma atriz?", "h": 0}, {"i": 436, "c": 6, "ct": "Capítulo IV", "t": "– Porque eu já amei muitas delas, Dorian.", "h": 0}, {"i": 437, "c": 6, "ct": "Capítulo IV", "t": "– Oh, sim, pessoas horríveis com cabelos tingidos e rostos maquiados.", "h": 0}, {"i": 438, "c": 6, "ct": "Capítulo IV", "t": "– Não fale mal dos cabelos tingidos e rostos maquiados. Às vezes, elas têm um encanto extraordinário – disse lorde Henry.", "h": 0}, {"i": 439, "c": 6, "ct": "Capítulo IV", "t": "– Agora me arrependi de ter contado sobre Sibyl Vane.", "h": 0}, {"i": 440, "c": 6, "ct": "Capítulo IV", "t": "– Você não teria como evitar de me contar, Dorian. Você me contará tudo o que fizer pelo resto da vida.", "h": 0}, {"i": 441, "c": 6, "ct": "Capítulo IV", "t": "– Sim, Harry, acredito que seja verdade. Não consigo evitar de lhe contar as coisas. Você tem sobre mim uma influência curiosa. Se um dia eu cometer algum crime, virei aqui confessá-lo. Você me entenderia.", "h": 0}, {"i": 442, "c": 6, "ct": "Capítulo IV", "t": "– Pessoas como você – obstinados raios de sol da vida – não cometem crimes, Dorian. Mas eu agradeço muito o elogio, da mesma forma. E agora me diga – passe-me os fósforos, como um bom menino: obrigado – qual é a sua relação efetiva com Sibyl Vane?", "h": 0}, {"i": 443, "c": 6, "ct": "Capítulo IV", "t": "Dorian Gray se pôs de pé num salto, com as faces coradas e os olhos ardentes. – Harry! Sibyl Vane é sagrada!", "h": 0}, {"i": 444, "c": 6, "ct": "Capítulo IV", "t": "– As coisas sagradas são as únicas que valem a pena tocar, Dorian – disse lorde Henry, com uma estranha pungência na voz. – Mas por que você se incomoda? Imagino que ela vá ser sua algum dia. O apaixonado sempre começa enganando a si mesmo e sempre acaba enganando o outro. É isso que as pessoas chamam de romance. Você a conhece pessoalmente, ao menos, imagino?", "h": 0}, {"i": 445, "c": 6, "ct": "Capítulo IV", "t": "– É claro que a conheço. Na primeira noite em que fui ao teatro, o velho judeu horrendo veio ao camarote depois do espetáculo e ofereceu me levar aos bastidores e me apresentar a ela. Fiquei furioso com ele, e disse que Julieta havia morrido séculos atrás, e que seu corpo jazia num túmulo de mármore em Verona. Creio que, pela expressão de espanto no rosto dele, ele deve ter ficado com a impressão de que eu bebera champanhe demais, ou coisa que o valha.", "h": 0}, {"i": 446, "c": 6, "ct": "Capítulo IV", "t": "– Não me surpreende.", "h": 0}, {"i": 447, "c": 6, "ct": "Capítulo IV", "t": "– Então ele me perguntou se eu escrevia para algum jornal. Eu disse que nem lia jornal. Ele pareceu terrivelmente desapontado com isso e me confessou que todos os críticos tinham um complô contra ele, e que eram todos uns vendidos.", "h": 0}, {"i": 448, "c": 6, "ct": "Capítulo IV", "t": "– Não duvido de que nisso ele tenha razão. Mas, por outro lado, a julgar pela aparência dos críticos, a maioria não devia cobrar muito.", "h": 0}, {"i": 449, "c": 6, "ct": "Capítulo IV", "t": "– Bem, o velho parecia achá-los caros demais – riu Dorian. – A essa altura, no entanto, as luzes se apagaram no teatro e precisei sair. Ele queria que eu experimentasse alguns charutos que recomendou enfaticamente. Declinei. Na noite seguinte, é claro, voltei ao local. Quando ele me viu, fez uma longa mesura e me disse que eu era um magnânimo patrono das artes. O sujeito era ofensivamente grosseiro, embora tivesse uma paixão extraordinária por Shakespeare. Disse-me, com certo ar de orgulho, que suas cinco falências foram exclusivamente por causa do “Bardo”, como ele insistia em chamá-lo. Parecia considerar aquilo uma distinção.", "h": 0}, {"i": 450, "c": 6, "ct": "Capítulo IV", "t": "– É uma distinção, meu caro Dorian – uma grande distinção. A maioria vai à bancarrota por investir demais na prosa da vida. Arruinar-se com poesia é uma honra. Mas quando foi a primeira vez que você falou com a senhorita Sibyl Vane?", "h": 0}, {"i": 451, "c": 6, "ct": "Capítulo IV", "t": "– Na terceira noite. Ela havia feito Rosalinda. Não pude evitar de ir aos bastidores. Eu havia jogado flores, e ela havia olhado para mim; pelo menos foi o que imaginei. O velho judeu era persistente. Parecia decidido a me levar ao camarim, então consenti. Você não acha curioso que eu não tenha desejado conhecê-la logo?", "h": 0}, {"i": 452, "c": 6, "ct": "Capítulo IV", "t": "– Não; não acho.", "h": 0}, {"i": 453, "c": 6, "ct": "Capítulo IV", "t": "– Mas, meu caro Harry, por quê?", "h": 0}, {"i": 454, "c": 6, "ct": "Capítulo IV", "t": "– Posso lhe dizer noutro momento. Agora quero saber sobre a garota.", "h": 0}, {"i": 455, "c": 6, "ct": "Capítulo IV", "t": "– Sibyl? Oh, ela é tão tímida e tão delicada. Ela tem algo de criança. Seus olhos ficaram arregalados com um deslumbramento delicioso quando eu disse o que achara da apresentação dela, e ela me pareceu inconsciente do próprio poder. Creio que estávamos ambos bastante nervosos. O velho judeu ficou sorrindo, parado na entrada da coxia empoeirada, fazendo rebuscados discursos sobre nós dois, enquanto nós ficamos nos olhando como duas crianças. Ele insistia em me chamar de “meu lorde”, de modo que precisei dizer a Sibyl que eu não era nada daquilo. Ela simplesmente me disse o seguinte: “Você parece mais um príncipe. Vou chamá-lo de Príncipe Encantado”.", "h": 0}, {"i": 456, "c": 6, "ct": "Capítulo IV", "t": "– Uma coisa é certa, Dorian, a senhorita Sibyl sabe fazer um elogio.", "h": 0}, {"i": 457, "c": 6, "ct": "Capítulo IV", "t": "– Você não a entendeu, Harry. Ela me considera meramente um personagem em uma peça de teatro. Ela não sabe nada da vida. Mora com a mãe, uma velha cansada que fizera o papel de Lady Capuleto usando uma espécie de cafetã magenta na primeira noite, e que parece já ter tido uma vida melhor.", "h": 0}, {"i": 458, "c": 6, "ct": "Capítulo IV", "t": "– Sei como é essa aparência. É algo que me deprime – murmurou lorde Henry, examinando os próprios anéis.", "h": 0}, {"i": 459, "c": 6, "ct": "Capítulo IV", "t": "– O judeu quis me contar a história dela, mas não me interessei.", "h": 0}, {"i": 460, "c": 6, "ct": "Capítulo IV", "t": "– Você agiu bem. Existe sempre algo de infinitamente cruel nas tragédias alheias.", "h": 0}, {"i": 461, "c": 6, "ct": "Capítulo IV", "t": "– Só me interesso pela Sibyl. Que me importa de onde ela vem? De sua cabecinha a seu pezinho, ela é absoluta e inteiramente divina. Todas as noites da minha vida vou assisti-la atuar, e a cada noite ela está mais maravilhosa.", "h": 0}, {"i": 462, "c": 6, "ct": "Capítulo IV", "t": "– Imagino que seja por isso que você nunca mais jantou comigo. Achei mesmo que você deveria estar envolvido em algum romance curioso. E você está de fato; mas não é bem o que eu tinha em mente.", "h": 0}, {"i": 463, "c": 6, "ct": "Capítulo IV", "t": "– Meu caro Harry, nós almoçamos ou ceamos juntos todos os dias, e fui à ópera com você diversas vezes desde então – disse Dorian, abrindo seus olhos azuis com espanto.", "h": 0}, {"i": 464, "c": 6, "ct": "Capítulo IV", "t": "– Você sempre tem chegado terrivelmente atrasado.", "h": 0}, {"i": 465, "c": 6, "ct": "Capítulo IV", "t": "– Bem, não consigo evitar de ir assistir Sibyl em cena – ele exclamou –, nem que seja um único ato. Sinto fome da presença dela; e quando penso na alma maravilhosa escondida naquele corpinho de marfim, sinto-me cheio de um temor reverente.", "h": 0}, {"i": 466, "c": 6, "ct": "Capítulo IV", "t": "– Você pode jantar comigo hoje à noite, não é, Dorian?", "h": 0}, {"i": 467, "c": 6, "ct": "Capítulo IV", "t": "Ele balançou a cabeça. – Hoje à noite ela será Imogênia – ele respondeu –, e amanhã será Julieta.", "h": 0}, {"i": 468, "c": 6, "ct": "Capítulo IV", "t": "– Quando ela é Sibyl Vane?", "h": 0}, {"i": 469, "c": 6, "ct": "Capítulo IV", "t": "– Nunca.", "h": 0}, {"i": 470, "c": 6, "ct": "Capítulo IV", "t": "– Meus parabéns.", "h": 0}, {"i": 471, "c": 6, "ct": "Capítulo IV", "t": "– Que horror você dizer isso! Ela é todas as grandes heroínas do mundo em uma única pessoa. Ela é mais que um indivíduo. Você ri, mas estou lhe dizendo que ela é genial. Eu a amo e preciso fazer que ela me ame. Você, que conhece todos os segredos da vida, diga-me como faço para Sibyl Vane se apaixonar por mim! Quero deixar Romeu com ciúmes. Quero que os amantes mortos do mundo ouçam nossas risadas e se entristeçam. Que o sopro da nossa paixão inspire consciência no pó, desperte as cinzas desses amantes e as converta em dor. Meu Deus, Harry, como eu a idolatro! – Ele caminhava para lá e para cá enquanto falava. Manchas vermelhas febris ardiam em suas faces. Ele estava terrivelmente excitado.", "h": 0}, {"i": 472, "c": 6, "ct": "Capítulo IV", "t": "Lorde Henry observava-o com uma sensação sutil de prazer. Quanta diferença do menino tímido e assustado que ele conhecera no estúdio de Basil Hallward! Sua natureza se desenvolvera como uma flor, dando origem a flamejantes florações escarlates. A alma deixara lentamente seu esconderijo secreto, e o desejo viera encontrá-la no caminho.", "h": 0}, {"i": 473, "c": 6, "ct": "Capítulo IV", "t": "– E o que você pretende fazer agora? – disse lorde Henry, enfim.", "h": 0}, {"i": 474, "c": 6, "ct": "Capítulo IV", "t": "– Quero que você e Basil venham comigo uma noite dessas e a vejam atuar. Não tenho nenhum medo do resultado. Você certamente reconhecerá a genialidade dela. Depois precisaremos livrá-la das mãos do judeu. Ela tem um contrato de três anos com ele – pelo menos dois anos e oito meses. Evidentemente, deverei pagar alguma coisa ao sujeito. Quando tudo estiver acertado, alugarei um teatro no West End e a lançarei como se deve. Ela enlouquecerá todo mundo como fez comigo.", "h": 0}, {"i": 475, "c": 6, "ct": "Capítulo IV", "t": "– Mas isso seria possível, meu querido menino?", "h": 0}, {"i": 476, "c": 6, "ct": "Capítulo IV", "t": "– Sim, ela conseguirá. Ela não tem apenas arte, um instinto artístico consumado, dentro de si, ela também tem personalidade; e muitas vezes você disse que são as personalidades, e não os princípios, que movimentam a nossa época.", "h": 0}, {"i": 477, "c": 6, "ct": "Capítulo IV", "t": "– Bem, e quando iremos vê-la?", "h": 0}, {"i": 478, "c": 6, "ct": "Capítulo IV", "t": "– Deixe-me ver. Hoje é terça-feira. Vamos marcar para amanhã. Amanhã ela fará Julieta.", "h": 0}, {"i": 479, "c": 6, "ct": "Capítulo IV", "t": "– Está bem. No Bristol, às oito horas; e eu vou buscar o Basil.", "h": 0}, {"i": 480, "c": 6, "ct": "Capítulo IV", "t": "– Oito, não, Harry, por favor. Seis e meia. Precisamos estar lá antes de abrirem a cortina. Você precisa vê-la no primeiro ato, quando ela conhece Romeu.", "h": 0}, {"i": 481, "c": 6, "ct": "Capítulo IV", "t": "– Seis e meia! Mas que horário! Será praticamente um ajantarado, ou como ler um romance inglês. O ideal seria às sete. Nenhum cavalheiro janta antes das sete. Você se encontrará com o Basil antes disso? Ou será melhor que eu escreva para ele?", "h": 0}, {"i": 482, "c": 6, "ct": "Capítulo IV", "t": "– Querido Basil! Não o vejo há uma semana. É um tanto horrível da minha parte, uma vez que ele mandou me entregar meu retrato em uma moldura maravilhosa, feita especialmente por ele, e, embora eu tenha ficado um pouco enciumado do retrato, por ser um mês mais jovem do que eu, devo admitir que adorei. Talvez seja melhor você escrever para ele. Não quero encontrá-lo sozinho. Ele diz coisas que me irritam. Quer me dar bons conselhos.", "h": 0}, {"i": 483, "c": 6, "ct": "Capítulo IV", "t": "Lorde Henry sorriu. – As pessoas gostam de dar aquilo de que elas mesmas mais precisam. É o que eu chamo de generosidade profunda.", "h": 0}, {"i": 484, "c": 6, "ct": "Capítulo IV", "t": "– Oh, o Basil é o melhor sujeito que eu conheço, mas ele me parece um pouco filisteu. Desde que conheci você, Harry, descobri isso.", "h": 0}, {"i": 485, "c": 6, "ct": "Capítulo IV", "t": "– O Basil, meu caro menino, coloca tudo o que tem de encantador em seu trabalho. A consequência é que não sobra nada para a vida dele, além dos preconceitos, princípios e senso comum. Os únicos artistas que conheci, que são pessoalmente adoráveis, são maus artistas. Os bons artistas só existem naquilo que fazem, e consequentemente são totalmente desinteressantes naquilo que são. Um grande poeta, um poeta realmente grande, é a criatura menos poética que existe. Mas os poetas inferiores são absolutamente fascinantes. Quanto piores são as rimas, mais pitoresca sua aparência. O simples fato de haver publicado um livro de sonetos de segunda categoria torna um homem irresistível. Ele vive a poesia que é incapaz de escrever. Os outros escrevem a poesia que não ousam realizar.", "h": 0}, {"i": 486, "c": 6, "ct": "Capítulo IV", "t": "– Será que isso é realmente assim, Harry? – disse Dorian Gray, derramando em seu lenço um pouco de perfume de um grande frasco de tampa dourada que estava na mesa. – Se você está dizendo, deve ser. E agora vou embora. Imogênia me espera. Não se esqueça de amanhã. Adeus.", "h": 0}, {"i": 487, "c": 6, "ct": "Capítulo IV", "t": "Assim que ele saiu da sala, as pálpebras pesadas de lorde Henry se fecharam, e ele começou a pensar. Seguramente poucas pessoas o interessavam tanto quanto Dorian Gray, e, no entanto, a louca adoração do rapaz por outra pessoa não lhe causava sequer uma pontada de irritação ou ciúme. Ficou contente com aquilo. Tornava-o um caso ainda mais interessante de estudo. Sempre tivera um fascínio pelos métodos das ciências naturais, mas os temas dessas ciências lhe pareciam triviais e sem importância. E assim, desde então, ele passara à dissecação de si mesmo, depois de muita dissecação alheia. A vida humana – eis a única coisa que lhe parecia valer a pena investigar. Comparado a isso, nada mais tinha qualquer valor. Era verdade que, quando se observa a vida em seu curioso crisol de dor e prazer não se pode usar uma máscara de vidro sobre o rosto, nem evitar que os vapores sulfurosos perturbem o cérebro, tornando a imaginação turva de monstruosas fantasias e sonhos disformes. Havia venenos tão sutis que, para conhecer suas propriedades, era preciso deles adoecer. Havia doenças tão estranhas que era preciso passar por elas para entender sua natureza. E, no entanto, que grande recompensa se recebia! Que maravilhoso o mundo se tornava! Reparar na curiosa lógica dura da paixão e na emotiva e colorida vida do intelecto – observar onde ambas se encontravam e onde se separavam, onde estavam em uníssono e em que ponto discordavam – nisso havia um prazer! Que importância tinha o preço disso? Nenhuma sensação seria cara demais.", "h": 0}, {"i": 488, "c": 6, "ct": "Capítulo IV", "t": "Ele tinha consciência – e esse pensamento trouxe um laivo de prazer a seus olhos de Agatha castanhos – de que havia sido com palavras suas, palavras musicais, ditas com voz musical, que a alma de Dorian Gray se voltara para aquela menina branca e se curvara em adoração diante dela. Em grande medida, o rapaz era uma criação sua. Ele o tornara precoce. Isso já era alguma coisa. As pessoas comuns esperavam a vida revelar seus segredos, mas aos raros, aos eleitos, os mistérios da vida eram revelados antes que o véu fosse removido. Às vezes, isso era efeito da arte e, principalmente, da arte da literatura, que lidava imediatamente com as paixões e com o intelecto. Mas, de quando em quando, uma personalidade complexa tomava seu lugar e assumia o posto da arte; era de fato, à sua maneira, uma verdadeira obra de arte, a vida fazendo suas elaboradas obras-primas, assim como a poesia faz as suas, ou a escultura, ou a pintura.", "h": 0}, {"i": 489, "c": 6, "ct": "Capítulo IV", "t": "Sim, o rapaz era precoce. Ele estava fazendo sua colheita quando ainda era primavera. O pulso e a paixão da juventude estavam dentro dele, mas ele vinha se tornando consciente disso. Era delicioso observá-lo. Com seu belo rosto e sua bela alma, ele era uma coisa deslumbrante. Não importava como tudo terminaria, ou como estava destinado a acabar. Ele era como uma dessas figuras graciosas em um cortejo ou em uma peça, cujas alegrias parecem remotas para nós, mas cujas tristezas abalam nossa ideia de beleza, e cujas feridas são como rosas vermelhas.", "h": 0}, {"i": 490, "c": 6, "ct": "Capítulo IV", "t": "Alma e corpo, corpo e alma – como eram misteriosos! Havia uma animalidade na alma, e o corpo tinha seus momentos de espiritualidade. Os sentidos podiam ser refinados, e o intelecto podia se degradar. Quem diria onde cessava o impulso carnal, ou começava o impulso físico? Como eram rasas as definições arbitrárias dos psicólogos comuns! E, no entanto, como era difícil escolher entre as afirmações das diversas escolas! Será que a alma era uma sombra pousada na casa do pecado? Ou será que era o corpo, na verdade, que habitava a alma, como pensava Giordano Bruno? A separação entre o espírito e a matéria era um mistério, e a união entre o espírito e a matéria também era um mistério.", "h": 0}, {"i": 491, "c": 6, "ct": "Capítulo IV", "t": "Ele começou a se perguntar se um dia seríamos capazes de criar uma psicologia tão absolutamente científica que cada mínima fonte de vida nos seria revelada. Na realidade, nunca nos entendemos e raramente entendemos os outros. A experiência não tinha nenhum valor ético. Era apenas um nome que os homens davam aos próprios erros. Os moralistas, em geral, consideravam a experiência uma espécie de alerta, reivindicavam-lhe uma certa eficácia ética na formação do caráter, elogiavam-na como algo que nos mostrava o caminho a seguir e o que evitar. Mas não havia uma força motriz na experiência. Era uma causa ativa tão fraca quanto a própria consciência. Tudo o que ela demonstrava na verdade era que nosso futuro seria igual ao nosso passado, e que o pecado que cometemos uma vez, com repulsa, nós o cometeríamos ainda muitas vezes, com alegria.", "h": 0}, {"i": 492, "c": 6, "ct": "Capítulo IV", "t": "Estava claro para ele que o método experimental era o único método pelo qual se podia chegar a uma análise científica das paixões; e certamente Dorian Gray era um tema sob medida para ele, e parecia prometer resultados ricos e frutíferos. Aquele súbito amor por Sibyl Vane era um fenômeno psicológico de grande interesse. Não havia dúvida de que a curiosidade tinha muito a ver com aquilo, a curiosidade e o desejo de novas experiências; embora não fosse uma paixão simples, mas muito complexa. O que era puramente um instinto sensual da adolescência se transformara, por obra da imaginação, em algo que, ao próprio rapaz, parecia algo distante da razão e, por isso mesmo, ainda mais perigoso. Eram as paixões sobre cuja origem nos iludíamos que nos tiranizavam mais fortemente. Nossas motivações mais fracas eram aquelas de cuja natureza tínhamos consciência. Amiúde, quando achamos que estamos fazendo experiências com os outros, na verdade estamos experimentando a nós mesmos.", "h": 0}, {"i": 493, "c": 6, "ct": "Capítulo IV", "t": "Enquanto lorde Henry sonhava com essas coisas, bateram na porta, e seu criado entrou, e lembrou que estava na hora de se vestir para o jantar. Ele se levantou e olhou pela janela. O pôr do sol pintara de ouro rubro as janelas altas das casas do outro lado da rua. Os vidros cintilavam como placas de metal aquecido. O céu parecia uma rosa fenecida. Ele pensou na vida em cores flamejantes de seu jovem amigo, e se perguntou como tudo aquilo acabaria.", "h": 0}, {"i": 494, "c": 6, "ct": "Capítulo IV", "t": "Quando ele chegou em casa, por volta da meia-noite e meia, viu um telegrama na mesa da entrada. Abriu-o, e viu que era de Dorian Gray. Escrevia-lhe para avisar que iria se casar com Sibyl Vane.", "h": 0}, {"i": 495, "c": 7, "ct": "Capítulo V", "t": "Capítulo V", "h": 1}, {"i": 496, "c": 7, "ct": "Capítulo V", "t": "– Mamãe, mamãe, estou tão feliz! – sussurrou a menina, afundando o rosto no colo da mulher envelhecida e cansada, que, com as costas voltadas para a luz estridente e intrusiva, estava sentada na única poltrona que a sala escura continha. – Estou tão feliz! – ela repetia –, e você também deveria ficar feliz!", "h": 0}, {"i": 497, "c": 7, "ct": "Capítulo V", "t": "A senhora Vane franziu o cenho e pôs as mãos branqueadas de bismuto sobre a cabeça da filha. – Feliz! – ela ecoou. – Só fico feliz, Sibyl, quando a vejo atuar. Você só deveria pensar na sua atuação. O senhor Isaacs tem sido muito bom para nós, e devemos dinheiro a ele.", "h": 0}, {"i": 498, "c": 7, "ct": "Capítulo V", "t": "A menina virou o rosto e ficou amuada. – Dinheiro, mamãe? – ela exclamou. – O que importa o dinheiro? O amor é maior que o dinhei
