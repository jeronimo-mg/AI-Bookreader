ítulo XIV", "t": "Incham como gargantas redondas", "h": 0}, {"i": 1090, "c": 16, "ct": "Capítulo XIV", "t": "Erguidas por suspiro amoroso.", "h": 0}, {"i": 1091, "c": 16, "ct": "Capítulo XIV", "t": "O esquife atraca e me larga,", "h": 0}, {"i": 1092, "c": 16, "ct": "Capítulo XIV", "t": "Jogando ao pilar sua amarra", "h": 0}, {"i": 1093, "c": 16, "ct": "Capítulo XIV", "t": "Diante de uma rósea fachada,", "h": 0}, {"i": 1094, "c": 16, "ct": "Capítulo XIV", "t": "Sobre o mármore de uma escada.]", "h": 0}, {"i": 1095, "c": 16, "ct": "Capítulo XIV", "t": "Como eram belos! Ao lê-los, sentia-se como se flutuasse pelos canais verdes da cidade rosa e perolada, sentado em uma gôndola negra com proa de prata e cortinas esvoaçantes. Os versos em si lhe pareciam as linhas retas de azul-turquesa que acompanham quem rema em direção ao Lido. Os lampejos súbitos de cor lembraram-lhe a cintilação do pescoço opalino e iridescente dos pássaros que pairam em torno do alto Campanile em forma de favo, ou espreitam, com graça altiva, por entre as arcadas sombrias e manchadas de pó. Recostando-se com os olhos entrecerrados, ele ficou repetindo consigo mesmo:", "h": 0}, {"i": 1096, "c": 16, "ct": "Capítulo XIV", "t": "Devant une façade rose,", "h": 0}, {"i": 1097, "c": 16, "ct": "Capítulo XIV", "t": "Sur le marbre d’un escalier.", "h": 0}, {"i": 1098, "c": 16, "ct": "Capítulo XIV", "t": "Veneza inteira estava nesses dois versos. Ele se lembrou do outono que passara lá, e de um amor maravilhoso que o levara a cometer desvarios de loucura e delícia. Havia romance em toda parte. Mas Veneza, como Oxford, conservara o cenário para o romance, e, para os verdadeiros românticos, o cenário era tudo, ou quase tudo. Basil estivera com ele parte do tempo e ficara apaixonado por Tintoretto. Pobre Basil! Que maneira horrível de morrer!", "h": 0}, {"i": 1099, "c": 16, "ct": "Capítulo XIV", "t": "Ele suspirou, voltou a abrir o livro, e tentou esquecer. Leu sobre as andorinhas que entram e saem do pequeno café em Esmirna onde os hadjis ficam repassando suas contas de âmbar e mercadores de turbantes fumam seus longos cachimbos com borlas e conversam gravemente; leu sobre o Obelisco na Place de la Concorde, que chora lágrimas de granito em seu solitário exílio sem sol e anseia por voltar ao Nilo quente e coberto de lótus, onde há esfinges, e íbis cor-de-rosa, e abutres brancos com garras douradas, e crocodilos, com pequenos olhos de berilo, que rastejam sobre a lama verde fumegante; começou a remoer aqueles versos que, extraindo música do mármore manchado de beijos, contam sobre aquela curiosa estátua que Gautier compara com uma voz de contralto, o monstre charmant que está deitado na sala de pórfiro do Louvre. Mas depois de algum tempo o livro lhe caiu das mãos. Ficou nervoso, e lhe veio um acesso horrendo de terror. E se Alan Campbell estivesse fora da Inglaterra? Dias se passariam até que ele voltasse. Talvez ele se recusasse a vir. O que poderia fazer se isso ocorresse? Cada momento era de vital importância. Eles tinham sido grandes amigos cinco anos atrás – quase inseparáveis, na verdade. Então subitamente a intimidade chegou ao fim. Quando se encontravam publicamente agora, era apenas Dorian Gray quem sorria; Alan Campbell jamais.", "h": 0}, {"i": 1100, "c": 16, "ct": "Capítulo XIV", "t": "Era um rapaz extremamente inteligente, embora não tivesse verdadeiro gosto pelas artes plásticas, e a pouca noção da beleza da poesia que tinha adquirira inteiramente de Dorian. Sua paixão intelectual dominante era pela ciência. Em Cambridge, passara boa parte do tempo trabalhando no laboratório e obtivera boa colocação no exame final de ciência natural. Na verdade, ele ainda era dedicado ao estudo da química e tinha um laboratório particular, onde costumava se trancar o dia inteiro, para grande incômodo da mãe, que sonhava para ele um cargo no Parlamento, e tinha a vaga ideia de que um químico era alguém que elaborava receitas médicas. Era um músico excelente, no entanto, também, e tocava violino e piano melhor que a maioria dos amadores. Na prática, havia sido a música que o aproximara de Dorian Gray – a música e aquela indefinível atração que Dorian parecia ser capaz de exercer sempre que desejasse e, a bem dizer, exercia amiúde sem ter consciência disso. Eles haviam se conhecido na casa de lady Berkshire, na noite em que Rubinstein tocou lá, e depois disso costumavam sempre ser vistos juntos na ópera e onde quer que houvesse boa música. Durante dezoito meses, essa intimidade durou. Campbell estava sempre ou em Selby Royal ou em Grosvenor Square. Para ele, assim como para muitas outras pessoas, Dorian Gray era o exmplo de tudo o que é maravilhoso e fascinante na vida. Se houve ou não alguma briga entre eles, ninguém jamais ficou sabendo. Mas, de repente, as pessoas notaram que eles mal se falavam quando se encontravam, e que Campbell parecia sempre ir embora mais cedo de qualquer festa em que Dorian Gray estivesse presente. Ele também havia mudado – estranhamente melancólico, às vezes, parecia quase não gostar de ouvir música e nunca mais tocou, oferecendo como desculpa, quando lhe pediam, o fato de estar tão absorvido pela ciência que não tinha mais tempo de praticar. E isso era certamente verdade. A cada dia, ele parecia mais interessado em biologia, e seu nome apareceu uma ou duas vezes em revistas científicas, associado a certos curiosos experimentos.", "h": 0}, {"i": 1101, "c": 16, "ct": "Capítulo XIV", "t": "Esse era o homem por quem Dorian Gray estava esperando. A cada segundo, ele olhava para o relógio. Depois de dez minutos, começou a ficar horrivelmente agitado. Enfim se levantou e passou a andar pela sala de um lado para o outro, parecendo um belo animal enjaulado. Dava passos longos e furtivos. Suas mãos estavam curiosamente frias.", "h": 0}, {"i": 1102, "c": 16, "ct": "Capítulo XIV", "t": "O suspense se tornou insuportável. O tempo lhe parecia se arrastar com pés de chumbo, enquanto ele era levado por ventos monstruosos em direção à escarpa rochosa de algum penhasco ou precipício obscuro. Ele sabia o que o aguardava ali; ele viu, na verdade, e, trêmulo, esmagou com mãos suadas suas pálpebras ardentes como se quisesse privar o cérebro da visão, empurrando os olhos para o fundo de sua caverna. Não adiantou. O cérebro tinha seu próprio alimento para se fartar, e a imaginação, tornada grotesca pelo terror, contorcida e distorcida como uma criatura viva pela dor, dançou como um boneco repulsivo em um teatrinho e sorriu através de máscaras articuladas. Então, subitamente, o tempo parou para ele. Sim: aquela criatura cega, de respiração lenta, já não se movia, e pensamentos horríveis, estando morto o tempo, correram muito ágeis diante de si, e arrancaram um futuro hediondo da sepultura, e mostraram para ele. Ele encarou aquilo. O horror petrificou-o.", "h": 0}, {"i": 1103, "c": 16, "ct": "Capítulo XIV", "t": "Por fim, a porta se abriu, e o criado entrou. Ele se virou com olhos vidrados.", "h": 0}, {"i": 1104, "c": 16, "ct": "Capítulo XIV", "t": "– O senhor Campbell, senhor – disse o criado.", "h": 0}, {"i": 1105, "c": 16, "ct": "Capítulo XIV", "t": "Um suspiro de alívio escapou de seus lábios secos, e a cor voltou ao rosto.", "h": 0}, {"i": 1106, "c": 16, "ct": "Capítulo XIV", "t": "– Peça que ele entre imediatamente, Francis – sentiu que voltava a si. A sensação de covardia havia passado.", "h": 0}, {"i": 1107, "c": 16, "ct": "Capítulo XIV", "t": "O criado fez uma mesura e se retirou. Momentos depois, Alan Campbell entrou, com expressão muito austera e um tanto pálido, palor intensificado por seus cabelos negros e sobrancelhas escuras.", "h": 0}, {"i": 1108, "c": 16, "ct": "Capítulo XIV", "t": "– Alan! É muita gentileza sua. Obrigado por ter vindo.", "h": 0}, {"i": 1109, "c": 16, "ct": "Capítulo XIV", "t": "– Minha intenção era nunca mais entrar na sua casa, Gray. Mas você disse que era um caso de vida ou morte – a voz era dura e fria. Ele falava devagar, deliberadamente. Havia uma expressão de desprezo no olhar firme com que ele fitava Dorian. Continuou com as mãos nos bolsos de seu sobretudo de astracã e pareceu ignorar o gesto com que fora saudado.", "h": 0}, {"i": 1110, "c": 16, "ct": "Capítulo XIV", "t": "– Sim: é uma questão de vida ou morte, Alan, e para mais de uma pessoa. Sente-se.", "h": 0}, {"i": 1111, "c": 16, "ct": "Capítulo XIV", "t": "Campbell sentou-se junto à mesa, e Dorian sentou-se diante dele. Os olhos dos dois se encontraram. Nos olhos de Dorian, havia uma pena infinita. Ele sabia que o que iria fazer era algo pavoroso.", "h": 0}, {"i": 1112, "c": 16, "ct": "Capítulo XIV", "t": "Após um momento de silêncio forçado, ele se inclinou para a frente e disse, muito suavemente, mas observando o efeito de cada palavra sobre o semblante daquele que mandara chamar: – Alan, dentro de um quarto trancado no alto desta casa, um quarto ao qual ninguém tem acesso além de mim, há um homem morto sentado diante de uma mesa. Ela já está ali morto há dez horas. Não se inquiete e não olhe assim para mim. Quem é esse homem, por que morreu, como morreu, são questões que não lhe dizem respeito. O que você precisa fazer é o seguinte…", "h": 0}, {"i": 1113, "c": 16, "ct": "Capítulo XIV", "t": "– Pare, Gray. Não quero saber mais nada. Se o que você me diz é verdade ou não, não me interessa. Recuso-me totalmente a me imiscuir na sua vida. Guarde seus segredos horríveis para você. Eles não me interessam mais.", "h": 0}, {"i": 1114, "c": 16, "ct": "Capítulo XIV", "t": "– Alan, eles precisam interessá-lo. Por este, você há de se interessar. Sinto muito, Alan. Mas não pude evitar. Você é a única pessoa capaz de me salvar. Fui obrigado a envolvê-lo no caso. Não tive escolha. Alan, você é um cientista. Você conhece química e coisas do tipo. Você fez experimentos. O que você precisa fazer é destruir aquela coisa lá em cima – destruir a ponto de não restar nenhum vestígio. Ninguém viu essa pessoa entrar na casa. Na verdade, neste exato momento, supostamente, ele estaria em Paris. Não darão falta dele em meses. Quando derem pela falta dele, não pode haver nenhum rastro dele mais aqui. Você, Alan, você precisa transformá-lo, e tudo o que pertencer a ele, em um punhado de cinzas que eu possa soprar no ar.", "h": 0}, {"i": 1115, "c": 16, "ct": "Capítulo XIV", "t": "– Você enlouqueceu, Dorian.", "h": 0}, {"i": 1116, "c": 16, "ct": "Capítulo XIV", "t": "– Ah! Eu estava esperando você me chamar de Dorian.", "h": 0}, {"i": 1117, "c": 16, "ct": "Capítulo XIV", "t": "– Você ficou louco, estou lhe dizendo – louco de achar que eu moveria um dedo para lhe ajudar, louco de me fazer essa monstruosa confissão. Não quero ter nada a ver com esse caso, seja o que for. Você acha que vou arriscar minha reputação por sua causa? O que eu tenho a ver com as suas armações diabólicas?", "h": 0}, {"i": 1118, "c": 16, "ct": "Capítulo XIV", "t": "– Foi suicídio, Alan.", "h": 0}, {"i": 1119, "c": 16, "ct": "Capítulo XIV", "t": "– Fico feliz em saber. Mas o que o levou a isso? Você, eu imagino.", "h": 0}, {"i": 1120, "c": 16, "ct": "Capítulo XIV", "t": "– Você continua se recusando a me ajudar?", "h": 0}, {"i": 1121, "c": 16, "ct": "Capítulo XIV", "t": "– É claro que eu me recuso. Não quero ter absolutamente nada com isso. Não me importa que você passe vexame. Você merece. Eu não vou sentir pena de vê-lo em desgraça publicamente. Como ousa pedir justo a mim, dentre todas as pessoas do mundo, que me misture com você nesse horror? Achei que você conhecesse melhor o caráter das pessoas. O seu amigo, lorde Henry Wotton, não deve ter lhe ensinado muita psicologia, ou o que quer que ele tenha lhe ensinado. Eu não moveria um dedo a seu favor. Você procurou a pessoa errada. Vá procurar algum dos seus amigos. Não me procure mais.", "h": 0}, {"i": 1122, "c": 16, "ct": "Capítulo XIV", "t": "– Alan, foi um assassinato. Eu o matei. Você não sabe o que ele me fez sofrer. Seja qual for a minha vida, ele foi mais responsável por fazer de mim o que sou, ou por estragá-la, do que o pobre Harry. Pode não ter sido essa a intenção dele, mas o resultado foi o mesmo.", "h": 0}, {"i": 1123, "c": 16, "ct": "Capítulo XIV", "t": "– Assassinato! Por Deus, Dorian, a que ponto você chegou? Não vou denunciá-lo. Não cabe a mim fazê-lo. Além do mais, mesmo que eu não interfira no caso, certamente você será preso. Ninguém comete um crime sem fazer algo de estúpido. Mas eu não quero ter nada com isso.", "h": 0}, {"i": 1124, "c": 16, "ct": "Capítulo XIV", "t": "– Você precisa ter algo a ver com isso. Espere, espere um momento; escute-me. Apenas escute, Alan. A única coisa que lhe peço é que você faça um certo experimento científico. Você vai a hospitais e morgues, e os horrores que você faz por lá não o afetam. Se você tivesse encontrado esse homem em uma hedionda sala de dissecção ou em algum laboratório fétido, deitado em uma mesa de metal com as vísceras para fora para o sangue escoar, você simplesmente o consideraria um espécime admirável. Você não hesitaria. Não julgaria estar fazendo nada de errado. Pelo contrário, você provavelmente acharia que estava fazendo o bem da raça humana, ou aumentando a soma de conhecimentos do mundo, ou satisfazendo uma curiosidade intelectual, ou algo do tipo. O que eu quero que você faça é meramente algo que você já fez muitas vezes antes. Na verdade, destruir um corpo deve ser muito menos horrível do que as coisas com as quais você está acostumado a trabalhar. E, lembre-se, este corpo é a única evidência contra mim. Se ele for encontrado, estou perdido; e certamente ele será encontrado se você não me ajudar.", "h": 0}, {"i": 1125, "c": 16, "ct": "Capítulo XIV", "t": "– Não tenho nenhuma intenção de ajudá-lo. Você se esquece disso. Sou simplesmente indiferente a tudo isso. Isso não tem nada a ver comigo.", "h": 0}, {"i": 1126, "c": 16, "ct": "Capítulo XIV", "t": "– Alan, eu lhe imploro. Pense na posição em que estou. Pouco antes de você chegar, eu quase desmaiei de terror. Quem sabe um dia você também não saberá o que é esse terror? Não! Nem pense nisso. Encare o assunto do ponto de vista puramente científico. Você não se pergunta de onde vêm as criaturas mortas que usa em seus experimentos. Não pergunte agora. Eu já lhe contei demais. Mas eu suplico que você faça isso por mim. Nós fomos amigos, Alan.", "h": 0}, {"i": 1127, "c": 16, "ct": "Capítulo XIV", "t": "– Não fale sobre essa época, Dorian: é uma época que já morreu.", "h": 0}, {"i": 1128, "c": 16, "ct": "Capítulo XIV", "t": "– Os mortos às vezes continuam presentes. O sujeito lá em cima não desaparecerá sozinho. Ele está sentado junto à mesa com a cabeça baixa e os braços estendidos. Alan! Alan! Se você não me ajudar, estarei arruinado. Ora, vão me enforcar, Alan! Você não está entendendo? Eles vão me enforcar por aquilo que eu fiz.", "h": 0}, {"i": 1129, "c": 16, "ct": "Capítulo XIV", "t": "– Não adianta prolongar essa cena. Eu me recuso absolutamente a fazer qualquer coisa a esse respeito. É uma insanidade sua me pedir isso.", "h": 0}, {"i": 1130, "c": 16, "ct": "Capítulo XIV", "t": "– Você se recusa?", "h": 0}, {"i": 1131, "c": 16, "ct": "Capítulo XIV", "t": "– Sim.", "h": 0}, {"i": 1132, "c": 16, "ct": "Capítulo XIV", "t": "– Eu lhe imploro, Alan.", "h": 0}, {"i": 1133, "c": 16, "ct": "Capítulo XIV", "t": "– Não adianta.", "h": 0}, {"i": 1134, "c": 16, "ct": "Capítulo XIV", "t": "A mesma expressão de pena surgiu nos olhos de Dorian Gray. Então ele estendeu a mão, pegou um pedaço de papel e escreveu alguma coisa. Ele leu duas vezes, dobrou com cuidado e empurrou o bilhete sobre a mesa. Depois disso, ele se levantou e foi até a janela.", "h": 0}, {"i": 1135, "c": 16, "ct": "Capítulo XIV", "t": "Campbell olhou surpreso para ele, e então pegou o papel, e abriu. Ao ler, seu rosto ficou morbidamente pálido, e ele se deixou cair na cadeira. Veio-lhe uma sensação horrível de náusea. Sentia-se como se o coração fosse bater até morrer dentro de uma cavidade vazia.", "h": 0}, {"i": 1136, "c": 16, "ct": "Capítulo XIV", "t": "Após dois ou três minutos de silêncio terrível, Dorian se virou e se aproximou e parou atrás dele, colocando a mão em seu ombro.", "h": 0}, {"i": 1137, "c": 16, "ct": "Capítulo XIV", "t": "– Eu sinto muito, Alan – ele murmurou –, mas você não me deixa outra alternativa. Tenho uma carta já escrita aqui comigo. Aqui está. Leia o endereço. Se você não me ajudar, precisarei enviá-la. Se você não me ajudar, vou enviá-la. Você sabe qual será o resultado. Mas você vai me ajudar. É impossível recusar agora. Tentei poupá-lo. Você deve admitir que eu tentei. Você foi duro, estúpido, ofensivo. Você me tratou como homem nenhum jamais ousou me tratar. Eu suportei. Agora é a minha vez de ditar as regras.", "h": 0}, {"i": 1138, "c": 16, "ct": "Capítulo XIV", "t": "Campbell cobriu o rosto com as mãos, e um calafrio percorreu seu corpo inteiro.", "h": 0}, {"i": 1139, "c": 16, "ct": "Capítulo XIV", "t": "– Sim, é a minha vez de ditar as regras, Alan. Você sabe que é. A coisa toda é muito simples. Vamos, não fique nesse frenesi. É preciso fazê-lo. Reconheça que é e faça-o.", "h": 0}, {"i": 1140, "c": 16, "ct": "Capítulo XIV", "t": "Um gemido escapou dos lábios de Campbell, e ele estremeceu. O tiquetaquear do relógio no aparador parecia dividir o tempo em átomos de agonia separados, todos terríveis de suportar. Sentia como se um anel de ferro estivesse sendo lentamente apertado em sua testa, como se a desgraça de que estava sendo ameaçado já estivesse agindo sobre ele. A mão em seu ombro pesava como uma mão de chumbo. Era insuportável. Parecia esmagá-lo.", "h": 0}, {"i": 1141, "c": 16, "ct": "Capítulo XIV", "t": "– Vamos, Alan, decida-se logo.", "h": 0}, {"i": 1142, "c": 16, "ct": "Capítulo XIV", "t": "– Eu não posso fazer isso – ele disse, mecanicamente, como se as palavras pudessem alterar as coisas.", "h": 0}, {"i": 1143, "c": 16, "ct": "Capítulo XIV", "t": "– Você tem de fazer. Você não tem escolha. Não postergue.", "h": 0}, {"i": 1144, "c": 16, "ct": "Capítulo XIV", "t": "Ele hesitou por um momento. – Há uma lareira no sótão?", "h": 0}, {"i": 1145, "c": 16, "ct": "Capítulo XIV", "t": "– Sim, a gás, revestida de asbesto.", "h": 0}, {"i": 1146, "c": 16, "ct": "Capítulo XIV", "t": "– Precisarei ir para casa e trazer algumas coisas do laboratório.", "h": 0}, {"i": 1147, "c": 16, "ct": "Capítulo XIV", "t": "– Não, Alan, você não sairá daqui. Escreva no papel o que você precisa, meu criado pegará um cabriolé e buscará tudo e trará para cá.", "h": 0}, {"i": 1148, "c": 16, "ct": "Capítulo XIV", "t": "Campbell escrevinhou algumas linhas, secou e endereçou o envelope ao assistente. Dorian pegou o bilhete e leu com atenção. Então tocou a sineta, e entregou-o ao pajem, com ordens de voltar o mais depressa possível, e trazer tudo aquilo consigo.", "h": 0}, {"i": 1149, "c": 16, "ct": "Capítulo XIV", "t": "Quando a porta se fechou, Campbell teve um sobressalto nervoso e, levantando-se da cadeira, aproximou-se do fogo. Tremia como se estivesse com malária. Durante quase vinte minutos, nenhum dos dois disse nada. Um mosquito zumbia ruidosamente na sala, e o tiquetaquear do relógio soava como as batidas de um martelo.", "h": 0}, {"i": 1150, "c": 16, "ct": "Capítulo XIV", "t": "Quando soou uma hora, Campbell se virou e, olhando para Dorian Gray, notou que os olhos dele estavam marejados de lágrimas. Havia algo na pureza e no refinamento daquele rosto triste que aparentemente o deixou furioso. – Você é infame, absolutamente infame! – ele murmurou.", "h": 0}, {"i": 1151, "c": 16, "ct": "Capítulo XIV", "t": "– Acalme-se, Alan: você salvou a minha vida – disse Dorian.", "h": 0}, {"i": 1152, "c": 16, "ct": "Capítulo XIV", "t": "– A sua vida? Céus! Que tipo de vida é essa? Você foi de degradação em degradação e agora culminou no crime. Ao fazer o que estou prestes a fazer, o que você me forçou a fazer, não é na sua vida que estou pensando.", "h": 0}, {"i": 1153, "c": 16, "ct": "Capítulo XIV", "t": "– Ah, Alan – murmurou Dorian, com um suspiro –, quem dera você sentisse um milésimo da pena que eu sinto de você – ele deu as costas ao falar e ficou olhando para o jardim. Campbell não disse nada.", "h": 0}, {"i": 1154, "c": 16, "ct": "Capítulo XIV", "t": "Cerca de dez minutos depois, bateram na porta, e o criado entrou, trazendo um grande baú de mogno de produtos químicos, com uma longa mola de aço e fio de platina e duas presilhas de ferro de formato curioso.", "h": 0}, {"i": 1155, "c": 16, "ct": "Capítulo XIV", "t": "– Devo deixar as coisas aqui, senhor? – ele perguntou a Campbell.", "h": 0}, {"i": 1156, "c": 16, "ct": "Capítulo XIV", "t": "– Sim – disse Dorian. – E receio, Francis, que tenho outra tarefa para você. Como se chama o sujeito em Richmond que entrega orquídeas em Selby?", "h": 0}, {"i": 1157, "c": 16, "ct": "Capítulo XIV", "t": "– Harden, senhor.", "h": 0}, {"i": 1158, "c": 16, "ct": "Capítulo XIV", "t": "– Isso, Harden. Vá até Richmond já, fale pessoalmente com Harden, e peça que ele envie o dobro de orquídeas que costumo encomendar, e que tenha o mínimo possível de brancas. Na verdade, não quero nenhuma branca. Está um dia adorável, Francis, e Richmond é um lugar muito simpático, de outro modo eu não pediria.", "h": 0}, {"i": 1159, "c": 16, "ct": "Capítulo XIV", "t": "– Sem problema, senhor. E a que horas devo estar de volta?", "h": 0}, {"i": 1160, "c": 16, "ct": "Capítulo XIV", "t": "Dorian olhou para Campbell. – Quanto tempo leva o seu experimento, Alan? – ele disse, com voz calma, indiferente. A presença de uma terceira pessoa na sala lhe conferiu uma coragem extraordinária.", "h": 0}, {"i": 1161, "c": 16, "ct": "Capítulo XIV", "t": "Campbell franziu o cenho e mordeu o lábio. – Acho que vou levar umas cinco horas – ele respondeu.", "h": 0}, {"i": 1162, "c": 16, "ct": "Capítulo XIV", "t": "– Dará tempo suficiente, então, se você voltar às sete e meia, Francis. Ou, espere: antes, prepare as minhas roupas. Pode tirar a noite de folga. Não jantarei em casa, de modo que não precisarei de você.", "h": 0}, {"i": 1163, "c": 16, "ct": "Capítulo XIV", "t": "– Obrigado, senhor – disse o sujeito, saindo da sala.", "h": 0}, {"i": 1164, "c": 16, "ct": "Capítulo XIV", "t": "– Agora, Alan, não há tempo a perder. Como esse baú é pesado! Vou levar para você. Você traz as outras coisas – ele falou rapidamente, e de modo autoritário. Campbell sentiu-se dominado por ele. Saíram juntos da sala.", "h": 0}, {"i": 1165, "c": 16, "ct": "Capítulo XIV", "t": "Quando chegaram no alto da escada, Dorian inseriu a chave e girou-a na fechadura. Então parou, e uma expressão perturbada se formou em seus olhos. Ele estremeceu. – Acho que não vou conseguir entrar, Alan – ele murmurou.", "h": 0}, {"i": 1166, "c": 16, "ct": "Capítulo XIV", "t": "– Não faz diferença. Não preciso de você – disse Campbell, friamente.", "h": 0}, {"i": 1167, "c": 16, "ct": "Capítulo XIV", "t": "Dorian entreabriu a porta. Ao fazê-lo, viu o rosto malicioso do retrato fitá-lo à luz do sol. No chão, diante do quadro, jazia a cortina arrancada. Ele se lembrou de que na noite anterior havia se esquecido, pela primeira vez na vida, de cobrir a tela fatal, e estava prestes a entrar correndo quando recuou com um calafrio.", "h": 0}, {"i": 1168, "c": 16, "ct": "Capítulo XIV", "t": "O que era aquilo que porejava odiosamente em vermelho, úmido e reluzente, de uma das mãos, como se a tela tivesse transpirado sangue? Como era horrível! Mais horrível naquele momento, para ele, do que o corpo silencioso que ele sabia estar estendido sobre a mesa, aquele corpo cuja sombra infeliz e grotesca sobre o tapete manchado lhe mostrava que não havia se movido, mas ainda estava ali tal como ele o deixara.", "h": 0}, {"i": 1169, "c": 16, "ct": "Capítulo XIV", "t": "Respirou fundo, abriu um pouco mais a porta e, com olhos entreabertos e cabeça baixa, entrou rapidamente, decidido a não olhar nenhuma vez para o morto. Então, parando de repente, e erguendo o pano dourado e roxo do chão, atirou-o por sobre o quadro.", "h": 0}, {"i": 1170, "c": 16, "ct": "Capítulo XIV", "t": "Ali mesmo ficou, temeroso demais para se virar, e seus olhos se fixaram nos intrincados padrões do tecido à sua frente. Ouviu Campbell entrar trazendo o baú pesado, e os ferros, e as coisas que pedira para sua odiosa tarefa. Começou a se perguntar se ele e Basil Hallward haviam chegado a se conhecer e, nesse caso, o que achavam um do outro.", "h": 0}, {"i": 1171, "c": 16, "ct": "Capítulo XIV", "t": "– Deixe-me agora – disse uma voz austera atrás dele.", "h": 0}, {"i": 1172, "c": 16, "ct": "Capítulo XIV", "t": "Ele se virou e saiu às pressas, a tempo apenas de perceber que o morto era recostado na cadeira e que Campbell contemplava um rosto amarelo lustroso. Enquanto descia a escada, ouviu a chave girar na fechadura.", "h": 0}, {"i": 1173, "c": 16, "ct": "Capítulo XIV", "t": "Havia se passado muito das sete quando Campbell voltou à biblioteca. Ele estava pálido, mas absolutamente calmo.", "h": 0}, {"i": 1174, "c": 16, "ct": "Capítulo XIV", "t": "– Fiz o que você me pediu – ele murmurou. – E agora adeus. Que não nos vejamos nunca mais.", "h": 0}, {"i": 1175, "c": 16, "ct": "Capítulo XIV", "t": "– Você me salvou da ruína, Alan. Não me esquecerei disso – disse Dorian, simplesmente.", "h": 0}, {"i": 1176, "c": 16, "ct": "Capítulo XIV", "t": "Assim que Campbell foi embora, ele subiu novamente. Havia um cheiro horrível de ácido nítrico no ar. Mas a criatura sentada junto à mesa havia desaparecido.", "h": 0}, {"i": 1177, "c": 17, "ct": "Capítulo XV", "t": "Capítulo XV", "h": 1}, {"i": 1178, "c": 17, "ct": "Capítulo XV", "t": "Naquela noite, às oito e meia, elegantemente vestido e com um grande arranjo de violetas de Parma na lapela, Dorian Gray foi levado à sala de estar de lady Narborough por criados que se despediram com mesuras. Sua cabeça latejava com os nervos enlouquecidos, e ele se sentia loucamente excitado, mas seu modo de se inclinar diante da mão da anfitriã foi natural e gracioso como sempre. Talvez nunca estejamos tão à vontade quanto quando precisamos interpretar um papel. Certamente ninguém que visse Dorian Gray naquela noite poderia acreditar que ele havia passado por uma tragédia tão horrível quanto qualquer outra tragédia dos nossos tempos. Aqueles dedos afilados jamais poderiam ter pego uma faca para cometer algum pecado, nem aqueles lábios sorridentes teriam sido capazes de esbravejar contra Deus e a bondade. Ele mesmo não conseguia evitar de se espantar com a calma de sua conduta, e por um momento sentiu agudamente o terrível prazer de uma vida dupla.", "h": 0}, {"i": 1179, "c": 17, "ct": "Capítulo XV", "t": "Era um grupo pequeno, convidados às pressas por lady Narborough, que era uma mulher muito sagaz, dona de algo que lorde Henry costumava descrever como os resquícios de uma feiura realmente notável. Ela se provara excelente esposa de um dos nossos embaixadores mais entediantes e, depois de enterrar propriamente o marido em um mausoléu de mármore, que ela mesma desenhou, e de casar as filhas com homens ricos e um tanto idosos, ela dedicava sua vida agora aos prazeres da literatura francesa, da culinária francesa e do esprit francês sempre que podia.", "h": 0}, {"i": 1180, "c": 17, "ct": "Capítulo XV", "t": "Dorian era um de seus favoritos especiais, e ela sempre dizia que era muito feliz por não tê-lo conhecido quando era mais moça. – Eu sei, meu querido, que eu teria me apaixonado perdidamente por você – ela costumava dizer –, e teria jogado meu elmo contra os moinhos por você. Foi muita sorte eu não o conhecer na época. Na verdade, nossos elmos eram tão ridículos e os moinhos estavam tão ocupados tentando fazer vento, que eu nunca cheguei sequer a flertar com ninguém. No entanto, foi tudo culpa do Narborough. Ele era terrivelmente míope, e não há nenhum prazer em um marido que nunca enxerga nada.", "h": 0}, {"i": 1181, "c": 17, "ct": "Capítulo XV", "t": "Seus convidados naquela noite eram um bocado entediantes. O fato era, conforme ela explicou a Dorian, por trás de um velho leque, que uma de suas filhas casadas aparecera subitamente para ficar com ela e, para piorar as coisas, trouxera até o marido consigo. – Achei a coisa mais deselegante da parte dela, meu querido – ela sussurrou. – Claro que eu sempre vou e fico com eles, todo verão quando volto de Homburg, mas uma mulher de idade como eu precisa de ar fresco às vezes, e, além disso, eu realmente faço com que eles se animem. Você não imagina a vida que eles levam por lá. É uma vida estritamente provinciana. Acordam cedo, porque têm muito o que fazer, e dormem cedo, porque não têm muito o que pensar. Não há um escândalo na vizinhança desde o tempo da rainha Elizabeth, e consequentemente todos vão dormir depois do jantar. Você não pode se sentar ao lado deles. Você vai se sentar do meu lado e me divertir.", "h": 0}, {"i": 1182, "c": 17, "ct": "Capítulo XV", "t": "Dorian murmurou um elogio gracioso e olhou para as pessoas na sala. Sim: era certamente um grupo tedioso. Duas das pessoas ele nunca tinha visto antes, e os outros eram Ernest Harrowden, um daqueles medíocres de meia-idade tão comuns nos clubes londrinos, que não têm nenhum inimigo, mas são completamente desdenhados pelos amigos; Lady Ruxton, uma mulher exageradamente trajada de quarenta e sete anos, com um nariz adunco, que estava sempre tentando se comprometer, mas que era tão peculiarmente comum que ninguém jamais acreditaria em nada de comprometedor a seu respeito; a senhora Erlynne, uma mulher impositiva e desimportante, com um delicioso cicio e cabelo vermelho-veneziano; lady Alice Chapman, filha da anfitriã, uma menina sem graça e sem elegância, com um daqueles típicos rostos ingleses, que, uma vez vistos, jamais são lembrados; e o marido, uma criatura rubicunda de bigodes brancos que, como muitos de sua classe, vivia com a impressão de que uma jovialidade descabida era capaz de compensar uma total falta de ideias.", "h": 0}, {"i": 1183, "c": 17, "ct": "Capítulo XV", "t": "Ele estava se lamentando por ter vindo, quando lady Narborough, olhando para o grandioso relógio de ouropel dourado que se espalhava em curvas extravagantes sobre o aparador drapeado em malva, exclamou: – Que horror da parte do Henry Wotton se atrasar tanto! Eu enviei o convite hoje cedo, e ele prometeu fielmente não me desapontar.", "h": 0}, {"i": 1184, "c": 17, "ct": "Capítulo XV", "t": "Era um certo consolo que Harry fosse chegar a qualquer momento e, quando a porta se abriu e ele ouviu sua voz lenta e musical conferindo encanto a alguma desculpa insincera, ele deixou de se sentir entediado.", "h": 0}, {"i": 1185, "c": 17, "ct": "Capítulo XV", "t": "Mas durante o jantar ele não conseguiu comer nada. Pratos e mais pratos foram retirados intactos. Lady Narborough continuava ralhando com ele pelo que ela considerava “um insulto ao pobre Adolphe, que inventou o cardápio especialmente para você”, e de quando em quando lorde Henry olhava para ele, intrigado com seu silêncio e seu aspecto distraído. De quando em quando, o mordomo enchia sua taça de champanhe. Ele bebia avidamente, e sua sede parecia só aumentar.", "h": 0}, {"i": 1186, "c": 17, "ct": "Capítulo XV", "t": "– Dorian – disse lorde Henry, enfim, enquanto passavam o chaud-froid –, o que há de errado com você esta noite? Você não parece nada bem.", "h": 0}, {"i": 1187, "c": 17, "ct": "Capítulo XV", "t": "– Acho que ele está apaixonado – exclamou lady Narborough –, e está com medo de me contar por receio de que eu fique com ciúmes. Ele tem razão. Certamente eu ficaria.", "h": 0}, {"i": 1188, "c": 17, "ct": "Capítulo XV", "t": "– Minha querida lady Narborough – murmurou Dorian, sorrindo –, eu não me apaixono por ninguém há uma semana, na verdade, desde que Madame de Ferrol saiu da cidade.", "h": 0}, {"i": 1189, "c": 17, "ct": "Capítulo XV", "t": "– Como vocês homens conseguem se apaixonar por aquela mulher! – exclamou a velha dama. – Eu realmente não consigo entender.", "h": 0}, {"i": 1190, "c": 17, "ct": "Capítulo XV", "t": "– É simplesmente porque ela lembra você quando menina, lady Narborough – disse lorde Henry. – Ela é o único elo entre nós e o seu vestido de menina.", "h": 0}, {"i": 1191, "c": 17, "ct": "Capítulo XV", "t": "– Ela não lembra em nada o meu vestido de menina, lorde Henry. Mas eu me lembro perfeitamente dela em Viena trinta anos atrás e de como ela era décolletée na época.", "h": 0}, {"i": 1192, "c": 17, "ct": "Capítulo XV", "t": "– Ela ainda é décolletée – ele respondeu, pegando uma azeitona com seus dedos afilados –; e quando ela usa um vestido elegante, fica parecendo uma édition de luxe de um romance francês ruim. Ela é realmente maravilhosa e cheia de surpresas. Sua capacidade de afeição familiar é extraordinária. Quando o terceiro marido morreu, seus cabelos ficaram dourados de tristeza.", "h": 0}, {"i": 1193, "c": 17, "ct": "Capítulo XV", "t": "– Como você pode dizer isso, Harry! – exclamou Dorian.", "h": 0}, {"i": 1194, "c": 17, "ct": "Capítulo XV", "t": "– Que explicação mais romântica – gargalhou a anfitriã. – Mas como assim terceiro marido, lorde Henry!? Você quer dizer que Ferrol é o quarto?", "h": 0}, {"i": 1195, "c": 17, "ct": "Capítulo XV", "t": "– Certamente, lady Narborough.", "h": 0}, {"i": 1196, "c": 17, "ct": "Capítulo XV", "t": "– Não acredito em uma palavra dessa história.", "h": 0}, {"i": 1197, "c": 17, "ct": "Capítulo XV", "t": "– Bem, pergunte ao senhor Gray. Ele é um dos amigos mais íntimos dela.", "h": 0}, {"i": 1198, "c": 17, "ct": "Capítulo XV", "t": "– Isso é verdade, senhor Gray?", "h": 0}, {"i": 1199, "c": 17, "ct": "Capítulo XV", "t": "– Ela me garantiu que sim, lady Narborough – disse Dorian.", "h": 0}, {"i": 1200, "c": 17, "ct": "Capítulo XV", "t": "– Perguntei se ela, como Marguerite de Navarre, havia embalsamado os corações deles e pendurado na cinta. Ela me disse que não, porque nenhum deles tinha coração.", "h": 0}, {"i": 1201, "c": 17, "ct": "Capítulo XV", "t": "– Quatro maridos! Juro que isso é trop de zèle .", "h": 0}, {"i": 1202, "c": 17, "ct": "Capítulo XV", "t": "– Trop d’audace , comentei com ela – disse Dorian.", "h": 0}, {"i": 1203, "c": 17, "ct": "Capítulo XV", "t": "– Oh! Ela é audaciosa o suficiente para fazer qualquer coisa, meu querido. E como é o senhor Ferrol? Não o conheci.", "h": 0}, {"i": 1204, "c": 17, "ct": "Capítulo XV", "t": "– Os maridos das mulheres muito bonitas pertencem à classe dos criminosos – disse lorde Henry, bebendo seu vinho.", "h": 0}, {"i": 1205, "c": 17, "ct": "Capítulo XV", "t": "Lady Narborough bateu nele com o leque: – Lorde Henry, não me surpreende que todo mundo diga que você é extremamente malvado.", "h": 0}, {"i": 1206, "c": 17, "ct": "Capítulo XV", "t": "– Mas quem é todo mundo? – perguntou lorde Henry, erguendo a sobrancelha. – Só se for o mundo do além-túmulo. O mundo e eu sempre nos demos muito bem.", "h": 0}, {"i": 1207, "c": 17, "ct": "Capítulo XV", "t": "– Todo mundo que eu conheço diz que você é muito malvado – exclamou a velha dama, balançando a cabeça.", "h": 0}, {"i": 1208, "c": 17, "ct": "Capítulo XV", "t": "Lorde Henry ficou sério por alguns momentos. – É incrivelmente monstruoso – ele disse, enfim –, como as pessoas hoje em dia dizem coisas contra os outros pelas costas que são absoluta e inteiramente verdadeiras.", "h": 0}, {"i": 1209, "c": 17, "ct": "Capítulo XV", "t": "– Ele não é mesmo incorrigível? – exclamou Dorian, inclinando-se para a frente na cadeira.", "h": 0}, {"i": 1210, "c": 17, "ct": "Capítulo XV", "t": "– Espero que sim – disse a anfitriã, gargalhando. – Mas, francamente, se vocês ficarem idolatrando a Madame de Ferrol dessa maneira ridícula, vou precisar casar de novo para continuar na moda.", "h": 0}, {"i": 1211, "c": 17, "ct": "Capítulo XV", "t": "– Você jamais se casará de novo, lady Narborough – interrompeu lorde Henry. – Você foi feliz demais. Quando uma mulher se casa de novo, é porque detestava o primeiro marido. Quando um homem se casa de novo, é porque adorava a primeira esposa. As mulheres tentam a sorte; os homens se arriscam.", "h": 0}, {"i": 1212, "c": 17, "ct": "Capítulo XV", "t": "– Narborough não era perfeito – exclamou a velha dama.", "h": 0}, {"i": 1213, "c": 17, "ct": "Capítulo XV", "t": "– Se ele fosse, você não o teria amado, minha cara lady – foi a resposta. – As mulheres nos amam por nossos defeitos. Se temos defeitos o bastante, elas nos perdoarão tudo, até nosso intelecto. Receio que você nunca mais me convidará para jantar, depois de dizer isso, lady Narborough; mas é a pura verdade.", "h": 0}, {"i": 1214, "c": 17, "ct": "Capítulo XV", "t": "– É claro que é verdade, lorde Henry. Se nós não amássemos os homens pelos seus defeitos, o que seria de todos vocês? Nenhum homem jamais se casaria. Vocês seriam um grupo de solteirões infelizes. Não que, contudo, isso fosse mudar muita coisa. Hoje em dia todos os homens casados vivem como solteiros, e todos os solteiros vivem como homens casados.", "h": 0}, {"i": 1215, "c": 17, "ct": "Capítulo XV", "t": "– Fin de siècle – murmurou lorde Henry.", "h": 0}, {"i": 1216, "c": 17, "ct": "Capítulo XV", "t": "– Fin du globe – respondeu a anfitriã.", "h": 0}, {"i": 1217, "c": 17, "ct": "Capítulo XV", "t": "– Quem me dera fosse o fin du globe – disse Dorian, com um suspiro. – A vida é uma grande decepção.", "h": 0}, {"i": 1218, "c": 17, "ct": "Capítulo XV", "t": "– Ah, meu querido – exclamou lady Narborough, vestindo as luvas –, não me diga que você já se cansou da vida. Quando um homem diz isso, já sabemos que a vida é que já se cansou dele. Lorde Henry é muito malvado, e eu às vezes desejo também ter sido; mas você nasceu para ser bom – você é tão bonito. Tenho que lhe arranjar uma boa esposa. Lorde Henry, você não acha que o senhor Gray deveria se casar?", "h": 0}, {"i": 1219, "c": 17, "ct": "Capítulo XV", "t": "– Estou sempre dizendo isso a ele, lady Narborough – disse lorde Henry, com uma mesura.", "h": 0}, {"i": 1220, "c": 17, "ct": "Capítulo XV", "t": "– Bem, precisamos procurar um par adequado para ele. Hoje à noite repassarei o guia Debrett com atenção e farei uma lista das melhores candidatas entre as jovens damas.", "h": 0}, {"i": 1221, "c": 17, "ct": "Capítulo XV", "t": "– Com as respectivas idades, lady Narborough? – perguntou Dorian.", "h": 0}, {"i": 1222, "c": 17, "ct": "Capítulo XV", "t": "– É claro, com as idades, ligeiramente editadas. Mas sem nenhuma pressa. Quero que seja aquilo que o Morning Post chama de uma aliança apropriada, e quero que os dois sejam felizes.", "h": 0}, {"i": 1223, "c": 17, "ct": "Capítulo XV", "t": "– Como as pessoas falam bobagens sobre casamentos felizes! – exclamou lorde Henry. – Um homem pode ser feliz com qualquer mulher, desde que ele não a ame.", "h": 0}, {"i": 1224, "c": 17, "ct": "Capítulo XV", "t": "– Ah! Como você é cínico! – exclamou a velha dama, afastando a cadeira e balançando a cabeça para lady Ruxton.", "h": 0}, {"i": 1225, "c": 17, "ct": "Capítulo XV", "t": "– Você tem que vir jantar comigo de novo em breve. Você é realmente um tônico admirável, muito melhor do que o que sir Andrew me receitou. Mas você precisa me dizer quem mais devo convidar. Quero que seja uma noite deliciosa.", "h": 0}, {"i": 1226, "c": 17, "ct": "Capítulo XV", "t": "– Eu gosto de homens de futuro e mulheres com passado – ele respondeu. – Ou você acha que seria melhor uma festa das anáguas?", "h": 0}, {"i": 1227, "c": 17, "ct": "Capítulo XV", "t": "– Receio que sim – ela disse, dando risada, ao se levantar. – Mil perdões, minha querida lady Ruxton – ela acrescentou. – Eu não tinha reparado que você ainda não havia terminado o seu cigarro.", "h": 0}, {"i": 1228, "c": 17, "ct": "Capítulo XV", "t": "– Não se preocupe, lady Narborough. Eu fumo um pouco demais. No futuro, tentarei me controlar.", "h": 0}, {"i": 1229, "c": 17, "ct": "Capítulo XV", "t": "– Tomara que não, lady Ruxton – disse lorde Henry. – A moderação é algo fatal. O suficiente é ruim como uma refeição comum. O mais do que suficiente é bom como um banquete.", "h": 0}, {"i": 1230, "c": 17, "ct": "Capítulo XV", "t": "Lady Ruxton olhou para ele com expressão curiosa. – Você precisa voltar e me explicar isso outro dia, lorde Henry. Mas me parece uma teoria fascinante – ela murmurou, enquanto saía da sala.", "h": 0}, {"i": 1231, "c": 17, "ct": "Capítulo XV", "t": "– Agora, vou pedir para vocês não ficarem muito tempo falando de política e escândalos – exclamou lady Narborough da porta. – Se vocês continuarem, estou certa de que acabaremos brigando lá em cima.", "h": 0}, {"i": 1232, "c": 17, "ct": "Capítulo XV", "t": "Os homens deram risada, e o senhor Chapman se levantou solenemente da ponta da mesa e foi até a cabeceira. Dorian Gray mudou de lugar e sentou-se ao lado de lorde Henry. O senhor Chapman começou a falar em voz alta sobre a situação na Câmara dos Comuns. Ele zombou de seus adversários. A palavra doctrinaire – eivada de horror para o espírito inglês – reapareceu de quando em quando entre suas explosões. Prefixos aliterativos serviam-lhe de ornamento de oratória. Ele alçou a bandeira britânica nos pináculos do pensamento. A estupidez atávica da raça – sólido lugar-comum inglês em sua terminologia jovial – foi exposta como o próprio baluarte da sociedade.", "h": 0}, {"i": 1233, "c": 17, "ct": "Capítulo XV", "t": "Um sorriso curvou os lábios de lorde Henry, e ele se virou e olhou para Dorian.", "h": 0}, {"i": 1234, "c": 17, "ct": "Capítulo XV", "t": "– Você está melhor, meu querido companheiro? – ele perguntou. – Você parecia um tanto ausente durante o jantar.", "h": 0}, {"i": 1235, "c": 17, "ct": "Capítulo XV", "t": "– Estou muito bem, Harry. Só estou cansado. É só isso.", "h": 0}, {"i": 1236, "c": 17, "ct": "Capítulo XV", "t": "– Você estava encantador ontem à noite. A pequena duquesa é bastante dedicada a você. Ela me contou que está indo a Selby.", "h": 0}, {"i": 1237, "c": 17, "ct": "Capítulo XV", "t": "– Ela prometeu chegar dia vinte.", "h": 0}, {"i": 1238, "c": 17, "ct": "Capítulo XV", "t": "– E Monmouth também vai?", "h": 0}, {"i": 1239, "c": 17, "ct": "Capítulo XV", "t": "– Oh, sim, Harry.", "h": 0}, {"i": 1240, "c": 17, "ct": "Capítulo XV", "t": "– Ele me entedia terrivelmente, quase tanto quanto a ela. Ela é muito inteligente, inteligente demais para uma mulher. Falta-lhe o indefinível encanto da fraqueza. São os pés de barro que tornam a imagem de ouro preciosa. Ela tem pés muito lindos, mas não são de barro. São pés brancos de porcelana, se você me permite. São pés que atravessaram o fogo, e o que o fogo não destrói, ele endurece. Ela teve lá suas experiências.", "h": 0}, {"i": 1241, "c": 17, "ct": "Capítulo XV", "t": "– Há quanto tempo ela está casada? – perguntou Dorian.", "h": 0}, {"i": 1242, "c": 17, "ct": "Capítulo XV", "t": "– Há uma eternidade, segundo ela me disse. Acho que, pelo pariato, são dez anos, mas dez anos com o Monmouth deve parecer uma eternidade, e mais algum tempo. Quem mais vai?", "h": 0}, {"i": 1243, "c": 17, "ct": "Capítulo XV", "t": "– Oh, os Willoughbys, lorde Rugby e a esposa, nossa anfitriã, Geoffrey Clouston, o grupo de sempre. Eu convidei lorde Grotrian.", "h": 0}, {"i": 1244, "c": 17, "ct": "Capítulo XV", "t": "– Gosto dele – disse lorde Henry. – Muita gente não gosta, mas eu o acho encantador. Ele compensa o fato de às vezes se vestir com apuro excessivo com o fato de ser sempre excessivamente educado. É um tipo bem moderno.", "h": 0}, {"i": 1245, "c": 17, "ct": "Capítulo XV", "t": "– Não sei se ele poderá vir, Harry. Talvez ele precise ir a Monte Carlo com o pai.", "h": 0}, {"i": 1246, "c": 17, "ct": "Capítulo XV", "t": "– Ah! Como os parentes das pessoas são irritantes! Tente fazer com que ele vá. Por falar nisso, Dorian, você foi embora muito cedo ontem à noite. Você saiu antes das onze. O que você fez depois? Foi direto para casa?", "h": 0}, {"i": 1247, "c": 17, "ct": "Capítulo XV", "t": "Dorian olhou rapidamente para ele e franziu o cenho. – Não, Harry – ele disse por fim –, só cheguei em casa quando eram quase três.", "h": 0}, {"i": 1248, "c": 17, "ct": "Capítulo XV", "t": "– Você foi ao clube?", "h": 0}, {"i": 1249, "c": 17, "ct": "Capítulo XV", "t": "– Sim – ele respondeu. Então se arrependeu. – Não, não foi o que eu quis dizer. Não fui ao clube. Fiquei passeando. Esqueci o que eu fiz… Como você é curioso, Harry! Sempre quer saber o que os outros fizeram. Eu sempre quero esquecer o que fiz. Cheguei em casa às duas e meia, se você quiser saber a hora exata. Tinha esquecido a chave em casa, e o meu criado precisou abrir para mim. Se você quiser alguma prova que corrobore o que eu disse, pergunte a ele.", "h": 0}, {"i": 1250, "c": 17, "ct": "Capítulo XV", "t": "Lorde Henry deu de ombros. – Meu querido colega, como se eu me importasse! Vamos subir para a sala de estar. Não quero xerez, obrigado, senhor Chapman. Alguma coisa aconteceu com você, Dorian. Diga-me o que foi. Você está diferente.", "h": 0}, {"i": 1251, "c": 17, "ct": "Capítulo XV", "t": "– Não se preocupe comigo, Harry. Estou irritado e sem paciência. Vou passar para vê-lo amanhã ou depois. Peça desculpas por mim a lady Narborough. Não vou subir. Vou para casa. Preciso ir para casa.", "h": 0}, {"i": 1252, "c": 17, "ct": "Capítulo XV", "t": "– Está bem, Dorian. Estou contando que vou encontrá-lo amanhã para o chá da tarde. A duquesa também vai.", "h": 0}, {"i": 1253, "c": 17, "ct": "Capítulo XV", "t": "– Tentarei comparecer, Harry – ele disse, deixando a sala. Enquanto voltava para casa, ele se deu conta de que a sensação de terror que o estivera sufocando havia voltado. As perguntas casuais de lorde Henry haviam-no deixado nervoso por um momento, e ele queria acalmar seus nervos. Objetos perigosos precisavam ser destruídos. Ele piscou. Odiava a ideia de sequer tocá-los.", "h": 0}, {"i": 1254, "c": 17, "ct": "Capítulo XV", "t": "No entanto, aquilo precisava ser feito. Deu-se conta disso e, depois de trancar a porta da biblioteca, abriu o compartimento secreto onde deixara o casaco e a valise de Basil Hallward. O fogo na lareira estava alto. Ele pôs mais lenha. O cheiro de pano chamuscado e couro queimado era horrível. Levou quarenta e cinco minutos para queimar tudo. Ao final, sentia-se tonto e nauseado e, depois de acender algumas pastilhas de inceso argelino em um braseiro vazado de cobre, banhou as mãos e a testa com um vinagre fresco e almiscarado.", "h": 0}, {"i": 1255, "c": 17, "ct": "Capítulo XV", "t": "De repente, sobressaltou-se. Seus olhos ficaram estranhamente brilhantes, e ele mordiscou nervosamente o lábio inferior. Entre duas janelas havia um grande gabinete florentino, de ébano, cravejado de marfim e lapis-lazúli. Ele ficou olhando para o móvel como algo que o fascinava e amedrontava, como se contivesse algo pelo qual ansiava e no entanto quase odiava ao mesmo tempo. Sua respiração ficou acelerada. Um desejo louco tomou conta de si. Acendeu um cigarro e em seguida jogou fora. As pálpebras caíram até que os longos cílios quase tocaram suas maçãs do rosto. Mas ele continuou contemplando o gabinete. Por fim, ele se levantou do sofá onde estava deitado, foi até lá, e, abrindo-o, pressionou uma mola oculta. Uma gaveta triangular deslizou lentamente para fora. Seus dedos se moveram instintivamente, penetraram a gaveta e se fecharam sobre um objeto. Era uma caixinha chinesa de laca preta e pó de ouro, intrincadamente entalhada, cujas laterais tinham um padrão de ondas recurvas, e as cordas de seda tinham cristais redondos nas pontas e borlas de fios de metal trançados. Ele abriu. Dentro da caixa havia uma pasta verde, de brilho ceroso e odor curiosamente forte e persistente.", "h": 0}, {"i": 1256, "c": 17, "ct": "Capítulo XV", "t": "Ele hesitou por alguns momentos, com um sorriso estranhamente imóvel no rosto. Então, tremendo, embora a atmosfera do ambiente estivesse terrivelmente quente, ele se levantou com esforço e olhou de relance para o relógio. Faltavam vinte minutos para a meia-noite. Ele guardou a caixa, fechando as portas do gabinete ao fazê-lo, e foi para o quarto.", "h": 0}, {"i": 1257, "c": 17, "ct": "Capítulo XV", "t": "Quando a meia-noite deu suas badaladas de bronze no ar escuro, Dorian Gray, com roupas comuns e um lenço no pescoço, saiu silenciosamente de casa. Na Bond Street, encontrou um fiacre com um bom cavalo. Fez sinal para parar e, com voz grave, deu um endereço ao cocheiro.", "h": 0}, {"i": 1258, "c": 17, "ct": "Capítulo XV", "t": "O sujeito balançou a cabeça. – É longe demais para mim – ele murmurou.", "h": 0}, {"i": 1259, "c": 17, "ct": "Capítulo XV", "t": "– Aqui está um soberano de ouro para você – disse Dorian. – Você receberá outro se for depressa.", "h": 0}, {"i": 1260, "c": 17, "ct": "Capítulo XV", "t": "– Está bem, senhor – respondeu o homem –, o senhor estará lá em uma hora – e depois de guardar o dinheiro, deu meia-volta com o cavalo e seguiu rapidamente em direção ao rio.", "h": 0}, {"i": 1261, "c": 18, "ct": "Capítulo XVI", "t": "Capítulo XVI", "h": 1}, {"i": 1262, "c": 18, "ct": "Capítulo XVI", "t": "Começou a cair uma chuva fria, e os lampiões borrados da rua pareciam sinistros na neblina gotejante. Os bares estavam quase fechando, e homens e mulheres obscuros se aglomeravam em grupos dispersos junto das portas. De alguns bares, vinha o som de risadas horríveis. Em outros, bêbados esbravejavam e gritavam.", "h": 0}, {"i": 1263, "c": 18, "ct": "Capítulo XVI", "t": "Recostado no fiacre, com o chapéu sobre a testa, Dorian Gray observava com olhos indiferentes a sórdida vergonha da cidade grande e, de quando em quando, repetia para si mesmo as palavras que lorde Henry lhe dissera na primeira vez em que se viram, “Curar a alma através dos sentidos, e os sentidos por meio da alma”. Sim, esse era o segredo. Muitas vezes tentara, e tentaria de novo agora. Havia opiários, onde se podia comprar o esquecimento, antros de horror onde a lembrança de velhos pecados podia ser destruída pela loucura de pecados novos.", "h": 0}, {"i": 1264, "c": 18, "ct": "Capítulo XVI", "t": "A lua pairava baixa no céu como um crânio amarelado. De quando em quando uma imensa nuvem disforme esticava um braço comprido e a escondia. Foram escasseando os lampiões de gás, e as ruas ficaram mais estreitas e sombrias. A certa altura, o cocheiro se perdeu e precisou voltar meia milha. Subia fumaça do cavalo que seguia pisando nas poças. As janelas laterais do fiacre estavam embaçadas de um vapor cinza aflanelado.", "h": 0}, {"i": 1265, "c": 18, "ct": "Capítulo XVI", "t": "“Curar a alma através dos sentidos, e os sentidos por meio da alma!” Como essas palavras ecoavam em seus ouvidos! Sua alma, decerto, estava fatalmente doente. Seria verdade que os sentidos poderiam curá-la? Sangue inocente havia sido derramado. O que poderia reparar isso? Ah! Para isso não havia reparação; mas embora o perdão fosse impossível, ainda assim era possível o esquecimento, e ele estava decidido a esquecer, a apagar aquilo, a esmagar como alguém esmaga a víbora que o picou. A bem dizer, que direito tinha Basil de falar com ele daquela forma? Quem lhe deu o direito de julgar os outros? Ele dissera coisas pavorosas, horríveis, que não podiam ser suportadas.", "h": 0}, {"i": 1266, "c": 18, "ct": "Capítulo XVI", "t": "O fiacre seguia em frente com esforço, indo mais devagar, segundo lhe parecia, a cada passo. Ele abriu a portinhola e mandou o cocheiro ir mais depressa. A hedionda fome pelo ópio começou a corroê-lo. Sua garganta ardia e suas mãos delicadas tremiam nervosamente entrelaçadas. Bateu no cavalo loucamente com sua bengala. O cocheiro deu risada e estalou o chicote. Ele riu em resposta, e o sujeito ficou calado.", "h": 0}, {"i": 1267, "c": 18, "ct": "Capítulo XVI", "t": "O caminho parecia interminável, e as ruas, a teia negra de uma aranha que se espalhava. A monotonia ficou insuportável, e, quando o nevoeiro engrossou, ele sentiu medo.", "h": 0}, {"i": 1268, "c": 18, "ct": "Capítulo XVI", "t": "Então eles passaram por solitárias olarias. A neblina ali era menos densa, e ele viu os fornos em forma de garrafa com suas línguas alaranjadas de fogo para fora parecendo leques. Um cão latiu quando eles passaram, e lá muito ao longe no escuro uma gaivota perdida gritou. O cavalo tropeçou em um buraco, então desviou, e disparou a galopar.", "h": 0}, {"i": 1269, "c": 18, "ct": "Capítulo XVI", "t": "Algum tempo depois, eles saíram da estrada de terra e tornaram com estardalhaço às ruas mal-pavimentadas. A maioria das janelas estava às escuras, mas, de quando em quando, sombras fantásticas apareciam em silhueta nas cortinas iluminadas. Observou-as com curiosidade. Moviam-se como monstruosas marionetes e faziam gestos como criaturas vivas. Odiou-as. Havia uma raiva surda em seu coração. Ao dobrarem uma esquina, uma mulher gritou para eles de uma porta aberta, e dois homens correram atrás do fiacre por mais de cem metros. O cocheiro bateu neles com o chicote.", "h": 0}, {"i": 1270, "c": 18, "ct": "Capítulo XVI", "t": "Dizem que a paixão faz a pessoa pensar em círculo. Certamente com hedionda repetição, os lábios mordiscados de Dorian Gray formularam e reformularam aquelas palavras sutis que tratavam da alma e dos sentidos, até encontrar nelas a expressão plena, a bem dizer, de seu estado de espírito, e justificar, com aprovação intelectual, paixões que sem tais justificativas ainda assim teriam dominado seu temperamento. De célula em célula de seu cérebro, esse único pensamento migrou; e o desejo selvagem de viver, o mais terrível de todos os apetites humanos, converteu em força todos os seus nervos e fibras trêmulos. A feiura, que outrora lhe fora odiosa porque tornava as coisas reais, tornou-se cara para ele agora pelo mesmo motivo. A feiura era a única realidade. A rouca gritaria, a espelunca odiosa, a crua violência da vida desordenada, a própria vileza dos ladrões e marginais, eram mais vívidas, em sua intensa efetividade de impressão, do que todas as formas graciosas da arte, que as sombras sonhadoras da canção. Elas eram o que ele precisava para o esquecimento. Em três dias, ele estaria livre.", "h": 0}, {"i": 1271, "c": 18, "ct": "Capítulo XVI", "t": "Subitamente o cocheiro parou com um solavanco no alto de uma alameda escura. Acima dos telhados baixos e chaminés irregulares das casas, erguiam-se os mastros negros dos navios. Espirais de névoa branca penduravam-se como velas fantasmagóricas nos estaleiros.", "h": 0}, {"i": 1272, "c": 18, "ct": "Capítulo XVI", "t": "– É por aqui, senhor, não? – ele perguntou com voz rouca através da portinhola.", "h": 0}, {"i": 1273, "c": 18, "ct": "Capítulo XVI", "t": "Dorian voltou a si e espiou ao redor. – Aqui está bom – ele respondeu e, saindo abruptamente e dando ao cocheiro o restante do dinheiro que havia prometido, caminhou depressa na direção do cais. Uma lanterna brilhava na popa de um imenso cargueiro. A luz tremulava e se estilhaçava nas poças. Um clarão vermelho vinha de um transatlântico que deixava o porto sendo abastecido de carvão. O calçamento escorregadio parecia uma capa molhada de chuva.", "h": 0}, {"i": 1274, "c": 18, "ct": "Capítulo XVI", "t": "Ele correu para a esquerda, olhando para trás de quando em quando para ver se estava sendo seguido. Em sete ou oito minutos, chegou a uma casa pobre, espremida entre duas fábricas abandonadas. Em uma janela do andar de cima, havia um lampião. Ele parou e bateu de modo peculiar.", "h": 0}, {"i": 1275, "c": 18, "ct": "Capítulo XVI", "t": "Após algum tempo, ouviu passos no corredor e a corrente ser removida. A porta se abriu devagar, e ele entrou sem dizer nada à disforme figura atarracada que sumiu na sombra quando ele passou. No fundo da sala, havia uma cortina verde esfarrapada que se levantou e balançou com a rajada de vento frio que entrou com ele da rua. Ele afastou a cortina e entrou em uma sala comprida, de teto baixo, que parecia ter sido um dia um salão de dança de terceira categoria. Lampiões de gás barulhentos, distorcidos e atenuados por espelhos sujos de moscas, enfileiravam-se em todas as paredes. As cúpulas engorduradas de alumínio cortado formavam trêmulos discos de luz. O piso era coberto de uma serragem ocre, pisoteada aqui e ali até virar lama, e manchado de círculos escuros de bebida derramada. Alguns malaios estavam encolhidos junto a um fogareiro de carvão jogando uma espécie de dominó de marfim e mostrando os dentes brancos enquanto conversavam. A um canto, com a cabeça enfiada entre os braços, um marinheiro esparramado em uma mesa, e junto ao bar de pintura chamativa que ocupava um lado inteiro do recinto, duas mulheres desmazeladas zombavam de um velho que esfregava as mangas do paletó com expressão de desgosto. – Ele acha que está coberto de formigas vermelhas – caçoou uma delas quando Dorian passou. O sujeito olhou para ela aterrorizado e começou a choramingar.", "h": 0}, {"i": 1276, "c": 18, "ct": "Capítulo XVI", "t": "No fundo da sala, havia uma escada, que dava em um quarto escuro. Quando Dorian subiu às pressas os três frágeis degraus, o perfume intenso do ópio veio recebê-lo. Ele inspirou profundamente, e suas narinas estremeceram de prazer. Quando ele entrou, um rapaz de cabelos loiros e lisos, inclinado sobre um lampião, acendendo um cachimbo comprido, olhou para ele e meneou, hesitante, a cabeça.", "h": 0}, {"i": 1277, "c": 18, "ct": "Capítulo XVI", "t": "– Você, aqui, Adrian? – murmurou Dorian.", "h": 0}, {"i": 1278, "c": 18, "ct": "Capítulo XVI", "t": "– Onde mais eu estaria? – ele respondeu, apaticamente. Nenhum dos rapazes fala mais comigo.", "h": 0}, {"i": 1279, "c": 18, "ct": "Capítulo XVI", "t": "– Pensei que você tinha ido embora da Inglaterra.", "h": 0}, {"i": 1280, "c": 18, "ct": "Capítulo XVI", "t": "– Darlington não vai fazer nada. Meu irmão pagou a conta no final. George também não fala mais comigo… Não me importo – ele acrescentou, com um suspiro. – Enquanto tiver isso aqui, quem precisa de amigos? Acho que eu já tive amigos demais.", "h": 0}, {"i": 1281, "c": 18, "ct": "Capítulo XVI", "t": "Dorian franziu o cenho e olhou à sua volta para as criaturas grotescas que assumiam posturas tão fantásticas sobre aqueles velhos catres. Braços e pernas retorcidos, bocas escancaradas, olhos fixos e opacos, tudo aquilo o fascinava. Ele sabia em que céus estranhos eles estavam sofrendo e que infernos entorpecidos lhes estavam ensinando alguma nova alegria secreta. Eles estavam melhor do que ele. Ele estava aprisionado no pensamento. A memória, como uma doença horrível, estava devorando sua alma. De quando em quando, ele parecia estar vendo os olhos de Basil Hallward olhando para ele. No entanto, sentiu que não poderia ficar ali. A presença de Adrian Singleton perturbou-o. Queria ficar onde ninguém soubesse quem ele era. Queria fugir de si mesmo.", "h": 0}, {"i": 1282, "c": 18, "ct": "Capítulo XVI", "t": "– Vou ao outro lugar – ele disse, após uma pausa.", "h": 0}, {"i": 1283, "c": 18, "ct": "Capítulo XVI", "t": "– No cais?", "h": 0}, {"i": 1284, "c": 18, "ct": "Capítulo XVI", "t": "– Sim.", "h": 0}, {"i": 1285, "c": 18, "ct": "Capítulo XVI", "t": "– Aquela gata louca deve estar lá. Eles não deixam mais ela vir aqui agora.", "h": 0}, {"i": 1286, "c": 18, "ct": "Capítulo XVI", "t": "Dorian deu de ombros. – Não suporto mais essas mulheres que amam os outros. As mulheres que odeiam alguém são muito mais interessantes. Além disso, o ópio de lá é melhor.", "h": 0}, {"i": 1287, "c": 18, "ct": "Capítulo XVI", "t": "– É quase igual.", "h": 0}, {"i": 1288, "c": 18, "ct": "Capítulo XVI", "t": "– Eu prefiro o de lá. Venha, vamos beber alguma coisa. Preciso beber alguma coisa.", "h": 0}, {"i": 1289, "c": 18, "ct": "Capítulo XVI", "t": "– Eu não quero beber nada – murmurou o rapaz.", "h": 0}, {"i": 1290, "c": 18, "ct": "Capítulo XVI", "t": "– Não faz mal.", "h": 0}, {"i": 1291, "c": 18, "ct": "Capítulo XVI", "t": "Adrian Singleton se levantou com dificuldade e acompanhou Dorian até o bar. Um mestiço, com um turbante sujo e um sobretudo velho, saudou-os com um sorriso horrível, servindo a garrafa de conhaque e dois copos na frente deles. As mulheres se aproximaram e começaram a tagarelar. Dorian se virou de costas para elas e disse algo em voz baixa a Adrian Singleton.", "h": 0}, {"i": 1292, "c": 18, "ct": "Capítulo XVI", "t": "Um sorriso tortuoso, como uma adaga malaia, retorceu-se no semblante da outra mulher. – Alguém parece estar muito orgulhoso hoje à noite – ela zombou.", "h": 0}, {"i": 1293, "c": 18, "ct": "Capítulo XVI", "t": "– Pelo amor de Deus, não fale comigo – exclamou Dorian, batendo o pé no chão. – O que você quer? Dinheiro? Aqui está. Não fale nunca mais comigo.", "h": 0}, {"i": 1294, "c": 18, "ct": "Capítulo XVI", "t": "Duas fagulhas vermelhas se acenderam por um momento nos olhos inebriados da mulher, então sumiram e os deixaram opacos e vidrados. Ela jogou a cabeça para trás e raspou as moedas do balcão com dedos gananciosos. A companheira ficou olhando com inveja.", "h": 0}, {"i": 1295, "c": 18, "ct": "Capítulo XVI", "t": "– Não adianta – suspirou Adrian Singleton. – Não me importo de voltar. Que importância tem? Estou bem feliz aqui.", "h": 0}, {"i": 1296, "c": 18, "ct": "Capítulo XVI", "t": "– Você manda avisar se quiser alguma coisa, não? – disse Dorian, após uma pausa.", "h": 0}, {"i": 1297, "c": 18, "ct": "Capítulo XVI", "t": "– Talvez.", "h": 0}, {"i": 1298, "c": 18, "ct": "Capítulo XVI", "t": "– Então, boa noite.", "h": 0}, {"i": 1299, "c": 18, "ct": "Capítulo XVI", "t": "– Boa noite – respondeu o rapaz, subindo a escada e enxugando a boca seca com um lenço.", "h": 0}, {"i": 1300, "c": 18, "ct": "Capítulo XVI", "t": "Dorian foi até a porta com uma expressão de dor em seu semblante. Quando ele afastava a cortina, uma gargalhada medonha escapou dos lábios pintados da mulher que ficara com seu dinheiro.", "h": 0}, {"i": 1301, "c": 18, "ct": "Capítulo XVI", "t": "– Lá vai o moço do pacto com o diabo! – ela soluçou, com voz rouca.", "h": 0}, {"i": 1302, "c": 18, "ct": "Capítulo XVI", "t": "– Maldita! – ele respondeu. – Não me chame assim.", "h": 0}, {"i": 1303, "c": 18, "ct": "Capítulo XVI", "t": "Ela estalou os dedos. – Príncipe Encantado, é assim que você gosta de ser chamado, não é? – ela gritou para ele.", "h": 0}, {"i": 1304, "c": 18, "ct": "Capítulo XVI", "t": "O marinheiro sonolento se pôs de pé ao ouvir aquilo e olhou ensandecido ao seu redor. Ele ouviu o som da porta do salão bater. Saiu correndo, como se se tratasse de uma perseguição.", "h": 0}, {"i": 1305, "c": 18, "ct": "Capítulo XVI", "t": "Dorian Gray correu pelo cais em meio à garoa. Seu encontro com Adrian Singleton o deixara estranhamente comovido, e ele se perguntou se a ruína daquele rapaz não seria também culpa sua, como Basil Hallward lhe dissera com tamanha infâmia insultosa. Ele se conteve e, por alguns segundos, seus olhos ficaram tristonhos. No entanto, afinal, que importância aquilo tinha para ele? A vida era muito breve para assumir o fardo dos erros alheios sobre os próprios ombros. Cada um vivia a sua vida e pagava o seu próprio preço por vivê-la. A única pena era precisar pagar muitas vezes por um único erro. Era, de fato, preciso pagar muitas e muitas vezes. Em seus acordos com o homem, o destino nunca encerra as contas.", "h": 0}, {"i": 1306, "c": 18, "ct": "Capítulo XVI", "t": "Há momentos, segundo os psicólogos, em que a paixão pelo pecado, ou por aquilo que o mundo chama de pecado, domina de tal forma uma natureza, que todas as fibras do corpo, assim como toda célula do cérebro, parecem se tornar instinto, com impulsos temerários. Homens e mulheres nesses momentos perdem a liberdade do arbítrio. Eles se movem rumo ao próprio fim como autômatos. Perdem o poder de escolha, e a consciência é assassinada, ou, se sobrevive, vive apenas para conferir à rebeldia o seu fascínio, e à desobediência o seu encanto. Pois todos os pecados, como os teólogos não se cansam de nos lembrar, são pecados da desobediência. Quando aquele espírito elevado, aquela estrela da manhã do mal, caiu do céu, foi como um rebelde que ele caiu.", "h": 0}, {"i": 1307, "c": 18, "ct": "Capítulo XVI", "t": "Impiedoso, concentrado no mal, com o espírito ofuscado e a alma faminta por rebeldia, Dorian Gray correu, apertando o passo no caminho, mas, quando saltou de lado e entrou por uma passagem em arco, às escuras, que lhe servia sempre de atalho quando ia àquele mal-afamado lugar aonde estava indo, sentiu-se subitamente agarrado por trás, e, antes que tivesse tempo de se defender, foi empurrado de costas contra a parede, com uma mão brutal segurando seu pescoço.", "h": 0}, {"i": 1308, "c": 18, "ct": "Capítulo XVI", "t": "Ele lutou enlouquecidamente pela vida e, com terrível esforço, desvencilhou-se daqueles dedos que o apertavam. Nesse segundo, ouviu o clique de um revólver e viu o brilho de um cano polido apontando diretamente para sua cabeça, e o vulto difuso de um homem baixo e forte olhando para ele.", "h": 0}, {"i": 1309, "c": 18, "ct": "Capítulo XVI", "t": "– O que você quer? – ele arquejou.", "h": 0}, {"i": 1310, "c": 18, "ct": "Capítulo XVI", "t": "– Fique calado – disse o homem. – Se você se mexer, eu atiro.", "h": 0}, {"i": 1311, "c": 18, "ct": "Capítulo XVI", "t": "– Você está louco. O que eu fiz para você?", "h": 0}, {"i": 1312, "c": 18, "ct": "Capítulo XVI", "t": "– Você arruinou a vida de Sibyl Vane – foi a resposta –, e Sibyl Vane era minha irmã. Ela se matou. Eu sei disso. A morte dela é sua culpa. Jurei que o mataria quando voltasse. Há anos que eu o procuro. Não tinha nenhuma pista, nenhum sinal. As duas pessoas que poderiam descrevê-lo estão mortas. Eu não sabia nada a seu respeito, a não ser o apelido com que ela costumava chamá-lo. Ouvi esse apelido por acaso hoje. Faça as pazes com Deus, porque hoje você vai morrer.", "h": 0}, {"i": 1313, "c": 18, "ct": "Capítulo XVI", "t": "Dorian Gray sentiu náuseas de tanto medo. – Eu não a conheci – ele balbuciou. – Nunca ouvi falar. Você está louco.", "h": 0}, {"i": 1314, "c": 18, "ct": "Capítulo XVI", "t": "– Seria melhor você confessar o seu pecado, pois, tão certo quanto eu me chamo James Vane, você vai morrer esta noite – houve um momento horrível. Dorian não soube o que dizer ou fazer. – Ajoelhe-se! – rosnou o homem. – Vou lhe dar um minuto para se confessar, não mais do que isso. Embarco hoje à noite para a Índia, mas vou cumprir minha tarefa primeiro. Um minuto. Nada mais.", "h": 0}, {"i": 1315, "c": 18, "ct": "Capítulo XVI", "t": "Os braços de Dorian pendiam junto ao corpo. Paralisado de terror, ele não sabia o que fazer. De repente, uma esperança desenfreada lhe passou pela cabeça.", "h": 0}, {"i": 1316, "c": 18, "ct": "Capítulo XVI", "t": "– Pare – ele gritou. – Quanto tempo faz que a sua irmã morreu? Depressa, diga-me logo!", "h": 0}, {"i": 1317, "c": 18, "ct": "Capítulo XVI", "t": "– Dezoito anos – disse o homem. – Por que você quer saber? Que importância tem quantos anos faz?", "h": 0}, {"i": 1318, "c": 18, "ct": "Capítulo XVI", "t": "– Dezoito anos – gargalhou Dorian Gray, com um toque de triunfo na voz. – Dezoito anos! Ponha-me embaixo do lampião e olhe para o meu rosto!", "h": 0}, {"i": 1319, "c": 18, "ct": "Capítulo XVI", "t": "James Vane hesitou por um momento, sem entender o que ele pretendia. Então agarrou Dorian Gray e o arrastou para fora dos arcos.", "h": 0}, {"i": 1320, "c": 18, "ct": "Capítulo XVI", "t": "Mesmo fraca e oscilante com o vento como estava a luz, ainda assim bastou para lhe demonstrar o equívoco tremendo, tal como lhe pareceu, que ele havia cometido, pois o rosto do homem que ele queria matar tinha todo o viço da adolescência, toda a imaculada pureza da juventude. Ele parecia um rapaz de não mais de vinte verões, dificilmente mais do que isso, talvez nem mesmo mais velho que a irmã quando se despediram havia tantos anos. Era óbvio que aquele não era o homem que havia destruído a vida dela.", "h": 0}, {"i": 1321, "c": 18, "ct": "Capítulo XVI", "t": "Ele o soltou e recuou.", "h": 0}, {"i": 1322, "c": 18, "ct": "Capítulo XVI", "t": "– Meu Deus! Meu Deus! – ele exclamou –, e eu quase o matei!", "h": 0}, {"i": 1323, "c": 18, "ct": "Capítulo XVI", "t": "Dorian Gray respirou fundo. – O senhor esteve prestes a cometer um crime terrível – ele disse, olhando para ele muito seriamente. – Que sirva de lição para o senhor não buscar vingança com as próprias mãos.", "h": 0}, {"i": 1324, "c": 18, "ct": "Capítulo XVI", "t": "– Perdão, senhor – murmurou James Vane. – Eu me enganei. Uma palavra ao acaso que ouvi naquele maldito antro me levou pelo caminho errado.", "h": 0}, {"i": 1325, "c": 18, "ct": "Capítulo XVI", "t": "– É melhor você ir embora, e jogue fora essa pistola, ou você pode arranjar mais confusão – disse Dorian, dando-lhe as costas e lentamente descendo a rua.", "h": 0}, {"i": 1326, "c": 18, "ct": "Capítulo XVI", "t": "James Vane ficou parado na calçada horrorizado. Tremia dos pés à cabeça. Algum tempo depois, uma sombra negra que se esgueirava junto à parede úmida veio para a luz e se aproximou dele a passos furtivos. Ele sentiu uma mão em seu braço e se virou assustado. Era uma das mulheres que estavam bebendo no bar.", "h": 0}, {"i": 1327, "c": 18, "ct": "Capítulo XVI", "t": "– Por que você não o matou? – ela sibilou, com o rosto desmazelado muito perto do dele. – Eu sabia que você tinha ido atrás dele quando saiu do Daly’s. Seu bobo! Você devia tê-lo matado. Ele tem muito dinheiro, e é tão mau quanto alguém pode ser.", "h": 0}, {"i": 1328, "c": 18, "ct": "Capítulo XVI", "t": "– Ele não é quem eu estou procurando – ele respondeu –, e eu não quero o dinheiro dele. Eu quero a vida. E esse homem cuja vida eu quero deve ter hoje quase quarenta anos. E este é pouco mais que um menino. Graças a Deus não fiquei com o sangue dele em minhas mãos.", "h": 0}, {"i": 1329, "c": 18, "ct": "Capítulo XVI", "t": "A mulher deu uma risada amarga. – Pouco mais que um menino! – ela zombou. – Ora, pois, já faz quase dezoito anos que o Príncipe Encantado fez de mim o que eu sou agora.", "h": 0}, {"i": 1330, "c": 18, "ct": "Capítulo XVI", "t": "– Você está mentindo! – gritou James Vane.", "h": 0}, {"i": 1331, "c": 18, "ct": "Capítulo XVI", "t": "Ela ergueu a mão para o céu. – Juro por Deus que estou dizendo a verdade – ela exclamou.", "h": 0}, {"i": 1332, "c": 18, "ct": "Capítulo XVI", "t": "– Por Deus?", "h": 0}, {"i": 1333, "c": 18, "ct": "Capítulo XVI", "t": "– Que caia um raio se estou mentindo. Ele é o pior que vem aqui. Dizem que ele se vendeu para o diabo em troca de um rosto sempre bonito. Faz quase dezoito anos que eu o conheço. Ele não mudou quase nada de lá para cá. Não foi o meu caso – ela acrescentou, com olhar doentio.", "h": 0}, {"i": 1334, "c": 18, "ct": "Capítulo XVI", "t": "– Você jura que isso é verdade?", "h": 0}, {"i": 1335, "c": 18, "ct": "Capítulo XVI", "t": "– Juro – saiu em eco rouco de sua boca flácida. – Mas não vá me dedurar para ele – ela se queixou –; eu tenho medo dele. Dê-me algum dinheiro para o quarto hoje à noite.", "h": 0}, {"i": 1336, "c": 18, "ct": "Capítulo XVI", "t": "Ele se afastou dela com um xingamento e correu até a esquina, mas Dorian Gray havia desaparecido. Quando ele olhou para trás, a mulher também tinha sumido.", "h": 0}, {"i": 1337, "c": 19, "ct": "Capítulo XVII", "t": "Capítulo XVII", "h": 1}, {"i": 1338, "c": 19, "ct": "Capítulo XVII", "t": "Uma semana depois, Dorian Gray estava no orquidário em Selby Royal conversando com a bela duquesa de Monmouth, que, ao lado do marido, um envelhecido senhor de sessenta anos, estava entre seus convidados. Era hora do chá, e a luz suave do imenso lampião rendado sobre a mesa iluminava a porcelana delicada e a prata lavrada do serviço que a duquesa presidia. Suas mãos brancas se moviam delicadamente entre as xícaras, e seus lábios vermelhos estavam sorrindo voluptuosamente de algo que Dorian lhe sussurrara. Lorde Henry estava recostado em uma poltrona de vime estofada em seda olhando para eles. Em um divã cor de pêssego estava lady Narborough fingindo ouvir a descrição que o duque fazia do último besouro brasileiro que ele acrescentou a sua coleção. Três jovens em sofisticados smokings serviam bolo a algumas das mulheres. O grupo consistia de doze pessoas, e havia mais convidados que chegariam no dia seguinte.", "h": 0}, {"i": 1339, "c": 19, "ct": "Capítulo XVII", "t": "– O que vocês dois estão conversando? – disse lorde Henry, aproximando-se da mesa e depositando a xícara. – Espero que Dorian tenha contado do meu plano de rebatizar todas as coisas, Gladys. É uma ideia deliciosa.", "h": 0}, {"i": 1340, "c": 19, "ct": "Capítulo XVII", "t": "– Mas eu não quero ser batizada outra vez, Harry – devolveu a duquesa, olhando para ele com seus olhos magníficos. – Estou bem satisfeita com meu nome e tenho certeza de que o senhor Gray também está satisfeito com o dele.", "h": 0}, {"i": 1341, "c": 19, "ct": "Capítulo XVII", "t": "– Minha querida Gladys, eu não mudaria o nome de vocês. São ambos perfeitos. Eu pensava basicamente em flores. Ontem, cortei uma orquídea para a minha lapela. Era uma coisa maravilhosa, manchada, eficaz como os sete pecados capitais. Em um momento à toa, perguntei ao jardineiro como se chamava aquela flor. Ele me disse que era um belo espécime de robinsoniana , ou algo assim pavoroso. É uma triste verdade, mas perdemos a faculdade de dar nomes adoráveis às coisas. O nome é tudo. Jamais discuto com ações. Minha única disputa é com as palavras. É por esse motivo que odeio o realismo vulgar na literatura. Um homem capaz de chamar uma pá de pá deveria ser obrigado a usar pás. É a única coisa para a qual ele serve.", "h": 0}, {"i": 1342, "c": 19, "ct": "Capítulo XVII", "t": "– Então como você deveria se chamar, Harry? – ela perguntou.", "h": 0}, {"i": 1343, "c": 19, "ct": "Capítulo XVII", "t": "– O nome dele é Príncipe Paradoxo – disse Dorian.", "h": 0}, {"i": 1344, "c": 19, "ct": "Capítulo XVII", "t": "– Posso reconhecê-lo instantaneamente por esse nome – exclamou a duquesa.", "h": 0}, {"i": 1345, "c": 19, "ct": "Capítulo XVII", "t": "– Não quero mais falar nisso – riu lorde Henry, recostando-se em uma poltrona. – Não há como escapar de um rótulo. Abdico do meu título.", "h": 0}, {"i": 1346, "c": 19, "ct": "Capítulo XVII", "t": "– A realeza não pode abdicar – saiu como um aviso daqueles belos lábios.", "h": 0}, {"i": 1347, "c": 19, "ct": "Capítulo XVII", "t": "– Então você quer que eu defenda o meu trono?", "h": 0}, {"i": 1348, "c": 19, "ct": "Capítulo XVII", "t": "– Sim.", "h": 0}, {"i": 1349, "c": 19, "ct": "Capítulo XVII", "t": "– Só sei as verdades de amanhã.", "h": 0}, {"i": 1350, "c": 19, "ct": "Capítulo XVII", "t": "– Prefiro os equívocos do agora – ela respondeu.", "h": 0}, {"i": 1351, "c": 19, "ct": "Capítulo XVII", "t": "– Você me desarma, Gladys – ele exclamou, captando a intenção de seu humor.", "h": 0}, {"i": 1352, "c": 19, "ct": "Capítulo XVII", "t": "– De seu escudo, Harry; não de sua lança.", "h": 0}, {"i": 1353, "c": 19, "ct": "Capítulo XVII", "t": "– Jamais investiria contra a beleza – ele disse, com um ademã.", "h": 0}, {"i": 1354, "c": 19, "ct": "Capítulo XVII", "t": "– Eis o seu erro, Harry, acredite em mim. Você valoriza demais a beleza.", "h": 0}, {"i": 1355, "c": 19, "ct": "Capítulo XVII", "t": "– Como você pode dizer isso? Admito que acho melhor ser belo do que ser bom. Mas, por outro lado, ninguém mais do que eu reconhece que é melhor ser bom do que ser feio.", "h": 0}, {"i": 1356, "c": 19, "ct": "Capítulo XVII", "t": "– A feiura, então, é um dos sete pecados capitais? – exclamou a duquesa. – E o que houve com a sua metáfora da orquídea?", "h": 0}, {"i": 1357, "c": 19, "ct": "Capítulo XVII", "t": "– A feiura é uma das sete virtudes capitais, Gladys. Você, como boa tóri, não deveria subestimá-la. A cerveja, a Bíblia e as sete virtudes capitais fizeram da nossa Inglaterra o que ela é hoje.", "h": 0}, {"i": 1358, "c": 19, "ct": "Capítulo XVII", "t": "– Você não gosta, então, do seu país? – ela perguntou.", "h": 0}, {"i": 1359, "c": 19, "ct": "Capítulo XVII", "t": "– Eu moro nele.", "h": 0}, {"i": 1360, "c": 19, "ct": "Capítulo XVII", "t": "– Para poder melhor criticá-lo.", "h": 0}, {"i": 1361, "c": 19, "ct": "Capítulo XVII", "t": "– Você prefere que eu aceite o veredito da Europa sobre ele? – perguntou.", "h": 0}, {"i": 1362, "c": 19, "ct": "Capítulo XVII", "t": "– O que eles dizem de nós?", "h": 0}, {"i": 1363, "c": 19, "ct": "Capítulo XVII", "t": "– Que Tartufo emigrou para a Inglaterra e abriu um comércio.", "h": 0}, {"i": 1364, "c": 19, "ct": "Capítulo XVII", "t": "– Essa frase é sua, Harry?", "h": 0}, {"i": 1365, "c": 19, "ct": "Capítulo XVII", "t": "– Pode ficar para você.", "h": 0}, {"i": 1366, "c": 19, "ct": "Capítulo XVII", "t": "– Eu não saberia usar. É verdadeira demais.", "h": 0}, {"i": 1367, "c": 19, "ct": "Capítulo XVII", "t": "– Não precisa se preocupar. Nossos conterrâneos nunca reconhecem uma descrição.", "h": 0}, {"i": 1368, "c": 19, "ct": "Capítulo XVII", "t": "– Eles são práticos.", "h": 0}, {"i": 1369, "c": 19, "ct": "Capítulo XVII", "t": "– São mais astutos do que práticos. Quando preenchem seus registros, eles compensam a estupidez com a riqueza, e o vício com a hipocrisia.", "h": 0}, {"i": 1370, "c": 19, "ct": "Capítulo XVII", "t": "– Ainda assim, nós fizemos grandes coisas.", "h": 0}, {"i": 1371, "c": 19, "ct": "Capítulo XVII", "t": "– Grandes coisas foram atiradas nas nossas costas, Gladys.", "h": 0}, {"i": 1372, "c": 19, "ct": "Capítulo XVII", "t": "– Nós carregamos esse fardo.", "h": 0}, {"i": 1373, "c": 19, "ct": "Capítulo XVII", "t": "– Mas só até a bolsa de valores.", "h": 0}, {"i": 1374, "c": 19, "ct": "Capítulo XVII", "t": "Ela balançou a cabeça. – Eu acredito em nossa estirpe – ela exclamou.", "h": 0}, {"i": 1375, "c": 19, "ct": "Capítulo XVII", "t": "– Ela representa a sobrevivência do empreendedor.", "h": 0}, {"i": 1376, "c": 19, "ct": "Capítulo XVII", "t": "– Ela teve algum desenvolvimento.", "h": 0}, {"i": 1377, "c": 19, "ct": "Capítulo XVII", "t": "– A decadência me fascina mais.", "h": 0}, {"i": 1378, "c": 19, "ct": "Capítulo XVII", "t": "– E quanto à arte? – ela perguntou.", "h": 0}, {"i": 1379, "c": 19, "ct": "Capítulo XVII", "t": "– É uma doença.", "h": 0}, {"i": 1380, "c": 19, "ct": "Capítulo XVII", "t": "– E o amor?", "h": 0}, {"i": 1381, "c": 19, "ct": "Capítulo XVII", "t": "– Uma ilusão.", "h": 0}, {"i": 1382, "c": 19, "ct": "Capítulo XVII", "t": "– E a religião?", "h": 0}, {"i": 1383, "c": 19, "ct": "Capítulo XVII", "t": "– O substituto elegante da crença.", "h": 0}, {"i": 1384, "c": 19, "ct": "Capítulo XVII", "t": "– Você é cético.", "h": 0}, {"i": 1385, "c": 19, "ct": "Capítulo XVII", "t": "– Jamais. O ceticismo é o começo da fé.", "h": 0}, {"i": 1386, "c": 19, "ct": "Capítulo XVII", "t": "– O que você é?", "h": 0}, {"i": 1387, "c": 19, "ct": "Capítulo XVII", "t": "– Definir é limitar.", "h": 0}, {"i": 1388, "c": 19, "ct": "Capítulo XVII", "t": "– Dê-me uma pista.", "h": 0}, {"i": 1389, "c": 19, "ct": "Capítulo XVII", "t": "– Os fios se partem. Você se perderia no labirinto.", "h": 0}, {"i": 1390, "c": 19, "ct": "Capítulo XVII", "t": "– Você me confunde. Vamos falar de outra pessoa.", "h": 0}, {"i": 1391, "c": 19, "ct": "Capítulo XVII", "t": "– Nosso anfitrião é um tema delicioso. Anos atrás ele foi chamado de Príncipe Encantado.", "h": 0}, {"i": 1392, "c": 19, "ct": "Capítulo XVII", "t": "– Ah! Não me faça lembrar disso – exclamou Dorian Gray.", "h": 0}, {"i": 1393, "c": 19, "ct": "Capítulo XVII", "t": "– Nosso anfitrião está terrível esta noite – respondeu a duquesa, enrubescendo. – Acredito que ele pense que Monmouth se casou comigo por princípios puramente científicos, como se eu fosse o melhor espécime que ele encontrou de uma borboleta moderna.", "h": 0}, {"i": 1394, "c": 19, "ct": "Capítulo XVII", "t": "– Bem, espero que ele não a espete com alfinetes, duquesa – gargalhou Dorian.", "h": 0}, {"i": 1395, "c": 19, "ct": "Capítulo XVII", "t": "– Oh, minha criada já faz isso, senhor Gray, quando ela está irritada comigo.", "h": 0}, {"i": 1396, "c": 19, "ct": "Capítulo XVII", "t": "– E o que a irrita em você, duquesa?", "h": 0}, {"i": 1397, "c": 19, "ct": "Capítulo XVII", "t": "– As coisas mais triviais, senhor Gray, eu lhe garanto. Geralmente, por
