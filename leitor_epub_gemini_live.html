ra entreter seus convidados com as maravilhas de sua arte. Seus pequenos jantares, que lorde Henry sempre lhe ajudava a organizar, eram notáveis tanto pela cuidadosa seleção e posição dos convidados, quanto pelo gosto magnífico demonstrado pela decoração da mesa, com seus sutis arranjos sinfônicos de flores exóticas, e toalhas bordadas, e antigos pratos de ouro e prata. Na verdade, havia muitos homens, especialmente entre os rapazes mais novos, que viam, ou imaginavam ver, em Dorian Gray, a verdadeira realização de um tipo com que muitas vezes sonharam nos tempos de Eton ou Oxford, um tipo que combinaria algo da genuína cultura de um erudito com a graça e a distinção e os modos perfeitos de um cidadão do mundo. Para eles, ele parecia pertencer àquela estirpe que Dante descreve como daqueles que tentaram “tornar-se perfeitos pela adoração da beleza”. Como Gautier, ele era alguém para quem “o mundo visível existia”.", "h": 0}, {"i": 932, "c": 13, "ct": "Capítulo XI", "t": "E, certamente, para ele a própria vida em si era a primeira, a maior das artes, e para a qual todas as outras pareciam meros preparativos. A moda, por meio da qual o que é realmente fantástico se torna por um momento universal, e o dandismo, que, à sua maneira, é uma tentativa de afirmar a absoluta modernidade da beleza, tinham, é claro, seu fascínio para ele. Seu modo de vestir e os estilos particulares que de quando em quando ele afetava tiveram notória influência sobre os jovens transviados dos bailes de Mayfair e dos clubes de Pall Mall, que o copiavam em tudo o que fazia, e tentavam reproduzir seus caprichos.", "h": 0}, {"i": 933, "c": 13, "ct": "Capítulo XI", "t": "Pois, embora estivesse pronto para aceitar a posição que foi quase imediatamente oferecida para ele ao atingir a maioridade, e tivesse encontrado, a bem dizer, um prazer sutil ao pensar que poderia vir a se tornar para a Londres de sua época o que para a Roma de Nero foi o autor do Satíricon , ainda assim, no fundo do coração, ele desejava ser algo mais do que um mero arbiter elegantiarum , para ser consultado sobre o modo de usar uma joia, de dar um nó de gravata ou de portar uma bengala. Ele tentaria elaborar um novo esquema de vida, que teria sua argumentação filosófica e seus próprios princípios ordenados, e encontrar na espiritualização dos sentidos sua mais alta realização.", "h": 0}, {"i": 934, "c": 13, "ct": "Capítulo XI", "t": "A adoração dos sentidos amiúde, e com muita justiça, foi execrada, pois o homem tem um instinto natural de terror diante das paixões e sensações que parecem mais fortes que ele, e que ele tem consciência de partilhar com formas de existência menos organizadas. Mas, para Dorian Gray, aparentemente, a verdadeira natureza dos sentidos jamais havia sido compreendida, e os sentidos haviam permanecido selvagens e animalescos meramente porque o mundo tentou obrigá-los à submissão ou matá-los de dor, em vez de tentar torná-los elementos de uma nova espiritualidade, da qual a característica dominante seria um instinto mais refinado para a beleza. Olhando em retrospecto para o movimento do homem ao longo da história, ele se viu assombrado por uma sensação de perda. Tantas concessões haviam sido feitas! E tão despropositadas! Foram loucas rejeições deliberadas, formas monstruosas de tortura e negação de si mesmo, cuja origem era o medo, e cujo resultado foi uma degradação infinitamente mais terrível do que a fantasiosa degradação da qual, em sua ignorância, ele havia tentado escapar. A natureza, em sua maravilhosa ironia, levando o anacoreta para viver com as feras selvagens do deserto, dando ao eremita os animais do campo como companheiros.", "h": 0}, {"i": 935, "c": 13, "ct": "Capítulo XI", "t": "Sim: haveria, como lorde Henry proferizara, um novo hedonismo que recriaria a vida, e a pouparia do rude e grosseiro puritanismo que, hoje em dia, vem sendo curiosamente revivido. Teria a seu serviço o intelecto, certamente; no entanto, jamais aceitaria qualquer teoria ou sistema que envolvesse o sacrifício de qualquer tipo de experiência passional. Seu objetivo, na verdade, seria a própria experiência, e não os frutos da experiência, doces ou amargos que fossem. Sobre o ascetismo que mortifica os sentidos, assim como a dissipação vulgar que os embota, não teria nenhum interesse. Mas ensinaria o homem a se concentrar nos momentos de uma vida que em si mesma não passava de um breve momento.", "h": 0}, {"i": 936, "c": 13, "ct": "Capítulo XI", "t": "Raros entre nós nunca acordaram antes do nascer do sol, ou depois de uma noite sem sonhos que quase nos faz desejar a morte, ou depois de uma noite de horror e alegria disforme, quando através das câmaras do cérebro passam fantasmas mais terríveis do que a própria realidade, imbuídos daquela vida ardente que espreita em todo grotesco, e que empresta à arte gótica sua duradoura vitalidade, sendo esta arte, como se pode imaginar, especialmente a arte daqueles cujos espíritos foram perturbados pela doença do devaneio. Aos poucos, dedos brancos avançam por entre as cortinas, e elas parecem tremular. Em fantásticas formas negras, sombras mudas rastejam até os cantos do quarto e ficam ali agachadas. Lá fora, há pássaros agitando as folhas, ou o som de homens indo trabalhar, ou o suspiro e o soluço do vento descendo das encostas e perambulando pela casa silenciosa, como se temesse despertar quem está dormindo, e, no entanto, precisasse chamar o sono para fora de sua caverna roxa. Véus e mais véus de fina gaze escura são erguidos, e aos poucos as formas e cores das coisas lhes são restituídas, e observamos a madrugada refazer o mundo em seu padrão antigo. Os espelhos pálidos retomam sua vida de mímicos. As velas apagadas estão onde as deixamos, e ao lado está o livro pela metade que estávamos lendo, ou a flor de lapela que usamos no baile, ou a carta que tivemos medo de ler, ou a que costumamos reler amiúde. Nada nos parece ter mudado. Das sombras irreais da noite, a vida real volta àquilo que conhecíamos. Precisamos retomar de onde paramos, e somos acometidos de uma terrível sensação da necessidade da continuidade da energia no mesmo ciclo exaustivo de hábitos estereotipados, ou do anseio selvagem, quiçá, de que nossas pálpebras possam se abrir certa manhã em um mundo recém-renovado na escuridão para o nosso prazer, um mundo em que as coisas teriam novas formas e cores e estariam todas mudadas, ou teriam outros segredos, um mundo em que o passado teria pouco ou nenhum espaço, ou em que não sobreviveria, sob nenhum aspecto, nenhuma forma consciente de obrigação ou de remorso, uma vez que até a lembrança da alegria possui alguma amargura, e a recordação do prazer, alguma dor.", "h": 0}, {"i": 937, "c": 13, "ct": "Capítulo XI", "t": "Era a criação desses mundos que parecia a Dorian Gray ser o verdadeiro objetivo, ou um dos verdadeiros objetivos, da vida; e em sua busca de sensações que fossem ao mesmo tempo novas e prazerosas, e possuíssem o elemento de estranheza que é tão essencial ao romance, ele adotaria amiúde certos modos de pensamento que sabia serem realmente alheios à sua própria natureza, abandonando-se às suas influências sutis, e depois, enfim, havendo lhes absorvido a cor e satisfeito sua curiosidade intelectual, abandonando-os com a curiosa indiferença que não é incompatível com um genuíno ardor do temperamento, e que, de fato, segundo alguns psicólogos modernos, muitas vezes é uma condição do verdadeiro ardor.", "h": 0}, {"i": 938, "c": 13, "ct": "Capítulo XI", "t": "Havia rumores de que ele estivera prestes a se converter ao catolicismo romano; e certamente o ritual romano sempre exercera grande atração sobre ele. O sacrifício diário, mais terrível na verdade que todos os sacrifícios do mundo antigo, deixava-o comovido tanto por sua soberba rejeição da evidência dos sentidos como pela primitiva simplicidade de seus elementos e pelo pathos eterno da tragédia humana que o sacrifício buscava simbolizar. Adorava se ajoelhar no piso frio de mármore e observar o padre, em seu traje rígido e florido, lentamente, e com mãos brancas, afastar o véu do tabernáculo, ou erguer o ostensório em forma de lanterna com aquela óstia pálida que às vezes as pessoas gostavam de pensar que era de fato o panis caelestis , o pão dos anjos, ou, usando o traje da Paixão de Cristo, partir a hóstia sobre o cálice, e bater no peito por seus pecados. Os incensórios fumegantes, que meninos graves, em renda e escarlate, lançavam no ar como grandes flores douradas, exerciam um fascínio sutil sobre ele. Na saída, ele costumava olhar com curiosidade para os confessionários escuros, e tinha vontade de se sentar na penumbra de um deles e ouvir homens e mulheres sussurrando através da treliça desbotada a verdadeira história de suas vidas.", "h": 0}, {"i": 939, "c": 13, "ct": "Capítulo XI", "t": "Mas ele jamais incorreu no erro de deter seu desenvolvimento intelectual por nenhuma aceitação formal de credos ou sistemas, ou de confundir uma casa onde morar e uma hospedaria adequada apenas para pernoitar, ou passar algumas horas de um noite sem estrelas ou em que a lua não nasceu. O misticismo, com seu maravilhoso poder de tornar estranhas as coisas comuns, e o sutil antinomianismo que sempre parece acompanhá-lo, comoveram-no por uma temporada; e por outra temporada ele se sentiu inclinado para as doutrinas materialistas do darwinismo na Alemanha, e encontrou um prazer curioso em associar os pensamentos e paixões dos homens a uma célula perolada no cérebro, ou a um nervo branco dentro do corpo, deliciando-se na concepção de uma dependência absoluta do espírito a certas condições físicas, mórbidas ou saudáveis, normais ou doentias. No entanto, como já se disse antes sobre ele, nenhuma teoria da vida parecia ter importância se comparada à vida em si. Sentia-se agudamente consciente de que a especulação intelectual era árida quando separada da ação e da experiência. Sabia que os sentidos, não menos que a alma, têm mistérios espirituais a revelar.", "h": 0}, {"i": 940, "c": 13, "ct": "Capítulo XI", "t": "E assim ele estudaria agora os perfumes, e os segredos de sua manufatura, destilando óleos fortemente aromáticos, e queimando resinas odoríferas do oriente. Ele veria que não havia estado de espírito que não tivesse uma contrapartida na vida sensual, e se pôs a descobrir suas verdadeiras relações, perguntando-se o que haveria no olíbano que tornava a pessoa mística, e no âmbar gris que suscitava as paixões, e nas violetas que despertava a lembrança de romances mortos, e no almíscar que perturbava o cérebro, e na champaca que tingia a imaginação; e buscando com afinco elaborar uma verdadeira psicologia dos perfumes, e estimar as diversas influências das raízes de doce fragrância, e das flores redolentes carregadas de polén, ou dos bálsamos aromáticos, e das madeiras escuras e olorosas, do nardo nauseante, e da uva japonesa que ensandece os homens, e do aloé que dizem ser capaz de expulsar a melancolia da alma.", "h": 0}, {"i": 941, "c": 13, "ct": "Capítulo XI", "t": "Em outra época, em que se dedicou inteiramente à música, em um comprido salão com janelas de treliça, com tetos vermelhos e dourados e paredes laqueadas verde-oliva, ele costumava dar curiosos concertos, em que loucos ciganos arrancavam uma música selvagem de suas pequenas cítaras, ou graves tunisianos de xales amarelos dedilhavam as cordas tensas de monstruosos alaúdes, enquanto negros sorridentes batiam monotonamente em tambores de cobre, e, sentados em tapetes escarlates, indianos de turbantes justos sopravam longos pífaros de vime ou latão, e encantavam, ou fingiam encantar, grandes serpentes encapeladas ou horrendas víboras cornudas. Os intervalos bruscos e as estridentes dissonâncias da música bárbara agitavam-no às vezes, quando a graça de Schubert, e as belas tristezas de Chopin, e as poderosas harmonias do próprio Beethoven, passavam despercebidas por seus ouvidos. Ele passou a colecionar de todas as partes do mundo os mais estranhos instrumentos que pudessem ser encontrados, fosse nas tumbas de povos extintos ou entre as poucas tribos selvagens que haviam sobrevivido ao contato com as civilizações ocidentais, e adorava tocá-los e experimentá-los. Ele tinha os misteriosos trompetes do Jurupari dos índios do rio Negro, que as mulheres não tinham permissão de ver, e que até os jovens só podiam ver depois de serem submetidos a jejuns e flagelações, e os potes de barro dos peruanos que emitiam os cantos agudos dos pássaros, e flautas de ossos humanos como as que Alfonso de Ovalle ouviu no Chile, e os jaspes verdes sonoros encontrados próximo a Cuzco que produzem uma nota de doçura singular. Tinha cabaças pintadas cheias de pedrinhas que chocalhavam quando agitadas; o longo clarín dos mexicanos, no qual o músico não sopra, mas através do qual inala o ar; o estridente clarinete do Turé das tribos amazônicas, que é tocado pelos sentinelas que ficam o dia inteiro no alto das árvores, e podem ser ouvidos, dizem, a três léguas de distância; o teponaztli , que tem duas línguas de madeira que vibram, e é percutido com baquetas lambuzadas com uma resina elástica obtida do sumo leitoso de plantas; os guizos yotl dos astecas, pendurados em cachos como uvas; e um imenso tambor cilíndrico, coberto com peles de grandes serpentes, como o que Bernal Díaz viu quando foi com Cortés ao templo mexicano, e de cujo som dolente ele nos deixou tão vívida descrição. O caráter fantástico desses instrumentos o fascinava, e ele sentia um curioso prazer em pensar que a arte, como a Natureza, tinha também seus monstros, coisas de formato bestial e com vozes hediondas. No entanto, após algum tempo, ele se cansaria deles, e iria para o seu camarote na ópera, sozinho ou com lorde Henry, e ficaria ouvindo com prazer enlevado o Tannhäuser , vendo no prelúdio dessa grande obra de arte uma representação da tragédia de sua própria alma.", "h": 0}, {"i": 942, "c": 13, "ct": "Capítulo XI", "t": "A certo momento, ele passou a estudar joias, e apareceu em uma festa à fantasia como Anne de Joyeuse, almirante da França, em um traje coberto com quinhentas e sessenta pérolas. Foi fascinado por isso durante anos, e, a bem da verdade, pode-se dizer que esse fascínio jamais o abandonou. Ele costumava passar um dia inteiro arrumando e rearranjando em caixas as diversas pedras que havia colecionado, como o crisoberilo verde-oliva que fica vermelho quando iluminado, o cimófano com sua linha de reflexo prateado, o peridoto cor de pistache, os topázios cor-de-rosa e de vinho amarelado, carbúnculos de escarlate flamejante com trêmulas estrelas de quatro pontas, grossulárias vermelho-canela, espinelas cor de laranja e violeta e ametistas com camadas alternadas de vermelho rubi e azul safira. Amava o dourado avermelhado da pedra do sol, e a brancura perolada da pedra da lua, e o arco-íris esfacelado da opala leitosa. Encomendou de Amsterdã três esmeraldas de tamanho e riqueza de cores extraordinários, e tinha uma turquesa de la vieille roche que era motivo de inveja em todos os connoisseurs .", "h": 0}, {"i": 943, "c": 13, "ct": "Capítulo XI", "t": "Descobriu histórias maravilhosas, também, sobre joias. Na Disciplina clericalis , de Pedro Alfonso, é mencionada uma serpente com olhos de jacinto, e na romântica história de Alexandre, diz-se que o conquistador da Emátia encontrou no vale do Jordão cobras “com colares de esmeraldas crescendo-lhes nas costas”. Havia uma gema no cérebro do dragão, segundo Filóstrato, e “pela exibição das letras douradas e um traje escarlate, o monstro podia ser lançado em sono mágico, e assim assassinado”. Segundo o grande alquimista Pierre de Boniface, o diamante tornava o homem invisível, e a ágata da Índia o tornava eloquente. A cornalina apaziguava a ira, e o jacinto provocava sono, e a ametista afastava as evolações do vinho. A granada espantava os demônios, e o hidrópico tirava a cor da lua. A selenita se tornava opaca e translúcida conforme a lua, e o meloceus, que revela os ladrões, só podia ser afetado pelo sangue de crianças. Camillo Leonardi viu uma pedra branca ser tirada do cérebro de um sapo que acabara de morrer, que era um certo antídoto contra veneno. O bezoar, encontrado no coração do veado árabe, era um talismã capaz de curar a peste. Nos ninhos dos pássaros árabes, havia aspilates, que, segundo Demócrito, mantinham quem os usasse imunes ao fogo.", "h": 0}, {"i": 944, "c": 13, "ct": "Capítulo XI", "t": "O rei do Ceilão desfilou a cavalo pela cidade com um grande rubi na mão, na cerimônia de sua coroação. Os portões do palácio do preste João eram “feitos de sárdio, lavrados com o corno da víbora, para que ninguém pudesse entrar trazendo veneno consigo”. No frontão, havia “duas maçãs de ouro, onde havia dois carbúnculos”, de modo que o ouro brilhasse de dia e os carbúnculos, à noite. No estranho romance de Lodge, Uma Margarita da América , dizia-se que no aposento da rainha era possível ver “todas as damas castas do mundo, engastadas em prata, olhando-se através de belos espelhos de crisólitos, carbúnculos, safiras e verdes esmeraldas”. Marco Polo vira os habitantes de Cipango colocarem pérolas róseas nas bocas dos mortos. Um monstro marinho, que se apaixonara pela pérola que um mergulhador trouxera ao rei Peroz, matou o ladrão e ficou sete luas em luto por sua perda. Quando os hunos atraíram o rei para o grande fosso, ele atirou a pérola tão longe – Procópio conta essa história – que nunca mais foi encontrada, embora o imperador Anastásio tenha oferecido quinhentas peças de ouro para quem a encontrasse. O rei de Malabar mostrara a um certo veneziano um rosário com trezentas e quatro pérolas, uma para cada deus de sua devoção.", "h": 0}, {"i": 945, "c": 13, "ct": "Capítulo XI", "t": "Quando o duque de Valentinois, filho de Alexandre VI , visitou Luís XII de França, seu cavalo estava carregado de folhas de ouro, segundo Brantôme, e seu chapéu tinha fileiras duplas de rubis que emitiam uma forte luz. Carlos de Inglaterra montara em estribos cravejados de quatrocentos e vinte e um diamantes. Ricardo II tinha um casaco, avaliado em trinta mil marcos, que era coberto de espinelas. Hall descreveu Henrique VIII , a caminho da torre, antes de ser coroado, usando “uma jaqueta de ouro em relevo, uma placa cravejada de diamantes e outras pedras preciosas, e um grande colar de grandes espinelas.” As favoritas de Jaime I usavam brincos de esmeraldas encastadas em filigranas de ouro. Eduardo II deu a Piers Gaveston um conjunto de armadura de ouro vermelho cravejada de jacintos, um colar de rosas de ouro decorado com turquesas, e um elmo parsemé de pérolas. Henrique II usava luvas cobertas de joias até o cotovelo, e tinha uma luva de falcoaria bordada com doze rubis e cinquenta e duas grandes pérolas iridescentes. O chapéu ducal de Carlos, o Temerário, último duque da Borgonha de sua linhagem, era coberto de pérolas em forma de pera, e cravejado de safiras.", "h": 0}, {"i": 946, "c": 13, "ct": "Capítulo XI", "t": "A vida outrora havia sido tão magnífica! Tão bela em sua pompa e em sua decoração! Até mesmo ler sobre o luxo dos mortos era maravilhoso.", "h": 0}, {"i": 947, "c": 13, "ct": "Capítulo XI", "t": "Depois ele voltou sua atenção aos bordados e às tapeçarias que faziam as vezes de afrescos nos ambientes frios dos países da Europa setentrional. Conforme ele pesquisava o assunto – e ele sempre tinha uma extraordinária capacidade de ser absolutamente absorvido por aquilo que investigava no momento – ficou quase triste ao refletir sobre a ruína em que o tempo transformava coisas belas e maravilhosas. Disso, ele mesmo, de qualquer modo, havia escapado. Os verões se sucederam, e os junquilhos amarelos floresceram e morreram muitas vezes, madrugadas de horror repetiram a história de sua vergonha, porém ele não se alterou. Nenhum inverno enrugou sua face ou maculou seu viço florescente. Como isso era diferente com as coisas materiais! Aonde teriam ido? Onde estava o grande peplo cor de açafrão, onde os deuses combatiam os gigantes, que havia sido feito por jovens morenas para o prazer de Atena? Onde, o imenso velarium que Nero estendeu sobre o Coliseu em Roma, a titânica vela roxa em que se representava o céu estrelado, e Apolo conduzindo uma quadriga puxada por corcéis brancos de arreios dourados? Ele teria adorado ver os curiosos guardanapos feitos para o sacerdote do sol, Heliogábalo, sobre os quais eram servidas todas as iguarias e provisões desejáveis em um banquete; a mortalha do rei Chilperico, com suas trezentas abelhas de ouro; os trajes fantásticos que provocaram a indignação do bispo de Ponto, ilustrados com leões, panteras, ursos, cães, florestas, rochedos, caçadores – todos elementos, na verdade, que um pintor poderia copiar da natureza; e o casaco que Carlos d’Orleans usou um dia, em cujas mangas estavam bordados os versos de uma canção que começava com Madame, je suis tout joyeux , e o acompanhamento musical das palavras vinha bordado em fio de ouro, e cada nota, aquadradadas naquela época, era formada por quatro pérolas. Lera sobre o quarto preparado no palácio de Rheims para a rainha Joana da Borgonha, decorado com mil e trezentos e vinte um papagaios, bordados, e adornado com o brasão de armas do rei, e quinhentas e sessenta e uma borboletas, cujas asas eram ornadas de modo semelhante com as armas da rainha, tudo em fios de ouro. Catarina de Médicis teve um leito de morte feito de veludo preto salpicado de crescentes e sóis. Tinha cortinas do dossel de damasco, com guirlandas e grinaldas de folhas, em relevo sobre um fundo dourado e prateado, com bordas franjadas de pérolas bordadas, e ficava em um quarto decorado com todos os apetrechos da rainha expostos sobre veludo negro em tecido prateado. Luís XIV tinha cariátides com aplicações em ouro de quase cinco metros de altura em seus aposentos. A cama com baldaquino de Sobieski, rei da Polônia, era feita de brocados de ouro de Esmirna, com versos do Corão bordados com turquesas. As colunas eram banhadas em prata, magnificamente lavradas e profusamente ornadas com medalhões esmaltados e cravejados de joias. Fora tomada do acampamento turco diante de Viena, e o estandarte de Mohammed permanecera sob o ouro tremulante de seu dossel.", "h": 0}, {"i": 948, "c": 13, "ct": "Capítulo XI", "t": "E assim, durante um ano inteiro, ele buscou acumular os espécimes mais sofisticados que conseguiu encontrar em termos de tecidos e bordados, adquirindo as delicadas musselinas de Nova Deli, lindamente urdidas com palmas de fio de ouro, e aplicações iridescentes de asas de besouros; as gazes de Dacca, que por sua transparência são conhecidas no oriente como “ar entretecido” e “água corrente”, e “sereno da noite”; as fazendas de estranhas figuras de Java; os elaborados panejamentos chineses; livros encadernados em cetins terracota ou em belas sedas azuis e decorados com fleurs de lys , pássaros e imagens; véus rendados em ponto húngaro; brocados sicilianos, e rígidos veludos espanhóis; bordados georgianos com moedas de ouro; e fukusas japoneses com seus dourados esverdeados e seus pássaros maravilhosamente emplumados.", "h": 0}, {"i": 949, "c": 13, "ct": "Capítulo XI", "t": "Ele tinha especial paixão, também, pela indumentária eclesiástica, como tinha aliás por tudo que fosse associado ao serviço da Igreja. Nos compridos baús que ladeavam a galeria oeste de sua casa, ele havia guardado muitos raros e belos espécimes do que seria realmente o traje da noiva de Cristo, que devia usar roxo e joias e fino linho para esconder o pálido corpo exaurido do sofredor por quem ela procura, ferido por dores autoinfligidas. Ele possuía um belo pluvial de seda carmesim e damasco de fios de ouro, ornado com um padrão repetido de romãs douradas dispostas em flores de seis pétalas, e de cada lado havia um ananás bordado em pérolas cultivadas. Os aurifrígios eram divididos em painéis representando cenas da vida da Virgem, e a coroação da Virgem aparecia em sedas coloridas sobre o capuz. Era uma peça italiana do século XV . Outro pluvial era de veludo verde, bordado com grupos de acantos em forma de coração, dos quais brotavam flores brancas de hastes compridas, cujos detalhes eram feitos em linha prateada e cristais coloridos. A presilha tinha uma cabeça de serafim em relevo de fio de ouro. Os aurifrígios eram de seda vermelha e dourada, estrelados de medalhões de muitos santos e mártires, entre os quais estava são Sebastião. Ele tinha também casulas de sedas ambarinas, de sedas azuis e com brocados dourados, e damasquins amarelos e tecidos de ouro, com figuras de representações da Paixão e da crucificação de Cristo, e bordados com leões e pavões e outros emblemas; dalmáticas de cetim branco e damascos cor-de-rosa, decorados com tulipas e golfinhos e fleurs de lys ; panos de altar de veludo carmim e linho azul; e muitos corporais, sanguíneos e sudários. Nos ofícios místicos em que tais coisas eram usadas, havia algo que despertava sua imaginação.", "h": 0}, {"i": 950, "c": 13, "ct": "Capítulo XI", "t": "Pois esses tesouros, e tudo o que ele colecionava em sua casa adorável, seriam para ele meios de esquecer, modos de escapar, por uma temporada, do medo que lhe parecia às vezes quase grande demais para suportar. Nas paredes do solitário sótão trancado onde passara tanto tempo na infância, ele havia pendurado com as próprias mãos o terrível retrato cujas feições cambiantes lhe mostravam a verdadeira degradação de sua vida, e na frente do quadro ele havia pendurado o manto roxo e dourado como uma cortina. Durante semanas, ele não entraria ali, esqueceria a hedionda criatura pintada e voltaria a ter o coração leve, à sua maravilhosa alegria, sua absorção passional na mera existência. Então, subitamente, uma noite, ele se esgueiraria para fora de casa, desceria aos pavorosos estabelecimentos perto de Blue Gate Fields e ali ficaria, dia após dia, até que o expulsassem. Na volta, ele sentaria diante do quadro, por vezes odiando-o e a si mesmo, mas, outras vezes, cheio de orgulho do individualismo que é metade do fascínio do pecado, e sorrindo, com um secreto prazer, da sombra disforme que tinha de carregar um fardo que deveria ter sido seu.", "h": 0}, {"i": 951, "c": 13, "ct": "Capítulo XI", "t": "Depois de alguns anos, ele não suportaria mais se ausentar muito da Inglaterra e acabaria abrindo mão da villa que dividira em Trouville com lorde Henry, assim como da casinha branca cercada de muros em Argel onde mais de uma vez passaram juntos o inverno. Ele odiava se separar do retrato que representava parte tão grande de sua vida, e também receava que durante sua ausência alguém pudesse ter acesso ao sótão, apesar das sofisticadas grades que mandara instalar na porta.", "h": 0}, {"i": 952, "c": 13, "ct": "Capítulo XI", "t": "Ele tinha plena consciência de que o quadro não lhes revelaria nada. Era verdade que o retrato ainda conservava, sob toda imundície e feiura do rosto, uma notável semelhança consigo mesmo; mas o que as pessoas poderiam inferir disso? Ele daria risada se alguém tentasse acusá-lo. Ele não havia pintado aquilo. Que importância tinha se o retrato fosse vil e vergonhoso? Mesmo que ele explicasse, quem acreditaria?", "h": 0}, {"i": 953, "c": 13, "ct": "Capítulo XI", "t": "No entanto, tinha receios. Às vezes, quando estava em sua casa grande em Nottinghamshire, recebendo rapazes elegantes de sua própria classe, que eram seus principais companheiros, e chocando a província com os luxos libertinos e o magnífico esplendor de seu modo de vida, ele subitamente deixava seus convidados e corria de volta à cidade para ver se a porta não havia sido arrombada, e se o quadro ainda estava lá. E se o quadro fosse roubado? Só de pensar nisso sentiu um calafrio de horror. Decerto então saberiam seu segredo. Talvez todo mundo já suspeitasse.", "h": 0}, {"i": 954, "c": 13, "ct": "Capítulo XI", "t": "Pois, embora ele fascinasse muita gente, não eram poucos que desconfiavam dele. Ele foi quase vetado em um clube do West End ao qual seu nascimento e sua posição lhe davam pleno direito de se tornar membro, e diziam que certa vez, quando foi levado por um amigo à sala de fumantes do Churchill, o duque de Berwick e outro cavalheiro ostensivamente se levantaram e foram embora. Começaram a circular histórias curiosas sobre ele depois que passou dos vinte e cinco anos. Havia rumores de que ele fora visto batendo boca com marinheiros estrangeiros em um antro sujo nos confins de Whitechapel, e que andava com ladrões e falsários e conhecia os mistérios de seus ofícios. Suas ausências extraordinárias se tornaram notórias, e, quando ele voltava a frequentar a sociedade, as pessoas ficavam cochichando pelos cantos, ou passavam por ele com desdém, ou encaravam com olhos inquisitivos, como se estivessem decididas a descobrir seu segredo.", "h": 0}, {"i": 955, "c": 13, "ct": "Capítulo XI", "t": "A tais insolências e tentativas de isultos, ele, é claro, não dava atenção, e, na opinião da maioria das pessoas, seus modos francos e afáveis, seu encantador sorriso de menino, e a graça infinita daquela juventude que não parecia abandoná-lo jamais, eram em si mesmas resposta suficiente àquelas calúnias, pois era assim que a elas se referiam, que circulavam a respeito dele. Sabia-se, contudo, que algumas pessoas que o conheciam mais intimamente passavam, após algum tempo, a evitá-lo. Mulheres que o adoraram loucamente, e em sua defesa enfrentaram todo tipo de censura social, desafiando as convenções, foram vistas empalidecendo de vergonha ou horror quando Dorian Gray entrava no recinto.", "h": 0}, {"i": 956, "c": 13, "ct": "Capítulo XI", "t": "No entanto, esses escândalos sussurrados só faziam aumentar, aos olhos de muitas pessoas, seu encanto estranho e perigoso. Sua grande fortuna era decerto um fator de segurança. A sociedade, ao menos a civilizada, nunca está muito disposta a acreditar em nada que deponha contra alguém ao mesmo tempo rico e fascinante. Instintivamente, a sociedade sente que o estilo é mais importante que a moral, e, segundo ela, a mais alta respeitabilidade tem muito menos valor do que se dispor de um bom chef . E, afinal, é um péssimo consolo saber que o sujeito que ofereceu um péssimo jantar, ou um péssimo vinho, é irrepreensível em sua vida privada. Nem mesmo as virtudes cardeais compensam entradas quase frias, como observou certa vez lorde Henry, ao discutir o assunto; e ele possivelmente ainda tem muito o que dizer sobre isso. Pois os cânones da boa sociedade são, ou deveriam ser, os mesmos cânones da arte. A forma é absolutamente essencial para isso. A forma deve ter a dignidade de uma cerimônia, assim como a mesma irrealidade, e combinar o caráter insincero de uma peça romântica com a sagacidade e a beleza que tornam essas peças deliciosas para nós. Será que a insinceridade era mesmo uma coisa tão terrível? Creio que não. É meramente um método por meio do qual podemos multiplicar nossas personalidades.", "h": 0}, {"i": 957, "c": 13, "ct": "Capítulo XI", "t": "Tal, de todo modo, era a opinião de Dorian Gray. Ele se espantava com a psicologia rasa daqueles que concebiam o ego do homem como algo simples, permanente, confiável, e de uma essência única. Para ele, o homem era um ser com miríades de vidas e miríades de sensações, uma criatura multiforme complexa que trazia dentro de si estranhos legados de pensamentos e paixões, e cuja própria carne estava conspurcada pelas monstruosas doenças dos mortos. Ele adorava perambular pela fria e desolada galeria de quadros de sua casa de campo e observar os diversos retratos daqueles cujo sangue corria em suas veias. Ali estava Philip Herbert, descrito por Francis Osborne, em suas Memórias dos reinados de Elizabete e Jaime , como um “agraciado pela corte por seu belo rosto, que não o acompanhou por muito tempo”. Será que ele estava vivendo às vezes a vida do jovem Herbert? Algum estranho germe venenoso teria avançado lentamente, de corpo em corpo, até chegar ao seu? Teria sido alguma sensação difusa daquela graça arruinada que o fizera subitamente, e quase sem motivo, pronunciar, no estúdio de Basil Hallward, a súplica que mudara tanto sua vida? Ali, com gibão vermelho em bordado dourado, e gola rufo e punhos debruados em ouro, estava sir Anthony Sherard, com a armadura prateada e negra apoiada a seus pés. Qual havia sido o legado daquele homem? Teria o amante de Giovanna de Nápoles deixado alguma herança de pecado e vergonha? Seriam suas ações meramente sonhos que aquele homem morto não ousara realizar? Ali, da tela desbotada, sorria lady Elizabeth Devereux, em seu capuz de gaze, peitilho de pérolas e mangas bufantes cor-de-rosa. Havia uma flor na mão direita, e a esquerda segurava um colar esmaltado de rosas brancas e damascenas. Na mesa ao lado dela ficava um bandolim e uma maçã. Havia grandes rosetas verdes em seus pequenos sapatos pontudos. Ele conhecia sua vida e as estranhas histórias que contavam sobre seus amantes. Teria também algo do temperamento dela em si? Aqueles olhos ovais de pálpebras pesadas pareciam olhar curiosamente para ele. E quanto a George Willoughby, com seus cabelos empoados e fantásticas pintas artificiais? Parecia tão maldoso! O rosto era saturnino e moreno, e os lábios sensuais pareciam franzidos de desdém. Delicados punhos rendados cobriam magras mãos amareladas de dedos repletos de anéis. Ele havia sido um macaroni do século XVIII e amigo de juventude de lorde Ferrars. E quanto ao segundo, lorde Beckenham, companheiro do príncipe regente em seus tempos mais libertinos, e testemunha do casamento secreto com a senhora Fitzherbert? Como era orgulhoso e lindo, com seus cachos castanhos e sua pose insolente! Quantas paixões não deve ter deixado? O mundo julgou-o infame. Havia organizado as orgias em Carlton House. A estrela da jarreteira reluzia em seu peito. Ao lado, ficava o retrato da esposa, uma mulher pálida, de lábios finos, de preto. O sangue dela também se agitava dentro dele. Que curioso tudo aquilo parecia! E sua mãe com seu rosto de lady Hamilton, e os lábios úmidos violáceos que ele sabia ter herdado. Dela ele herdara a beleza e a paixão pela beleza dos outros. Ela ria para ele em sua folgada túnica de bacante. Havia folhas de parreira nos cabelos dela. A carnação da pintura murchara, mas os olhos ainda eram maravilhosos em sua profundidade e na vivacidade da cor. Pareciam segui-lo aonde quer que ele fosse.", "h": 0}, {"i": 958, "c": 13, "ct": "Capítulo XI", "t": "No entanto, tinha ancestrais na literatura, além da própria genealogia, talvez ainda mais próximos em tipo e temperamento, muitos deles, e certamente de cuja influência ele tinha uma consciência mais absoluta. Às vezes, parecia a Dorian Gray que a história inteira era meramente o registro de sua própria vida, não como ele a vivera em atos e circunstâncias, mas tal como sua imaginação a criara para si, como se tivesse ocorrido dentro de seu cérebro e de suas paixões. Ele sentia como se tivesse conhecido todas aquelas pessoas, aquelas figuras estranhas e terríveis que haviam passado pelo palco do mundo e tornado o pecado algo tão maravilhoso, e o mal algo tão cheio de sutilezas. Parecia-lhe de alguma maneira misteriosa que aquelas vidas haviam sido a sua.", "h": 0}, {"i": 959, "c": 13, "ct": "Capítulo XI", "t": "O herói do maravilhoso romance que tanto influenciara sua vida também tivera essa curiosa fantasia. No sétimo capítulo, ele conta como, com uma coroa de louros, para que o relâmpago não o atingisse, ele se sentara, tal como Tibério, em um jardim em Capri, lendo os livros vexaminosos da poeta Elephantis, enquanto anões e pavões passeavam ao redor, e o flautista zombava do portador do turíbulo; e, tal como Calígula, embriagara-se com os cavaleiros de camisas verdes em seus estábulos e jantara em uma manjedoura de marfim com um cavalo de testeira cravejada; e, tal como Domiciano, vagara através de um corredor revestido de espelhos de mármore, observando com olhos estupefatos o reflexo da adaga que encerraria seus dias, nauseado com aquele ennui , aquele terrível taedium vitae que acomete aqueles a quem a vida não nega nada; e fitara através de uma clara esmeralda na carnificina rubra de um circo, e então, em uma quadriga de pérolas e púrpura puxada por mulas com ferraduras de prata, fora carregado pela rua das Romãs até a casa de ouro, e ouvira homens pranteando Nero César ao passar; e, tal como Heliogábalo, pintara o rosto com cores, e virara a roca entre as mulheres, e trouxera a lua de Cartago, e a entregara em boda mística ao sol.", "h": 0}, {"i": 960, "c": 13, "ct": "Capítulo XI", "t": "Repetidas vezes, Dorian costumava ler esse capítulo fantástico, e os dois capítulos imediatamente seguintes, nos quais, como em algumas tapeçarias curiosas ou esmaltes sofisticadamente lavrados, eram retratadas as formas terríveis e belas daqueles a quem o vício, o sangue e o cansaço haviam transformado em monstros ou loucos: Filippo, duque de Milão, que matou a esposa, e pintou os lábios dela com veneno escarlate, para que o amante dela sugasse a morte da defunta que acariciaria; Pietro Barbi, o veneziano, conhecido como Paulo Segundo, que buscou em sua vaidade assumir o título de Formosus , e cuja tiara, avaliada em duzentos mil florins, fora comprada ao preço de um terrível pecado; Gian Maria Visconti, que costumava usar cães para caçar homens vivos, e cujo corpo assassinado fora coberto com rosas por uma meretriz que o amara; o Bórgia em seu cavalo branco, com o fratricida montado a seu lado, e seu manto manchado com o sangue de Perotto; Pietro Riario, o jovem cardeal arcebispo de Florença, filho e assecla de Sexto IV , cuja beleza só era igualada por sua devassidão, e que recebera Leonora de Aragão em um pavilhão de seda branca e carmim, cheio de ninfas e centauros, e banhou em ouro um menino para servir no banquete como Ganimedes ou Hilas; Ezzelino, cuja melancolia só podia ser curada pelo espetáculo da morte, e que tinha uma paixão pelo sangue vermelho, como outros homens têm pelo vinho tinto – filho do demônio, tal como se dizia na época, e alguém que trapaceara nos dados contra o próprio pai, quando jogava com ele por sua própria alma; Giambattista Cibo, que por escárnio adotou o nome de Inocente, e em cujas veias torpes o sangue de três rapazes foi injetado por um médico judeu; Sigismondo Malatesta, amante de Isotta, e senhor de Rimini, cuja efígie foi queimada em Roma como inimigo de Deus e do homem, que estrangulou Polissena com um guardanapo, e deu veneno a Ginevra d’Este em uma taça de esmeralda, e em honra a uma paixão vergonhosa construiu uma igreja pagã para adoração cristã; Carlos VI , que adorava tão loucamente a esposa do irmão, que um leproso o alertara da insanidade que lhe acometeria, e que, quando seu cérebro ficou doente e estranho, só podia ser aliviado olhando cartas sarracenas pintadas com imagens do amor e da morte e da loucura; e, em seu justilho sem mangas e chapéu ornado de joias e cachos em forma de acantos, Grifonetto Baglioni, que assassinou Astorre com sua noiva, e Simonetto com seu pajem, e cuja beleza era tal que, quando jazia moribundo na piazza amarela da Perugia, aqueles que o odiavam em vida nada podiam fazer senão chorar, e Atalanta, que o amaldiçoara, acabou por abençoá-lo.", "h": 0}, {"i": 961, "c": 13, "ct": "Capítulo XI", "t": "Havia em todos eles uma fascinação terrível. Ele olhava para eles à noite, e eles perturbavam sua imaginação durante o dia. A Renascença conhecera modos estranhos de envenenamento – envenenamento com elmo e tocha acesa, com luva bordada e leque de pedras cravejadas, com pingente dourado e corrente de âmbar aromático. Dorian Gray havia sido envenenado por um livro. Havia momentos em que ele considerava o mal simplesmente como um modo pelo qual podia realizar sua concepção do belo.", "h": 0}, {"i": 962, "c": 14, "ct": "Capítulo XII", "t": "Capítulo XII", "h": 1}, {"i": 963, "c": 14, "ct": "Capítulo XII", "t": "Foi no dia nove de novembro, véspera de seu aniversário de trinta e oito anos, como ele muitas vezes se lembraria depois.", "h": 0}, {"i": 964, "c": 14, "ct": "Capítulo XII", "t": "Voltava a pé para casa, por volta das onze da noite, vindo da casa de lorde Henry, onde fora jantar, e estava coberto de peles pesadas, pois fazia uma noite fria e nebulosa. Na esquina da Grosvenor Square com South Audley Street, um homem passou por ele em meio ao nevoeiro, caminhando muito depressa, e com o colarinho de seu sobretudo cinza erguido. Levava uma valise. Dorian o reconheceu. Era Basil Hallward. Teve uma estranha sensação de medo, que não soube explicar. Não fez sinal de havê-lo reconhecido, e seguiu em frente, rapidamente, em direção à própria casa.", "h": 0}, {"i": 965, "c": 14, "ct": "Capítulo XII", "t": "Porém Hallward o viu. Dorian ouviu quando ele parou na calçada, e depois correu atrás dele. No momento seguinte, a mão dele estava em seu braço.", "h": 0}, {"i": 966, "c": 14, "ct": "Capítulo XII", "t": "– Dorian! Que sorte extraordinária! Esperei-o na biblioteca desde as nove. Finalmente tive pena do seu criado cansado, e disse que ele podia ir se deitar, e que me acompanhasse até a porta. Parto para Paris no trem da meia-noite, e queria muito encontrá-lo antes de ir. Achei mesmo que era você, ou alguém com o seu casaco de pele, quando você passou. Mas não tinha certeza. Você não me reconheceu?", "h": 0}, {"i": 967, "c": 14, "ct": "Capítulo XII", "t": "– Nesse nevoeiro, meu querido Basil? Ora, não reconheci nem a Grosvenor Square. Acho que minha casa fica por aqui, mas não tenho lá muita certeza disso. Sinto muito que você esteja de partida, pois não nos vemos há séculos. Mas imagino que você vá voltar logo, não?", "h": 0}, {"i": 968, "c": 14, "ct": "Capítulo XII", "t": "– Não: ficarei fora da Inglaterra por seis meses. Pretendo alugar um estúdio em Paris, e vou me trancar até terminar um grande quadro que tenho em mente fazer. Mas não era sobre mim que eu queria falar. Eis a sua porta. Deixe-me entrar por um momento. Tenho uma coisa para lhe contar.", "h": 0}, {"i": 969, "c": 14, "ct": "Capítulo XII", "t": "– Seria um prazer. Mas você não vai perder o trem? – disse Dorian Gray, languidamente, ao subir os degraus da entrada e abrir a porta com sua chave.", "h": 0}, {"i": 970, "c": 14, "ct": "Capítulo XII", "t": "A luz do lampião conseguiu atravessar a neblina, e Hallward olhou no relógio. – Tenho um bocado de tempo – ele respondeu. – O trem só sai meia-noite e quinze, e agora ainda são onze. Na verdade, eu estava indo ao clube procurá-lo quando o encontrei. Você sabe, não perderei tempo com bagagem, pois já despachei todas as minhas coisas pesadas. Só tenho esta valise e chego facilmente à estação Victoria em vinte minutos.", "h": 0}, {"i": 971, "c": 14, "ct": "Capítulo XII", "t": "Dorian olhou para ele e sorriu. – Um pintor tão elegante, viajando só com isso! Uma valise e um sobretudo! Entre, ou o nevoeiro entrará na casa. E peço que não me conte nada sério. Nada é sério hoje em dia. Ou, pelo menos, não deveria ser.", "h": 0}, {"i": 972, "c": 14, "ct": "Capítulo XII", "t": "Hallward balançou a cabeça ao entrar e seguiu Dorian até a biblioteca. O fogo estava alto na lenha flamejante da grande lareira aberta. Os lampiões estavam acesos, e um armário de bebidas holandês de prata estava aberto, com alguns sifões de água com gás e grandes copos de cristal lavrado sobre uma mesinha de marchetaria.", "h": 0}, {"i": 973, "c": 14, "ct": "Capítulo XII", "t": "– Como você pode ver, o seu criado me deixou bastante à vontade, Dorian. Ele me deu tudo o que eu queria, inclusive os seus melhores cigarros de filtro dourado. Ele é uma criatura muitíssimo hospitaleira. Gosto muito mais dele do que do francês que você tinha antes. O que aconteceu com o francês, aliás?", "h": 0}, {"i": 974, "c": 14, "ct": "Capítulo XII", "t": "Dorian deu de ombros. – Imagino que ele tenha se casado com a empregada de lady Radley e a levou para trabalhar em Paris como modista inglesa. Ouvi dizer que a anglomanie está em alta por lá agora. Não lhe parece uma tolice dos franceses? Mas – devo dizer – ele era um bom empregado. Jamais gostei dele, mas nunca tive do que reclamar. Muitas vezes pensamos coisas bem absurdas. Ele era realmente muito dedicado a mim, e me pareceu muito triste ao ir embora. Você quer outro conhaque com água gaseificada? Ou prefere vinho branco com água seltzer? Eu sempre quero um vinho com seltzer. Deve estar na outra sala.", "h": 0}, {"i": 975, "c": 14, "ct": "Capítulo XII", "t": "– Obrigado, não quero beber mais nada – disse o pintor, tirando o chapéu e o sobretudo e depondo-os sobre a valise que deixara no canto.", "h": 0}, {"i": 976, "c": 14, "ct": "Capítulo XII", "t": "– E agora, meu caro colega, quero lhe falar seriamente. Não faça essa cara. Você torna as coisas mais difíceis para mim.", "h": 0}, {"i": 977, "c": 14, "ct": "Capítulo XII", "t": "– Do que se trata? – exclamou Dorian, a seu modo petulante, atirando-se no sofá. – Espero que não seja nada sobre mim. Estou cansado de mim mesmo por hoje. Eu gostaria de ser outra pessoa.", "h": 0}, {"i": 978, "c": 14, "ct": "Capítulo XII", "t": "– É claro que é sobre você – respondeu Hallward, com sua voz grave, profunda –, e eu preciso falar. Só tomarei meia hora sua.", "h": 0}, {"i": 979, "c": 14, "ct": "Capítulo XII", "t": "Dorian suspirou e acendeu um cigarro. – Meia hora! – ele murmurou.", "h": 0}, {"i": 980, "c": 14, "ct": "Capítulo XII", "t": "– Não é pedir muito, Dorian, e estou falando exclusivamente pelo seu bem. Acho que é justo que você saiba que andam dizendo as coisas mais pavorosas sobre você em Londres.", "h": 0}, {"i": 981, "c": 14, "ct": "Capítulo XII", "t": "– Não quero saber nada sobre isso. Adoro escândalos de outras pessoas, mas escândalos comigo não me interessam. Não têm mais o fascínio da novidade.", "h": 0}, {"i": 982, "c": 14, "ct": "Capítulo XII", "t": "– Pois deveriam ser do seu interesse, Dorian. Todo cavalheiro deve se interessar pela boa reputação. Você não vai querer ser associado a algo vil e degradado. É claro que você tem sua posição, e sua riqueza, e todas essas coisas. Mas a posição e a riqueza não são tudo. Saiba que eu não acredito nesses rumores. Ao menos, não consigo acreditar neles agora que estou olhando para você. O pecado é uma coisa que fica escrita no semblante de um homem. É impossível esconder. As pessoas às vezes comentam sobre vícios secretos. Não existe esse tipo de coisa. Se um homem condenado tem um vício, ele se mostra nas linhas da boca, nas pálpebras caídas, até no formato das mãos. Alguém – não vou dizer quem, mas você o conhece – veio me procurar no ano passado para encomendar um retrato. Nunca tinha visto o sujeito antes e nunca tinha ouvido sequer falar dele na época, embora tenha ouvido até demais desde então. Ele ofereceu um valor extravagante. Recusei. Havia algo no formato de seus dedos que odiei. Hoje sei que estava certo sobre o que imaginei a respeito dele. A vida dele é um horror. Mas você, Dorian, com esse seu rosto puro, brilhante, inocente, e a sua juventude maravilhosamente impassível – não consigo acreditar no que dizem contra você. E, no entanto, temos nos visto raramente, e agora você não me visita mais no estúdio, e longe de você, quando ouço essas coisas horríveis que as pessoas sussurram a seu respeito, não sei o que dizer. Por que motivo, Dorian, um homem como o duque de Berwick sai do recinto do clube quando você entra? Por que tantos cavalheiros em Londres deixaram de vir à sua casa e de convidá-lo para ir às deles? Você costumava ser amigo de lorde Staveley. Encontrei-o semana passada em um jantar. O seu nome surgiu por acaso na conversa, sobre as estatuetas que você emprestou para a exposição na Dudley. Staveley franziu os lábios e disse que você podia até ter bom gosto artístico, mas que era um homem que nenhuma moça de mente sã deveria jamais conhecer, e em cuja companhia nenhuma mulher decente deveria sequer ficar sob o mesmo teto. Lembrei-o de que eu era seu amigo e perguntei o que ele queria dizer com aquilo. Ele me contou. Ele me disse na frente de todo mundo. Foi horrível! Por que a sua amizade é tão fatal para os rapazes? Houve o coitado daquele menino da guarda que cometeu suicídio. Você era grande amigo dele. Houve sir Henry Ashlon, que precisou ir embora da Inglaterra, com nome sujo. Você e ele eram inseparáveis. E quanto a Adrian Singleton, que teve um fim terrível? E o filho único de lorde Kent, e sua carreira? Ontem encontrei o pai na St. James’s Street. Estava alquebrado de vergonha e tristeza. E o jovem duque de Perth? Que tipo de vida ele ainda tem pela frente? Que cavalheiro iria querer se associar a ele?", "h": 0}, {"i": 983, "c": 14, "ct": "Capítulo XII", "t": "– Pare, Basil. Você está falando de coisas sobre as quais não sabe nada – disse Dorian Gray, contendo-se, e com um tom de desdém infinito. – Você me pergunta por que Berwick sai da sala quando eu entro. É porque eu sei tudo sobre a vida dele, não porque ele saiba algo sobre a minha. Com o sangue que ele tem nas veias, como a ficha dele poderia ser limpa? Você me pergunta sobre Henry Ashton e o jovem Perth. Acaso fui eu que ensinei a um os vícios e ao outro a devassidão? Se o filho bobo de Kent tirou a mulher da sarjeta – o que eu tenho com isso? Se Adrian Singleton escreve o nome do amigo em uma conta, sou acaso seu tutor? Sei que as pessoas comentam na Inglaterra. A classe média externa seus preconceitos morais durante seus jantares grotescos e sussurra sobre aquilo que chama de dissipações de seus superiores, para fingir pertencer à alta sociedade, como se fossem íntimas das pessoas de quem falam mal. Neste país, basta um homem ter distinção e cérebro que a língua do vulgo se agita contra ele. E que tipo de vida essas pessoas, que posam de moralistas, levam? Meu caro colega, você se esquece de que estamos na terra natal da hipocrisia.", "h": 0}, {"i": 984, "c": 14, "ct": "Capítulo XII", "t": "– Dorian – exclamou Hallward –, não é essa a questão. A Inglaterra já é ruim o bastante, eu sei, e a sociedade inglesa está toda errada. Eis o motivo por que eu quero que você fique bem. Você não anda bem. É justo julgar um homem pelo efeito que ele tem sobre seus amigos. Você parece ter perdido toda noção de honra, de bondade, de pureza. Você impregnou a todos eles com uma loucura pelo prazer. Eles foram às profundezas. Você os levou para lá. Sim: você os levou, e no entanto você consegue sorrir, como está sorrindo agora. E ainda há algo pior por trás de tudo. Sei que você e Harry são inseparáveis. Só por esse motivo, ainda que não houvesse outros, você deveria ter poupado o nome da irmã dele.", "h": 0}, {"i": 985, "c": 14, "ct": "Capítulo XII", "t": "– Tome cuidado, Basil. Você está indo longe demais.", "h": 0}, {"i": 986, "c": 14, "ct": "Capítulo XII", "t": "– Eu preciso falar e você precisa me ouvir. Agora você vai me ouvir. Quando você conheceu lady Gwendolen, nenhuma suspeita de escândalo jamais havia passado perto dela. Hoje existe alguma mulher decente em Londres que passearia de carruagem com ela no parque? Ora, nem os próprios filhos podem mais morar com ela. E ainda há outras histórias de que você foi visto se esgueirando de madrugada, saindo de estabelecimentos pavorosos, furtivamente disfarçado, e entrando nos antros mais sórdidos de Londres. Isso é verdade? Será possível que seja verdade? Quando ouvi da primeira vez, dei risada. Quando agora falam nisso, eu estremeço. E quanto à sua casa de campo, e a vida que se leva por lá? Dorian, você não sabe o que as pessoas dizem a seu respeito. Não vou lhe contar porque não quero passar sermão. Lembro-me perfeitamente de o Harry dizer um dia que todo homem que quer se passar por padre sempre começa dizendo isso e, em seguida, quebra a promessa. Na verdade, quero lhe passar um sermão. Quero que você leve uma vida que faça todo mundo respeitá-lo. Quero que você tenha o nome limpo e uma ficha impecável. Quero que você se livre dessas pessoas pavorosas com quem você convive. Não dê de ombros assim. Não seja tão indiferente. Você tem uma influência maravilhosa sobre as pessoas. Que seja para o bem, não para o mal. Dizem que você corrompe a todos de quem se torna íntimo, e que basta você entrar numa casa para que algum tipo de vexame venha em seguida. Não sei se isso é verdade ou não. Como eu poderia saber? Mas é o que dizem de você. E me contaram coisas que parecem impossíveis de duvidar. Lorde Gloucester era um dos meus melhores amigos em Oxford. Ele me mostrou uma carta que a esposa escreveu quando estava morrendo sozinha na villa em Mentone. O seu nome era implicado na mais terrível confissão que eu já li na vida. Eu disse a ele que aquilo era absurdo – que eu o conhecia perfeitamente, e que você seria incapaz de qualquer coisa daquele tipo. Mas será que eu o conheço mesmo? Antes de responder a essa pergunta, eu precisaria ver a sua alma.", "h": 0}, {"i": 987, "c": 14, "ct": "Capítulo XII", "t": "– Ver a minha alma! – murmurou Dorian Gray, levantando-se do sofá e ficando quase branco de medo.", "h": 0}, {"i": 988, "c": 14, "ct": "Capítulo XII", "t": "– Sim – respondeu Hallward, gravemente e com tom de tristeza profunda na voz –, ver a sua alma. Mas apenas Deus pode fazer isso.", "h": 0}, {"i": 989, "c": 14, "ct": "Capítulo XII", "t": "Uma risada amarga de zombaria escapou dos lábios do rapaz. – Agora você a verá com os próprios olhos – ele exclamou, pegando um lampião da mesa. – Venha: é seu trabalho. Por que não deixar que você o veja? Depois, se quiser, pode contar o que viu para todo mundo. Ninguém jamais acreditaria. E, se acreditarem, gostarão ainda mais de mim por isso. Conheço nossa época melhor do que você, embora você fique tediosamente tagarelando tolices a respeito. Venha, estou dizendo. Você já falou demais sobre degradação. Agora você a verá face a face.", "h": 0}, {"i": 990, "c": 14, "ct": "Capítulo XII", "t": "Havia a loucura do orgulho em cada palavra que ele pronunciava. Ele batia o pé no chão à sua maneira insolente de menino. Sentia uma alegria terrível só de pensar que alguém compartilharia seu segredo, e que o homem que pintara o retrato que havia sido a origem de toda a sua vergonha teria de suportar pelo resto da vida o fardo da hedionda lembrança do que fizera.", "h": 0}, {"i": 991, "c": 14, "ct": "Capítulo XII", "t": "– Sim – ele continuou, aproximando-se dele e olhando fixamente em seus olhos austeros, – vou lhe mostrar minha alma. Você verá aquilo que imagina que apenas Deus pode ver.", "h": 0}, {"i": 992, "c": 14, "ct": "Capítulo XII", "t": "Hallward recuou sobressaltado. – Isso é blasfêmia, Dorian! – ele exclamou. – Você não deve dizer essas coisas. São horríveis e não querem dizer nada.", "h": 0}, {"i": 993, "c": 14, "ct": "Capítulo XII", "t": "– Você acha? – ele tornou a rir.", "h": 0}, {"i": 994, "c": 14, "ct": "Capítulo XII", "t": "– Eu tenho certeza. Quanto ao que eu lhe disse hoje, disse-o pelo seu bem. Você sabe que eu sempre fui seu amigo leal.", "h": 0}, {"i": 995, "c": 14, "ct": "Capítulo XII", "t": "– Não me toque. Termine o que você ia dizer.", "h": 0}, {"i": 996, "c": 14, "ct": "Capítulo XII", "t": "Um lampejo de dor franziu o semblante do pintor. Ele parou por um momento e lhe sobreveio uma louca sensação de pena. Afinal, que direito ele tinha de se intrometer na vida de Dorian Gray? Se ele tivesse feito um décimo do que diziam os rumores, como não deveria ter sofrido! Então ele se endireitou, caminhou até a lareira, e ali ficou, olhando a lenha arder com suas cinzas que pareciam neve e seus cernes latejantes de labaredas.", "h": 0}, {"i": 997, "c": 14, "ct": "Capítulo XII", "t": "– Estou esperando, Basil – disse o rapaz, com uma voz ríspida e clara.", "h": 0}, {"i": 998, "c": 14, "ct": "Capítulo XII", "t": "Ele se virou. – O que eu ia dizer é o seguinte – ele exclamou. – Você tem que me dar uma resposta sobre essas acusações horríveis que foram feitas. Se você me disser que elas são absolutamente falsas do início ao fim, vou acreditar em você. Negue-as, Dorian, negue-as! Você não vê o que eu estou passando? Meu Deus, não me diga que você é mau, e corrupto, e vergonhoso.", "h": 0}, {"i": 999, "c": 14, "ct": "Capítulo XII", "t": "Dorian Gray sorriu. Havia um esgar de desdém em seus lábios. – Suba comigo, Basil – ele disse, suavemente. – Tenho um diário da minha vida que nunca sai do quarto onde o escrevo. Vou lhe mostrar, se você subir comigo.", "h": 0}, {"i": 1000, "c": 14, "ct": "Capítulo XII", "t": "– Vou com você, Dorian, se você quiser. Vejo que perdi o trem. Não importa. Posso ir amanhã. Mas não me peça para ler nada esta noite. Só quero uma simples resposta para a minha questão.", "h": 0}, {"i": 1001, "c": 14, "ct": "Capítulo XII", "t": "– A resposta será dada lá em cima. Não posso responder aqui. Você não precisará ler muito.", "h": 0}, {"i": 1002, "c": 15, "ct": "Capítulo XIII", "t": "Capítulo XIII", "h": 1}, {"i": 1003, "c": 15, "ct": "Capítulo XIII", "t": "Ele saiu da sala e começou a subir a escada, Basil Hallward vindo logo atrás. Caminharam devagar, como os homens instintivamente caminham à noite. O lampião lançava sombras fantásticas nas paredes e nos degraus. Um vento passou e fez algumas janelas tremerem.", "h": 0}, {"i": 1004, "c": 15, "ct": "Capítulo XIII", "t": "Quando chegaram no alto, Dorian deixou o lampião no chão e, sacando a chave, abriu a porta. – Você insiste em querer saber, Basil? – ele perguntou em voz baixa.", "h": 0}, {"i": 1005, "c": 15, "ct": "Capítulo XIII", "t": "– Sim.", "h": 0}, {"i": 1006, "c": 15, "ct": "Capítulo XIII", "t": "– Será um prazer – ele respondeu, sorrindo. Então acrescentou, algo bruscamente: – Você é justamente a única pessoa que tem direito de saber tudo a meu respeito. Você teve mais importância na minha vida do que pensa – e, pegando o lampião, abriu a porta e entrou. Uma corrente de ar frio passou por eles, e a chama se tornou por um momento uma labareda alaranjada e sombria. Ele estremeceu. – Feche a porta ao entrar – ele sussurrou, e depôs o lampião sobre a mesa.", "h": 0}, {"i": 1007, "c": 15, "ct": "Capítulo XIII", "t": "Hallward olhou à sua volta, com expressão intrigada. O quarto parecia não ser ocupado havia anos. Uma desbotada tapeçaria flamenga, um quadro coberto por uma cortina, um velho cassone italiano e uma estante de livros praticamente vazia era tudo o que parecia conter, além de uma cadeira e uma mesa. Enquanto Dorian Gray acendia um toco de vela sobre o aparador, ele notou que o lugar estava todo coberto de poeira, e que o tapete estava todo furado. Um camundongo passou correndo por trás do painel da parede. Havia um cheiro úmido de bolor.", "h": 0}, {"i": 1008, "c": 15, "ct": "Capítulo XIII", "t": "– Quer dizer que você acha que apenas Deus pode ver a alma, Basil? Afaste a cortina e você verá a minha.", "h": 0}, {"i": 1009, "c": 15, "ct": "Capítulo XIII", "t": "A voz que falava era fria e cruel.", "h": 0}, {"i": 1010, "c": 15, "ct": "Capítulo XIII", "t": "– Você enlouqueceu, Dorian, ou está interpretando um papel – murmurou Hallward, franzindo o cenho.", "h": 0}, {"i": 1011, "c": 15, "ct": "Capítulo XIII", "t": "– Não vai? Então eu faço isso sozinho – disse o rapaz; e arrancou a cortina da barra e jogou-a no chão.", "h": 0}, {"i": 1012, "c": 15, "ct": "Capítulo XIII", "t": "Uma exclamação de horror irrompeu dos lábios do pintor quando viu na penumbra a face hedionda na tela sorrindo para ele. Havia algo em sua expressão que o encheu de asco e repulsa. Céus! Era ainda o rosto de Dorian Gray que ele tinha diante de si! O horror, fosse o que fosse, não havia estragado inteiramente a maravilhosa beleza. Havia ainda um pouco de ouro nos cabelos finos e um pouco de escarlate na boca sensual. Os olhos inchados conservavam algo de seu adorável azul, as curvas nobres não haviam abandonado totalmente as narinas cinzeladas e o pescoço plástico. Sim, era o próprio Dorian. Mas quem fizera aquilo? Ele julgou reconhecer a própria pincelada, e a moldura era a mesma que encomendara. A ideia era monstruosa, mas ele sentiu medo. Ele pegou o toco de vela aceso e aproximou-o da pintura. No canto esquerdo estava sua assinatura, traçada em longas letras de vermelho-vivo.", "h": 0}, {"i": 1013, "c": 15, "ct": "Capítulo XIII", "t": "Era alguma paródia suja, alguma sátira infame, ignóbil. Ele jamais fizera aquilo. Ainda assim, era o seu quadro. Ele sabia e sentiu como se seu sangue tivesse se transformado, de um momento para o outro, de fogo em gelo imóvel. Seu próprio quadro! O que signficava aquilo? Por que havia se alterado? Ele se virou e olhou para Dorian Gray com olhos doentios. Sua boca contorcida e sua língua seca não pareciam capazes de articular nada. Passou a mão na testa. Estava encharcada de um suor viscoso.", "h": 0}, {"i": 1014, "c": 15, "ct": "Capítulo XIII", "t": "O rapaz estava apoiado ao aparador, observando-o com a estranha expressão que se vê no semblante de quem assiste a uma peça quando um grande artista entra em cena. Não havia nenhuma tristeza genuína, nem tampouco uma verdadeira alegria. Havia simplesmente a paixão do espectador, talvez com uma faísca de triunfo em seus olhos. Tirara a flor da lapela e a estava cheirando, ou fingindo fazê-lo.", "h": 0}, {"i": 1015, "c": 15, "ct": "Capítulo XIII", "t": "– O que significa isso? – exclamou Hallward, enfim. A voz soara estridente e curiosa aos seus próprios ouvidos.", "h": 0}, {"i": 1016, "c": 15, "ct": "Capítulo XIII", "t": "– Anos atrás, quando eu era um garoto – disse Dorian Gray, esmagando a flor com a mão –, você me conheceu, você me lisonjeou e me ensinou a ser vaidoso da minha boa aparência. Um dia, você me apresentou a um amigo seu, que me explicou a maravilha da juventude, e você terminou o retrato que me revelou a maravilha da beleza. Em um momento de loucura, que até hoje não sei se lamento ou não, fiz um pedido, talvez você possa chamar de uma súplica…", "h": 0}, {"i": 1017, "c": 15, "ct": "Capítulo XIII", "t": "– Eu me lembro! Oh, como eu me lembro bem! Não! Isso é impossível. O quarto é úmido. O bolor deve ter passado para a tela. As tintas que usei tinham algum maldito veneno mineral. Estou lhe dizendo que é impossível.", "h": 0}, {"i": 1018, "c": 15, "ct": "Capítulo XIII", "t": "– Ah, o que é impossível? – murmurou o rapaz, aproximando-se da janela e apoiando a testa no frio do vidro embaçado.", "h": 0}, {"i": 1019, "c": 15, "ct": "Capítulo XIII", "t": "– Você me disse que tinha destruído o quadro.", "h": 0}, {"i": 1020, "c": 15, "ct": "Capítulo XIII", "t": "– Eu me enganei. O quadro me destruiu.", "h": 0}, {"i": 1021, "c": 15, "ct": "Capítulo XIII", "t": "– Não acredito que este seja o meu quadro.", "h": 0}, {"i": 1022, "c": 15, "ct": "Capítulo XIII", "t": "– Você não está vendo nele o seu ideal? – disse Dorian, amargamente.", "h": 0}, {"i": 1023, "c": 15, "ct": "Capítulo XIII", "t": "– O meu ideal, como você diz…", "h": 0}, {"i": 1024, "c": 15, "ct": "Capítulo XIII", "t": "– Como você o chamou.", "h": 0}, {"i": 1025, "c": 15, "ct": "Capítulo XIII", "t": "– Não havia nada de mal nele, nada de vergonhoso. Você foi para mim um ideal como jamais encontrarei outro. Este é o semblante de um sátiro.", "h": 0}, {"i": 1026, "c": 15, "ct": "Capítulo XIII", "t": "– É o semblante da minha alma.", "h": 0}, {"i": 1027, "c": 15, "ct": "Capítulo XIII", "t": "– Cristo! O que foi que idolatrei! Ele tem os olhos de um demônio.", "h": 0}, {"i": 1028, "c": 15, "ct": "Capítulo XIII", "t": "– Todos temos dentro de nós um céu e um inferno, Basil – exclamou Dorian, com um gesto de louco desespero.", "h": 0}, {"i": 1029, "c": 15, "ct": "Capítulo XIII", "t": "Hallward virou-se novamente para o retrato e o ficou contemplando. – Meu Deus! Se isso for verdade – ele exclamou –, e isto é o que você fez da sua vida, você deve estar ainda pior do que imaginam aqueles que falam mal de você! – Ele ergueu o lampião outra vez até perto da tela e a examinou. A superfície parecia inalterada, tal como ele a deixara. Aparentemente, a imundície e o horror vinham de dentro. Através de alguma estranha agitação da vida interior, a lepra do pecado lentamente ia devorando a criatura inteira. O apodrecimento de um cadáver em uma sepultura úmida não seria tão pavoroso.", "h": 0}, {"i": 1030, "c": 15, "ct": "Capítulo XIII", "t": "Sua mão estremeceu, e a vela caiu no chão, e ali ficou se derretendo. Ele pôs o pé sobre ela e a apagou. Então se deixou cair na cadeira esquálida que havia junto à mesa e cobriu o rosto com as mãos.", "h": 0}, {"i": 1031, "c": 15, "ct": "Capítulo XIII", "t": "– Por Deus, Dorian, que lição! Que lição terrível! – Não houve resposta, mas ele ouviu o rapaz soluçar junto à janela. – Reze, Dorian, reze – ele murmurou. – Como era aquela oração que nos ensinavam a dizer na infância? “Não nos deixeis cair em tentação. Perdoai os nossos pecados. Livrai-nos do mal.” Vamos rezar juntos. A oração do seu orgulho foi atendida. A oração do seu arrependimento também será. Eu o idolatrei demais. Estou sendo punido por isso. Você se idolatrou demais. Estamos sendo ambos castigados.", "h": 0}, {"i": 1032, "c": 15, "ct": "Capítulo XIII", "t": "Dorian Gray se virou lentamente e olhou para ele com olhos marejados. – É tarde demais, Basil – ele balbuciou.", "h": 0}, {"i": 1033, "c": 15, "ct": "Capítulo XIII", "t": "– Nunca é tarde demais, Dorian. Vamos nos ajoelhar juntos e ver se nos lembramos de alguma oração. Não havia uma passagem que dizia: “Ainda que os vossos pecados sejam como escarlate, ficarão brancos como a neve”?", "h": 0}, {"i": 1034, "c": 15, "ct": "Capítulo XIII", "t": "– Essas palavras não me dizem nada agora.", "h": 0}, {"i": 1035, "c": 15, "ct": "Capítulo XIII", "t": "– Silêncio! Não diga isso. Você já fez mal o bastante na vida. Meu Deus! Você está vendo aquela criatura maldita zombando de nós agora?", "h": 0}, {"i": 1036, "c": 15, "ct": "Capítulo XIII", "t": "Dorian Gray olhou de relance para o quadro e subitamente foi tomado por um ódio incontrolável de Basil Hallward, como que sugerido pela imagem na tela, sussurrado em seu ouvido por aqueles lábios zombeteiros. As loucas paixões de um animal acuado se agitaram dentro dele, e ele odiou o homem sentado à mesa, mais do que na vida inteira odiara qualquer outra coisa. Olhou ensandecido ao redor. Algo cintilou sobre o móvel pintado que tinha diante de si. Seus olhos pararam ali. Ele sabia o que era. Era uma faca que ele mesmo trouxera alguns dias antes para cortar um pedaço de corda e que se esquecera de levar de volta consigo. Lentamente, ele se dirigiu até a faca, e, ao fazê-lo, passou por Hallward. Assim que ficou atrás dele, pegou a faca e se virou. Hallward se moveu na cadeira, como se fosse se levantar. Ele correu até ele e cravou a faca na grande veia detrás da orelha, segurou a cabeça dele contra a mesa e o esfaqueou mais duas vezes.", "h": 0}, {"i": 1037, "c": 15, "ct": "Capítulo XIII", "t": "Houve um gemido abafado e o som horrível de uma pessoa sufocando com o próprio sangue. Três vezes os braços estendidos se moveram convulsivamente, acenando com dedos rígidos no ar. Ele o esfaqueou mais duas vezes, mas o homem não se moveu. Algo começou a gotejar no chão. Ele aguardou um momento, mantendo a cabeça do outro sobre a mesa. Então jogou a faca na mesa e ficou ouvindo.", "h": 0}, {"i": 1038, "c": 15, "ct": "Capítulo XIII", "t": "Ouviu apenas aquelas gotas, gotejando no tapete puído. Abriu a porta e foi até o corredor. A casa estava absolutamente silenciosa. Não havia ninguém por ali. Por alguns segundos, ele ficou apoiado na balaustrada, espiando lá para baixo dentro daquele poço negro de escuridão borbulhante. Então sacou sua chave e voltou para o sótão, trancando-se sozinho por dentro.", "h": 0}, {"i": 1039, "c": 15, "ct": "Capítulo XIII", "t": "O corpo ainda estava sentado na cadeira, apoiado na mesa com a cabeça baixa, e as costas encurvadas, e longos braços fantasmagóricos. Não fosse o corte vermelho no pescoço, e a poça negra coagulada que lentamente aumentava sobre a mesa, seria possível dizer que o sujeito estava apenas dormindo.", "h": 0}, {"i": 1040, "c": 15, "ct": "Capítulo XIII", "t": "Como tudo fora feito depressa! Ele se sentiu estranhamente calmo e, caminhando até a janela, abriu-a, e saiu na varanda. O vento havia dispersado a neblina, e o céu parecia uma monstruosa cauda de pavão, estrelada com miríades de olhos dourados. Ele olhou para a rua e viu o policial fazendo sua ronda e piscando o longo facho de sua lanterna sobre as portas das casas silenciosas. A mancha carmesim de uma carruagem à espreita cintilou na esquina e depois sumiu. Uma mulher com um xale esvoaçante se arrastava lentamente junto aos gradis, cambaleante em seu caminho. De quando em quando, ela parava e olhava para trás. A certa altura, ela começou a cantar com voz rouca. O policial foi até lá e disse algo a ela. Ela foi embora, gargalhando. Um vento fustigante varreu a praça. Os lampiões de gás bruxulearam e ficaram azuis, e as árvores desfolhadas balançaram seus galhos de ferro negro para frente e para trás. Ele estremeceu e recuou, fechando a porta-balcão atrás de si.", "h": 0}, {"i": 1041, "c": 15, "ct": "Capítulo XIII", "t": "Chegando à porta, ele virou a chave, e abriu-a. Nem sequer olhou para o homem assassinado. Sentia que o segredo de tudo era não se dar conta da situação. O amigo que pintara o retrato fatal que causara toda a sua desgraça tinha saído de sua vida. Isso era o bastante.", "h": 0}, {"i": 1042, "c": 15, "ct": "Capítulo XIII", "t": "Então se lembrou do lampião. Tratava-se de um curioso artesanato mourisco, em prata lavrada com arabescos de aço escovado e cravejada de turquesas brutas. Talvez sua ausência fosse notada pelo criado, e perguntas seriam feitas. Ele hesitou por um momento, depois se virou e o tirou da mesa. Não pôde evitar de ver o corpo morto. Como estava imóvel! Que horríveis aquelas mãos brancas e compridas! Parecia um pavoroso boneco de cera.", "h": 0}, {"i": 1043, "c": 15, "ct": "Capítulo XIII", "t": "Depois de trancar a porta atrás de si, ele desceu silenciosamente a escada. A madeira rangia, parecia gritar de dor. Ele parou diversas vezes e esperou. Não: estava tudo em silêncio. Era apenas o som dos próprios passos.", "h": 0}, {"i": 1044, "c": 15, "ct": "Capítulo XIII", "t": "Quando chegou à biblioteca, ele viu a valise e o sobretudo no canto. Precisava escondê-los em algum lugar. Abriu um compartimento secreto embutido no painel de madeira, compartimento onde guardava seus curiosos disfarces, e os guardou ali. Mais tarde, poderia facilmente queimá-los. Depois consultou o relógio. Eram vinte para as duas.", "h": 0}, {"i": 1045, "c": 15, "ct": "Capítulo XIII", "t": "Ele se sentou e começou a pensar. Todos os anos – praticamente todos os meses – homens eram enforcados na Inglaterra pelo que ele fez. Uma loucura assassina estivera no ar. Alguma estrela vermelha se aproximara demais da terra… E, no entanto, que evidências havia contra ele? Basil Hallward havia ido embora de sua casa às onze da noite. Ninguém o vira entrar de novo. A maioria dos empregados estava em Selby Royal. Seu pajem havia se recolhido… Paris! Sim. Basil tinha ido a Paris, e no trem da meia-noite, tal como era sua intenção. Com seus hábitos curiosos e reservados, levaria meses até que surgisse alguma suspeita. Meses! Tudo aquilo poderia ser destruído muito antes disso.", "h": 0}, {"i": 1046, "c": 15, "ct": "Capítulo XIII", "t": "Um súbito pensamento lhe ocorreu. Ele vestiu o casaco de pele e o chapéu e saiu para o salão. Ali parou, escutando os passos lentos e pesados do policial na calçada lá fora, e vendo o lampejo da lanterna refletido na janela. Ele esperou e conteve a respiração.", "h": 0}, {"i": 1047, "c": 15, "ct": "Capítulo XIII", "t": "Momentos depois, ele virou a maçaneta e saiu, fechando delicadamente a porta atrás de si. Então tocou a campainha. Em cerca de cinco minutos, seu pajem apareceu, ainda se vestindo, e parecendo muito sonolento.", "h": 0}, {"i": 1048, "c": 15, "ct": "Capítulo XIII", "t": "– Sinto muito por acordá-lo, Francis – ele disse, entrando em casa –; mas esqueci minha chave. Que horas são?", "h": 0}, {"i": 1049, "c": 15, "ct": "Capítulo XIII", "t": "– Duas e dez, senhor – respondeu o sujeito, olhando para o relógio e piscando.", "h": 0}, {"i": 1050, "c": 15, "ct": "Capítulo XIII", "t": "– Duas e dez? Que horror, como cheguei tarde! Quero que você me acorde amanhã às nove. Tenho um trabalho a fazer.", "h": 0}, {"i": 1051, "c": 15, "ct": "Capítulo XIII", "t": "– Está bem, senhor.", "h": 0}, {"i": 1052, "c": 15, "ct": "Capítulo XIII", "t": "– Alguém veio me visitar essa noite?", "h": 0}, {"i": 1053, "c": 15, "ct": "Capítulo XIII", "t": "– O senhor Hallward, senhor. Ele ficou aqui até as onze horas e depois foi embora para pegar o trem.", "h": 0}, {"i": 1054, "c": 15, "ct": "Capítulo XIII", "t": "– Oh! Que pena que não o encontrei. Ele deixou algum recado?", "h": 0}, {"i": 1055, "c": 15, "ct": "Capítulo XIII", "t": "– Não, senhor, só disse que escreveria para o senhor de Paris, se não o encontrasse no clube.", "h": 0}, {"i": 1056, "c": 15, "ct": "Capítulo XIII", "t": "– Está bem, Francis. Não se esqueça de me acordar amanhã às nove.", "h": 0}, {"i": 1057, "c": 15, "ct": "Capítulo XIII", "t": "– Não se preocupe, senhor.", "h": 0}, {"i": 1058, "c": 15, "ct": "Capítulo XIII", "t": "O sujeito seguiu pelo corredor arrastando as pantufas.", "h": 0}, {"i": 1059, "c": 15, "ct": "Capítulo XIII", "t": "Dorian Gray tirou o chapéu e o casaco, e os deixou sobre a mesa, e entrou na biblioteca. Durante quinze minutos, ele ficou andando de um lado para o outro, mordiscando o lábio e pensando. Então, sacando o Livro Azul da prateleira, começou a folheá-lo. “Alan Campbell, Hertford Street, 152, Mayfair.” Sim; aquele era o homem que ele queria.", "h": 0}, {"i": 1060, "c": 16, "ct": "Capítulo XIV", "t": "Capítulo XIV", "h": 1}, {"i": 1061, "c": 16, "ct": "Capítulo XIV", "t": "Às nove horas da manhã seguinte, o criado entrou com uma xícara de chocolate em uma bandeja e abriu a janela. Dorian dormia pacificamente, deitado no flanco direito, com uma mão embaixo do rosto. Parecia um menino cansado de brincar, ou de estudar.", "h": 0}, {"i": 1062, "c": 16, "ct": "Capítulo XIV", "t": "O criado precisou tocá-lo duas vezes no ombro até ele acordar, e, quando abriu os olhos, um sorriso passageiro se formou em seus lábios, como se estivesse perdido em algum sonho delicioso. No entanto, não tivera sonho algum. A noite inteira não fora perturbada por nenhuma imagem de prazer ou de dor. Era apenas um sorriso juvenil sem nenhum motivo. É um dos principais fascínios da juventude.", "h": 0}, {"i": 1063, "c": 16, "ct": "Capítulo XIV", "t": "Ele se virou e, apoiando-se no cotovelo, começou a bebericar seu chocolate. O sol suave de novembro veio se infiltrar no quarto. O céu estava claro e havia um agradável calor no ar. Era quase uma manhã de maio.", "h": 0}, {"i": 1064, "c": 16, "ct": "Capítulo XIV", "t": "Aos poucos, os acontecimentos da noite anterior se insinuaram com pés silenciosos e sangrentos em seu cérebro e se reconstruíram ali com terrível nitidez. Ele estremeceu ao lembrar tudo o que havia sofrido e, por um momento, o mesmo sentimento curioso de ódio por Basil Hallward, que o levara a matá-lo ao sentar na cadeira, voltou, e ele ficou lívido de paixão. O morto ainda estava sentado ali, também, agora à luz do sol. Que coisa horrível! Tais coisas hediondas eram próprias para a escuridão, não para o dia.", "h": 0}, {"i": 1065, "c": 16, "ct": "Capítulo XIV", "t": "Ele sentiu que, se ficasse se lamentando pelo que havia acontecido, acabaria adoecendo ou enlouqueceria. Havia pecados cujo fascínio residia mais na lembrança do que em cometê-los; estranhos triunfos que gratificavam mais o orgulho que as paixões, e davam ao intelecto uma sensação acelerada de alegria, maior do que qualquer alegria que traziam, ou que jamais poderiam trazer, aos sentidos. Mas aquele não era um desses. Era algo que devia ser afugentado do espírito, drogado com papoulas, estrangulado para que não se estrangulasse a si mesmo.", "h": 0}, {"i": 1066, "c": 16, "ct": "Capítulo XIV", "t": "Depois de meia hora, ele passou a mão na testa e, então, se levantou apressado, e se vestiu com apuro ainda maior que de costume, dedicando um bocado de atenção à escolha da gravata e do alfinete, e trocando mais de uma vez seus anéis. Passou um longo tempo no desjejum, provando diversos pratos, conversando com o pajem sobre novas librés que estava pensando em mandar fazer para os criados em Selby, e verificando a correspondência. Diante de algumas cartas, ele sorriu. Três delas o entediaram. Uma ele releu diversas vezes e depois rasgou com uma breve irritação no semblante. – Que memória medonha têm as mulheres! – como lorde Henry dissera uma vez.", "h": 0}, {"i": 1067, "c": 16, "ct": "Capítulo XIV", "t": "Depois de beber sua xícara de café preto, ele enxugou lentamente os lábios com um guardanapo, fez sinal para o criado esperar e, indo até a mesa, sentou-se e escreveu duas cartas. Uma ele guardou no bolso, a outra, entregou ao criado.", "h": 0}, {"i": 1068, "c": 16, "ct": "Capítulo XIV", "t": "– Leve esta carta à Hertford Street, 152, Francis, e, se o senhor Campbell não estiver na cidade, peça o endereço.", "h": 0}, {"i": 1069, "c": 16, "ct": "Capítulo XIV", "t": "Assim que ficou sozinho, ele acendeu um cigarro e começou a desenhar em um pedaço de papel, a princípio, flores e detalhes arquitetônicos, depois, rostos de pessoas. De repente, reparou que todos os rostos que desenhara tinham uma fantástica semelhança com Basil Hallward. Franziu o cenho e, ficando de pé, foi até a estante de livros e tirou um volume ao acaso. Estava decidido a não pensar no que havia acontecido enquanto não fosse absolutamente necessário.", "h": 0}, {"i": 1070, "c": 16, "ct": "Capítulo XIV", "t": "Quando se deitou no sofá, olhou a folha de rosto do livro. Eram os Esmaltes e camafeus de Gautier, na edição Charpentier em papel japonês, com gravura de Jacquemart. A encadernação era em couro verde, cor de limão, com treliças douradas e romãs pontilhadas. Ganhara de presente de Adrian Singleton. Ao passar as páginas, seus olhos deram com o poema sobre a mão de Lacenaire, a mão fria e amarelada du supplice mal lavée , com sua penugem de pelos ruivos e seus doigts de faune . Ele olhou para seus próprios dedos brancos e afilados, estremecendo um pouco mesmo contra sua vontade, e seguiu folheando o livro, até chegar àquelas adoráveis estrofes sobre Veneza:", "h": 0}, {"i": 1071, "c": 16, "ct": "Capítulo XIV", "t": "Sur une gamme chromatique,", "h": 0}, {"i": 1072, "c": 16, "ct": "Capítulo XIV", "t": "Le sein de perles ruisselant,", "h": 0}, {"i": 1073, "c": 16, "ct": "Capítulo XIV", "t": "La Vénus de l’Adriatique", "h": 0}, {"i": 1074, "c": 16, "ct": "Capítulo XIV", "t": "Sort de l’eau son corps rose et blanc.", "h": 0}, {"i": 1075, "c": 16, "ct": "Capítulo XIV", "t": "Les dômes, sur 1’azur des ondes", "h": 0}, {"i": 1076, "c": 16, "ct": "Capítulo XIV", "t": "Suivant la phrase au pur contour,", "h": 0}, {"i": 1077, "c": 16, "ct": "Capítulo XIV", "t": "S’enflent comme des gorges rondes", "h": 0}, {"i": 1078, "c": 16, "ct": "Capítulo XIV", "t": "Que soulève un soupir d’amour.", "h": 0}, {"i": 1079, "c": 16, "ct": "Capítulo XIV", "t": "L’esquif aborde et me dépose,", "h": 0}, {"i": 1080, "c": 16, "ct": "Capítulo XIV", "t": "Jetant son amarre au pilier,", "h": 0}, {"i": 1081, "c": 16, "ct": "Capítulo XIV", "t": "Devant une façade rose,", "h": 0}, {"i": 1082, "c": 16, "ct": "Capítulo XIV", "t": "Sur le marbre d’un escalier.", "h": 0}, {"i": 1083, "c": 16, "ct": "Capítulo XIV", "t": "[Em escala cromática,", "h": 0}, {"i": 1084, "c": 16, "ct": "Capítulo XIV", "t": "O seio de pérolas gotejante,", "h": 0}, {"i": 1085, "c": 16, "ct": "Capítulo XIV", "t": "A Vênus do Adriático", "h": 0}, {"i": 1086, "c": 16, "ct": "Capítulo XIV", "t": "Sai da água, o corpo rosa e branco.", "h": 0}, {"i": 1087, "c": 16, "ct": "Capítulo XIV", "t": "Os domos, sobre o azul das ondas", "h": 0}, {"i": 1088, "c": 16, "ct": "Capítulo XIV", "t": "Seguindo a frase de puro contorno,", "h": 0}, {"i": 1089, "c": 16, "ct": "Cap
