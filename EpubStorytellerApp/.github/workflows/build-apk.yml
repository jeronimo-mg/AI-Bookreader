name: Build Android APK (Sem Android Studio)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Aceitar licenças do Android SDK pré-instalado no runner
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compilar APK Debug
        run: |
          if [ -f "EpubStorytellerApp/settings.gradle.kts" ]; then
            cd EpubStorytellerApp
          fi
          gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: EpubStoryteller-debug-apk
          path: |
            **/app/build/outputs/apk/debug/app-debug.apk
