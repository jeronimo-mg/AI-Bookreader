<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#121318" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>EPUB Storyteller • Gemini 3.8 Live</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg: #121318;
      --surface: #1e2028;
      --card: #1a1c22;
      --card-active: #282518;
      --gold: #d4af37;
      --blue: #8ab4f8;
      --text: #e3e5ec;
      --text-active: #fff8e7;
      --muted: #9ea4b6;
      --danger: #ff6b6b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: var(--surface);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2c303d;
      gap: 10px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .header-title {
      min-width: 180px;
      flex: 1;
    }
    .header-title h1 {
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }
    .header-title p {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .header-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      align-items: center;
      flex-wrap: wrap;
    }
    .icon-btn {
      background: #282b36;
      color: var(--text);
      border: 1px solid #383c4a;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s;
    }
    .icon-btn:hover { background: #343846; }
    .icon-btn.key-missing { border-color: var(--danger); color: var(--danger); }
    .icon-btn.key-ok { border-color: var(--gold); color: var(--gold); }
    #builtin-book-select {
      width: auto;
      max-width: 210px;
      padding: 6px 8px;
      font-size: 12.5px;
      background: #282b36;
      border: 1px solid #484d5e;
      color: var(--gold);
      font-weight: 600;
    }

    .info-banner {
      background: #1a2436;
      color: #9ac2ff;
      font-size: 12px;
      padding: 6px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .info-banner button {
      background: transparent;
      border: 1px solid #4c7bd9;
      color: #9ac2ff;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }

    .error-banner {
      background: #5a1d1d;
      color: #ffdad6;
      padding: 10px 14px;
      font-size: 13px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    #reader-container {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    .para-card {
      background: var(--card);
      border: 1.5px solid transparent;
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .para-card:hover { background: #22252e; }
    .para-card.heading { background: #191c24; }
    .para-card.active {
      background: var(--card-active);
      border-color: var(--gold);
    }
    .para-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 11px;
      color: #8a90a2;
    }
    .para-card.active .para-meta {
      color: var(--gold);
      font-weight: 600;
    }
    .para-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-status {
      font-size: 10px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.4px;
    }
    .play-here-btn {
      background: #2b2f3c;
      color: var(--gold);
      border: 1px solid #484d5e;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .play-here-btn:hover { background: #383d4d; }
    .para-text {
      font-size: 15.5px;
      line-height: 1.55;
      color: var(--text);
    }
    .para-card.heading .para-text {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }
    .para-card.active .para-text {
      color: var(--text-active);
    }

    footer {
      background: var(--surface);
      border-top: 1px solid #2c303d;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }
    #live-transcript {
      font-size: 12px;
      font-style: italic;
      color: var(--gold);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-height: 16px;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      color: var(--muted);
    }
    .slider-row input[type="range"] {
      flex: 1;
      accent-color: var(--gold);
      cursor: pointer;
    }
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    #conn-status {
      font-size: 11px;
      color: var(--muted);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .transport-btns {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ctrl-btn {
      background: #282b36;
      color: var(--text);
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .ctrl-btn.primary {
      background: var(--gold);
      color: #121318;
      width: 46px;
      height: 46px;
      font-size: 18px;
      font-weight: 700;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid #363a48;
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      max-height: 85dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      padding: 14px 16px;
      border-bottom: 1px solid #2c303d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 16px;
    }
    .modal-body {
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-footer {
      padding: 12px 16px;
      border-top: 1px solid #2c303d;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    input[type="text"], input[type="password"], input[type="number"], select {
      width: 100%;
      background: #14161c;
      border: 1px solid #383c4a;
      color: #fff;
      padding: 9px 11px;
      border-radius: 8px;
      font-size: 13.5px;
    }
    label { font-size: 12.5px; color: var(--muted); font-weight: 600; }
    .btn {
      background: var(--gold);
      color: #121318;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .btn.secondary {
      background: #2b2f3c;
      color: var(--text);
    }
    .list-item {
      background: #252832;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    .list-item.current {
      background: #2d291b;
      color: var(--gold);
      font-weight: 700;
    }
  </style>
</head>
<body>

<header>
  <div class="header-title">
    <h1 id="book-title">O Retrato de Dorian Gray</h1>
    <p id="book-subtitle">Carregando...</p>
  </div>
  <div class="header-actions">
    <select id="builtin-book-select" onchange="selectBuiltinBook(this.value)" title="Alternar livro embutido">
      <option value="0">📗 O Retrato de Dorian Gray</option>
    </select>
    <button class="icon-btn" onclick="openModal('chapters-modal')" title="Capítulos">📑 Capítulos</button>
    <button class="icon-btn" onclick="openModal('search-modal')" title="Buscar ou Pular para Parágrafo">🔍 Ponto</button>
    <label class="icon-btn" title="Abrir outro arquivo .epub do computador">
      📂 Abrir EPUB
      <input type="file" id="epub-file-input" accept=".epub" style="display:none" onchange="handleEpubUpload(event)" />
    </label>
    <button id="api-key-btn" class="icon-btn key-missing" onclick="openModal('settings-modal')">🔑 API & Voz</button>
  </div>
</header>

<div class="info-banner">
  <span id="resume-banner-text">Toque em qualquer parágrafo para definir ou mudar o ponto de leitura (mesmo durante a fala).</span>
  <button onclick="scrollToCurrentParagraph(true)">Ir p/ Atual (<span id="current-para-badge">#1</span>)</button>
</div>

<div id="error-banner" class="error-banner">
  <span id="error-text"></span>
  <button class="icon-btn" onclick="hideError()">Fechar</button>
</div>

<main id="reader-container"></main>

<footer>
  <div id="live-transcript"></div>
  <div class="slider-row">
    <span id="slider-cur-label">1</span>
    <input type="range" id="progress-slider" min="0" max="100" value="0" oninput="onSliderInput(this.value)" onchange="onSliderCommit(this.value)" />
    <span id="slider-max-label">1</span>
  </div>
  <div class="controls-row">
    <div id="conn-status">Pronto</div>
    <div class="transport-btns">
      <button class="ctrl-btn" onclick="skipRelative(-5)" title="Voltar 5 parágrafos">⏪</button>
      <button class="ctrl-btn" onclick="skipRelative(-1)" title="Parágrafo anterior">⏮</button>
      <button id="play-pause-btn" class="ctrl-btn primary" onclick="togglePlayPause()" title="Iniciar/Pausar Narração">▶</button>
      <button class="ctrl-btn" onclick="skipRelative(1)" title="Próximo parágrafo">⏭</button>
      <button class="ctrl-btn" onclick="skipRelative(5)" title="Avançar 5 parágrafos">⏩</button>
    </div>
    <button id="autofollow-btn" class="ctrl-btn" style="color: var(--gold);" onclick="toggleAutoFollow()" title="Auto-rolagem">🎯</button>
  </div>
</footer>

<!-- Modal Capítulos -->
<div id="chapters-modal" class="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <span>Capítulos Detectados</span>
      <button class="icon-btn" onclick="closeModal('chapters-modal')">✕</button>
    </div>
    <div id="chapters-list" class="modal-body"></div>
  </div>
</div>

<!-- Modal Busca / Ponto de Leitura -->
<div id="search-modal" class="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <span>Escolher Ponto Inicial de Leitura</span>
      <button class="icon-btn" onclick="closeModal('search-modal')">✕</button>
    </div>
    <div class="modal-body">
      <label>1. Ir direto para o número do parágrafo:</label>
      <div style="display:flex; gap:8px;">
        <input type="number" id="jump-number-input" min="1" value="1" />
        <button class="btn" onclick="jumpToInputNumber()">Ler Daqui</button>
      </div>
      <label style="margin-top:8px;">2. Ou buscar palavra/frase no livro:</label>
      <input type="text" id="search-query-input" placeholder="Ex: Dorian, Henry, Saunière, Louvre..." oninput="runSearch(this.value)" />
      <div id="search-results" style="display:flex; flex-direction:column; gap:6px; max-height:240px; overflow-y:auto;"></div>
    </div>
  </div>
</div>

<!-- Modal Configurações API Key e Voz -->
<div id="settings-modal" class="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <span>Gemini 3.8 Live • API Key & Voz</span>
      <button class="icon-btn" onclick="closeModal('settings-modal')">✕</button>
    </div>
    <div class="modal-body">
      <label>Chave de API do Gemini (Google AI Studio):</label>
      <input type="password" id="api-key-input" placeholder="AIzaSy..." />
      <label>Voz Storyteller (configurada com pt-BR nativo):</label>
      <select id="voice-select" onchange="document.getElementById('custom-voice-input').value = this.value">
        <option value="Sulafat">Sulafat (Storyteller Calorosa / Envolvente)</option>
        <option value="Charon">Charon (Narrador Grave / Misterioso - Ideal p/ Suspense)</option>
        <option value="Vindemiatrix">Vindemiatrix (Narradora Suave / Contadora de Histórias)</option>
        <option value="Sadaltager">Sadaltager (Narrador Erudito / Clássico)</option>
        <option value="Aoede">Aoede (Narradora Natural / Fluida)</option>
        <option value="Kore">Kore (Narradora Firme / Clara)</option>
        <option value="Puck">Puck (Narrador Expressivo / Vibrante)</option>
      </select>
      <label>ID da Voz (ou cole um ID customizado / Extended Voice Library):</label>
      <input type="text" id="custom-voice-input" value="Sulafat" />
      <button class="btn secondary" onclick="fetchExtendedVoices()">🔄 Buscar Vozes Extras pt-BR na API (/v1beta/voices)</button>
    </div>
    <div class="modal-footer">
      <button class="btn secondary" onclick="closeModal('settings-modal')">Cancelar</button>
      <button class="btn" onclick="saveSettings()">Salvar</button>
    </div>
  </div>
</div>

fácio", "h": 1}, {"i": 31, "c": 2, "ct": "Prefácio", "t": "O artista é o criador de coisas belas.", "h": 0}, {"i": 32, "c": 2, "ct": "Prefácio", "t": "Revelar a arte e esconder o artista é o objetivo da arte.", "h": 0}, {"i": 33, "c": 2, "ct": "Prefácio", "t": "O crítico é aquele capaz de traduzir de outra maneira ou em outro material suas impressões sobre as coisas belas.", "h": 0}, {"i": 34, "c": 2, "ct": "Prefácio", "t": "A forma mais elevada de crítica, assim como a mais baixa, é um tipo de autobiografia.", "h": 0}, {"i": 35, "c": 2, "ct": "Prefácio", "t": "Aqueles que encontram significados feios nas coisas belas são corrompidos sem charme. Isso é um defeito.", "h": 0}, {"i": 36, "c": 2, "ct": "Prefácio", "t": "Aqueles que encontram belos significados nas coisas belas são cultos. Para estes, há esperança.", "h": 0}, {"i": 37, "c": 2, "ct": "Prefácio", "t": "Eles são os escolhidos para os quais as coisas belas significam apenas beleza.", "h": 0}, {"i": 38, "c": 2, "ct": "Prefácio", "t": "Não existe isso de livro moral ou imoral. Há livros bem escritos, ou mal escritos. Isso é tudo.", "h": 0}, {"i": 39, "c": 2, "ct": "Prefácio", "t": "A aversão do século XIX pelo Realismo é a fúria de Caliban ao ver o próprio rosto no espelho.", "h": 0}, {"i": 40, "c": 2, "ct": "Prefácio", "t": "A aversão do século XIX pelo Romantismo é a fúria de Caliban ao não se ver refletido no espelho.", "h": 0}, {"i": 41, "c": 2, "ct": "Prefácio", "t": "A vida moral do homem faz parte do tema-assunto do artista, mas a moralidade da arte consiste no uso perfeito de um meio imperfeito.", "h": 0}, {"i": 42, "c": 2, "ct": "Prefácio", "t": "Nenhum artista quer provar nada. Até coisas verdadeiras podem ser provadas.", "h": 0}, {"i": 43, "c": 2, "ct": "Prefácio", "t": "Nenhum artista tem simpatias éticas. Uma simpatia ética em um artista é um maneirismo de estilo imperdoável.", "h": 0}, {"i": 44, "c": 2, "ct": "Prefácio", "t": "Nenhum artista jamais é mórbido. O artista é capaz de expressar tudo.", "h": 0}, {"i": 45, "c": 2, "ct": "Prefácio", "t": "O pensamento e a linguagem são para o artista instrumentos de uma arte.", "h": 0}, {"i": 46, "c": 2, "ct": "Prefácio", "t": "O vício e a virtude são para o artista materiais de uma arte.", "h": 0}, {"i": 47, "c": 2, "ct": "Prefácio", "t": "Do ponto de vista da forma, o tipo perfeito de todas as artes é a arte do músico. Do ponto de vista do sentimento, o tipo perfeito é o ofício do ator.", "h": 0}, {"i": 48, "c": 2, "ct": "Prefácio", "t": "Toda arte é ao mesmo tempo superfície e símbolo.", "h": 0}, {"i": 49, "c": 2, "ct": "Prefácio", "t": "Aqueles que buscam algo por baixo da superfície fazem-no por conta e risco próprios.", "h": 0}, {"i": 50, "c": 2, "ct": "Prefácio", "t": "É o espectador, e não a vida, que a vida realmente espelha.", "h": 0}, {"i": 51, "c": 2, "ct": "Prefácio", "t": "A diversidade de opiniões sobre uma obra de arte mostra que a obra é nova, complexa e vital.", "h": 0}, {"i": 52, "c": 2, "ct": "Prefácio", "t": "Quando os críticos discordam, o artista está de acordo consigo mesmo.", "h": 0}, {"i": 53, "c": 2, "ct": "Prefácio", "t": "Podemos perdoar um homem por fazer uma coisa útil desde que ele não a admire. A única desculpa para se fazer uma coisa inútil é que a admiremos intensamente.", "h": 0}, {"i": 54, "c": 2, "ct": "Prefácio", "t": "Toda arte é bastante inútil.", "h": 0}, {"i": 55, "c": 2, "ct": "Prefácio", "t": "Oscar Wilde", "h": 0}, {"i": 56, "c": 3, "ct": "Capítulo I", "t": "Capítulo I", "h": 1}, {"i": 57, "c": 3, "ct": "Capítulo I", "t": "O estúdio estava repleto do exuberante odor de rosas, e quando a leve brisa do verão agitou as árvores do jardim, entrou pela porta aberta o forte aroma de lilases, e o perfume mais delicado do róseo espinheiro florido.", "h": 0}, {"i": 58, "c": 3, "ct": "Capítulo I", "t": "Do canto do divã de almofadas persas onde ele estava reclinado, fumando, como de costume, inúmeros cigarros, lorde Henry Wotton podia captar o brilho das flores do laburno, com cheiro e cor de mel, cujos galhos mal pareciam suportar o peso de sua própria beleza flamejante; e, de quando em quando, as fantásticas sombras dos pássaros voando através das longas cortinas de seda iridescente estendidas diante da imensa janela, produzindo uma espécie de efeito japonês momentâneo, e fazendo-o pensar naqueles pálidos pintores de Tóquio com seus semblantes de jade, que, através de uma arte que é necessariamente imóvel, buscam transmitir a sensação de agilidade e movimento. O murmúrio taciturno das abelhas enxameando seu caminho através da relva alta, ou circulando com monótona insistência em torno dos cornos dourados das madressilvas esparsas, parecia tornar a quietude mais opressiva. O rumor surdo de Londres era como o bordão grave de um órgão distante.", "h": 0}, {"i": 59, "c": 3, "ct": "Capítulo I", "t": "No centro do cômodo, preso a um cavalete montado, havia um retrato de corpo inteiro de um rapaz de extraordinária beleza pessoal, e diante do quadro, mantendo uma certa distância, estava sentado o próprio artista, Basil Hallward, cuja súbita desaparição alguns anos antes causara, na ocasião, grande alvoroço, e dera origem a muitas conjecturas estranhas.", "h": 0}, {"i": 60, "c": 3, "ct": "Capítulo I", "t": "Enquanto o pintor olhava para a forma graciosa e aprazível que tão habilidosamente espelhara em sua arte, um sorriso de satisfação percorreu seu semblante e aparentemente ali ficaria para sempre. Mas, subitamente, ele se sobressaltou, e, fechando os olhos, pôs os dedos sobre as pálpebras, como se tentasse aprisionar dentro do cérebro algum sonho curioso do qual temia despertar.", "h": 0}, {"i": 61, "c": 3, "ct": "Capítulo I", "t": "– Este é seu melhor trabalho, Basil, a melhor coisa que você já fez – disse lorde Henry, languidamente. – Você deve sem falta enviá-lo no ano que vem à galeria Grosvenor. A Academia é muito grande e vulgar. Sempre que vou lá, há tanta gente que não consigo ver as pinturas, o que é pavoroso, ou tantas pinturas que não consigo ver as pessoas, o que é ainda pior. A Grosvenor é de fato o “único lugar”.", "h": 0}, {"i": 62, "c": 3, "ct": "Capítulo I", "t": "– Não creio que eu vá enviá-lo a parte alguma – ele respondeu, inclinando a cabeça para trás daquela maneira peculiar que fazia seus amigos rirem dele em Oxford. – Não: não o enviarei a lugar nenhum.", "h": 0}, {"i": 63, "c": 3, "ct": "Capítulo I", "t": "Lorde Henry ergueu as sobrancelhas e olhou para ele espantado através das finas guirlandas de fumaça azul que esvoaçavam em fantasiosas espirais de seu cigarro temperado de ópio.", "h": 0}, {"i": 64, "c": 3, "ct": "Capítulo I", "t": "– A lugar nenhum? Meu caro, por quê? Você tem algum motivo? Vocês, pintores, são sujeitos estranhos. Vocês fazem qualquer coisa no mundo para conquistar uma reputação. Assim que a conquistam, vocês parecem querer jogá-la fora. É uma tolice da sua parte, pois só existe uma coisa no mundo pior do que falarem de nós, que é não falarem de nós. Um retrato desses colocaria você muito acima de todos os jovens da Inglaterra e deixaria os velhos com bastante inveja, se é que os velhos são capazes de alguma emoção.", "h": 0}, {"i": 65, "c": 3, "ct": "Capítulo I", "t": "– Sei que você rirá de mim – ele respondeu –, mas eu realmente não posso expor esse quadro. Pus muito de mim mesmo nele.", "h": 0}, {"i": 66, "c": 3, "ct": "Capítulo I", "t": "Lorde Henry se ergueu no divã e deu risada.", "h": 0}, {"i": 67, "c": 3, "ct": "Capítulo I", "t": "– Sim, eu sabia que você riria de mim; mas é verdade mesmo assim.", "h": 0}, {"i": 68, "c": 3, "ct": "Capítulo I", "t": "– Muito de você nele! Juro, Basil, não sabia que você era tão vaidoso; e eu realmente não vejo nenhuma semelhança entre o seu rosto forte e rude, o seu cabelo preto-carvão, e esse jovem Adônis, que parece feito de marfim e roseiras. Ora, meu caro Basil, ele é um Narciso, e você, bem, é claro que você tem uma expressão intelectual, e tudo mais. Mas a beleza, de verdade, termina onde começa a expressão intelectual. O intelecto em si é uma forma de exagero, e destrói a harmonia de qualquer rosto. No momento em que começamos a pensar, viramos um nariz, ou uma testa, ou algo assim horrendo. Veja os homens bem-sucedidos de qualquer profissão erudita. Como eles são todos perfeitamente hediondos, com exceção, é claro, da Igreja. Mas na Igreja eles não pensam. O bispo continua dizendo aos oitenta o que aprendeu a dizer quando era um garoto de dezoito e, como consequência natural, conserva uma aparência absolutamente deliciosa. O seu jovem amigo misterioso, cujo nome você nunca me disse, mas cujo retrato realmente me fascina, nunca pensa. Tenho plena certeza disso. Ele é uma bela criatura desmiolada, que deveria estar sempre aqui no inverno quando não temos flores para olhar, e sempre no verão quando queremos refrescar nossa inteligência. Não se gabe, Basil; você não se parece nada com ele.", "h": 0}, {"i": 69, "c": 3, "ct": "Capítulo I", "t": "– Você não entendeu, Harry – respondeu o artista. – Claro que não me pareço com ele. Na verdade, eu lamentaria ser parecido com ele. Você dá de ombros? Estou falando a verdade. Existe uma certa fatalidade em toda distinção física e intelectual, um tipo de fatalidade que persegue os passos em falso dos reis ao longo da história. É melhor não ser diferente dos seus companheiros. O feio e o estúpido levam a melhor neste mundo. Eles podem ficar sentados boquiabertos e assistir tudo à vontade. Se não conhecem a vitória, ao menos são poupados da derrota. Vivem bem como todo mundo deveria viver, imperturbáveis, indiferentes, sem inquietações. Eles nem arruínam os outros, nem são arruinados por mãos alheias. A sua posição e a sua riqueza, Harry; o meu cérebro, assim como é – minha arte, o que quer que ela possa valer; a beleza de Dorian Gray – todos sofremos pelo que os deuses nos deram, sofremos terrivelmente.", "h": 0}, {"i": 70, "c": 3, "ct": "Capítulo I", "t": "– Dorian Gray? Esse é o nome dele? – perguntou lorde Henry, atravessando o estúdio em direção a Basil Hallward.", "h": 0}, {"i": 71, "c": 3, "ct": "Capítulo I", "t": "– Sim, é o nome dele. Não era minha intenção lhe contar.", "h": 0}, {"i": 72, "c": 3, "ct": "Capítulo I", "t": "– Mas por que não?", "h": 0}, {"i": 73, "c": 3, "ct": "Capítulo I", "t": "– Oh, eu não saberia explicar. Quando eu gosto imensamente de alguém nunca digo o nome a ninguém. Seria como abrir mão de uma parte da pessoa. Acabei amando o sigilo. Parece-me ser a única coisa capaz de tornar a vida moderna misteriosa ou maravilhosa para nós. A coisa mais corriqueira se torna uma delícia se a escondemos. Quando eu saio da cidade hoje em dia, nunca digo em casa aonde vou. Se eu contasse, perderia todo o prazer. É um costume tolo, admito, mas de alguma forma parece trazer um bocado de romance à vida da pessoa. Imagino que você esteja me achando um tremendo tolo por isso, não?", "h": 0}, {"i": 74, "c": 3, "ct": "Capítulo I", "t": "– De maneira nenhuma – respondeu lorde Henry –, longe disso, meu querido Basil. Você parece se esquecer de que eu sou casado, e a única graça do casamento é tornar uma vida de engodos algo absolutamente necessário para ambas as partes. Nunca sei onde está minha esposa, e minha esposa nunca sabe o que estou fazendo. Quando nos encontramos – eventualmente nos encontramos, quando jantamos juntos, ou vamos visitar o duque – contamos um ao outro as mais absurdas histórias com os semblantes mais sérios. Minha esposa é muito boa nisso – muito melhor, a bem da verdade, do que eu. Ela nunca se confunde com as datas, como eu sempre faço. Mas, quando me pega em alguma mentira, ela nunca faz escândalo. Às vezes eu bem gostaria que ela fizesse; mas ela só ri da minha cara.", "h": 0}, {"i": 75, "c": 3, "ct": "Capítulo I", "t": "– Odeio o modo como você fala da sua vida de casado, Harry – disse Basil Hallward, caminhando até a porta que dava para o jardim. – Acho que você é um marido realmente muito bom, mas tem uma vergonha terrível das próprias virtudes. Você é um sujeito extraordinário. Nunca vem com moralismo e nunca faz nada de errado. O seu cinismo é simplesmente uma pose.", "h": 0}, {"i": 76, "c": 3, "ct": "Capítulo I", "t": "– Ser espontâneo é simplesmente uma pose, e é a pose mais irritante que eu conheço – exclamou lorde Henry, dando risada; e os dois saíram juntos para o jardim e se aconchegaram em um longo banco de bambu que ficava à sombra de um alto loureiro. A luz do sol deslizava sobre as folhas lustrosas. Na relva, as margaridas brancas estavam trêmulas.", "h": 0}, {"i": 77, "c": 3, "ct": "Capítulo I", "t": "Após uma pausa, lorde Henry sacou o relógio.", "h": 0}, {"i": 78, "c": 3, "ct": "Capítulo I", "t": "– Receio que precise ir embora, Basil – ele murmurou –, mas, antes de ir, insisto que você me responda uma pergunta que lhe fiz alguns minutos atrás.", "h": 0}, {"i": 79, "c": 3, "ct": "Capítulo I", "t": "– O que é? – disse o pintor, com os olhos fixos no chão.", "h": 0}, {"i": 80, "c": 3, "ct": "Capítulo I", "t": "– Você sabe muito bem.", "h": 0}, {"i": 81, "c": 3, "ct": "Capítulo I", "t": "– Não sei, Harry.", "h": 0}, {"i": 82, "c": 3, "ct": "Capítulo I", "t": "– Bem, então vou lhe dizer o que é. Quero que você me explique por que não quer expor o retrato de Dorian Gray. Quero saber o verdadeiro motivo.", "h": 0}, {"i": 83, "c": 3, "ct": "Capítulo I", "t": "– Eu já lhe disse o verdadeiro motivo.", "h": 0}, {"i": 84, "c": 3, "ct": "Capítulo I", "t": "– Não, você não disse. Você disse que era porque havia posto muito de si mesmo no quadro. Ora, isso é muito infantil.", "h": 0}, {"i": 85, "c": 3, "ct": "Capítulo I", "t": "– Harry – disse Basil Hallward, olhando bem para os olhos dele –, todo retrato pintado com sentimento é um retrato do artista, não do modelo. O modelo é mero acidente, algo ocasional. Não é o modelo que é revelado pelo pintor; mas antes o pintor quem, na tela colorida, revela-se a si mesmo. O motivo de eu não expor esse retrato é que tenho medo de ter mostrado nele o segredo da minha própria alma.", "h": 0}, {"i": 86, "c": 3, "ct": "Capítulo I", "t": "Lorde Henry deu risada.", "h": 0}, {"i": 87, "c": 3, "ct": "Capítulo I", "t": "– E que segredo é esse? – ele perguntou.", "h": 0}, {"i": 88, "c": 3, "ct": "Capítulo I", "t": "– Vou lhe contar – disse Hallward; mas uma expressão de perplexidade percorreu seu semblante.", "h": 0}, {"i": 89, "c": 3, "ct": "Capítulo I", "t": "– Estou esperando, Basil – continuou o companheiro, olhando para ele.", "h": 0}, {"i": 90, "c": 3, "ct": "Capítulo I", "t": "– Oh, na verdade, não há quase nada para contar, Harry – respondeu o pintor –, e receio que você não vá entender. Talvez nem acreditar.", "h": 0}, {"i": 91, "c": 3, "ct": "Capítulo I", "t": "Lorde Henry sorriu e, abaixando-se, arrancou uma margarida de pétalas róseas da grama e a examinou.", "h": 0}, {"i": 92, "c": 3, "ct": "Capítulo I", "t": "– Tenho toda certeza de que vou entender – ele respondeu, contemplando absorto o disquinho dourado emplumado de branco –, e quanto a acreditar nas coisas, sou capaz de acreditar em qualquer coisa, desde que seja incrível o bastante.", "h": 0}, {"i": 93, "c": 3, "ct": "Capítulo I", "t": "O vento soltou algumas flores das árvores e pesados lilases, com seus cachos estrelados, esvoaçaram no ar lânguido. Um grilo começou a cricrilar junto ao muro, e como um fio azul uma longa e esguia libélula passou flutuando com suas asas de gaze marrom. Lorde Henry sentiu como se pudesse ouvir o coração de Basil Hallward bater e se perguntou sobre o que viria pela frente.", "h": 0}, {"i": 94, "c": 3, "ct": "Capítulo I", "t": "– A história é simplesmente a seguinte – disse o pintor após algum tempo. – Há dois meses fui a uma festa na casa de lady Brandon. Você sabe, nós, artistas pobres, precisamos aparecer na sociedade de quando em quando, só para lembrar ao público que não somos selvagens. De casaca e gravata branca, como você me disse uma vez, qualquer um, até um corretor da bolsa, pode conquistar a reputação de ser civilizado. Bem, quando eu já estava ali havia uns dez minutos, conversando com viúvas ricas e arrumadas demais e acadêmicos entediantes, de repente me dei conta de que havia alguém olhando para mim. Virei o rosto e vi Dorian Gray pela primeira vez. Quando nossos olhares se cruzaram, senti que fiquei pálido. Uma curiosa sensação de terror tomou conta de mim. Eu sabia que estava frente a frente com alguém cuja personalidade era tão fascinante que, se eu me deixasse levar, absorveria toda a minha natureza, toda a minha alma, até minha própria arte. Eu não queria nenhuma influência externa na minha vida. Você sabe, Harry, como eu sou independente por natureza. Sempre fui senhor de mim mesmo; ou, pelo menos, até conhecer Dorian Gray. Depois disso – bem, não sei como lhe explicar. Algo me dizia que eu estava prestes a entrar em uma crise terrível na minha vida. Tive a estranha sensação de que o Destino tinha me reservado alegrias e tristezas extremas. Fiquei com medo e me virei para ir embora. Não foi a consciência que me fez agir assim; foi uma espécie de covardia. Não quero me gabar por ter tentado fugir.", "h": 0}, {"i": 95, "c": 3, "ct": "Capítulo I", "t": "– Consciência e covardia são na verdade a mesma coisa, Basil. Consciência é o nome comercial da firma. Só isso.", "h": 0}, {"i": 96, "c": 3, "ct": "Capítulo I", "t": "– Eu não acredito nisso, Harry, e acho que nem você acredita nisso. No entanto, seja qual for o motivo – talvez até por orgulho –, o fato é que eu tentei chegar até a porta. Lá, evidentemente, deparei com lady Brandon. “Você não vai embora tão cedo, não é, senhor Hallward?”, ela gritou. Sabe aquela voz curiosamente aguda que ela tem?", "h": 0}, {"i": 97, "c": 3, "ct": "Capítulo I", "t": "– Sei; ela é um verdadeiro pavão em tudo, menos na beleza – disse lorde Henry, despedaçando a margarida com os dedos longos e nervosos.", "h": 0}, {"i": 98, "c": 3, "ct": "Capítulo I", "t": "– Não consegui me livrar dela. Ela me apresentou a nobres e condecorados com estrelas e jarreteiras, velhas senhoras com gigantescas tiaras e narizes de papagaio. Falou de mim como seu amigo mais querido. Vira-me uma vez na vida, mas pôs na cabeça que iria me bajular. Imagino que algum quadro meu tivesse feito um grande sucesso na época, ou pelo menos foi comentado nos jornais populares, o que equivale à imortalidade nos padrões do século XIX . De repente, bem ali na minha frente, o rapaz cuja personalidade me instigara de modo tão estranho. Estávamos muito próximos, quase nos tocando. Nossos olhares se cruzaram outra vez. Foi imprudente da minha parte, mas pedi que lady Brandon me apresentasse para ele. Talvez não fosse nem imprudência minha, afinal. Foi simplesmente inevitável. Teríamos nos falado mesmo que não nos apresentassem. Disso tenho certeza. Dorian me contou depois. Ele também sentiu que estávamos destinados a nos conhecer.", "h": 0}, {"i": 99, "c": 3, "ct": "Capítulo I", "t": "– E como lady Brandon descreveu esse maravilhoso rapaz? – perguntou o companheiro. – Sei que ela adora fazer um rápido précis de todos os convidados. Lembro que ela me apresentou a um velho cavalheiro, truculento e rubicundo, todo coberto de medalhas e fitas, e sussurrou no meu ouvido, com uma voz trágica que devia ser perfeitamente audível por todo mundo na sala, os detalhes mais escabrosos a respeito dele. Eu simplesmente saí correndo. Gosto de conhecer as pessoas sozinho. Mas lady Brandon trata seus convidados como um leiloeiro trata seus lotes. Ora ela explica a ponto de entregar todos os defeitos, ora diz tudo menos aquilo que se quer saber da pessoa.", "h": 0}, {"i": 100, "c": 3, "ct": "Capítulo I", "t": "– Pobre lady Brandon! Você está sendo duro com ela, Harry – disse Hallward, rispidamente.", "h": 0}, {"i": 101, "c": 3, "ct": "Capítulo I", "t": "– Meu caro colega, ela tentou abrir um salon , mas só conseguiu abrir um restaurante. Como eu poderia admirá-la? Mas me conte, o que ela disse sobre o senhor Dorian Gray?", "h": 0}, {"i": 102, "c": 3, "ct": "Capítulo I", "t": "– Oh, algo como “um encanto de menino, a coitada da mãe e eu somos absolutamente inseparáveis. Sempre esqueço o que ele faz; receio que não faça nada. Oh, sim, ele toca piano; ou será que é violino, querido senhor Gray?” – nenhum de nós conseguiu conter o riso e ficamos amigos imediatamente.", "h": 0}, {"i": 103, "c": 3, "ct": "Capítulo I", "t": "– O riso não é nada mal para começar e é disparado a melhor coisa para encerrar uma amizade – disse o jovem lorde, arrancando outra margarida.", "h": 0}, {"i": 104, "c": 3, "ct": "Capítulo I", "t": "Hallward balançou a cabeça.", "h": 0}, {"i": 105, "c": 3, "ct": "Capítulo I", "t": "– Você não sabe o que é amizade, Harry – ele murmurou –, nem o que é inimizade, a bem da verdade. Você gosta de todo mundo; ou seja, você é indiferente a todo mundo.", "h": 0}, {"i": 106, "c": 3, "ct": "Capítulo I", "t": "– Mas que injustiça horrível da sua parte! – exclamou lorde Henry, inclinando o chapéu para trás e olhando para as nuvenzinhas que, como meadas emaranhadas de lustrosos fios de seda branca, vagavam através do vazio turquesa do céu de verão. – Sim; uma injustiça horrível da sua parte. Faço enormes distinções entre as pessoas. Escolho os amigos pela aparência, os conhecidos pelo caráter e os inimigos pela inteligência. Todo cuidado é pouco ao escolher os inimigos. Entre meus inimigos, não há nenhum que seja tolo. São todos homens com certa potência intelectual e consequentemente todos têm apreço por mim. Seria muita futilidade minha? Creio que seja bastante fútil da minha parte.", "h": 0}, {"i": 107, "c": 3, "ct": "Capítulo I", "t": "– Eu diria que sim, Harry. Mas, segundo as suas categorias, então, eu deveria ser um mero conhecido seu.", "h": 0}, {"i": 108, "c": 3, "ct": "Capítulo I", "t": "– Meu velho e querido Basil, você é muito mais do que um conhecido.", "h": 0}, {"i": 109, "c": 3, "ct": "Capítulo I", "t": "– E muito menos que um amigo. Talvez uma espécie de irmão?", "h": 0}, {"i": 110, "c": 3, "ct": "Capítulo I", "t": "– Ora, irmãos! Não quero saber de irmãos. Meu irmão mais velho não morre nunca, e os mais novos parece que não sabem fazer outra coisa.", "h": 0}, {"i": 111, "c": 3, "ct": "Capítulo I", "t": "– Harry! – exclamou Hallward, franzindo o cenho.", "h": 0}, {"i": 112, "c": 3, "ct": "Capítulo I", "t": "– Meu caro, não estou falando sério. Mas não consigo deixar de detestar meus parentes. Talvez isso seja porque não suportamos outras pessoas com os mesmos defeitos que nós. Simpatizo muito com a revolta da democracia inglesa contra aquilo que eles chamam de vícios da classe alta. A plebe acha que a embriaguez, a estupidez e a imoralidade deveriam ser seu privilégio exclusivo, e, se algum de nós dá vexame, é como se estivesse invadindo território deles. Quando o pobre do Southwark foi ao Tribunal de Divórcio, a indignação deles foi algo de magnífico. E, no entanto, não creio que dez por cento do proletariado viva idoneamente.", "h": 0}, {"i": 113, "c": 3, "ct": "Capítulo I", "t": "– Não concordo com uma única palavra do que você disse e, mais do que isso, Harry, tenho certeza de que nem você.", "h": 0}, {"i": 114, "c": 3, "ct": "Capítulo I", "t": "Lorde Henry cofiou a ponta de sua barba castanha, e tocou a ponta de sua bota de couro com uma bengala de ébano com castão entalhado.", "h": 0}, {"i": 115, "c": 3, "ct": "Capítulo I", "t": "– Você é tão inglês, Basil! É a segunda vez que você faz esse comentário. Quando alguém expõe uma ideia a um legítimo inglês – sempre algo intempestivo de se fazer –, ele nunca sequer sonha em considerar se a ideia é acertada ou equivocada. A única coisa que ele considera importante é se a própria pessoa acredita no que disse. Ora, o valor de uma ideia não tem nada a ver com a sinceridade da pessoa que a expressa. Na verdade, a probabilidade maior é de que, quanto mais insincera for a pessoa, mais puramente intelectual seja a ideia, pois nesse caso ela não será colorida nem pelos interesses, nem pelos desejos, nem pelos preconceitos da pessoa. Seja como for, não pretendo discutir política, sociologia ou metafísica com você. Gosto mais de gente do que de princípios, e gosto de gente sem princípios mais do que qualquer outra coisa no mundo. Conte-me mais sobre o senhor Dorian Gray. Você o encontra com que frequência?", "h": 0}, {"i": 116, "c": 3, "ct": "Capítulo I", "t": "– Todos os dias. Eu não conseguiria ser feliz se não o visse todo dia. Ele é absolutamente necessário para mim.", "h": 0}, {"i": 117, "c": 3, "ct": "Capítulo I", "t": "– Que coisa extraordinária! Eu achava que você jamais se importaria com nada além da sua arte.", "h": 0}, {"i": 118, "c": 3, "ct": "Capítulo I", "t": "– Ele é toda a minha arte para mim agora – disse o pintor, gravemente. – Às vezes, Harry, acho que só existem duas eras importantes na história do mundo. A primeira é o surgimento de um novo meio para a arte, e a segunda é o surgimento também de uma nova personalidade para a arte. O que a invenção da pintura a óleo foi para os venezianos, o rosto de Antínoo foi para a escultura grega, e o rosto de Dorian Gray será um dia para mim. Não se trata meramente do fato de eu pintá-lo, desenhá-lo e de fazer esboços a partir dele. Claro que tudo isso eu já fiz. Mas ele é muito mais para mim que um modelo ou alguém que posa para mim. Não vou dizer que esteja insatisfeito com o que fiz a partir dele, ou que a beleza dele seja algo que a arte é incapaz de expressar. Não existe nada que a arte não possa expressar, e eu sei que os quadros que fiz, desde que conheci Dorian Gray, são bons, são os melhores que já fiz na vida. Mas de alguma forma curiosa – eu me pergunto se você poderá me entender – a personalidade dele me sugeriu um forma inteiramente nova de arte, um tipo de estilo inteiramente novo. Vejo as coisas de maneira diferente, penso nelas de maneira diferente. Agora sou capaz de recriar a vida de um modo que antes esteve oculto para mim. “Um sonho da forma em dias de pensamento” – quem foi que disse isso mesmo? – Esqueci; mas é o que Dorian Gray tem sido para mim. A mera presença visível desse rapaz – pois ele me parece pouco mais que um rapaz, embora na verdade ele tenha mais de vinte anos –, sua mera presença visível –, ah! Será que você se dá conta de tudo o que isso significa? Inconscientemente, ele define para mim as linhas de uma nova escola, uma escola que terá em si toda a paixão do espírito romântico e toda a perfeição do espírito grego. A harmonia da alma e do corpo – isso já seria muito! Nós, em nossa loucura, separamos as duas coisas e inventamos um realismo vulgar, um idealismo vazio. Harry, se você soubesse o que Dorian Gray é para mim! Você se lembra de uma paisagem que fiz, pela qual Agnew ofereceu um alto preço, mas da qual eu não quis me desfazer? É um dos melhores quadros que eu já fiz. E por quê? Porque enquanto eu estava pintando essa paisagem, Dorian Gray se sentou do meu lado. Alguma influência sutil passou dele para mim, e pela primeira vez na vida vi na simples floresta a maravilha que sempre procurei, sem nunca encontrar.", "h": 0}, {"i": 119, "c": 3, "ct": "Capítulo I", "t": "– Basil, isso é extraordinário! Preciso conhecer Dorian Gray.", "h": 0}, {"i": 120, "c": 3, "ct": "Capítulo I", "t": "Hallward se levantou do banco e ficou caminhando pelo jardim. Algum tempo depois, ele voltou.", "h": 0}, {"i": 121, "c": 3, "ct": "Capítulo I", "t": "– Harry – ele disse –, Dorian Gray é para mim simplesmente um motivo para a arte. Talvez você não veja nada de mais nele. Eu vejo tudo nele. Ele nunca está tão presente no meu trabalho como quando não há nenhuma imagem dele no quadro. Ele é uma sugestão, como eu disse, de um novo estilo. Eu o encontro nas curvas de certas linhas, na graça e na sutileza de certas cores. E isso é tudo.", "h": 0}, {"i": 122, "c": 3, "ct": "Capítulo I", "t": "– Então por que você não quer expor esse retrato? – perguntou lorde Henry.", "h": 0}, {"i": 123, "c": 3, "ct": "Capítulo I", "t": "– Porque, mesmo sem intenção, pus nesse retrato uma certa expressão de toda essa curiosa idolatria artística, sobre a qual, evidentemente, nunca quis falar com ele. Ele não sabe nada a esse respeito. Ele jamais ficará sabendo disso. Mas as outras pessoas talvez percebam; e não quero expor minha alma aos olhos rasos da bisbilhotice alheia. Meu coração jamais será posto no microscópio do mundo. Há muito de mim mesmo nisso, Harry – muito mesmo!", "h": 0}, {"i": 124, "c": 3, "ct": "Capítulo I", "t": "– Os poetas não têm tantos escrúpulos quanto você. Eles sabem muito bem como a paixão é útil para o mercado de livros. Hoje em dia um coração partido enseja muitas edições.", "h": 0}, {"i": 125, "c": 3, "ct": "Capítulo I", "t": "– É por isso que eu odeio os poetas – exclamou Hallward. – Um artista deve criar coisas belas, mas não deve colocar nada de sua própria vida nelas. Vivemos em uma época em que os homens tratam a arte como se fosse uma forma de autobiografia. Perdemos a noção abstrata da beleza. Algum dia mostrarei ao mundo o que isso significa; e por esse motivo ninguém jamais verá meu retrato de Dorian Gray.", "h": 0}, {"i": 126, "c": 3, "ct": "Capítulo I", "t": "– Acho que você está errado, Basil, mas não discutirei consigo. Diga-me, esse Dorian Gray gosta muito de você?", "h": 0}, {"i": 127, "c": 3, "ct": "Capítulo I", "t": "O pintor ponderou por alguns breves momentos.", "h": 0}, {"i": 128, "c": 3, "ct": "Capítulo I", "t": "– Ele gosta de mim – respondeu, após uma pausa –; sei que ele gosta de mim. É claro que eu o bajulo terrivelmente. Sinto um estranho prazer em dizer a ele coisas das quais sei que me arrependerei depois. Em geral, ele é encantador comigo, e ficamos no estúdio e conversamos sobre milhares de coisas. De quando em quando, contudo, ele é horrivelmente rude e parece sentir um prazer genuíno em me magoar. Então, Harry, sinto que entreguei totalmente minha alma a alguém que me trata como se eu fosse uma flor em sua lapela, um toque decorativo para enfeitar sua vaidade, um ornamento para um dia de verão.", "h": 0}, {"i": 129, "c": 3, "ct": "Capítulo I", "t": "– Os dias duram mais no verão, Basil – murmurou lorde Henry. – Talvez você se canse dele antes que ele de você. É uma coisa deprimente de se pensar, mas sem dúvida o gênio dura mais que a beleza. Isso explica o fato de todos nós nos empenharmos excessivamente com nossa própria educação. Na luta selvagem pela existência, queremos algo que perdure, e enchemos nossas cabeças com bagatelas e fatos, na vã esperança de mantermos nossa posição. O homem totalmente bem informado, eis o ideal moderno. E o espírito do homem totalmente bem informado é algo pavoroso. É como um bricabraque, repleto de monstros e pó, com o preço de todas as coisas muito acima do valor apropriado. Acho que você vai se cansar primeiro, seja como for. Um dia você vai olhar para o seu amigo, ele lhe parecerá mal desenhado, ou você não vai mais gostar do tom de sua cor, ou algo assim. Você o condenará amargamente dentro do seu próprio coração e pensará seriamente que ele agiu muito mal consigo. Da próxima vez que ele vier, você estará perfeitamente frio e indiferente. Será uma pena muito grande, pois você ficará alterado. O que você me contou é um verdadeiro romance, um romance de arte, por assim dizer, e a pior coisa de um romance é que acaba com o romantismo da pessoa.", "h": 0}, {"i": 130, "c": 3, "ct": "Capítulo I", "t": "– Harry, não fale assim. Enquanto eu viver, a personalidade de Dorian Gray terá domínio sobre mim. Você não sente as coisas como eu. Você é volúvel demais.", "h": 0}, {"i": 131, "c": 3, "ct": "Capítulo I", "t": "– Ah, meu caro Basil, é exatamente por isso que eu sei como você se sente. Os fiéis só conhecem o lado trivial do amor: os infiéis conhecem as tragédias do amor – e lorde Henry riscou um fósforo em uma delicada caixa de prata e começou a fumar um cigarro com ar apreensivo e satisfeito, como se houvesse resumido o mundo em uma frase. Ouviu-se um farfalhar de pardais pipilantes nas folhas laqueadas de verde da hera, e as sombras azuladas das nuvens se perseguindo sobre a relva como andorinhas. Que agradável estava o jardim! E como eram deliciosas as emoções dos outros! – muito mais do que as ideias dos outros, segundo ele. A nossa própria alma e as paixões dos nossos amigos – era o que havia de fascinante na vida. Ele imaginou com silenciosa diversão o entediante almoço que perdera ficando tanto tempo com Basil Hallward. Se tivesse ido à casa da tia, certamente teria encontrado lorde Goodbody e teriam falado o tempo todo sobre alimentar os pobres e sobre a necessidade dos albergues de caridade. Cada classe pregaria a importância de virtudes que não precisavam praticar em suas próprias vidas. Os ricos falariam sobre o valor da frugalidade, e os ociosos arengariam eloquentemente sobre a dignidade do trabalho. Era fascinante ter escapado de tudo isso! Enquanto pensava na tia, aparentemente teve uma ideia súbita. Virou-se para Hallward e disse:", "h": 0}, {"i": 132, "c": 3, "ct": "Capítulo I", "t": "– Meu caro, acabei de me lembrar.", "h": 0}, {"i": 133, "c": 3, "ct": "Capítulo I", "t": "– O que foi, Harry?", "h": 0}, {"i": 134, "c": 3, "ct": "Capítulo I", "t": "– De onde foi que ouvi o nome Dorian Gray.", "h": 0}, {"i": 135, "c": 3, "ct": "Capítulo I", "t": "– Onde foi? – perguntou Hallward, franzindo um pouco o cenho.", "h": 0}, {"i": 136, "c": 3, "ct": "Capítulo I", "t": "– Não me olhe assim irritado, Basil. Foi na casa da minha tia, lady Agatha. Ela me disse ter conhecido um rapaz maravilhoso, que a ajudaria no East End, e que o nome dele era Dorian Gray. Devo dizer que ela nunca mencionou que ele era bonito. As mulheres não valorizam a boa aparência; pelo menos não as boas senhoras. Ela disse que era um sujeito muito sincero e que era ótima pessoa. Imediatamente imaginei uma criatura de óculos e cabelo escorrido, sardas horrendas, vagando pesadamente por aí com pés enormes. Quem dera eu soubesse que ele era seu amigo.", "h": 0}, {"i": 137, "c": 3, "ct": "Capítulo I", "t": "– Fico muito contente por você não saber, Harry.", "h": 0}, {"i": 138, "c": 3, "ct": "Capítulo I", "t": "– Ora, por quê?", "h": 0}, {"i": 139, "c": 3, "ct": "Capítulo I", "t": "– Não quero que você o conheça.", "h": 0}, {"i": 140, "c": 3, "ct": "Capítulo I", "t": "– Você não quer que eu o conheça?", "h": 0}, {"i": 141, "c": 3, "ct": "Capítulo I", "t": "– Não.", "h": 0}, {"i": 142, "c": 3, "ct": "Capítulo I", "t": "– Senhor, o senhor Dorian Gray está no estúdio – disse o mordomo, chegando ao jardim.", "h": 0}, {"i": 143, "c": 3, "ct": "Capítulo I", "t": "– Você vai me apresentar agora – exclamou lorde Henry, dando uma risada.", "h": 0}, {"i": 144, "c": 3, "ct": "Capítulo I", "t": "O pintor se virou para o criado, que franzia os olhos ao sol.", "h": 0}, {"i": 145, "c": 3, "ct": "Capítulo I", "t": "– Peça para o senhor Gray esperar, Parker. Estarei lá daqui a pouco – o criado fez uma mesura e voltou pelo mesmo caminho.", "h": 0}, {"i": 146, "c": 3, "ct": "Capítulo I", "t": "Então ele olhou para lorde Henry.", "h": 0}, {"i": 147, "c": 3, "ct": "Capítulo I", "t": "– Dorian Gray é meu amigo mais querido – ele disse. – Ele é mesmo uma ótima pessoa. A sua tia tem toda razão. Não o bajule. Não tente influenciá-lo. A sua influência seria má. O mundo é grande, e nele existem pessoas maravilhosas. Não me tire a única pessoa que dá à minha arte o único fascínio que ela tem; minha vida como artista depende dele. Lembre-se, Harry, estou confiando em você – ele disse isso muito lentamente, e as palavras pareciam lhe escapar quase contra sua vontade.", "h": 0}, {"i": 148, "c": 3, "ct": "Capítulo I", "t": "– Quanta bobagem você diz! – disse lorde Henry, sorrindo e, pegando Hallward pelo braço, praticamente o conduziu para dentro de casa.", "h": 0}, {"i": 149, "c": 4, "ct": "Capítulo II", "t": "Capítulo II", "h": 1}, {"i": 150, "c": 4, "ct": "Capítulo II", "t": "Assim que eles entraram, viram Dorian Gray. Ele estava sentado ao piano, de costas para eles, virando páginas de um volume das Cenas da floresta de Schumann . – Você tem que me emprestar essas, Basil – ele exclamou. – Quero aprender a tocá-las. São perfeitamente encantadoras.", "h": 0}, {"i": 151, "c": 4, "ct": "Capítulo II", "t": "– Isso só vai depender de como você posar hoje, Dorian.", "h": 0}, {"i": 152, "c": 4, "ct": "Capítulo II", "t": "– Oh, cansei de posar, não quero um retrato meu em tamanho natural – respondeu o rapaz, rodopiando no banco do piano, de maneira contrariada e petulante. Quando ele se deu conta da presença de lorde Henry, um discreto rubor coloriu suas faces por um momento e ele se sobressaltou. – Perdão, Basil, mas eu não sabia que você tinha companhia.", "h": 0}, {"i": 153, "c": 4, "ct": "Capítulo II", "t": "– Este é lorde Henry Wotton, Dorian, um velho amigo meu dos tempos de Oxford. Eu estava justamente contando para ele que você é um grande modelo, e agora você estragou tudo.", "h": 0}, {"i": 154, "c": 4, "ct": "Capítulo II", "t": "– Você não estragou o meu prazer em conhecê-lo, senhor Gray – disse lorde Henry, dando um passo à frente e estendendo a mão. – Minha tia me falou muito de você. Você é um de seus favoritos e, receio, também uma de suas vítimas.", "h": 0}, {"i": 155, "c": 4, "ct": "Capítulo II", "t": "– No momento, estou na lista negra de lady Agatha – respondeu Dorian, com expressão divertida de penitência. – Prometi que iria com ela a um clube em Whitechapel na terça-feira passada e, na verdade, me esqueci completamente. Iríamos tocar um dueto – três duetos, na verdade. Nem sei o que ela me dirá. Estou até com medo de ir visitá-la.", "h": 0}, {"i": 156, "c": 4, "ct": "Capítulo II", "t": "– Ora, farei as pazes entre vocês. Ela o tem em alta conta. Não creio que tenha importância que você não tenha ido. O público provavelmente pensou que era mesmo um dueto. Quando a tia Agatha senta ao piano, ela faz barulho suficiente para duas pessoas tocando.", "h": 0}, {"i": 157, "c": 4, "ct": "Capítulo II", "t": "– Que coisa horrível para se dizer dela e quão pouco lisonjeiro para mim – respondeu Dorian, dando risada.", "h": 0}, {"i": 158, "c": 4, "ct": "Capítulo II", "t": "Lorde Henry olhou para ele. Sim, ele era sem dúvida maravilhosamente lindo, com lábios vermelhos bem delineados, francos olhos azuis e crespos cabelos louros. Havia algo em seu rosto que fazia que se confiasse nele instantaneamente. Toda a candura da juventude estava ali, assim como toda a pureza apaixonada da juventude. Tinha-se a sensação de que ele se mantivera imaculado pelo mundo. Não era de se estranhar que Basil Hallward o idolatrasse.", "h": 0}, {"i": 159, "c": 4, "ct": "Capítulo II", "t": "– Você é muito encantador para se dedicar à filantropia, senhor Gray, encantador demais mesmo. – Lorde Henry se atirou no divã e abriu a cigarreira.", "h": 0}, {"i": 160, "c": 4, "ct": "Capítulo II", "t": "O pintor estava muito ocupado misturando suas cores e aprontando seus pincéis. Parecia preocupado e, quando ouviu a última frase de lorde Henry, olhou para ele, hesitou por um momento e, então, disse: – Harry, quero terminar hoje este retrato. Você acharia muito rude da minha parte se eu pedisse para você ir embora?", "h": 0}, {"i": 161, "c": 4, "ct": "Capítulo II", "t": "Lorde Henry sorriu e olhou para Dorian Gray. – Devo me retirar, senhor Gray? – ele perguntou.", "h": 0}, {"i": 162, "c": 4, "ct": "Capítulo II", "t": "– Oh, por favor, não vá, lorde Henry. Estou vendo que o Basil hoje está de mau humor; e eu não suporto quando ele fica assim. Além do mais, quero que você me diga por que eu não deveria me dedicar à filantropia.", "h": 0}, {"i": 163, "c": 4, "ct": "Capítulo II", "t": "– Não sei como lhe dizer, senhor Gray. É um assunto tão entediante que seria preciso falar seriamente a respeito. Mas seguramente não irei embora correndo, agora que você me pediu para ficar. Você realmente não se importa, não é, Basil? Você sempre diz que gosta que seus modelos tenham alguém com quem conversar.", "h": 0}, {"i": 164, "c": 4, "ct": "Capítulo II", "t": "Hallward se conteve. – Se o Dorian quiser, claro que você pode ficar. Os caprichos do Dorian são verdadeiras leis para todo mundo, exceto para ele mesmo.", "h": 0}, {"i": 165, "c": 4, "ct": "Capítulo II", "t": "Lorde Henry pegou o chapéu e as luvas. – Você é muito imperioso, Basil, mas receio que precise ir. Prometi encontrar um sujeito no Orleans. Adeus, senhor Gray. Venha visitar-me qualquer dia, à tarde, em Curzon Street. Estou quase sempre em casa às cinco. Escreva avisando quando quiser aparecer. Seria uma pena se houvesse desencontro.", "h": 0}, {"i": 166, "c": 4, "ct": "Capítulo II", "t": "– Basil – exclamou Dorian Gray –, se lorde Henry for embora, eu também vou. Você nunca abre a boca quando está pintando, e é terrivelmente maçante ficar parado em uma plataforma e tentar parecer simpático. Peça para ele ficar. Eu faço questão.", "h": 0}, {"i": 167, "c": 4, "ct": "Capítulo II", "t": "– Fique, Harry, para agradar ao Dorian e por mim também – disse Hallward, fitando absorto sua pintura. – É bem verdade, nunca falo quando estou trabalhando e nunca escuto tampouco, e deve mesmo ser pavorosamente entediante para meus pobres modelos. Eu lhe peço que fique.", "h": 0}, {"i": 168, "c": 4, "ct": "Capítulo II", "t": "– Mas o que eu faço com meu compromisso no Orleans?", "h": 0}, {"i": 169, "c": 4, "ct": "Capítulo II", "t": "O pintor deu risada. – Não creio que isso seja um problema. Sente-se, Harry. E agora, Dorian, suba na plataforma e não fique se mexendo muito, nem preste atenção ao que lorde Henry diz. Ele é uma péssima influência para todos os seus amigos, com uma única exceção, que sou eu mesmo.", "h": 0}, {"i": 170, "c": 4, "ct": "Capítulo II", "t": "Dorian Gray subiu no praticável, com ar de um jovem mártir grego, e fez um muxoxo de descontentamento para lorde Henry, por quem já estava um tanto apaixonado. Ele era muito diferente de Basil. Formavam um delicioso contraste. E tinha uma voz muito bonita. Alguns momentos depois, ele lhe disse: – Você realmente é uma má influência, lorde Henry? Tão má quanto Basil está dizendo?", "h": 0}, {"i": 171, "c": 4, "ct": "Capítulo II", "t": "– Não existem boas influências, senhor Gray. Toda influência é imoral – imoral do ponto de vista científico.", "h": 0}, {"i": 172, "c": 4, "ct": "Capítulo II", "t": "– Por quê?", "h": 0}, {"i": 173, "c": 4, "ct": "Capítulo II", "t": "– Porque influenciar alguém é lhe dar a própria alma. A pessoa não pensa mais seus próprios pensamentos, nem arde das próprias paixões. Suas virtudes deixam de ser reais para ela. Seus pecados, se é que existe tal coisa, são emprestados. Ela se torna um eco da música de alguém, um ator em um papel que não foi escrito para ele. O objetivo da vida é o autodesenvolvimento. Perceber perfeitamente a própria natureza, é para isso que cada um de nós está aqui. As pessoas têm medo de si mesmas hoje em dia. Esqueceram-se do mais alto dos deveres, o dever que a pessoa tem para consigo mesma. É claro que são caridosas. Dão de comer aos famintos e de vestir aos mendigos. Mas suas próprias almas morrem de fome e estão nuas. A coragem debandou da nossa raça. Talvez jamais tenhamos sido corajosos de verdade. O terror da sociedade, que é a base da moral, o terror diante de Deus, que é o segredo da religião, são essas as duas coisas que nos governam. E no entanto…", "h": 0}, {"i": 174, "c": 4, "ct": "Capítulo II", "t": "– Apenas vire a cabeça um pouco para a direita, Dorian, seja um bom menino – disse o pintor, concentrado em seu trabalho, consciente apenas de que surgira no semblante do rapaz uma expressão que ele nunca tinha visto antes.", "h": 0}, {"i": 175, "c": 4, "ct": "Capítulo II", "t": "– E no entanto – continuou lorde Henry, em sua voz baixa, musical, e com um gracioso gesto com a mão tão tipicamente seu, e que ele tinha desde a época de estudante em Eton –, acredito que se a pessoa viver a vida plena e completamente, se der forma a todo sentimento, expressão a todo pensamento, realidade a cada sonho, creio que o mundo ganharia um impulso novo de alegria, que nos faria esquecer todas as enfermidades do medievalismo, e voltaríamos ao ideal helênico – ou algo mais refinado, talvez mais rico que o ideal helênico. Porém, os mais corajosos dentre nós têm medo de si mesmos. A mutilação dos selvagens tem sua trágica sobrevivência na negação de si mesmos que macula as nossas vidas. Somos castigados pelas nossas recusas. Cada impulso que tentamos estrangular é incubado no espírito e nos envenena. O corpo peca uma vez e se esquece de seu pecado, pois a ação é uma forma de purificação. Nada permanece depois além da recordação de um prazer, ou da luxúria de um arrependimento. A única maneira de se livrar de uma tentação é cedendo a ela. Resista à paixão, e a sua alma adoecerá com os anseios pelas coisas a que se proibiu, com o desejo daquilo que suas leis monstruosas tornaram monstruoso e ilegal. Dizem que os grandes acontecimentos do mundo ocorrem no cérebro. É também no cérebro, e apenas no cérebro, que os grandes pecados acontecem. Até mesmo você, senhor Gray, com a rosa vermelha da sua juventude e a rosa branca da sua meninice, deve ter tido paixões que o amedrontaram, pensamentos que o encheram de terror, devaneios e sonhos que a mera lembrança o faria corar de vergonha.", "h": 0}, {"i": 176, "c": 4, "ct": "Capítulo II", "t": "– Pare – exaltou-se Dorian Gray –, pare! Assim você me deixa confuso. Não sei o que dizer. Sei que tenho uma resposta para lhe dar, mas não consigo encontrá-la agora. Não diga mais nada. Deixe-me pensar. Ou melhor, deixe-me não pensar em nada.", "h": 0}, {"i": 177, "c": 4, "ct": "Capítulo II", "t": "Durante quase dez minutos, ele ficou ali, parado, com os lábios entreabertos e um brilho estranho nos olhos. Tinha uma pálida consciência de que influências inteiramente novas agiam agora dentro de si. No entanto, na verdade, tinha a impressão de que advinham de si mesmo. As poucas palavras que o amigo de Basil lhe dissera ao acaso, sem dúvida, contendo dolosos paradoxos, tocaram alguma corda secreta jamais tocada antes dentro de si, mas que ele sentia agora vibrar e latejar em pulsos curiosos.", "h": 0}, {"i": 178, "c": 4, "ct": "Capítulo II", "t": "A música já o havia abalado assim. A música o deixara perturbado muitas vezes. Mas a música não era articulada. Não se tratava de um mundo novo, mas de um novo caos, que a música criava dentro de nós. Palavras! Meras palavras! Como eram terríveis! Como eram claras, vívidas e cruéis! Não se podia escapar delas. E, no entanto, que magia sutil elas continham! Pareciam ser capazes de dar uma forma plástica a coisas informes e possuírem uma música própria, suave como a da gamba ou do alaúde. Meras palavras! Haveria algo tão real quanto as palavras?", "h": 0}, {"i": 179, "c": 4, "ct": "Capítulo II", "t": "Sim; ocorreram coisas em sua infância que ele não havia entendido. Entendia-as agora. A vida de repente ganhava cores flamejantes. Pareceu-lhe estar caminhando dentro do fogo. Por que não se dera conta disso antes?", "h": 0}, {"i": 180, "c": 4, "ct": "Capítulo II", "t": "Com seu sorriso sutil, lorde Henry o observava. Ele soube o momento psicológico preciso de se calar. Sentiu-se intensamente interessado. Ficara perplexo com a súbita impressão que suas palavras haviam causado e, lembrando-se de um livro que lera aos dezesseis anos, um livro que lhe revelara muita coisa que não conhecia, perguntou-se se Dorian Gray não estaria passando por uma experiência semelhante. Ele havia simplesmente disparado uma flecha no ar. Teria acertado o alvo? Que rapaz fascinante!", "h": 0}, {"i": 181, "c": 4, "ct": "Capítulo II", "t": "Hallward pintava absorto, com aquele maravilhoso toque de ousadia, que possuía o verdadeiro refinamento e a perfeita delicadeza que, na arte, em qualquer medida, advêm apenas da força. Ele não se dera conta desse silêncio.", "h": 0}, {"i": 182, "c": 4, "ct": "Capítulo II", "t": "– Basil, estou cansado de posar – reclamou Dorian Gray, subitamente –, preciso sair e sentar no jardim. Aqui está muito abafado.", "h": 0}, {"i": 183, "c": 4, "ct": "Capítulo II", "t": "– Meu caro, sinto muito. Quando estou pintando, não consigo pensar em mais nada. Mas você posou hoje melhor do que nunca. Você ficou perfeitamente imóvel. E consegui captar o efeito que eu queria – dos lábios entreabertos e do brilho nos olhos. Não sei o que o Harry estava lhe dizendo, mas certamente ele fez você ficar com uma expressão maravilhosa. Imagino que ele o estivesse elogiando. Você não deve acreditar em nenhuma palavra do que ele diz.", "h": 0}, {"i": 184, "c": 4, "ct": "Capítulo II", "t": "– Garanto que ele não estava me elogiando. Talvez por isso eu não tenha acreditado em nada do que ele disse.", "h": 0}, {"i": 185, "c": 4, "ct": "Capítulo II", "t": "– Você sabe que acreditou em tudo – disse lorde Henry, olhando para ele com seu olhar sonhador e lânguido. – Também vou ao jardim com você. Está um calor horrível aqui no estúdio. Basil, sirva-nos alguma coisa gelada, algo com morangos.", "h": 0}, {"i": 186, "c": 4, "ct": "Capítulo II", "t": "– Perfeitamente, Harry. É só tocar a sineta e, quando Parker vier, eu digo o que você quer. Preciso terminar esse fundo e me juntarei a vocês depois. Não retenha o Dorian por muito tempo. Nunca me senti melhor para pintar do que hoje. Este quadro será minha obra-prima. Já é minha obra-prima no ponto em que está.", "h": 0}, {"i": 187, "c": 4, "ct": "Capítulo II", "t": "Lorde Henry foi ao jardim e encontrou Dorian Gray com o rosto mergulhado em grandes lilases frescos, febrilmente inspirando seu perfume como se fosse um vinho. Ele se aproximou e pôs a mão em seu ombro. – Você tem toda razão em fazer isso – ele murmurou. – Nada cura melhor a alma do que os sentidos, assim como nada cura melhor os sentidos do que a alma.", "h": 0}, {"i": 188, "c": 4, "ct": "Capítulo II", "t": "O rapaz se assustou e recuou. Estava sem chapéu, e as folhas haviam desmanchado seus cachos rebeldes e embaraçado suas madeixas douradas. Havia uma expressão de medo em seus olhos, como a de alguém que é acordado de repente. Suas narinas benfeitas estremeceram, e algum nervo oculto espantou o escarlate de seus lábios e os deixou trêmulos.", "h": 0}, {"i": 189, "c": 4, "ct": "Capítulo II", "t": "– Sim – continuou lorde Henry –, este é um dos grandes segredos da vida, curar a alma através dos sentidos, e os sentidos por meio da alma. Você é uma criatura maravilhosa. Você sabe mais do que pensa que sabe, assim como sabe menos do que quer vir a saber.", "h": 0}, {"i": 190, "c": 4, "ct": "Capítulo II", "t": "Dorian Gray franziu o cenho, se virou para o outro lado. Não conseguiu evitar de gostar do alto, gracioso sujeito de pé a seu lado. Seu rosto romântico bronzeado e sua expressão exaurida o interessaram. Havia algo em sua voz baixa, lânguida, que era absolutamente fascinante. Até suas mãos frias, brancas, florais, tinham um encanto curioso. Elas se moviam, quando ele falava, como música, e pareciam possuir uma linguagem própria. Mas ele estava com medo e com vergonha desse medo. Por que coubera a um desconhecido revelá-lo para si mesmo? Ele conhecia Basil Hallward fazia meses, mas a amizade entre eles jamais o transformara assim. De repente, surgia alguém em sua vida que parecia ter lhe revelado o mistério da vida. E, no entanto, o que havia para se temer? Ele não era mais um garotinho da escola ou uma garotinha. Era absurdo se apavorar assim.", "h": 0}, {"i": 191, "c": 4, "ct": "Capítulo II", "t": "– Vamos até ali e nos sentemos à sombra – disse lorde Henry. – Parker trouxe as bebidas e, se você ficar mais um minuto nesse sol, acabará se arruinando, e Basil nunca mais poderá pintá-lo. Você realmente não deveria se expor ao sol. Seria indesejável.", "h": 0}, {"i": 192, "c": 4, "ct": "Capítulo II", "t": "– Que importância isso tem? – exclamou Dorian Gray, rindo, sentando-se no fundo do jardim.", "h": 0}, {"i": 193, "c": 4, "ct": "Capítulo II", "t": "– Deveria ser a coisa mais importante para você, senhor Gray.", "h": 0}, {"i": 194, "c": 4, "ct": "Capítulo II", "t": "– Por quê?", "h": 0}, {"i": 195, "c": 4, "ct": "Capítulo II", "t": "– Porque a sua juventude é a coisa mais maravilhosa, e a juventude é a única coisa que vale a pena se ter.", "h": 0}, {"i": 196, "c": 4, "ct": "Capítulo II", "t": "– Eu não acho que seja assim, lorde Henry.", "h": 0}, {"i": 197, "c": 4, "ct": "Capítulo II", "t": "– Não, você não acha isso agora. Algum dia, quando você estiver velho e encarquilhado e feio, quando o pensamento tiver vincado a sua testa com suas rugas, e a paixão lhe tiver crestado os lábios com suas labaredas hediondas, você entenderá, você sentirá isso terrivelmente. Hoje, aonde quer que vá, você fascina a todos. Será sempre assim?… Você tem um rosto maravilhosamente belo, senhor Gray. Não franza o cenho. Você tem mesmo. E a beleza é uma forma de gênio – uma forma ainda mais elevada que o gênio, na verdade, pois não precisa de explicação. É uma das grandes verdades da vida, como a luz do sol, ou a primavera, ou o reflexo em águas escuras daquela concha prateada que chamamos de lua. Ela não pode ser questionada. Ela possui um direito divino à soberania. Ela transforma em príncipes aqueles que a possuem. Você ri? Ah! Depois de perdê-la, você não sorrirá mais assim… As pessoas dizem às vezes que a beleza é apenas superficial. Pode ser. Mas pelo menos não é tão superficial quanto o pensamento. Para mim, a beleza é a maravilha das maravilhas. Apenas as pessoas superficiais não julgam pela aparência. O verdadeiro mistério do mundo é o visível, não o invisível… Sim, senhor Gray, os deuses foram bons com você. Mas aquilo que os deuses dão, rapidamente eles mesmos tomam de volta. Você tem apenas alguns anos para viver realmente, perfeitamente, plenamente. Quando a juventude passa, a beleza vai junto e, de repente, você descobre que não há mais nenhum triunfo pela frente, ou precisa se contentar com míseros triunfos que a lembrança do passado tornará mais amargos que derrotas. A cada mês que passa, ela diminui e traz você para mais perto de algo pavoroso. O tempo tem ciúmes de você e está em guerra contra os seus lírios e rosas. Sua pele ficará amarelada, suas faces encovadas, seus olhos opacos. Você sofrerá horrivelmente… Ah! aproveite a sua juventude enquanto você a tem. Não esbanje o ouro dos seus dias dando ouvidos aos tediosos, tentando remediar o fracasso inevitável, ou desperdiçando a vida com os ignorantes, medianos e vulgares. Esses são os objetivos doentios, os falsos ideais, da nossa época. Viva! Viva a vida maravilhosa que você tem dentro de si! Não deixe passar nada. Esteja sempre em busca de sensações novas. Não tenha medo de nada… Um novo hedonismo – é isso que o nosso século quer. Você pode ser o símbolo visível disso. Com a sua personalidade, não há nada que você não possa fazer. O mundo pertence a você por uma temporada… No momento em que o conheci, vi que você era bastante inconsciente daquilo que você realmente é, daquilo que você realmente pode vir a ser. Foram tantas coisas que me fascinaram em você que senti que devia lhe dizer alguma coisa sobre você mesmo. Pensei na tragédia que seria deixá-lo desperdiçar seu tempo. Pois a sua juventude durará pouco tempo – pouquíssimo tempo. As flores comuns fenecem, mas voltam a florir. O laburno estará tão amarelo no próximo junho quanto está agora. Dentro de um mês, haverá estrelas roxas nas clemátis e, ano após ano, a noite verde de suas folhas conservará a púrpura de suas estrelas. Porém jamais teremos de volta a nossa juventude. O pulso de alegria que bate dentro de nós aos vinte fica preguiçoso. Nossos membros fraquejam, nossos sentidos apodrecem. Degeneramos em marionetes hediondas, assombrados pela lembrança das paixões das quais tivemos medo demais, e das deliciosas tentações às quais não tivemos coragem de ceder. Juventude! Juventude! Não existe absolutamente nada no mundo além da juventude!", "h": 0}, {"i": 198, "c": 4, "ct": "Capítulo II", "t": "Dorian Gray ouviu, de olhos arregalados e abismado. O ramo de lilás caiu de sua mão sobre o cascalho. Um zangão veio e zumbiu em volta por um momento. Depois começou a escalar o globo estrelado das minúsculas flores. Ele ficou observando aquilo que o estranho interesse pelas coisas triviais que tentamos criar produz quando coisas muito importantes nos apavoram, ou quando somos agitados por uma nova emoção para a qual não conseguimos encontrar expressão, ou quando algum pensamento que nos aterroriza subitamente arrebata o nosso cérebro e nos obriga a ceder. Algum tempo depois o mamangá saiu voando. Ele viu o zangão lentamente entrar na trompa manchada de uma ipomeia púrpura. A flor estremeceu e depois balançou delicadamente..", "h": 0}, {"i": 199, "c": 4, "ct": "Capítulo II", "t": "De repente o pintor apareceu na porta do estúdio, e fez sinais em staccato para que eles entrassem. Eles se entreolharam e sorriram.", "h": 0}, {"i": 200, "c": 4, "ct": "Capítulo II", "t": "– Já estou esperando – ele exclamou. – Entrem. A luz está praticamente perfeita, e vocês podem trazer as bebidas.", "h": 0}, {"i": 201, "c": 4, "ct": "Capítulo II", "t": "Eles se levantaram e seguiram juntos pelo caminho. Duas borboletas verdes e brancas passaram por eles, e na pereira do canto do jardim um tordo começou a cantar.", "h": 0}, {"i": 202, "c": 4, "ct": "Capítulo II", "t": "– Você ficou contente de me conhecer, senhor Gray – disse lorde Henry, olhando para ele.", "h": 0}, {"i": 203, "c": 4, "ct": "Capítulo II", "t": "– Sim, agora estou. Mas me pergunto: será sempre assim?", "h": 0}, {"i": 204, "c": 4, "ct": "Capítulo II", "t": "– Sempre?! Mas que palavra horrível. Estremeço sempre que dizem. As mulheres adoram usá-la. Elas estragam todo romance tentando fazer com que seja eterno. Essa é outra palavra sem sentido. A única diferença entre um capricho e uma paixão eterna é que o capricho dura um pouco mais.", "h": 0}, {"i": 205, "c": 4, "ct": "Capítulo II", "t": "Quando entravam no estúdio, Dorian Gray pôs a mão no braço de lorde Henry. – Nesse caso, que a nossa amizade seja um capricho – ele murmurou, corando com a própria ousadia, e então subiu na plataforma e retomou sua pose.", "h": 0}, {"i": 206, "c": 4, "ct": "Capítulo II", "t": "Lorde Henry se deixou em uma grande poltrona de vime e observou-o. Os raspões e traços do pincel na tela eram os únicos sons a interromper a quietude, exceto quando, volta e meia, Hallward recuava para olhar o trabalho com certa distância. Nos raios oblíquos infiltrados pela porta aberta, a poeira dançava, dourada. Um forte perfume de rosas parecia pairar sobre tudo.", "h": 0}, {"i": 207, "c": 4, "ct": "Capítulo II", "t": "Quinze minutos depois, Hallward parou de pintar, olhou para Dorian Gray por um bom tempo e depois, por outro bom tempo, para a pintura, mordendo o cabo de um de seus imensos pincéis, franzindo o cenho. – Está pronto – ele exclamou por fim e se abaixou e escreveu seu nome em longas letras vermelhas no canto esquerdo da tela.", "h": 0}, {"i": 208, "c": 4, "ct": "Capítulo II", "t": "Lorde Henry se aproximou e examinou o retrato. Era certamente uma obra de arte maravilhosa e guardava uma maravilhosa semelhança ao mesmo tempo.", "h": 0}, {"i": 209, "c": 4, "ct": "Capítulo II", "t": "– Meu caro, meus calorosos parabéns – ele disse. – É o melhor retrato dos tempos modernos. Senhor Gray, venha, veja a si mesmo.", "h": 0}, {"i": 210, "c": 4, "ct": "Capítulo II", "t": "O rapaz se surpreendeu, como se despertasse de um sonho. – Está mesmo pronto? – ele murmurou, descendo da plataforma.", "h": 0}, {"i": 211, "c": 4, "ct": "Capítulo II", "t": "– Está pronto – disse o pintor. – E você hoje posou esplendidamente. Sou terrivelmente grato.", "h": 0}, {"i": 212, "c": 4, "ct": "Capítulo II", "t": "– Isso se deve inteiramente a mim – interrompeu lorde Henry. – Não é verdade, senhor Gray?", "h": 0}, {"i": 213, "c": 4, "ct": "Capítulo II", "t": "Dorian não disse nada, mas passou apaticamente diante de seu retrato e se virou para ele. Ao vê-lo, recuou, e as maçãs de seu rosto coraram de prazer por um momento. Uma expressão de alegria se formou em seus olhos, como se tivesse se reconhecido pela primeira vez. Ficou ali parado, maravilhado, remotamente consciente de que Hallward estava falando consigo, mas sem entender o sentido das palavras. Ele se deu conta da própria beleza como uma revelação. Nunca tinha sentido isso antes. Os elogios de Basil Hallward sempre lhe soaram meras lisonjas exageradas de amigo. Ouvira-os, dera risada, depois os esquecera. Não haviam influenciado sua natureza. Então viera lorde Henry Wotton com aquele estranho panegírico da juventude e terríveis alertas sobre sua brevidade. Aquilo mexeu com ele na hora, e agora, ao contemplar a sombra de sua própria graça, a plena realidade da descrição atravessou-o com um lampejo. Sim, um dia seu rosto estaria enrugado e encarquilhado, seus olhos, opacos e sem cor, e o encanto de seu corpo, quebrado, desfigurado. O escarlate partiria de seus lábios, e o ouro se furtaria de seus cabelos. A vida que fizera sua alma arruinaria seu corpo. Ele se tornaria pavoroso, hediondo e grosseiro.", "h": 0}, {"i": 214, "c": 4, "ct": "Capítulo II", "t": "Quando pensou nisso, uma pontada aguda de dor penetrou-o como uma faca e fez cada fibra delicada de sua natureza estremecer. Seus olhos ficaram fundos como ametistas e, sobre eles, se formou uma aragem de lágrimas. Sentiu como se uma mão de gelo pousasse em seu coração.", "h": 0}, {"i": 215, "c": 4, "ct": "Capítulo II", "t": "– Você não gostou? – exclamou Hallward enfim, um tanto ressentido com o silêncio do rapaz, sem entender o que significava.", "h": 0}, {"i": 216, "c": 4, "ct": "Capítulo II", "t": "– Claro que ele gostou – disse lorde Henry. – Quem não gostaria? É uma das melhores obras da arte moderna. Pago quanto você quiser por ele. Preciso tê-lo.", "h": 0}, {"i": 217, "c": 4, "ct": "Capítulo II", "t": "– Não pertence a mim, Harry.", "h": 0}, {"i": 218, "c": 4, "ct": "Capítulo II", "t": "– Pertence a quem então?", "h": 0}, {"i": 219, "c": 4, "ct": "Capítulo II", "t": "– Ao Dorian, é claro – respondeu o pintor.", "h": 0}, {"i": 220, "c": 4, "ct": "Capítulo II", "t": "– Ele tem muita sorte.", "h": 0}, {"i": 221, "c": 4, "ct": "Capítulo II", "t": "– Como é triste! – murmurou Dorian Gray, com os olhos fixos no próprio retrato. – Como é triste que eu tenha de envelhecer, ficar horrível e pavoroso. Mas este retrato continuará sempre jovem. Ele jamais envelhecerá além deste dia em particular de junho… Se fosse justamente o contrário! Se fosse eu eternamente jovem, e só o retrato envelhecesse! Por isso – por isso – eu daria tudo! Sim, não há nada no mundo que eu não daria! Eu entregaria minha alma por isso!", "h": 0}, {"i": 222, "c": 4, "ct": "Capítulo II", "t": "– Dificilmente você gostaria de um trato desses, Basil – exclamou lorde Henry, dando risada. – Seria um bocado ruim para o seu trabalho.", "h": 0}, {"i": 223, "c": 4, "ct": "Capítulo II", "t": "– Eu faria fortíssimas objeções, Harry – disse Hallward.", "h": 0}, {"i": 224, "c": 4, "ct": "Capítulo II", "t": "Dorian Gray se virou e olhou para ele. – Eu imagino mesmo que você faria, Basil. Você gosta mais da sua arte do que dos seus amigos. Eu não passo de um estátua de bronze oxidado para você. Ouso dizer que nem isso.", "h": 0}, {"i": 225, "c": 4, "ct": "Capítulo II", "t": "O pintor o encarava perplexo. Não era comum que Dorian falasse assim. O que haveria acontecido? Ele parecia bastante irritado. Seu rosto estava vermelho e suas faces ardiam.", "h": 0}, {"i": 226, "c": 4, "ct": "Capítulo II", "t": "– Sim – ele continuou –, para você, sou menos que o seu Hermes de marfim ou que o seu Fauno de prata. Você gostará deles para sempre. Por quanto tempo você gostará de mim? Até surgir minha primeira ruga, imagino. Sei, agora, que quando se perde a boa aparência, seja quem for, perde-se tudo. O seu quadro me ensinou isso. Lorde Henry Wotton está inteiramente certo. A juventude é a única coisa que vale a pena ter. Quando eu perceber que estou envelhecendo, vou me suicidar.", "h": 0}, {"i": 227, "c"
