que eu chego às nove e digo que preciso estar vestida às oito e meia.", "h": 0}, {"i": 1398, "c": 19, "ct": "Capítulo XVII", "t": "– Mas que absurdo da parte dela! Você deveria lhe dar uma advertência.", "h": 0}, {"i": 1399, "c": 19, "ct": "Capítulo XVII", "t": "– Não ouso fazer isso, senhor Gray. Ora, ela inventa chapéus para mim. Você se lembra do que eu estava usando na festa ao ar livre de lady Hilstone? Não lembra, mas é gentil da sua parte fingir que lembra. Bem, esse chapéu ela fez a partir do nada. Todos os bons chapéus são feitos a partir do nada.", "h": 0}, {"i": 1400, "c": 19, "ct": "Capítulo XVII", "t": "– Como todas as boas reputações, Gladys – interrompeu lorde Henry. – Cada efeito que causamos nos confere um inimigo. Para ser popular, é preciso ser medíocre.", "h": 0}, {"i": 1401, "c": 19, "ct": "Capítulo XVII", "t": "– Não com as mulheres – disse a duquesa, balançando a cabeça –, e as mulheres mandam no mundo. Eu lhe garanto que nós não suportamos a mediocridade. Nós, mulheres, como disse alguém, amamos com os ouvidos, assim como vocês, homens, amam com os olhos, se é que chegam a amar.", "h": 0}, {"i": 1402, "c": 19, "ct": "Capítulo XVII", "t": "– Parece-me que nunca fazemos outra coisa além de amar – murmurou Dorian.", "h": 0}, {"i": 1403, "c": 19, "ct": "Capítulo XVII", "t": "– Ah! Então, senhor Gray, o senhor nunca amou de verdade – respondeu a duquesa, fingindo tristeza.", "h": 0}, {"i": 1404, "c": 19, "ct": "Capítulo XVII", "t": "– Minha querida Gladys! – exclamou lorde Henry. – Como você pode dizer isso? O romance vive da repetição, e a repetição transforma um apetite em uma arte. Além disso, toda vez que alguém se apaixona é como se fosse a única vez que amou na vida. A diferença de objeto não altera a singularidade da paixão. Ela meramente a intensifica. Na vida, na melhor das hipóteses, só temos uma única grande experiência, e o segredo da vida é reproduzir essa experiência com a maior frequência possível.", "h": 0}, {"i": 1405, "c": 19, "ct": "Capítulo XVII", "t": "– Mesmo quando a pessoa sai ferida dessa experiência, Harry? – perguntou a duquesa, após uma pausa.", "h": 0}, {"i": 1406, "c": 19, "ct": "Capítulo XVII", "t": "– Especialmente quando a pessoa saiu ferida – respondeu lorde Henry.", "h": 0}, {"i": 1407, "c": 19, "ct": "Capítulo XVII", "t": "A duquesa se virou e olhou para Dorian Gray com uma expressão curiosa nos olhos. – O que o senhor tem a dizer sobre isso, senhor Gray? – ela perguntou.", "h": 0}, {"i": 1408, "c": 19, "ct": "Capítulo XVII", "t": "Dorian hesitou por um momento. Então jogou a cabeça para trás e deu risada. – Eu sempre concordo com o Harry, duquesa.", "h": 0}, {"i": 1409, "c": 19, "ct": "Capítulo XVII", "t": "– Mesmo quando ele está errado?", "h": 0}, {"i": 1410, "c": 19, "ct": "Capítulo XVII", "t": "– O Harry nunca está errado, duquesa.", "h": 0}, {"i": 1411, "c": 19, "ct": "Capítulo XVII", "t": "– E a filosofia dele deixa o senhor feliz?", "h": 0}, {"i": 1412, "c": 19, "ct": "Capítulo XVII", "t": "– Jamais busquei a felicidade. Quem quer felicidade? Eu sempre busquei o prazer.", "h": 0}, {"i": 1413, "c": 19, "ct": "Capítulo XVII", "t": "– E o senhor encontrou o prazer, senhor Gray?", "h": 0}, {"i": 1414, "c": 19, "ct": "Capítulo XVII", "t": "– Muitas vezes. Até demais.", "h": 0}, {"i": 1415, "c": 19, "ct": "Capítulo XVII", "t": "A duquesa suspirou. – Estou em busca de paz – ela disse –, e, se eu não for me trocar logo, não terei nenhuma esta noite.", "h": 0}, {"i": 1416, "c": 19, "ct": "Capítulo XVII", "t": "– Deixe que eu lhe traga algumas orquídeas, duquesa – exclamou Dorian, pondo-se de pé e caminhando pelo orquidário.", "h": 0}, {"i": 1417, "c": 19, "ct": "Capítulo XVII", "t": "– Você está flertando com ele desavergonhadamente – disse lorde Henry a sua prima. – É melhor você tomar cuidado. Ele é muito fascinante.", "h": 0}, {"i": 1418, "c": 19, "ct": "Capítulo XVII", "t": "– Se ele não fosse, não haveria disputa.", "h": 0}, {"i": 1419, "c": 19, "ct": "Capítulo XVII", "t": "– De grego contra grega, então?", "h": 0}, {"i": 1420, "c": 19, "ct": "Capítulo XVII", "t": "– Estou do lado dos troianos. Eles lutaram por uma mulher.", "h": 0}, {"i": 1421, "c": 19, "ct": "Capítulo XVII", "t": "– Eles foram derrotados.", "h": 0}, {"i": 1422, "c": 19, "ct": "Capítulo XVII", "t": "– Existem coisas piores do que ser capturada – ela respondeu.", "h": 0}, {"i": 1423, "c": 19, "ct": "Capítulo XVII", "t": "– Você está galopando com a rédea solta.", "h": 0}, {"i": 1424, "c": 19, "ct": "Capítulo XVII", "t": "– O ritmo dá vida – foi a riposte .", "h": 0}, {"i": 1425, "c": 19, "ct": "Capítulo XVII", "t": "– Vou anotar isso no meu diário hoje à noite.", "h": 0}, {"i": 1426, "c": 19, "ct": "Capítulo XVII", "t": "– O quê?", "h": 0}, {"i": 1427, "c": 19, "ct": "Capítulo XVII", "t": "– Que criança queimada adora fogo.", "h": 0}, {"i": 1428, "c": 19, "ct": "Capítulo XVII", "t": "– Não fiquei nem chamuscada. Minhas asas estão intactas.", "h": 0}, {"i": 1429, "c": 19, "ct": "Capítulo XVII", "t": "– Você usa suas asas para tudo, menos para voar.", "h": 0}, {"i": 1430, "c": 19, "ct": "Capítulo XVII", "t": "– A coragem passou dos homens para as mulheres. É uma experiência nova para nós.", "h": 0}, {"i": 1431, "c": 19, "ct": "Capítulo XVII", "t": "– Você tem uma rival.", "h": 0}, {"i": 1432, "c": 19, "ct": "Capítulo XVII", "t": "– Quem?", "h": 0}, {"i": 1433, "c": 19, "ct": "Capítulo XVII", "t": "Ele deu risada. – Lady Narborough – ele sussurrou. – Ela o adora demais.", "h": 0}, {"i": 1434, "c": 19, "ct": "Capítulo XVII", "t": "– Você me deixou apreensiva. O apelo à Antiguidade é fatal para nós, românticas.", "h": 0}, {"i": 1435, "c": 19, "ct": "Capítulo XVII", "t": "– Românticas! Vocês usam todos os métodos da ciência.", "h": 0}, {"i": 1436, "c": 19, "ct": "Capítulo XVII", "t": "– Fomos educadas pelos homens.", "h": 0}, {"i": 1437, "c": 19, "ct": "Capítulo XVII", "t": "– Mas não foram explicadas.", "h": 0}, {"i": 1438, "c": 19, "ct": "Capítulo XVII", "t": "– Descreva-nos enquanto sexo – ela o desafiou.", "h": 0}, {"i": 1439, "c": 19, "ct": "Capítulo XVII", "t": "– Esfinges sem segredos.", "h": 0}, {"i": 1440, "c": 19, "ct": "Capítulo XVII", "t": "Ela olhou para ele, sorrindo. – Como o senhor Gray está demorando! – ela disse. – Vamos ajudá-lo. Ainda não contei a ele a cor do meu vestido.", "h": 0}, {"i": 1441, "c": 19, "ct": "Capítulo XVII", "t": "– Ah! Você deveria escolher o vestido de acordo com as flores que ele lhe trouxer, Gladys.", "h": 0}, {"i": 1442, "c": 19, "ct": "Capítulo XVII", "t": "– Isso seria uma rendição prematura.", "h": 0}, {"i": 1443, "c": 19, "ct": "Capítulo XVII", "t": "– A arte romântica começa pelo clímax.", "h": 0}, {"i": 1444, "c": 19, "ct": "Capítulo XVII", "t": "– Preciso conservar a opção pela retirada.", "h": 0}, {"i": 1445, "c": 19, "ct": "Capítulo XVII", "t": "– À maneira dos partos?", "h": 0}, {"i": 1446, "c": 19, "ct": "Capítulo XVII", "t": "– Eles encontraram segurança no deserto. Eu não seria capaz de uma coisa dessas.", "h": 0}, {"i": 1447, "c": 19, "ct": "Capítulo XVII", "t": "– Nem sempre as mulheres têm escolha – ele respondeu, porém, mal havia terminado a frase, quando, do outro lado do orquidário, ouviu-se um gemido abafado, seguido pelo som surdo de uma queda abrupta. Todos se sobressaltaram. A duquesa ficou imóvel de horror. E, com medo nos olhos, lorde Henry correu por entre as folhas das palmeiras até encontrar Dorian Gray deitado de bruços no piso de lajotas, desacordado, como se estivesse morto.", "h": 0}, {"i": 1448, "c": 19, "ct": "Capítulo XVII", "t": "Ele foi levado imediatamente até a sala azul e deitado em um dos sofás. Após algum tempo, ele recobrou a consciência e olhou ao redor com expressão espantada.", "h": 0}, {"i": 1449, "c": 19, "ct": "Capítulo XVII", "t": "– O que aconteceu? – ele perguntou. – Oh! Lembrei. Estou seguro aqui, Harry? – Ele começou a tremer.", "h": 0}, {"i": 1450, "c": 19, "ct": "Capítulo XVII", "t": "– Meu caro Dorian – respondeu lorde Henry –, você só desmaiou. Só isso. Você deve ter se exigido demais. É melhor você nem descer para o jantar. Posso assumir seu lugar.", "h": 0}, {"i": 1451, "c": 19, "ct": "Capítulo XVII", "t": "– Não, eu consigo – ele disse, esforçando-se para ficar de pé. – Prefiro descer. Não posso ficar sozinho.", "h": 0}, {"i": 1452, "c": 19, "ct": "Capítulo XVII", "t": "Ele entrou em seu quarto e trocou de roupa. Havia uma selvagem alegria descontraída em seus modos quando se sentou à mesa, mas de quando em quando um calafrio de terror o atravessava, ao se lembrar de que, colado ao vidro do orquidário, como um lenço branco, vira o rosto de James Vane olhando para ele.", "h": 0}, {"i": 1453, "c": 20, "ct": "Capítulo XVIII", "t": "Capítulo XVIII", "h": 1}, {"i": 1454, "c": 20, "ct": "Capítulo XVIII", "t": "No dia seguinte, ele não saiu de casa e, a bem dizer, passou a maior parte do tempo sozinho, sentindo-se mal, com um medo louco de morrer, e, no entanto, indiferente à vida em geral. A consciência de estar sendo perseguido, encurralado, rastreado, começara a dominá-lo. Se a tapeçaria tremulava a qualquer brisa, ele estremecia. As folhas mortas sopradas contra os vitrais tingidos lembravam-lhe suas próprias resoluções fanadas e seus desbragados remorsos. Quando fechava os olhos, via sempre o rosto do marinheiro espiando pelo vidro embaçado e a mão do horror parecia mais uma vez apertar seu coração.", "h": 0}, {"i": 1455, "c": 20, "ct": "Capítulo XVIII", "t": "Mas talvez fosse apenas sua fantasia, clamando por vingança no meio da noite, engendrando os vultos hediondos do castigo diante de si. A vida real era o caos, mas havia algo terrivelmente lógico na imaginação. Era a imaginação que fazia o remorso seguir de perto os passos do pecado. Era a imaginação que fazia cada crime gestar sua prole disforme. No mundo comum dos fatos, o ímpio não era castigado, nem tampouco o justo recompensado. O sucesso era concedido aos fortes, e o fracasso, imposto aos fracos. Era só isso. Além do mais, se algum desconhecido estivesse rondando a casa, teria sido visto pelos criados ou pelos vigias. Se houvesse pegadas nos canteiros de flores, o jardineiros teriam avisado. Sim: era mera fantasia. O irmão de Sibyl Vane não havia voltado para matá-lo. Tomara o tal navio, rumo a algum mar invernal. Dele, ao menos, ele estava a salvo. Ora, o sujeito não sabia quem ele era, não teria como saber. A máscara da juventude o salvara.", "h": 0}, {"i": 1456, "c": 20, "ct": "Capítulo XVIII", "t": "E, no entanto, se tivesse sido apenas uma ilusão, como era terrível pensar que a consciência era capaz de forjar aqueles fantasmas assustadores, e lhes dar forma visível, fazendo-os se mover diante dele! Que vida seria a sua, se, dia e noite, sombras de seu crime fossem espreitá-lo pelos cantos silenciosos, zombar dele em lugares secretos, sussurrar em seu ouvido em plena festa, acordá-lo com dedos gélidos quando adormecesse! Enquanto esse pensamento passava pela sua cabeça, ele foi ficando pálido de terror, e o ar lhe pareceu ficar subitamente mais frio. Oh! Em que momento extremo de loucura ele matara o amigo! Que horrível lembrar-se da cena! Reviu tudo aquilo de novo. Cada detalhe hediondo voltou com horror renovado. De dentro da caverna negra do tempo, terrível e envolvida em escarlate, erguia-se a imagem de seu pecado. Quando lorde Henry veio às seis, encontrou-o chorando como alguém com o coração partido.", "h": 0}, {"i": 1457, "c": 20, "ct": "Capítulo XVIII", "t": "Só no terceiro dia ele arriscou sair do quarto. Havia algo no ar claro, cheirando a pinho, daquela manhã de inverno que parecia levá-lo de volta à sua alegria e seu ardor pela vida. Mas não foram apenas as condições físicas do ambiente que causaram essa transformação. Sua própria natureza havia se rebelado contra o excesso de angústia que tentava mutilar e conspurcar a perfeição de sua serenidade. Com os temperamentos mais sutis e sofisticados, é sempre assim. Suas poderosas paixões devem ferir ou se submeter. Ou elas massacram o homem, ou elas mesmas morrem. As tristezas rasas e os amores rasos sobrevivem. Os amores e as tristezas que forem grandes são destruídos pela própria plenitude. Além disso, ele se convencera de que fora vítima de uma imaginação dominada pelo terror e, retrospectivamente, contemplou seus medos com uma dose de compaixão e nem um pingo de desdém.", "h": 0}, {"i": 1458, "c": 20, "ct": "Capítulo XVIII", "t": "Após o desjejum, ele caminhou com a duquesa por uma hora no jardim e depois atravessou o parque de charrete para se juntar aos atiradores. A geada quebradiça se espalhara feito sal sobre a relva. O céu era uma xícara virada de metal azul. Uma fina camada de gelo debruava o lago repleto de juncos.", "h": 0}, {"i": 1459, "c": 20, "ct": "Capítulo XVIII", "t": "No canto do pinheiral, ele avistou sir Geoffrey Clouston, irmão da duquesa, tirando dois cartuchos usados de sua espingarda. Ele saltou da charrete e, pedindo ao cavalariço para levar a égua de volta para casa, caminhou em direção a seu convidado através das samambaias murchas e do mato rasteiro.", "h": 0}, {"i": 1460, "c": 20, "ct": "Capítulo XVIII", "t": "– Como vai a caçada, Geoffrey? – ele perguntou.", "h": 0}, {"i": 1461, "c": 20, "ct": "Capítulo XVIII", "t": "– Não muito bem, Dorian. Creio que a maior parte das aves já voou para o campo aberto. Ouso dizer que será melhor depois do almoço, quando mudarmos de lugar.", "h": 0}, {"i": 1462, "c": 20, "ct": "Capítulo XVIII", "t": "Dorian caminhou ao lado dele. O cheiro penetrante do ar perfumado, as luzes marrons e vermelhas que cintilavam no bosque, os gritos roucos dos batedores de quando em quando, e os disparos secos das armas que se seguiam, fascinaram Dorian, enchendo-o de uma deliciosa sensação de liberdade. Sentia-se dominado pela despreocupação da felicidade e pela alta indiferença da alegria.", "h": 0}, {"i": 1463, "c": 20, "ct": "Capítulo XVIII", "t": "De repente, de trás de uma touceira de capim velho, cerca de vinte metros à sua frente, com orelhas eretas de pontas pretas e longas patas traseiras a impulsioná-la adiante, surgiu uma lebre. Ela correu para um bosque de amieiros. Sir Geoffrey apontou a espingarda, apoiada no ombro, mas havia algo no gracioso movimento do animal que estranhamente fascinou Dorian Gray, e ele gritou na hora: – Não atire, Geoffrey. Deixe-a viver.", "h": 0}, {"i": 1464, "c": 20, "ct": "Capítulo XVIII", "t": "– Que bobagem, Dorian! – riu seu companheiro, e, quando a lebre saltou dentro do bosque, disparou. Ouviram-se dois gritos, o grito de uma lebre ferida, que é pavoroso, e o grito de um homem agonizante, que é pior.", "h": 0}, {"i": 1465, "c": 20, "ct": "Capítulo XVIII", "t": "– Santo Deus! Acertei um batedor! – exclamou sir Geoffrey. – Quem foi o asno que se postou na frente das armas? Parem de atirar aí! – ele gritou com toda força. – Um homem foi atingido.", "h": 0}, {"i": 1466, "c": 20, "ct": "Capítulo XVIII", "t": "O guarda-caça veio correndo com um cajado na mão.", "h": 0}, {"i": 1467, "c": 20, "ct": "Capítulo XVIII", "t": "– Onde, senhor? Onde ele está? – ele gritou. Ao mesmo tempo, os tiros cessaram.", "h": 0}, {"i": 1468, "c": 20, "ct": "Capítulo XVIII", "t": "– Aqui – respondeu sir Geoffrey, irritado, correndo em direção ao bosque. – Por que diabos você não mandou seus homens se afastarem? Estragou minha caçada pelo resto do dia.", "h": 0}, {"i": 1469, "c": 20, "ct": "Capítulo XVIII", "t": "Dorian observou-os sumir no bosque de amieiros, afastando os galhos flexíveis que balançavam. No momento seguinte, eles voltaram, arrastando um corpo até a luz do dia. Ele se virou horrorizado. Pareceu-lhe que a desgraça o acompanhava aonde quer que ele fosse. Ouvira sir Geoffrey perguntar se o homem estava realmente morto, e a resposta afirmativa do guarda-caça. O bosque lhe pareceu ficar subitamente vivo e cheio de rostos. Ouviu-se o tropel de milhares de pés, e o burburinho grave de vozes. Um grande faisão acobreado saiu esvoaçando do meio dos galhos.", "h": 0}, {"i": 1470, "c": 20, "ct": "Capítulo XVIII", "t": "Momentos depois, que lhe pareceram, em seu estado perturbado, horas intermináveis de dor, ele sentiu uma mão em seu ombro. Sobressaltou-se e olhou para o lado.", "h": 0}, {"i": 1471, "c": 20, "ct": "Capítulo XVIII", "t": "– Dorian – disse lorde Henry –, achei melhor avisá-los de que a caçada encerrou por hoje. Não ficaria bem se continuássemos.", "h": 0}, {"i": 1472, "c": 20, "ct": "Capítulo XVIII", "t": "– Por mim, estaria encerrada para sempre, Harry – ele respondeu, amargamente. – É tudo muito horrível e cruel. O sujeito está…?", "h": 0}, {"i": 1473, "c": 20, "ct": "Capítulo XVIII", "t": "Ele não conseguiu terminar a frase.", "h": 0}, {"i": 1474, "c": 20, "ct": "Capítulo XVIII", "t": "– Receio que sim – interveio lorde Henry. – Ele recebeu a carga inteira no peito. Deve ter morrido instantaneamente. Venha; vamos para casa.", "h": 0}, {"i": 1475, "c": 20, "ct": "Capítulo XVIII", "t": "Caminharam lado a lado em direção à alameda por quase cinquenta metros sem dizer nada. Então Dorian olhou para lorde Henry e disse, com um suspiro pesado: – É um mau sinal, Harry, muito mau mesmo.", "h": 0}, {"i": 1476, "c": 20, "ct": "Capítulo XVIII", "t": "– O que foi? – perguntou lorde Henry. – Oh! Esse acidente, imagino. Meu caro colega, não há o que fazer. Foi culpa dele mesmo. Por que ele ficou na frente das armas? Além do mais, não temos nada a ver com isso. É um tanto estranho da parte de Geoffrey, é claro. Ele não costuma acertar em batedores. Isso lhe dará fama de mau atirador. E Geoffrey não é, ele tem boa pontaria. Mas não adianta falarmos mais nisso.", "h": 0}, {"i": 1477, "c": 20, "ct": "Capítulo XVIII", "t": "Dorian balançou a cabeça. – É um mau sinal, Harry. Sinto como se uma coisa horrível fosse acontecer a algum de nós. Comigo, talvez – ele acrescentou, passando a mão sobre os olhos, com um gesto dolorido.", "h": 0}, {"i": 1478, "c": 20, "ct": "Capítulo XVIII", "t": "O mais velho deu risada. – A única coisa horrível no mundo é o ennui , Dorian. É o único pecado para o qual não existe perdão. Mas não é provável que venhamos a sofrer disso, a não ser que essas pessoas continuem falando sobre o acidente durante o jantar. Vou dizer que esse assunto é tabu. Quanto a maus sinais, não existe isso de mau sinal. O destino não nos envia arautos. É sábio ou cruel demais para isso. Além do mais, o que poderia lhe acontecer, Dorian? Você tem tudo na vida que um homem pode desejar. Não há ninguém que não adoraria trocar de lugar com você.", "h": 0}, {"i": 1479, "c": 20, "ct": "Capítulo XVIII", "t": "– Eu trocaria de lugar com qualquer um e de bom grado, Harry. Não ria assim. Estou falando a verdade. O maldito faisão que morreu está melhor que eu. Não tenho nenhum terror da morte. É a chegada da morte que me aterroriza. Suas asas monstruosas parecem estar batendo no ar plúmbeo à minha volta. Santo Deus, você não está vendo um homem se mexendo ali atrás das árvores, olhando para mim, esperando por mim?", "h": 0}, {"i": 1480, "c": 20, "ct": "Capítulo XVIII", "t": "Lorde Henry olhou na direção para a qual ele apontava. – Sim – ele disse, sorrindo. – Estou vendo o jardineiro esperando por você. Imagino que ele queira lhe perguntar que flores você quer na mesa hoje à noite. Você está absurdamente nervoso, meu caro colega! Precisa visitar meu médico, quando voltarmos à cidade.", "h": 0}, {"i": 1481, "c": 20, "ct": "Capítulo XVIII", "t": "Dorian suspirou aliviado ao ver o jardineiro se aproximar. O homem tocou a aba do chapéu, olhou de relance para lorde Henry de modo hesitante e então sacou uma carta, que estendeu ao patrão. – Sua Graça me pediu para esperar a resposta – ele murmurou.", "h": 0}, {"i": 1482, "c": 20, "ct": "Capítulo XVIII", "t": "Dorian guardou a carta no bolso. – Diga à Sua Graça que já estou entrando – ele disse, friamente. O homem se virou e rapidamente se encaminhou para a casa.", "h": 0}, {"i": 1483, "c": 20, "ct": "Capítulo XVIII", "t": "– Como as mulheres adoram fazer coisas arriscadas! – riu lorde Henry. – É uma das qualidades delas que eu mais admiro. Uma mulher é capaz de flertar com qualquer um desde que haja outras pessoas olhando.", "h": 0}, {"i": 1484, "c": 20, "ct": "Capítulo XVIII", "t": "– Como você adora dizer coisas arriscadas, Harry! Neste caso, você atirou longe. Gosto muito da duquesa, mas não a amo tanto assim.", "h": 0}, {"i": 1485, "c": 20, "ct": "Capítulo XVIII", "t": "– E a duquesa o ama muito, mas não gosta tanto, de modo que vocês formam um par perfeito.", "h": 0}, {"i": 1486, "c": 20, "ct": "Capítulo XVIII", "t": "– Você está criando um escândalo, Harry, e não há nenhum motivo para escândalo.", "h": 0}, {"i": 1487, "c": 20, "ct": "Capítulo XVIII", "t": "– A base de todo escândalo é uma certeza imoral – disse lorde Henry, acendendo um cigarro.", "h": 0}, {"i": 1488, "c": 20, "ct": "Capítulo XVIII", "t": "– Você sacrificaria qualquer um, Harry, em troca de um epigrama.", "h": 0}, {"i": 1489, "c": 20, "ct": "Capítulo XVIII", "t": "– Quem vai ao altar vai por vontade própria – foi a resposta.", "h": 0}, {"i": 1490, "c": 20, "ct": "Capítulo XVIII", "t": "– Quem dera eu fosse capaz de amar – exclamou Dorian Gray, com uma nota grave de paixão na voz. – Mas parece que perdi a paixão e esqueci o desejo. Sou concentrado demais em mim mesmo. Minha própria personalidade se tornou um fardo para mim. Quero fugir, ir embora, esquecer. Foi tolice minha vir até aqui. Acho que mandarei um telegrama a Harvey para preparar o veleiro. A bordo, estarei a salvo.", "h": 0}, {"i": 1491, "c": 20, "ct": "Capítulo XVIII", "t": "– A salvo do quê, Dorian? Você está em apuros. Por que não me diz o que é? Você sabe que eu o ajudaria.", "h": 0}, {"i": 1492, "c": 20, "ct": "Capítulo XVIII", "t": "– Não posso lhe dizer, Harry – ele respondeu –, infelizmente. E arriscaria dizer que se trata de uma fantasia minha apenas. Esse acidente infeliz me perturbou. Estou com um pressentimento horrível de que algo do tipo pode acontecer comigo.", "h": 0}, {"i": 1493, "c": 20, "ct": "Capítulo XVIII", "t": "– Que absurdo!", "h": 0}, {"i": 1494, "c": 20, "ct": "Capítulo XVIII", "t": "– Espero que seja, mas não posso evitar de me sentir assim. Ah! Lá vem a duquesa, parecendo uma Ártemis em um vestido sob medida. Veja, estamos de volta, duquesa.", "h": 0}, {"i": 1495, "c": 20, "ct": "Capítulo XVIII", "t": "– Estou sabendo de tudo, senhor Gray – ela respondeu. – Pobre Geoffrey, ele está terrivelmente transtornado. E parece que foi você quem pediu para ele não atirar na lebre. Que curioso!", "h": 0}, {"i": 1496, "c": 20, "ct": "Capítulo XVIII", "t": "– Sim, foi muito curioso. Não sei o que me fez dizer aquilo. Algum capricho, imagino. Pareceu-me a mais adorável das criaturas. Mas lamento que tenham lhe contado sobre o homem. É um assunto horrível.", "h": 0}, {"i": 1497, "c": 20, "ct": "Capítulo XVIII", "t": "– É um assunto irritante – interveio lorde Henry –, não tem nenhum valor psicológico. Ora, se Geoffrey tivesse feito de propósito, seria muito mais interessante! Eu adoraria conhecer alguém que cometeu um assassinato de verdade.", "h": 0}, {"i": 1498, "c": 20, "ct": "Capítulo XVIII", "t": "– Que horrível da sua parte, Harry! – exclamou a duquesa. – Não é mesmo, senhor Gray? Harry, o senhor Gray está passando mal outra vez. Ele vai desmaiar.", "h": 0}, {"i": 1499, "c": 20, "ct": "Capítulo XVIII", "t": "Dorian se recompôs com esforço e sorriu. – Não é nada, duquesa – ele murmurou –; meus nervos estão terrivelmente abalados. É só isso. Receio ter caminhado demais pela manhã. Não ouvi o que Harry disse. Foi muito grave? Conte-me depois. Acho que preciso ir me deitar agora. Vocês me dão licença?", "h": 0}, {"i": 1500, "c": 20, "ct": "Capítulo XVIII", "t": "Haviam chegado ao grandioso lance de escada que levava do orquidário ao terraço. Quando a porta de vidro se fechou atrás de Dorian, lorde Henry se virou e olhou para a duquesa com olhar sonolento. – Você está muito apaixonada por ele? – ele perguntou. – Ela levou algum tempo para responder, mas continuou contemplando a paisagem. – Quem me dera saber – ela disse por fim.", "h": 0}, {"i": 1501, "c": 20, "ct": "Capítulo XVIII", "t": "Ele balançou a cabeça. – Sabê-lo seria fatal. É a incerteza que fascina. Um pouco de neblina torna as coisas magníficas.", "h": 0}, {"i": 1502, "c": 20, "ct": "Capítulo XVIII", "t": "– E podemos nos perder no caminho.", "h": 0}, {"i": 1503, "c": 20, "ct": "Capítulo XVIII", "t": "– Todos os caminhos levam ao mesmo ponto, minha cara Gladys.", "h": 0}, {"i": 1504, "c": 20, "ct": "Capítulo XVIII", "t": "– E que ponto é esse?", "h": 0}, {"i": 1505, "c": 20, "ct": "Capítulo XVIII", "t": "– À desilusão.", "h": 0}, {"i": 1506, "c": 20, "ct": "Capítulo XVIII", "t": "– Foi assim que fiz meu début na vida – ela suspirou.", "h": 0}, {"i": 1507, "c": 20, "ct": "Capítulo XVIII", "t": "– Essa foi sua coroação.", "h": 0}, {"i": 1508, "c": 20, "ct": "Capítulo XVIII", "t": "– Estou farta das folhas de morango desse brasão.", "h": 0}, {"i": 1509, "c": 20, "ct": "Capítulo XVIII", "t": "– Elas lhe caem bem.", "h": 0}, {"i": 1510, "c": 20, "ct": "Capítulo XVIII", "t": "– Apenas em público.", "h": 0}, {"i": 1511, "c": 20, "ct": "Capítulo XVIII", "t": "– Você acabaria sentindo falta delas – disse lorde Henry.", "h": 0}, {"i": 1512, "c": 20, "ct": "Capítulo XVIII", "t": "– Farei questão de cobrar cada pétala.", "h": 0}, {"i": 1513, "c": 20, "ct": "Capítulo XVIII", "t": "– Monmouth tem ouvidos.", "h": 0}, {"i": 1514, "c": 20, "ct": "Capítulo XVIII", "t": "– Os velhos são surdos.", "h": 0}, {"i": 1515, "c": 20, "ct": "Capítulo XVIII", "t": "– Ele nunca teve ciúmes?", "h": 0}, {"i": 1516, "c": 20, "ct": "Capítulo XVIII", "t": "– Quem dera tivesse.", "h": 0}, {"i": 1517, "c": 20, "ct": "Capítulo XVIII", "t": "Ele olhou de relance para os lados, como se procurasse alguma coisa. – O que você está procurando? – ela perguntou.", "h": 0}, {"i": 1518, "c": 20, "ct": "Capítulo XVIII", "t": "– A ponta do seu florete – ele respondeu. – Você deixou cair.", "h": 0}, {"i": 1519, "c": 20, "ct": "Capítulo XVIII", "t": "Ela deu risada. – Conservei a máscara.", "h": 0}, {"i": 1520, "c": 20, "ct": "Capítulo XVIII", "t": "– Ela deixa os seus olhos ainda mais lindos – foi a resposta dele.", "h": 0}, {"i": 1521, "c": 20, "ct": "Capítulo XVIII", "t": "Ela tornou a rir. Seus dentes pareciam sementes brancas em um fruto escarlate.", "h": 0}, {"i": 1522, "c": 20, "ct": "Capítulo XVIII", "t": "No andar de cima, em seu quarto, Dorian Gray estava deitado no sofá, com o terror instaurado em cada fibra tensa de seu corpo. De repente, a vida se tornara um fardo hediondo demais para ele suportar. A morte pavorosa do infeliz batedor, baleado no bosque como um animal selvagem, pareceu-lhe prefigurar sua própria morte. Ele havia quase desmaiado com o que lorde Henry dissera casualmente como brincadeira cínica.", "h": 0}, {"i": 1523, "c": 20, "ct": "Capítulo XVIII", "t": "Às cinco, ele tocou a sineta e mandou que o criado aprontasse suas coisas, pois tomaria o expresso noturno para a cidade, e que trouxessem a carruagem às oito e meia. Ele estava decidido a não passar nem mais uma noite em Selby Royal. Era um lugar de maus agouros. A morte andava por lá em plena luz do dia. A relva da floresta fora manchada de sangue.", "h": 0}, {"i": 1524, "c": 20, "ct": "Capítulo XVIII", "t": "Então, ele escreveu um bilhete para lorde Henry, dizendo-lhe que estava indo à cidade consultar seu médico e pedindo que entretivesse os convidados na sua ausência. Quando estava guardando o bilhete no envelope, bateram na porta, e seu pajem informou que o guarda-caça desejava vê-lo. Ele franziu o cenho e mordiscou o lábio. – Mande entrar – ele murmurou, após alguns momentos de hesitação.", "h": 0}, {"i": 1525, "c": 20, "ct": "Capítulo XVIII", "t": "Assim que o homem entrou, Dorian tirou seu talão de cheques da gaveta e abriu diante dele.", "h": 0}, {"i": 1526, "c": 20, "ct": "Capítulo XVIII", "t": "– Imagino que você tenha vindo falar sobre o infeliz acidente desta manhã, Thornton? – ele disse, tomando uma caneta.", "h": 0}, {"i": 1527, "c": 20, "ct": "Capítulo XVIII", "t": "– Sim, senhor – respondeu o guarda-caça.", "h": 0}, {"i": 1528, "c": 20, "ct": "Capítulo XVIII", "t": "– E o pobre coitado era casado? Tinha alguém que dependia dele? – perguntou Dorian com expressão entediada. – Caso haja alguém, eu não gostaria que passassem dificuldades e enviarei a quantia de dinheiro que você julgar necessária.", "h": 0}, {"i": 1529, "c": 20, "ct": "Capítulo XVIII", "t": "– Não sabemos quem ele era, senhor. Era sobre isso que tomei a liberdade de vir lhe falar.", "h": 0}, {"i": 1530, "c": 20, "ct": "Capítulo XVIII", "t": "– Não sabem quem ele era? – disse Dorian, com apatia. – O que você quer dizer com isso? Não era um de seus homens?", "h": 0}, {"i": 1531, "c": 20, "ct": "Capítulo XVIII", "t": "– Não, senhor. Nunca o vi antes. Parece que era um marinheiro, senhor.", "h": 0}, {"i": 1532, "c": 20, "ct": "Capítulo XVIII", "t": "A caneta caiu da mão de Dorian Gray, e ele sentiu como se seu coração de repente fosse parar de bater. – Um marinheiro? – ele exclamou. – Você disse marinheiro?", "h": 0}, {"i": 1533, "c": 20, "ct": "Capítulo XVIII", "t": "– Sim, senhor. Parece que era uma espécie de marinheiro; com tatuagens nos dois braços e esse tipo de coisa.", "h": 0}, {"i": 1534, "c": 20, "ct": "Capítulo XVIII", "t": "– Não encontraram nada que o identificasse? – disse Dorian, inclinando-se para frente e encarando o sujeito com olhos arregalados. – Nada que contivesse o nome dele?", "h": 0}, {"i": 1535, "c": 20, "ct": "Capítulo XVIII", "t": "– Encontramos algum dinheiro, senhor, não muito, e um revólver de seis balas. Não havia nenhuma identificação. Era um sujeito de aparência decente, senhor, mas um tanto rústico. Achamos que devia ser uma espécie de marinheiro.", "h": 0}, {"i": 1536, "c": 20, "ct": "Capítulo XVIII", "t": "Dorian se pôs rapidamente de pé. Uma terrível esperança pairou sobre ele. Ele se agarrou a ela enlouquecidamente. – Onde está o corpo? – ele exclamou. – Depressa, preciso vê-lo agora.", "h": 0}, {"i": 1537, "c": 20, "ct": "Capítulo XVIII", "t": "– Está em um estábulo vazio na fazenda, senhor. O povo não gosta desse tipo de coisa dentro de casa. Dizem que defunto dá azar.", "h": 0}, {"i": 1538, "c": 20, "ct": "Capítulo XVIII", "t": "– Na fazenda! Vá para lá imediatamente e espere por mim. Mande um cavalariço trazer minha égua. Não. Não se preocupe. Vou ao estábulo sozinho. Poupará tempo.", "h": 0}, {"i": 1539, "c": 20, "ct": "Capítulo XVIII", "t": "Em menos de quinze minutos, Dorian Gray estava galopando pela longa alameda o mais depressa que podia. As árvores pareciam passar por ele em uma procissão espectral, e sombras descontroladas se atiravam em seu caminho. A certa altura, a égua desviou diante de um portão branco e quase o lança no chão. Ele a açoitou no pescoço com o chicote. Ela cruzou o ar do crepúsculo feito uma flecha. Os seixos voavam debaixo de seus cascos.", "h": 0}, {"i": 1540, "c": 20, "ct": "Capítulo XVIII", "t": "Por fim, ele chegou à fazenda. Dois homens aguardavam no terreiro. Ele saltou da sela e entregou as rédeas a um deles. No último estábulo, havia uma luz acesa. Algo parecia lhe dizer que o cadáver estava ali, e ele correu para a porta e pôs a mão no trinco.", "h": 0}, {"i": 1541, "c": 20, "ct": "Capítulo XVIII", "t": "Ali parou por um momento, sentindo-se prestes a fazer uma descoberta que salvaria ou estragaria para sempre sua vida. Então, ele escancarou a porta e entrou.", "h": 0}, {"i": 1542, "c": 20, "ct": "Capítulo XVIII", "t": "Sobre uma pilha de sacas, no canto, jazia o corpo morto de um homem vestindo camisa rústica e calças azuis. Um lenço de bolinhas fora colocado sobre o rosto. Uma vela irregular, enfiada em uma garrafa, derretia ao lado.", "h": 0}, {"i": 1543, "c": 20, "ct": "Capítulo XVIII", "t": "Dorian Gray estremeceu. Sentiu que não seria capaz de remover o lenço com as próprias mãos e chamou um funcionário da fazenda.", "h": 0}, {"i": 1544, "c": 20, "ct": "Capítulo XVIII", "t": "– Tire essa coisa do rosto. Quero olhar para ele – ele disse, apoiando-se no umbral da porta.", "h": 0}, {"i": 1545, "c": 20, "ct": "Capítulo XVIII", "t": "Depois que o funcionário removeu o lenço, ele deu um passo à frente. Um grito de alegria escapou de seus lábios. O homem que havia sido baleado no bosque era James Vane.", "h": 0}, {"i": 1546, "c": 20, "ct": "Capítulo XVIII", "t": "Ele ficou ali parado por alguns minutos olhando para o cadáver. Enquanto cavalgava de volta para casa, seus olhos ficaram cheios de lágrimas, pois ele sabia que agora estava salvo.", "h": 0}, {"i": 1547, "c": 21, "ct": "Capítulo XIX", "t": "Capítulo XIX", "h": 1}, {"i": 1548, "c": 21, "ct": "Capítulo XIX", "t": "– Não adianta você me dizer que será bom – exclamou lorde Henry, mergulhando os dedos em uma tigela de cobre cheia de água de rosas. – Você já é perfeito o bastante, não mude.", "h": 0}, {"i": 1549, "c": 21, "ct": "Capítulo XIX", "t": "Dorian Gray balançou a cabeça. – Não, Harry, já fiz muitas coisas horríveis na vida. Não quero tornar a fazê-las. Minhas boas ações começaram ontem.", "h": 0}, {"i": 1550, "c": 21, "ct": "Capítulo XIX", "t": "– Onde você estava ontem?", "h": 0}, {"i": 1551, "c": 21, "ct": "Capítulo XIX", "t": "– No campo, Harry. Fiquei sozinho em uma pequena hospedaria.", "h": 0}, {"i": 1552, "c": 21, "ct": "Capítulo XIX", "t": "– Meu caro menino – disse lorde Henry, sorrindo –, no campo, qualquer um consegue ser bom. Não há tentações por lá. É por isso que as pessoas que moram fora da cidade absolutamente não são civilizadas. A civilização está longe de ser algo fácil de alcançar. Só existem dois modos de chegar a ela. Um deles é sendo culto, o outro é sendo corrupto. No campo, as pessoas não têm oportunidade de nenhuma das duas coisas, de modo que ficam estagnadas.", "h": 0}, {"i": 1553, "c": 21, "ct": "Capítulo XIX", "t": "– Cultura e corrupção – repetiu Dorian. – Conheci um bocado de ambas. Agora me parece terrível que tenham um dia se fundido. Pois agora tenho um novo ideal, Harry. Vou mudar. Acho que já estou mudado.", "h": 0}, {"i": 1554, "c": 21, "ct": "Capítulo XIX", "t": "– Você ainda não me contou que boa ação foi essa. Ou você quis dizer que já fez mais de uma? – perguntou seu companheiro, servindo em seu prato uma piramedezinha carmesim de morangos e, usando uma colher perfurada em forma de concha do mar, nevou açúcar branco sobre eles.", "h": 0}, {"i": 1555, "c": 21, "ct": "Capítulo XIX", "t": "– Eu posso lhe contar, Harry. Não é uma história que eu possa contar a mais ninguém. Eu poupei uma pessoa. Pode parecer fútil, mas você entende o que eu quero dizer. Ela era muito bonita, e maravilhosamente parecida com Sibyl Vane. Acho que foi o que me atraiu a princípio. Você se lembra da Sibyl, não? Parece que foi há tanto tempo! Bem, Hetty não era alguém da nossa classe, é claro. Era simplesmente uma garota da província. Mas eu realmente fiquei apaixonado por ela. Tenho plena certeza disso. Ao longo de todo esse maravilhoso maio em que estamos, eu me acostumei a correr para lá e me encontrar com ela duas ou três vezes por semana. Ontem ela me encontrou em um pequeno pomar. As flores das macieiras ficavam caindo no cabelo dela, e ela estava rindo. Era para fugirmos juntos hoje de madrugada. De repente, resolvi abandoná-la, em flor, tal como a conheci.", "h": 0}, {"i": 1556, "c": 21, "ct": "Capítulo XIX", "t": "– Imagino que a novidade dessa emoção deva ter lhe dado um frenesi de genuíno prazer, Dorian – interrompeu lorde Henry. – Mas permita que eu termine o seu idílio por você. Você deu bons conselhos a uma moça e partiu seu coração. Esse foi o começo da sua regeneração?", "h": 0}, {"i": 1557, "c": 21, "ct": "Capítulo XIX", "t": "– Harry, como você é horrível! Você não devia dizer essas coisas pavorosas. Hetty não ficou com o coração partido. Claro que chorou, e tudo mais. Mas ela não sofreu nenhuma desgraça. Ela poderá viver, como Perdita, em seu jardim de hortelãs e malmequeres.", "h": 0}, {"i": 1558, "c": 21, "ct": "Capítulo XIX", "t": "– E chorar por um Florizel infiel – disse lorde Henry, às gargalhadas, recostando-se na poltrona. – Meu querido Dorian, você pensa curiosamente como um menino. Você acha que essa menina um dia se contentará agora com alguém da própria classe? Imagino que um dia ela acabará se casando com um carroceiro rústico ou com algum lavrador sorridente. Pois bem, o fato de havê-lo conhecido e amado lhe ensinará a desprezar o marido, e ela será infeliz. Do ponto de vista moral, não posso dizer que admiro muito a sua grande renúncia. Até mesmo como um primeiro passo, é pouco. Além do mais, como você sabe que Hetty não está agora flutuando em algum lago à luz das estrelas entre adoráveis lírios-d’água, como Ofélia?", "h": 0}, {"i": 1559, "c": 21, "ct": "Capítulo XIX", "t": "– Não suporto mais isso, Harry! Você zomba de tudo e depois sugere as tragédias mais sérias. Agora me arrependo de ter lhe contado isso. Não importa o que você diga. Sei que agi certo. Pobre Hetty! Quando passei pela fazenda hoje cedo, vi seu rosto branco na janela, como um ramo de jasmim. Não vamos mais falar sobre isso e não tente me convencer de que a única boa ação que faço em anos, o primeiro mísero sacrifício que jamais conheci, é na verdade uma espécie de pecado. Quero ser melhor. E serei melhor. Agora fale de você. O que está acontecendo na cidade? Não vou ao clube há dias.", "h": 0}, {"i": 1560, "c": 21, "ct": "Capítulo XIX", "t": "– As pessoas ainda estão falando sobre o desaparecimento do pobre Basil.", "h": 0}, {"i": 1561, "c": 21, "ct": "Capítulo XIX", "t": "– Eu imaginei que já estariam cansados desse assunto a essa altura – disse Dorian, servindo-se de vinho e franzindo brevemente o cenho.", "h": 0}, {"i": 1562, "c": 21, "ct": "Capítulo XIX", "t": "– Meu caro menino, as pessoas estão falando disso apenas há seis semanas, e o público inglês realmente não se dispõe ao esforço mental de falar sobre mais de um assunto antes de três meses. Ultimamente, no entanto, eles tiveram muita sorte. Além do meu divórcio, tiveram também o suicídio de Alan Campbell. Agora, esse misterioso desaparecimento de um artista. A Scotland Yard continua insistindo que o homem de sobretudo cinza que partiu para Paris no expresso da meia-noite de nove de novembro era o pobre Basil, e a polícia francesa afirma que Basil nunca chegou a Paris. Imagino que daqui a quinze dias vamos descobrir que ele foi visto em San Francisco. É muito engraçado, mas todo mundo que desaparece dizem que foi visto em San Francisco. Deve ser uma delícia de cidade e possuir todas as atrações do futuro.", "h": 0}, {"i": 1563, "c": 21, "ct": "Capítulo XIX", "t": "– O que você acha que aconteceu ao Basil? – perguntou Dorian, erguendo sua taça de borgonha contra a luz e se perguntando como era capaz de abordar o assunto com tamanha calma.", "h": 0}, {"i": 1564, "c": 21, "ct": "Capítulo XIX", "t": "– Não faço a menor ideia. Se Basil preferiu se esconder, não é assunto meu. Se ele morreu, não quero mais pensar nele. A morte é a única coisa que me aterroriza. Odeio a morte.", "h": 0}, {"i": 1565, "c": 21, "ct": "Capítulo XIX", "t": "– Por quê? – disse o mais jovem, languidamente.", "h": 0}, {"i": 1566, "c": 21, "ct": "Capítulo XIX", "t": "– Porque – disse lorde Henry, passando entre as narinas a treliça dourada de uma caixa aberta de sais aromáticos – pode-se sobreviver a tudo hoje em dia, exceto à morte. A morte e a vulgaridade são os dois únicos fatos do século XIX que não se podem explicar. Vamos beber nosso café na sala de música, Dorian. Você tem que tocar Chopin para mim. O sujeito com quem minha esposa fugiu tocava Chopin divinamente. Pobre Victoria! Eu gostava muito dela. A casa ficou solitária sem ela. Claro que a vida conjugal é meramente um hábito, um mau hábito. Mas eis que lamentamos a perda até dos nossos piores hábitos. Talvez sejam os que mais lamentamos. São parte essencial da nossa personalidade.", "h": 0}, {"i": 1567, "c": 21, "ct": "Capítulo XIX", "t": "Dorian não disse nada, mas se levantou da mesa e, passando à sala ao lado, sentou-se ao piano e deixou seus dedos percorrerem o marfim branco e preto das teclas. Depois que o café foi servido, ele parou e, olhando para lorde Henry, disse: – Harry, já lhe ocorreu que o Basil pode ter sido assassinado?", "h": 0}, {"i": 1568, "c": 21, "ct": "Capítulo XIX", "t": "Lorde Henry bocejou. – Basil era muito popular e sempre usava um relógio Waterbury. Por que ele teria sido assassinado? Ele não era inteligente o bastante para ter inimigos. É claro que ele tinha um gênio maravilhoso para a pintura. Mas a pessoa pode pintar como Velásquez e ser tão tacanho quanto é possível. Basil era na verdade um tanto tacanho. O único momento em que me interessei por ele foi quando ele me disse, anos atrás, que ele tinha uma louca adoração por você, e que você era o motivo dominante em sua arte.", "h": 0}, {"i": 1569, "c": 21, "ct": "Capítulo XIX", "t": "– Eu gostava muito do Basil – disse Dorian, com um tom de tristeza na voz. – Mas as pessoas não estão cogitando que ele tenha sido assassinado?", "h": 0}, {"i": 1570, "c": 21, "ct": "Capítulo XIX", "t": "– Oh, alguns jornais. Não me parece nada provável. Sei que existem lugares terríveis em Paris, mas Basil não era o tipo de homem que os frequenta. Ele não tinha curiosidade. Era o seu principal defeito.", "h": 0}, {"i": 1571, "c": 21, "ct": "Capítulo XIX", "t": "– O que você diria, Harry, se eu lhe falasse que eu matei o Basil? – disse o mais jovem. E ficou olhando fixamente para ele depois de falar.", "h": 0}, {"i": 1572, "c": 21, "ct": "Capítulo XIX", "t": "– Eu diria, meu caro colega, que você está posando de um personagem que não lhe fica bem. Todo crime é vulgar, assim como toda vulgaridade é um crime. Não está em você, Dorian, cometer assassinato. Sinto muito se feri sua vaidade ao dizer isso, mas lhe garanto que é verdade. O crime é algo exclusivo das classes inferiores. Não os culpo minimamente por isso. Eu ousaria até dizer que o crime é para eles o que a arte é para nós, simplesmente um método de obter sensações extraordinárias.", "h": 0}, {"i": 1573, "c": 21, "ct": "Capítulo XIX", "t": "– Um método de obter sensações? Você acha então que alguém que cometeu assassinato poderia voltar a cometer o mesmo crime? Não me diga isso.", "h": 0}, {"i": 1574, "c": 21, "ct": "Capítulo XIX", "t": "– Oh! qualquer coisa pode se tornar um prazer. Se feita com muita frequência – exclamou lorde Henry, às gargalhadas. – Esse é um dos segredos mais importantes da vida. Eu diria, no entanto, que o assassinato é sempre um erro. Ninguém jamais deveria fazer nada que não possa comentar depois do jantar. Mas deixemos o pobre Basil de lado. Eu adoraria acreditar que ele tenha tido esse fim realmente romântico que você sugere; mas não posso. Eu diria que ele caiu de um ônibus no Sena, e que o condutor abafou o escândalo. Sim: eu diria que esse foi seu fim. Posso vê-lo agora deitado embaixo daquelas águas verdes opacas com as barcas pesadas passando por cima dele, e longas algas enganchando em seu cabelo. Sabe, não creio que ele fosse fazer mais boas pinturas. Nos últimos dez anos, a pintura dele piorou muito.", "h": 0}, {"i": 1575, "c": 21, "ct": "Capítulo XIX", "t": "Dorian soltou um suspiro profundo, e lorde Henry deu alguns passos e começou a acariciar a cabeça de um curioso papagaio de Java, um pássaro grande de plumagem cinza, de crista e cauda cor-de-rosa, que se equilibrava em um poleiro de bambu. Quando seus dedos afilados tocaram a ave, ela fechou os flocos brancos de suas pálpebras enrugadas sobre os negros olhos vítreos e começou a se balançar para trás e para frente.", "h": 0}, {"i": 1576, "c": 21, "ct": "Capítulo XIX", "t": "– Sim – ele continuou, virando-se e tirando o lenço do bolso –; a pintura dele piorou muito. Parece que perdeu alguma coisa. Perdeu um ideal. Quando você e ele deixaram de ser grandes amigos, ele deixou de ser um grande pintor. O que foi que os separou, afinal? Imagino que você tenha se entediado com ele. Aliás, onde está aquele retrato maravilhoso que ele fez de você? Acho que nunca mais o vi desde que ele o terminou. Oh! Lembro que você me contou anos atrás que o mandara para Selby, e que o quadro se perdeu ou foi roubado no caminho. Você nunca o recuperou? Que pena! Era uma verdadeira obra-prima. Lembro que eu quis comprá-lo. Quem dera eu o tivesse hoje em dia. Foi a melhor fase do Basil. Depois disso, a pintura dele virou essa curiosa mistura de má pintura e boas intenções que sempre qualifica o pintor a ser chamado de artista inglês representativo. Você registrou a ocorrência? Pois deveria.", "h": 0}, {"i": 1577, "c": 21, "ct": "Capítulo XIX", "t": "– Eu me esqueci – disse Dorian. – Acho que me esqueci. Mas na verdade nunca gostei daquele retrato. Lamento ter posado para ele. É uma lembrança odiosa para mim. Por que você tocou nesse assunto? Ele me lembrava aquela frase curiosa de uma peça… Hamlet , se não me engano… Como era mesmo?", "h": 0}, {"i": 1578, "c": 21, "ct": "Capítulo XIX", "t": "Como a pintura de uma tristeza,", "h": 0}, {"i": 1579, "c": 21, "ct": "Capítulo XIX", "t": "Um rosto sem coração.", "h": 0}, {"i": 1580, "c": 21, "ct": "Capítulo XIX", "t": "[Claudius a Laertes, Hamlet , ato IV, cena 7.]", "h": 0}, {"i": 1581, "c": 21, "ct": "Capítulo XIX", "t": "– Sim, é isso mesmo.", "h": 0}, {"i": 1582, "c": 21, "ct": "Capítulo XIX", "t": "Lorde Henry deu risada. – Se a pessoa lida artisticamente com a vida, seu cérebro é seu coração – ele respondeu, afundando em uma poltrona.", "h": 0}, {"i": 1583, "c": 21, "ct": "Capítulo XIX", "t": "Dorian Gray balançou a cabeça e dedilhou alguns acordes suaves ao piano. – Como a pintura de uma tristeza – ele repetiu –, um rosto sem coração.", "h": 0}, {"i": 1584, "c": 21, "ct": "Capítulo XIX", "t": "O amigo mais velho se recostou e olhou para ele, de olhos quase fechados. – Por falar nisso, Dorian – ele disse, após uma pausa –, “de que adianta ao homem ganhar o mundo inteiro e perder” – como é o resto da citação? – “a própria alma”?", "h": 0}, {"i": 1585, "c": 21, "ct": "Capítulo XIX", "t": "A música destoou e Dorian Gray teve um sobressalto e encarou o amigo. – Por que você me pergunta isso, Harry?", "h": 0}, {"i": 1586, "c": 21, "ct": "Capítulo XIX", "t": "– Meu caro colega – disse lorde Henry, erguendo as sobrancelhas de surpresa –, eu pergunto porque talvez você possa me dar uma resposta. Só por isso. Eu ia passando pelo parque domingo passado, e, perto de Marble Arch, havia uma pequena multidão de gente de aparência humilde, ouvindo um pregador de rua bem vulgar. Quando passei, ouvi o homem berrando essa pergunta ao público. Aquilo me pareceu um tanto dramático. Londres é muito farta nesse tipo de efeito curioso. Um domingo chuvoso, um pobre cristão de sobretudo, um círculo de rostos pálidos e doentios embaixo de guarda-chuvas quebrados e gotejantes, e uma frase maravilhosa lançada no ar por lábios estridentes e histéricos – foi realmente uma frase muito boa à sua maneira, uma sugestão e tanto. Pensei em dizer ao profeta que a arte tinha uma alma, mas o homem não. Receio, contudo, que ele não fosse me entender.", "h": 0}, {"i": 1587, "c": 21, "ct": "Capítulo XIX", "t": "– Não, Harry. A alma é uma realidade terrível. A alma pode ser comprada, e vendida, e trocada. Pode ser envenenada, ou aperfeiçoada. Em cada um de nós, existe uma alma. Eu sei disso.", "h": 0}, {"i": 1588, "c": 21, "ct": "Capítulo XIX", "t": "– Você tem mesmo certeza disso, Dorian?", "h": 0}, {"i": 1589, "c": 21, "ct": "Capítulo XIX", "t": "– Absoluta certeza.", "h": 0}, {"i": 1590, "c": 21, "ct": "Capítulo XIX", "t": "– Ah! Pois então deve ser uma ilusão. As coisas das quais temos absoluta certeza nunca são verdade. Isso é uma fatalidade da fé, e a lição do romance. Como você está sério! Não seja tão grave. O que você ou eu temos a ver com as superstições da nossa época? Não: nós desistimos de acreditar na alma. Toque alguma coisa. Toque-me um noturno, Dorian, e, enquanto toca, diga-me, em voz baixa, como conservou sua juventude. Deve haver algum segredo. Sou apenas dez anos mais velho que você, e estou enrugado, exausto, amarelado. Você continua realmente maravilhoso, Dorian. Nunca esteve mais encantador que esta noite. Você me lembra do dia em que o vi pela primeira vez. Você tinha o rosto mais cheio, era muito tímido e absolutamente extraordinário. Você mudou, é claro, mas não na aparência. Queria que você me contasse o seu segredo. Para voltar à minha juventude, eu faria qualquer coisa no mundo, menos exercício, acordar cedo ou ser respeitável. Juventude! Não há nada igual. É um absurdo falar da ignorância da juventude. As únicas pessoas cujas opiniões eu respeito hoje em dia são muito mais jovens do que eu. Elas parecem mais avançadas. A vida lhes revelou sua última maravilha. Quanto aos velhos, sempre os contradigo. Contradigo-os por princípio. Se você perguntar a um velho sua opinião sobre alguma coisa que aconteceu ontem, ele solenemente lhe dará as opiniões correntes em 1820, quando as pessoas usavam meias longas, acreditavam em tudo e não sabiam absolutamente nada. Que adorável isso que você está tocando! Imagino se Chopin escreveu isso em Maiorca, com o mar varrendo o vilarejo, e a maresia salgada batendo contra as janelas, é maravilhosamente romântico. É uma bênção que ainda nos reste uma arte que não seja imitativa! Não pare. Hoje à noite eu quero música. Parece-me que você é o jovem Apolo, e eu sou Marsias a ouvi-lo tocar. Tenho tristezas, Dorian, de que você nem desconfia. A tragédia da idade não é que ficamos velhos, mas que ainda somos jovens. Fico espantado às vezes com minha própria sinceridade. Ah, Dorian, como você é feliz! Que vida magnífica você teve! Você bebeu tudo profundamente. Você esmagou as uvas contra o palato. Nada ficou oculto dos seus olhos. E para você é como se tivesse sido música para os seus ouvidos. Nada o abalou. Você continua o mesmo.", "h": 0}, {"i": 1591, "c": 21, "ct": "Capítulo XIX", "t": "– Não sou mais o mesmo, Harry.", "h": 0}, {"i": 1592, "c": 21, "ct": "Capítulo XIX", "t": "– Sim: você continua o mesmo. Eu me pergunto como será pelo resto da sua vida. Não estrague tudo com renúncias. Neste momento, você é um tipo perfeito. Não se torne incompleto. Você não tem nenhum defeito assim como está. Não precisa balançar a cabeça: você sabe que é. Além do mais, Dorian, não se engane. A vida não se deixa dominar pela vontade ou pela intenção. A vida é uma questão de nervos, e fibras, e células que se constroem lentamente, onde o pensamento se esconde e a paixão tem seus sonhos. Você pode se julgar a salvo e achar que é forte. Mas um tom casual da cor de um quarto ou de um céu pela manhã, um perfume em particular que um dia você amou e que traz de volta lembranças sutis, um verso de um poema esquecido com o qual você se depare, uma cadência de uma peça musical que você deixou de tocar, estou lhe dizendo, Dorian, é dessas coisas que a nossa vida depende. Browning escreveu sobre isso em algum lugar; mas os nossos próprios sentidos imaginarão tudo isso por nós. Há momentos em que o aroma do lilas blanc passa subitamente por mim, e tenho que viver novamente o mês mais estranho da minha vida. Queria trocar de lugar consigo, Dorian. O mundo gritou contra nós dois, mas sempre o idolatrou. O mundo sempre há de idolatrá-lo. Você representa tudo o que nossa época está buscando e tudo aquilo que ela teme já haver encontrado. Fico tão contente por você nunca ter feito nada, nunca esculpiu uma estátua, ou pintou um quadro, ou produziu qualquer coisa além de você mesmo! A vida foi a sua arte. Você se transpôs em música. Seus dias são seus sonetos.", "h": 0}, {"i": 1593, "c": 21, "ct": "Capítulo XIX", "t": "Dorian se levantou do piano e passou a mão pelos cabelos. – Sim, foi uma vida magnífica – ele murmurou –,mas não levarei mais a mesma vida, Harry. E você não precisa dizer essas extravagâncias para mim. Você não sabe tudo a meu respeito. Acho que se soubesse, até você me daria as costas. Você ri. Pois não ria.", "h": 0}, {"i": 1594, "c": 21, "ct": "Capítulo XIX", "t": "– Por que você parou de tocar, Dorian? Volte a tocar e me dê outra vez aquele noturno. Veja que lua imensa, cor de mel, pairando no céu opaco. Ela está esperando que você a embale, e, se você tocar, ela chegará mais perto da Terra. Não vai mais tocar? Então vamos ao clube. Foi uma noite deliciosa, e devemos encerrá-la deliciosamente. Há uma pessoa no White’s que deseja imensamente conhecê-lo – o jovem lorde Poole, filho mais velho do Bournemouth. Ele já copia as suas gravatas e me implorou para apresentá-lo. Ele é muito agradável e me lembra até você.", "h": 0}, {"i": 1595, "c": 21, "ct": "Capítulo XIX", "t": "– Espero que não – disse Dorian, com olhos tristonhos. – Mas hoje já estou cansado, Harry. Não vou ao clube. São quase onze, e quero me deitar cedo.", "h": 0}, {"i": 1596, "c": 21, "ct": "Capítulo XIX", "t": "– Fique mais. Você nunca tocou tão bem quanto esta noite. Havia algo no seu toque que foi maravilhoso. Tinha mais expressão do que nunca.", "h": 0}, {"i": 1597, "c": 21, "ct": "Capítulo XIX", "t": "– É porque agora serei bom – ele respondeu, sorrindo. – Já estou um pouco diferente.", "h": 0}, {"i": 1598, "c": 21, "ct": "Capítulo XIX", "t": "– Você não será capaz de me transformar, Dorian – disse lorde Henry. – E você e eu seremos sempre amigos.", "h": 0}, {"i": 1599, "c": 21, "ct": "Capítulo XIX", "t": "– No entanto, você me envenenou com um livro um dia. Isso não poderei perdoar. Harry, prometa-me que jamais você emprestará esse livro a mais ninguém. Ele me fez mal.", "h": 0}, {"i": 1600, "c": 21, "ct": "Capítulo XIX", "t": "– Meu caro menino, você realmente está começando a ser moralista. Logo você estará por aí como um convertido, um revivalista, alertando as pessoas sobre os pecados dos quais você se cansou. Você é encantador demais para fazer isso. Além do mais, não adianta. Você e eu somos o que somos, e seremos o que seremos. Quanto ao envenenamento por livros, isso não existe. A arte não tem nenhuma influência sobre a ação. Ela aniquila o desejo de agir. É extremamente estéril. Os livros que o mundo chama de imorais são livros que mostram ao mundo a sua própria vergonha. Só isso. Mas não vamos discutir literatura. Vá me ver amanhã. Vou cavalgar às onze. Podemos ir juntos, e, depois, vou levá-lo para almoçar com lady Branksome. É uma mulher encantadora e quer consultá-lo sobre algumas tapeçarias que ela pretende comprar. Espero que você venha. Ou almoçamos com a nossa duquesinha? Ela disse que nunca mais o encontrou. Será que você se cansou da Gladys? Eu imaginei que você fosse se cansar dela. Ela tem uma língua que dá nos nervos da gente. Bem, seja como for, esteja aqui às onze.", "h": 0}, {"i": 1601, "c": 21, "ct": "Capítulo XIX", "t": "– Eu preciso mesmo ir, Harry?", "h": 0}, {"i": 1602, "c": 21, "ct": "Capítulo XIX", "t": "– Sem dúvida. O parque está delicioso agora. Não me lembro de ter visto lilases assim desde aquele ano em que nos conhecemos.", "h": 0}, {"i": 1603, "c": 21, "ct": "Capítulo XIX", "t": "– Muito bem. Estarei aqui às onze – disse Dorian. – Boa noite, Harry. – Quando chegou à porta, ele hesitou por um momento, como se fosse dizer mais alguma coisa. Então suspirou e foi embora.", "h": 0}, {"i": 1604, "c": 22, "ct": "Capítulo XX", "t": "Capítulo XX", "h": 1}, {"i": 1605, "c": 22, "ct": "Capítulo XX", "t": "Fazia uma noite adorável, tão quente que ele tirou o paletó e nem sequer envolveu o pescoço com sua echarpe de seda. Enquanto caminhava de volta para casa, fumando seu cigarro, dois rapazes em traje de noite passaram por ele. Ouviu um deles sussurrar ao outro, “aquele é Dorian Gray.” Lembrou-se de como costumava gostar de ser reconhecido na rua, ou encarado, ou que falassem dele. Agora estava cansado de ouvir o próprio nome. Metade do encanto do pequeno vilarejo que ele costumara frequentar ultimamente era o fato de que ninguém sabia quem ele era. Amiúde dizia à garota que seduzira para que o amasse que ele era pobre, e ela acreditara nele. Dissera-lhe um dia que ele era mau, e ela deu risada, e disse que as pessoas más eram sempre muito velhas e muito feias. Que risada ela tinha! – parecia o trinado de um tordo. E como era bonita naqueles vestidos de algodão e seus chapéus largos! Ela não sabia nada, mas tinha tudo o que ele havia perdido.", "h": 0}, {"i": 1606, "c": 22, "ct": "Capítulo XX", "t": "Ao chegar em casa, ele encontrou o criado à sua espera. Mandou-o dormir, e se atirou no sofá da biblioteca, e começou a pensar nas coisas que lorde Henry lhe dissera.", "h": 0}, {"i": 1607, "c": 22, "ct": "Capítulo XX", "t": "Será que era mesmo verdade que as pessoas não podiam nunca mudar? Sentiu uma louca nostalgia da pureza imaculada de sua infância – da rosa branca de sua infância, como lorde Henry um dia dissera. Sabia que havia se desgraçado, enchido a cabeça de corrupções e causara horrores a seu bel-prazer; que havia sido uma má influência para os outros e experimentado uma alegria terrível ao fazê-lo; e que, das vidas que cruzaram seu caminho, apenas as mais belas e mais cheias de promessa ele envergonhara. Mas será que era tudo irreversível? Haveria esperança para ele?", "h": 0}, {"i": 1608, "c": 22, "ct": "Capítulo XX", "t": "Ah! que momento monstruoso de orgulho e paixão, aquele em que suplicara que o retrato portasse o fardo de seus dias, e ele mantivesse o esplendor intacto da eterna juventude! Todo o seu fracasso se devia àquilo. Teria sido melhor para ele se cada pecado de sua vida tivesse trazido consigo um castigo certo e rápido. Havia uma purificação no castigo. Não “perdoai as nossas ofensas”, mas “espancai-nos pelas nossas iniquidades”, deveria ser a oração de um homem para um Deus mais justo.", "h": 0}, {"i": 1609, "c": 22, "ct": "Capítulo XX", "t": "O espelho de moldura curiosamente esculpida que lorde Henry lhe dera, tantos anos atrás, estava sobre a mesa, e os alvíssimos cupidos riam ao seu redor como antigamente. Ele ergueu o espelho, como fizera naquela noite de horror, quando notara pela primeira vez a transformação do fatídico quadro, e de olhos arregalados, marejados de lágrimas, olhou para o escudo polido. Um dia, alguém que o amara terrivelmente escrevera-lhe uma carta enlouquecida, que terminava com essas palavras idólatras: “O mundo mudou porque você foi feito de marfim e de ouro. As curvas dos seus lábios reescrevem a história.” As frases lhe voltaram à lembrança, e ele as repetiu diversas vezes para si mesmo. Então odiou a própria beleza e, atirando o espelho no chão, estilhaçou-o em lascas prateadas com o salto do sapato. Fora sua beleza que o arruinara, sua beleza e sua juventude pelas quais suplicara. Não fossem essas duas coisas, sua vida poderia ter sido isenta de máculas. Sua beleza fora apenas uma máscara; sua juventude, mero escárnio. Na melhor das hipóteses, o que era a juventude? Um tempo verde, imaturo, de humores fúteis e pensamentos doentios. Por que vestira a libré da juventude? A juventude só fizera estragá-lo.", "h": 0}, {"i": 1610, "c": 22, "ct": "Capítulo XX", "t": "Era melhor não pensar no passado. Nada poderia mudar aquilo. Era em si mesmo, e em seu próprio futuro, que ele precisava pensar. James Vane estava escondido em uma lápide sem nome no cemitério de Selby. Alan Campbell se matara com um tiro uma noite em seu laboratório, mas sem revelar o segredo que fora obrigado a saber. A excitação, ao que parecia, sobre o desaparecimento de Basil Hallward logo passaria. Já estava diminuindo. Ele ficaria perfeitamente seguro então. Nem tampouco era a morte de Basil Hallward o que mais pesava em seu espírito. Era a morte em vida de sua própria alma que o perturbava. Basil pintara o retrato que arruinara sua vida. Não poderia perdoá-lo por isso. Fora o retrato o culpado de tudo. Basil lhe dissera coisas insuportáveis e que, no entanto, ele suportara com paciência. O assassinato fora apenas um loucura momentânea. Quanto a Alan Campbell, suicidara-se sozinho. Decidira assim. Ele não tinha nada com isso.", "h": 0}, {"i": 1611, "c": 22, "ct": "Capítulo XX", "t": "Vida nova! Era isso que ele queria. Era isso que ele estava esperando. Decerto já havia começado. Já havia poupado, ao menos, uma criatura inocente. Jamais tentaria a inocência outra vez. Ele seria bom.", "h": 0}, {"i": 1612, "c": 22, "ct": "Capítulo XX", "t": "Ao pensar em Hetty Merton, ele começou a se perguntar se o retrato no sótão trancado estaria alterado. Será que não estaria mais tão horrível quanto antes? Talvez, se sua vida se tornasse pura, ele pudesse expurgar todos os sinais de paixões más do rosto. Talvez as marcas da maldade já tivessem sumido. Ele subiria para verificar.", "h": 0}, {"i": 1613, "c": 22, "ct": "Capítulo XX", "t": "Pegou o lampião da mesa e subiu lentamente as escadas. Enquanto destrancava a porta, um sorriso de alegria percorreu seu semblante estranhamente jovem e pairou por um momento em seus lábios. Sim, doravante seria bom, e aquela coisa hedionda que escondera não seria mais um terror para ele. Sentiu como se um fardo já tivesse sido retirado de seus ombros.", "h": 0}, {"i": 1614, "c": 22, "ct": "Capítulo XX", "t": "Entrou silenciosamente, trancando a porta atrás de si, como de costume, e retirou o manto roxo do retrato. Um grito de dor e indignação escapou de sua boca. Ele não notou nenhuma mudança, exceto pelos olhos, onde havia uma expressão de astúcia, e pela boca, curvada com a ruga da hipocrisia. A imagem ainda era odiosa – ainda mais odiosa, se possível, do que antes – e a mancha escarlate da mão pareceu-lhe mais vívida e mais semelhante a sangue recém-derramado. Então ele estremeceu. Teria sido apenas a vaidade que o levara àquela única boa ação? Ou o desejo de uma nova sensação, como havia intuído lorde Henry, com sua risada zombeteira? Ou aquela paixão por interpretar um papel que às vezes nos faz fazer coisas melhores do que nós mesmos? Ou, quem sabe, tudo isso junto? E por que a mancha vermelha estava maior do que antes? Parecia se espalhar como uma doença horrível sobre os dedos enrugados. Havia sangue nos pés da pintura, como se a imagem tivesse derramado sangue até mesmo da mão sem a faca. Confessar? Será que aquilo significava que devia confessar? Entregar-se e ser condenado à morte? Ele riu. Sentiu que era uma ideia monstruosa. Além disso, mesmo que confessasse, quem acreditaria nele? Não havia nenhum sinal do homem assassinado em parte alguma. Todos os seus pertences haviam sido destruídos. Ele mesmo havia incinerado o que restara no andar de baixo. O mundo simplesmente diria que ele estava louco. Acabaria sendo internado se insistisse nessa história… No entanto, era seu dever confessar, sofrer a vergonha pública e fazer a reparação pública. Havia um Deus que conclamava os homens a confessar os pecados tanto à Terra quanto ao céu. Nada que ele fizesse o limparia enquanto ele não confessasse seu pecado. Seu pecado? Ele deu de ombros. A morte de Basil Hallward pareceu-lhe muito pouco. Ele estava pensando em Hetty Merton. Pois era um espelho injusto, esse espelho de sua alma, para o qual estava olhando. Vaidade? Curiosidade? Hipocrisia? Não haveria nada mais em sua renúncia além disso? Havia, sim, algo mais. Ao menos, ele achava que sim. Mas quem poderia dizer?… Não. Não havia nada além disso. Por vaidade, ele a havia poupado. Por hipocrisia, ele vestira a máscara da bondade. Por pura curiosidade, ele havia experimentado a negação de si mesmo. Agora ele admitia.", "h": 0}, {"i": 1615, "c": 22, "ct": "Capítulo XX", "t": "Mas aquele assassinato – será que o perseguiria pelo resto da vida? Viveria para sempre com o fardo do passado? Será que devia realmente confessar? Jamais. Havia apenas uma única evidência contra ele. O quadro em si – eis a prova. Ele o destruiria. Por que afinal o guardara por tanto tempo? Antes tivera algum prazer observando-o mudar e envelhecer. Ultimamente, já não lhe dava prazer algum. Mantinha-o acordado à noite. Quando saía de casa, vivia aterrorizado que outros olhos pudessem vê-lo. Trouxera melancolia a todas as suas paixões. Sua mera lembrança arruinara muitos momentos de alegria. O quadro havia sido como a consciência para ele. Sim, fora sua consciência. Ele o destruiria.", "h": 0}, {"i": 1616, "c": 22, "ct": "Capítulo XX", "t": "Olhou para os lados e viu a faca que usara em Basil Hallward. Ele a limpara muitas vezes, até que não restasse nenhuma nódoa. Estava polida e reluzente. Assim como fora usada para matar o pintor, seria usada para matar sua obra, e tudo o que ela significava. Mataria o passado e, quando o passado estivesse morto, ele estaria livre. Mataria aquela monstruosa vida anímica, e, sem seus alertas horríveis, ele ficaria em paz. Segurou firme a faca e esfaqueou o retrato.", "h": 0}, {"i": 1617, "c": 22, "ct": "Capítulo XX", "t": "Ouviu-se um grito e um baque. O grito foi tão horrível em sua agonia que os criados assustados acordaram e saíram lentamente de seus quartos. Dois cavalheiros, que passavam pela praça, pararam e olharam para a casa grandiosa. Caminharam até encontrar um policial e voltaram com ele. O homem tocou diversas vezes a campainha, mas ninguém atendeu. Exceto por uma luz acesa em uma janela do último andar, a casa inteira estava às escuras. Após algum tempo, ele foi embora, parou sob um pórtico vizinho e ficou observando.", "h": 0}, {"i": 1618, "c": 22, "ct": "Capítulo XX", "t": "– Quem mora aí, seu guarda? – perguntou o mais velho dos dois cavalheiros.", "h": 0}, {"i": 1619, "c": 22, "ct": "Capítulo XX", "t": "– O senhor Dorian Gray, senhor – respondeu o policial.", "h": 0}, {"i": 1620, "c": 22, "ct": "Capítulo XX", "t": "Eles se entreolharam e foram embora com expressão de desprezo. Um deles era tio de sir Henry Ashton.", "h": 0}, {"i": 1621, "c": 22, "ct": "Capítulo XX", "t": "Lá dentro, na ala dos criados da casa, as empregadas estavam se vestindo, conversando aos sussurros. A velha senhora Leaf estava chorando e entrelaçando os dedos. Francis estava pálido como a morte.", "h": 0}, {"i": 1622, "c": 22, "ct": "Capítulo XX", "t": "Depois de cerca de quinze minutos, ele chamou o cocheiro e um dos lacaios e subiram lentamente as escadas. Bateram na porta, mas não houve resposta. Gritaram. Tudo parecia imóvel. Enfim, depois de tentar em vão forçar a porta, subiram no telhado e desceram pela sacada. As janelas cederam com facilidade: os ferrolhos eram velhos.", "h": 0}, {"i": 1623, "c": 22, "ct": "Capítulo XX", "t": "Ao entrarem no sótão, encontraram, pendurado na parede, um esplêndido retrato do patrão tal como eles o haviam visto pela última vez, em todo esplendor de sua juventude e beleza extraordinárias. Deitado no chão, havia um homem morto, em traje de noite, com uma faca no coração. Estava seco, enrugado, com um rosto odioso. Só quando examinaram seus anéis reconheceram quem era.", "h": 0}, {"i": 1624, "c": 22, "ct": "Capítulo XX", "t": "FIM", "h": 0}, {"i": 1625, "c": 23, "ct": "Oscar Wilde: o poeta de Salomé", "t": "Oscar Wilde: o poeta de Salomé", "h": 1}, {"i": 1626, "c": 23, "ct": "Oscar Wilde: o poeta de Salomé", "t": "Por James Joyce", "h": 0}, {"i": 1627, "c": 23, "ct": "Oscar Wilde: o poeta de Salomé", "t": "Oscar Fingal O’Flahertie Wills Wilde. Foram esses os altissonantes títulos que com arrogância juvenil ele imprimiu no frontispício de sua primeira reunião de poemas, e, nesse gesto orgulhoso, com o qual ele tentou granjear nobreza, estão os sinais de suas vãs pretensões e a sina que já o aguardava. Seu nome o simboliza: Oscar, sobrinho do rei Fingal e filho único de Ossian na amorfa Odisseia celta, que foi morto à traição pela mão de seu anfitrião ao se sentar à mesa. O’Flahertie, uma tribo irlandesa selvagem cujo destino era atacar os portões das cidades medievais; um nome que incitava terror em homens pacíficos, que ainda recitam, entre as pragas, a ira de Deus, e o espírito da fornicação, na antiga litania dos santos: “dos selvagens O’Flaherties, libera nos Domine .” Como aquele outro Oscar, ele encontraria a morte pública na flor de seus anos ao se sentar à mesa, coroado com as falsas folhas de videira e discutindo Platão. Como aquela tribo selvagem, ele haveria de partir a lança de seus fluentes paradoxos contra o corpo das convenções práticas e de ouvir, como um exilado desonrado, o coro dos justos recitar seu nome entre os nomes dos impuros.", "h": 0}, {"i": 1628, "c": 23, "ct": "Oscar Wilde: o poeta de Salomé", "t": "Wilde nasceu na modorrenta capital irlandesa há cinquenta e cinco anos. Seu pai era um importante cientista, que foi considerado o pai da moderna otologia. Sua mãe, que tomou parte no movimento literário-revolucionário de 1848, escreveu para o jornal nacionalista The Nation sob o pseudônimo de Speranza e incitou o público, em seus poemas e artigos, à tomada do Castelo de Dublin. Existem circunstâncias relativas à gravidez de lady Wilde e à infância de seu filho que, aos olhos de alguns, explicam em parte a infeliz mania (se é que se pode chamar assim) que mais tarde o levaria à ruína; e ao menos é certo que a criança cresceu em uma atmosfera de insegurança e prodigalidade.", "h": 0}, {"i": 1629, "c": 23, "ct": "Oscar Wilde: o poeta de Salomé", "t": "A vida pública de Oscar Wilde começou na Universidade de Oxford, onde, na época de sua matrícula, um pomposo professor chamado Ruskin conduzia uma multidão de adolescentes anglo-saxões rumo à terra prometida da sociedade do futuro – levando um carrinho de mão. O temperamento suscetível de sua mãe reviveu no jovem rapaz, e, a começar por si mesmo, ele decidiu pôr em prática uma teoria do belo que era em parte original e em parte derivada dos livros de Pater e de Ruskin. Ele provocaria o escárnio do público ao proclamar e praticar uma reforma na indumentária e na aparência dos lares. Fez turnês de palestras nos Estados Unidos e nas províncias inglesas e se tornou o porta-voz da escola estética, enquanto à sua volta se formava a fantástica lenda do Apóstolo da Beleza. Seu nome evocaria na opinião pública uma vaga ideia de tons pastéis delicados, de uma vida embelezada pelas flores. O culto do girassol, sua flor favorita, espalhou-se entre as classes ociosas, e a arraia-miúda ouviria falar de sua famosa bengala branca de marfim reluzente de turquesas e de seu penteado neroniano.", "h": 0}, {"i": 1630, "c": 23, "ct": "Oscar Wilde: o poeta de Salomé", "t": "O modelo desse quadro reluzente era mais miserável do que julgavam os burgueses. De tempos em tempos, suas medalhas, troféus de sua juventude acadêmica, seriam penhoradas, e algumas vezes a jovem esposa do autor de epigramas precisaria pedir dinheiro emprestado ao vizinho para comprar sapatos. Wilde foi obrigado a aceitar um emprego como editor de um jornal bastante inexpressivo, e apenas com a encenação de suas brilhantes comédias ele entraria na breve fase final de sua vida – de luxo e riqueza. O leque de lady Windermere tomou Londres de assalto. Na tradição dos comediógrafos irlandeses, que vai desde Sheridan e Goldsmith a Bernard Shaw, Wilde se tornaria, como eles, um bobo da corte dos ingleses. Ele se tornaria o padrão de elegância na metrópole, e os rendimentos anuais de seus escritos chegariam a quase meio milhão de francos. Ele esbanjou seu ouro com uma série de amizades indignas. A cada manhã, ele comprava duas flores caríssimas, uma para si mesmo e outra para seu cocheiro; e, até o dia de seu julgamento sensacionalista, ele foi conduzido ao tribunal em uma carruagem de dois cavalos por um cocheiro brilhantemente trajado e um pajem empoado.", "h": 0}, {"i": 1631, "c": 23, "ct": "Oscar Wilde: o poeta de Salomé", "t": "Sua decadência foi saudada com uivos de alegria puritana. Diante da notícia de sua condenação, a multidão reunida do lado de fora do tribunal começou a dançar uma pavana na rua enlameada. Repórteres de jornais tiveram acesso à prisão, e pela janela de sua cela alimentaram o espetáculo de sua vergonha. Faixas brancas cobriram seu nome nos cartazes dos teatros. Seus amigos o abandonaram. Seus manuscritos foram roubados, enquanto ele recontava na prisão a dor que lhe fora infligida por dois anos de trabalhos forçados. Sua mãe morreu na obscuridade. Sua esposa morreu. Foi declarada sua falência e seus bens foram vendidos em leilão. Seus filhos lhe foram tomados. Quando ele saiu da prisão, capangas contratados pelo nobre marquês de Queensbury esperavam-no em uma emboscada. Perseguiram-no de casa em casa, como cães atrás de um coelho. Todas as portas se fecharam, todos lhe recusaram pão e teto, e, ao anoitecer, enfim, ele acabou indo parar embaixo da janela de seu irmão, chorando e balbuciando como uma criança.", "h": 0}, {"i": 1632, "c": 23, "ct": "Oscar Wilde: o poeta de Salomé", "t": "O epílogo rapidamente chegou ao fim, e não vale a pena acompanhar o infeliz dos cortiços de Nápoles até seu quarto pobre no Quartier Latin, onde ele morreria de meningite no último mês do último ano do século XIX . Não vale a pena seguir cada um de seus passos, como os espiões franceses fizeram. Ele morreu católico romano, agregando outra faceta à sua vida pública ao repudiar sua doutrina rebelde. Depois de zombar dos ídolos do mercado, ele se ajoelhou, triste e arrependido por ter sido um dia o cantor da divindade da alegria, e fechou o livro da rebelião de seu espírito com um ato de devoção espiritual.", "h": 0}, {"i": 1633, "c": 23, "ct": "Oscar Wilde: o poeta de Salomé", "t": "Este não é o lugar para examinar o estranho problema da vida de Oscar Wilde, nem para determinar até que ponto a hereditariedade e a tendência epiléptica de seu sistema nervoso podem desculpar aquilo que foi imputado a ele. Se era inocente ou culpado das acusações que lhe foram feitas, sem dúvida ele foi um bode expiatório. Seu maior crime foi ter causado um escândalo na Inglaterra, e sabe-se muito bem que as autoridades inglesas fizeram o possível para convencê-lo a fugir antes que emitissem sua ordem de prisão. Um funcionário do Ministério do Interior afirmou durante o julgamento que, apenas em Londres, existiam mais de 20 mil pessoas vigiadas pela polícia, mas que viviam soltas enquanto não causassem escândalo. As cartas de Wilde a seus amigos foram lidas no tribunal, e o autor foi denunciado como um degenerado obcecado por perversões exóticas: “O tempo tem ciúmes de você e está em guerra contra os seus lírios e rosas. Adoro vê-lo caminhando pelos vales cheios de violetas, com o brilho de seus cabelos cor de mel”. Mas a verdade é que Wilde, longe de ser um monstro pervertido surgido de forma inexplicável da civilização da Inglaterra moderna, é o produto lógico e inevitável do sistema escolar e universitário anglo-saxão, com seus segredos e suas restrições.", "h": 0}, {"i": 1634, "c": 23, "ct": "Oscar Wilde: o poeta de Salomé", "t": "A condenação de Wilde pelo povo inglês se origina de muitas causas complexas; mas não foi simples reação de uma consciência limpa. Qualquer um que analise os graffiti , os desenhos eróticos e os gestos licenciosos daquelas pessoas hesitará em acreditar que tenham um coração puro. Qualquer um que acompanhe de perto a vida e a linguagem dos homens, seja nas casernas dos soldados ou nas grandes casas comerciais, hesitará em acreditar que aqueles que atiraram pedras em Wilde fossem imaculados. Na verdade, todos nos sentimos desconfortáveis ao falar sobre esse assunto com as outras pessoas, com receio de que o ouvinte possa saber mais do que nós a respeito. A defesa que o próprio Oscar Wilde fez de si mesmo, no Scots Observer , deveria permanecer válida ao juízo de um crítico objetivo. Cada um de nós, ele escreveu, vê seu próprio pecado em Dorian Gray (o romance mais conhecido de Wilde). Qual foi o pecado de Dorian Gray, isso ninguém diz e ninguém sabe. Quem o reconhece é porque o cometeu.", "h": 0}, {"i": 1635, "c": 23, "ct": "Oscar Wilde: o poeta de Salomé", "t": "Aqui tocamos o pulso da arte de Wilde – o pecado. Ele enganou a si mesmo ao acreditar ser o portador da boa-nova do neopaganismo para um povo escravizado. Suas próprias qualidades mais distintas, as qualidades, talvez, de sua raça – perspicácia, generosidade e um intelecto assexuado –, ele as pôs a serviço de uma teoria do belo que, segundo ele, traria de volta a Idade de Ouro e a alegria da juventude do mundo. Mas se alguma verdade permanece de suas interpretações subjetivas de Aristóteles, de seu pensamento irrequieto que procede por sofismas mais do que por silogismos, de suas assimilações de naturezas tão diferentes da sua quanto o delinquente é do humilde, em seu verdadeiro fundamento, é a verdade inerente à alma do catolicismo: a de que o homem não pode alcançar o coração divino senão através dessa noção de separação e perda chamada pecado.", "h": 0}, {"i": 1636, "c": 23, "ct": "Oscar Wilde: o poeta de Salomé", "t": "Em seu último livro, De profundis , ele se ajoelha diante de um Cristo gnóstico, ressuscitado das páginas apócrifas da Casa das Romãs , e então sua verdadeira alma, trêmula, tímida e contrita, brilha através do manto de Heliogábalo. Sua lenda fantástica, sua opera – uma variação polifônica sobre a relação entre arte e natureza, mas ao mesmo tempo uma revelação de sua própria psique –, seus livros brilhantes cintilando de epigramas (que fizeram dele, na opinião de algumas pessoas, o orador mais penetrante de seu século), estes são agora um butim dividido.", "h": 0}, {"i": 1637, "c": 23, "ct": "Oscar Wilde: o poeta de Salomé", "t": "Um versículo do livro de Jó foi entalhado em sua lápide no empobrecido cemitério de Bagneux. É um elogio de sua eloquência, eloquium suum – o grande manto lendário que hoje é um butim dividido. Talve o futuro entalhe também outro verso, menos orgulhoso, porém mais piedoso:", "h": 0}, {"i": 1638, "c": 23, "ct": "Oscar Wilde: o poeta de Salomé", "t": "– Partiti sunt sibi vestimenta mea et super", "h": 0}, {"i": 1639, "c": 23, "ct": "Oscar Wilde: o poeta de Salomé", "t": "vestem meam miserunt sortis .", "h": 0}, {"i": 1640, "c": 23, "ct": "Oscar Wilde: o poeta de Salomé", "t": "[Repartem entre si as minhas roupas", "h": 0}, {"i": 1641, "c": 23, "ct": "Oscar Wilde: o poeta de Salomé", "t": "e sobre elas tiram a sorte.]", "h": 0}, {"i": 1642, "c": 23, "ct": "Oscar Wilde: o poeta de Salomé", "t": "* Em março de 1909, quando vivia em Trieste, James Joyce assistiu à montagem da ópera Salomé , de Richard Strauss, inspirada na peça teatral homônima de Oscar Wilde. No dia 24, Joyce escreveu, em italiano, este artigo para o jornal Il Piccolo della Sera . Mais tarde, no mesmo ano, os restos mortais de Wilde seriam transferidos para o cemitério Père Lachaise de Paris, onde se encontram até hoje, e a inscrição seria substituída por um verso da Balada do cárcere de Reading . [N. T.]", "h": 0}, {"i": 1643, "c": 24, "ct": "Sumário", "t": "Sumário", "h": 1}, {"i": 1644, "c": 25, "ct": "Mulherzinhas - Adoráveis Mulheres - Edição integral", "t": "Mulherzinhas - Adoráveis Mulheres - Edição integral", "h": 1}, {"i": 1645, "c": 25, "ct": "Mulherzinhas - Adoráveis Mulheres - Edição integral", "t": "Alcott, Louisa May", "h": 0}, {"i": 1646, "c": 25, "ct": "Mulherzinhas - Adoráveis Mulheres - Edição integral", "t": "9788567097831", "h": 0}, {"i": 1647, "c": 25, "ct": "Mulherzinhas - Adoráveis Mulheres - Edição integral", "t": "464 páginas", "h": 0}, {"i": 1648, "c": 25, "ct": "Mulherzinhas - Adoráveis Mulheres - Edição integral", "t": "Compre agora e leia", "h": 0}, {"i": 1649, "c": 25, "ct": "Mulherzinhas - Adoráveis Mulheres - Edição integral", "t": "Obra-prima de Louisa May Alcott, Mulherzinhas é uma emocionante trama que reúne drama familiar, romance histórico e inspirações autobiográficas. No auge da Guerra Civil Americana, o senhor March se junta às frentes de batalha. Em casa, suas filhas têm de conviver com as dificuldades econômicas e a busca pela realização de seus sonhos. Meg almeja um bom casamento. Beth quer apenas ajudar os pais nos cuidados do lar. Amy, a mais jovem, sonha com riqueza e status, enquanto a impulsiva Jo deseja ser escritora — em uma versão semibiográfica da própria A
