ro.", "h": 0}, {"i": 499, "c": 7, "ct": "Capítulo V", "t": "– O senhor Isaacs nos adiantou cinquenta libras para pagarmos nossas dívidas e para arranjarmos roupas adequadas para o James. Você não pode se esquecer disso, Sibyl. Cinquenta libras é uma quantia muito alta. O senhor Isaacs tem tido muita consideração conosco.", "h": 0}, {"i": 500, "c": 7, "ct": "Capítulo V", "t": "– Ele não é um cavalheiro, mamãe, e eu odeio o modo como ele fala comigo – disse a menina, pondo-se em pé, e indo até a janela.", "h": 0}, {"i": 501, "c": 7, "ct": "Capítulo V", "t": "– Não sei como eu teria feito sem ele – respondeu a senhora, queixosamente.", "h": 0}, {"i": 502, "c": 7, "ct": "Capítulo V", "t": "Sibyl Vane jogou a cabeça para trás e deu risada. – Nós não queremos mais nada com ele, mamãe. O meu Príncipe Encantado mandará na nossa vida agora – então ela fez uma pausa. Uma rosa se agitou em seu sangue e sombreou suas faces. A respiração ofegante separou as pétalas de seus lábios. Estremeceram. Algum vento meridional de paixão percorreu seu corpo e buliu com as pregas delicadas de seu vestido. – Eu o amo – ela disse, simplesmente.", "h": 0}, {"i": 503, "c": 7, "ct": "Capítulo V", "t": "– Menina boba! Menina boba! – foi a frase papagueada em resposta. A agitação dos dedos tortos e ornados de joias falsas emprestou um tom grotesco às palavras.", "h": 0}, {"i": 504, "c": 7, "ct": "Capítulo V", "t": "A menina tornou a rir. Havia em sua voz a alegria de um pássaro engaiolado. Seus olhos captaram a melodia e ecoaram-na com radiâncias; então se fecharam por um momento, como se tentassem ocultar seus próprios segredos. Quando se abriram, a bruma de um sonho havia passado por eles.", "h": 0}, {"i": 505, "c": 7, "ct": "Capítulo V", "t": "A sabedoria dos lábios cruéis lhe falou desde a velha poltrona, sugerindo prudência, citando daquele livro da covardia que o autor macaqueia com o nome de senso comum. Ela não deu ouvidos. Ela estava livre em sua prisão da paixão. Seu príncipe, o Príncipe Encantado, estava consigo. Ela recorreu à memória para reconstruí-lo. Mandara sua alma procurar por ele e sua alma o trouxera de volta. O beijo dele ardeu novamente em sua boca. Suas pálpebras ficaram quentes com o hálito dele.", "h": 0}, {"i": 506, "c": 7, "ct": "Capítulo V", "t": "Então a sabedoria mudou de método e falou em observação e descoberta. Aquele rapaz podia ser rico. Se fosse, o casamento devia ser considerado. Contra a concha de seus ouvidos, chocaram-se as ondas da astúcia mundana. As flechas do artifício se cravaram ao seu lado. Ela viu aqueles lábios finos se movendo e sorriu.", "h": 0}, {"i": 507, "c": 7, "ct": "Capítulo V", "t": "De repente, ela sentiu necessidade de falar. Aquele silêncio palavroso a incomodou. – Mamãe, mamãe – ela exclamou –, por que ele me ama tanto assim? Eu sei por que o amo. Amo-o porque ele é tudo aquilo que o amor deveria ser. Mas o que ele vê em mim? Não o mereço. E, no entanto, não sei por que, embora eu me sinta muito abaixo dele, não me sinto humilde. Sinto-me orgulhosa, terrivelmente orgulhosa. Mamãe, a senhora amava o meu pai como eu amo o meu Príncipe Encantado?", "h": 0}, {"i": 508, "c": 7, "ct": "Capítulo V", "t": "A senhora ficou pálida por baixo da grossa camada de pó que empoava suas faces, e seus lábios secos estremeceram com um espasmo de dor. Sibyl acudiu a mãe, prontamente a abraçou e a beijou. – Perdão, mamãe. Sei que a senhora não gosta de falar sobre o papai. Mas a senhora sofre porque o amava demais. Não fique tão triste. Estou tão feliz agora quanto a senhora há vinte anos. Ah! Deixe-me ser feliz para sempre!", "h": 0}, {"i": 509, "c": 7, "ct": "Capítulo V", "t": "– Minha filha, você é muito jovem para pensar em se apaixonar. Além do mais, o que você sabe sobre esse rapaz? Você nem sabe o nome dele. Realmente, essa história toda é muito inconveniente, agora que o James está indo embora para a Austrália, e eu tenho que pensar em tanta coisa, devo dizer que você deveria mostrar mais consideração por mim. No entanto, como eu disse, se ele for rico…", "h": 0}, {"i": 510, "c": 7, "ct": "Capítulo V", "t": "– Ah! Mamãe, mamãe, deixe-me ser feliz!", "h": 0}, {"i": 511, "c": 7, "ct": "Capítulo V", "t": "A senhora Vane olhou para ela e, com um daqueles falsos gestos teatrais que amiúde se tornam uma espécie de segunda natureza para uma atriz, abraçou subitamente a filha. Nesse momento, a porta se abriu, e um jovem rapaz de cabelos castanhos desgrenhados entrou na sala. Era um sujeito corpulento, e suas mãos e pés também eram grandes, e seus movimentos pareciam um tanto desajeitados. Não era tão bem-apessoado quanto a irmã. Dificilmente alguém adivinharia o íntimo parentesco que existia entre os dois. A senhora Vane olhou fixamente para ele e reforçou o sorriso. Mentalmente, elevava o filho à dignidade de uma plateia. Ela tinha certeza de que o tableau era interessante.", "h": 0}, {"i": 512, "c": 7, "ct": "Capítulo V", "t": "– Acho que você poderia guardar alguns desses beijos para mim, Sibyl – disse o rapaz, com um resmungo bem-humorado.", "h": 0}, {"i": 513, "c": 7, "ct": "Capítulo V", "t": "– Ah! Mas você nunca gostou de ser beijado, Jim – ela exclamou. – Você sempre foi um velho urso mal-humorado – e ela correu até ele e o abraçou.", "h": 0}, {"i": 514, "c": 7, "ct": "Capítulo V", "t": "James Vane olhou para a irmã com ternura. – Venha, Sibyl, quero dar uma volta com você. Acho que não verei mais essa Londres horrorosa. Certamente não vou querer mais voltar aqui.", "h": 0}, {"i": 515, "c": 7, "ct": "Capítulo V", "t": "– Meu filho, não diga uma coisa horrível dessas – murmurou a senhora Vane, apanhando um chamativo vestido de cena, com um suspiro, e começando a remendá-lo. Ficara um pouco frustrada por ele não se juntar à trupe. A presença dele teria acentuado o dramático pitoresco da situação.", "h": 0}, {"i": 516, "c": 7, "ct": "Capítulo V", "t": "– Por que não, mamãe? É justamente minha intenção.", "h": 0}, {"i": 517, "c": 7, "ct": "Capítulo V", "t": "– Você me magoa assim, meu filho. Espero que você volte da Austrália em uma posição afluente. Imagino que não exista nenhum tipo de sociedade nas colônias, nada que se possa chamar de sociedade; de modo que, depois de fazer fortuna, você deve voltar e se afirmar em Londres.", "h": 0}, {"i": 518, "c": 7, "ct": "Capítulo V", "t": "– Sociedade! – murmurou o rapaz. – Não quero nem saber dessas coisas. Quero ganhar dinheiro para tirar a senhora e a Sibyl do teatro. Odeio essa vida.", "h": 0}, {"i": 519, "c": 7, "ct": "Capítulo V", "t": "– Oh, Jim! – disse Sibyl, rindo. – Que maldade! Mas você quer mesmo dar uma volta comigo? Eu adoraria! Eu temia que você quisesse se despedir de alguns amigos – do Tom Hardy, que lhe deu aquele cachimbo horroroso, ou do Ned Langton, que zomba de você por fumá-lo. É muita gentileza sua passar comigo a sua última tarde. Aonde podemos ir? Vamos ao parque.", "h": 0}, {"i": 520, "c": 7, "ct": "Capítulo V", "t": "– Estou todo desarrumado – ele respondeu, franzindo o cenho. – Só tem gente elegante no parque.", "h": 0}, {"i": 521, "c": 7, "ct": "Capítulo V", "t": "– Bobagem, Jim – ela sussurrou, ajeitando a manga do paletó do irmão.", "h": 0}, {"i": 522, "c": 7, "ct": "Capítulo V", "t": "Ele hesitou por um momento. – Pois bem – ele disse enfim –, mas não demore muito para se vestir. Ela saiu dançando da sala. Podia-se ouvi-la cantar enquanto subia correndo as escadas. Seus pezinhos sapateavam no andar de cima.", "h": 0}, {"i": 523, "c": 7, "ct": "Capítulo V", "t": "Ele deu duas ou três voltas pela sala. Então se virou para a figura imóvel na poltrona. – Mãe, as minhas coisas estão prontas? – ele perguntou.", "h": 0}, {"i": 524, "c": 7, "ct": "Capítulo V", "t": "– Estão, James – ela respondeu, cabisbaixa, sem tirar os olhos da costura. Havia alguns meses que ela vinha se sentindo incomodada quando ficava sozinha com a rispidez de seu filho mais duro. O lado superficial e secreto da mãe se perturbava quando cruzavam o olhar. Ela se perguntava se ele desconfiava de alguma coisa. O silêncio, pois ele não dissera mais nada, ficou insuportável para ela. Começou a reclamar. As mulheres se defendem atacando, assim como atacam por meio de súbitas e estranhas rendições. – Espero que você fique satisfeito, James, com essa vida marítima – ela disse. – Você não se esqueça de que foi escolha sua. Você podia ter entrado em um escritório de advocacia. Os advogados são uma classe muito respeitável, e no interior geralmente jantam com as melhores famílias.", "h": 0}, {"i": 525, "c": 7, "ct": "Capítulo V", "t": "– Odeio escritórios, odeio advogados – ele respondeu. – Mas a senhora tem razão. Foi uma escolha minha. A única coisa que lhe peço é que cuide da Sibyl. Não deixe que nada de mal lhe aconteça. Mãe, a senhora precisa cuidar dela.", "h": 0}, {"i": 526, "c": 7, "ct": "Capítulo V", "t": "– James, é realmente estranho você dizer isso. É claro que vou cuidar da Sibyl.", "h": 0}, {"i": 527, "c": 7, "ct": "Capítulo V", "t": "– Ouvi dizer que há um cavalheiro que aparece toda noite no teatro e depois vai ao camarim conversar com ela. É isso mesmo? O que a senhora sabe a respeito disso?", "h": 0}, {"i": 528, "c": 7, "ct": "Capítulo V", "t": "– Você está falando de uma coisa sobre a qual você não entende nada, James. Nesse meio, estamos acostumadas a receber um bocado de atenção de pessoas muito gratas. Eu mesma costumava receber muitos buquês ao mesmo tempo. Isso no tempo em que as pessoas realmente entendiam de teatro. Quanto à Sibyl, no momento não sei se esse relacionamento dela é sério ou não. Mas não tenha dúvida de que o rapaz em questão é um perfeito cavalheiro. Sempre muito educado comigo. Além disso, ele parece ser rico, e as flores que ele envia são adoráveis.", "h": 0}, {"i": 529, "c": 7, "ct": "Capítulo V", "t": "– Então a senhora nem sabe o nome dele – disse o rapaz, bruscamente.", "h": 0}, {"i": 530, "c": 7, "ct": "Capítulo V", "t": "– Não – respondeu a mãe, com uma expressão plácida no semblante. – Ele ainda não revelou seu verdadeiro nome. Acho que é muito romântico da parte dele. Provavelmente pertence à aristocracia.", "h": 0}, {"i": 531, "c": 7, "ct": "Capítulo V", "t": "James Vane se calou.", "h": 0}, {"i": 532, "c": 7, "ct": "Capítulo V", "t": "– Cuide da Sibyl, mãe – ele exclamou –, cuide dela.", "h": 0}, {"i": 533, "c": 7, "ct": "Capítulo V", "t": "– Meu filho, você me deixa muito triste. Sibyl está sempre sendo bem cuidada por mim. É claro, se esse cavalheiro for rico, não haveria motivo para ela não contrair compromisso com ele. Creio se tratar de um aristocrata. Devo dizer que ele tem toda a aparência de ser. Seria um casamento perfeito para Sibyl. Formariam um par lindo. A beleza do moço é realmente notável; não há quem não repare nos dois.", "h": 0}, {"i": 534, "c": 7, "ct": "Capítulo V", "t": "O rapaz murmurou algo consigo mesmo e tamborilou na janela com os dedos grosseiros. Ele havia acabado de se virar para dizer alguma coisa quando a porta se abriu, e Sibyl entrou correndo na sala.", "h": 0}, {"i": 535, "c": 7, "ct": "Capítulo V", "t": "– Como vocês estão sérios! – ela exclamou. – Qual é o problema?", "h": 0}, {"i": 536, "c": 7, "ct": "Capítulo V", "t": "– Nada – ele respondeu. – Imagino que às vezes é preciso ser sério. Adeus, mãe; jantarei às cinco. Está tudo na mala, exceto as camisas, então não precisa se preocupar.", "h": 0}, {"i": 537, "c": 7, "ct": "Capítulo V", "t": "– Adeus, meu filho – ela respondeu, com uma mesura de esforçada dignidade. Estava extremamente irritada com o tom que o filho adotara consigo, e havia algo na expressão dele que lhe dava medo.", "h": 0}, {"i": 538, "c": 7, "ct": "Capítulo V", "t": "– Beije-me, mamãe – disse a menina. Seus lábios de flor tocaram a face ressequida da mãe, e lhe aqueceram o gelo.", "h": 0}, {"i": 539, "c": 7, "ct": "Capítulo V", "t": "– Minha menina! minha menina! – exclamou a senhora Vane, olhando para o teto como se visse camarotes imaginários.", "h": 0}, {"i": 540, "c": 7, "ct": "Capítulo V", "t": "– Vamos, Sibyl – disse o irmão, impaciente. Odiava as afetações da mãe.", "h": 0}, {"i": 541, "c": 7, "ct": "Capítulo V", "t": "Eles saíram à luz do sol bruxuleante ao vento e caminharam pela triste Euston Road. Os transeuntes olhavam espantados para o taciturno rapaz que, em roupas rústicas e mal-ajambradas, passeava na companhia de uma menina tão graciosa e refinada. Parecia um pobre jardineiro passeando com uma rosa.", "h": 0}, {"i": 542, "c": 7, "ct": "Capítulo V", "t": "De quando em quando, Jim franzia o cenho ao notar o olhar inquisitivo de algum desconhecido. Ele tinha aquele ódio de ser encarado que os gênios só sentem no final da vida, e que as pessoas comuns nunca deixam de sentir. Sibyl, no entanto, não parecia ter consciência do efeito que estava causando. Seu amor estremecia em risos em seus lábios. Ela estava pensando no Príncipe Encantado e, ainda que estivesse pensando nele, não falava sobre ele, mas tagarelava sobre o navio em que Jim iria zarpar, sobre o ouro que certamente iria encontrar, sobre a maravilhosa herdeira que o irmão salvaria dos cruéis renegados de camisas vermelhas. Pois ele não haveria de continuar na marinha mercante para sempre, como supervisor de carga, ou coisa que o valha. Oh, não! A vida de marujo é pavorosa. Imagine-se preso em um navio horrendo, com as ondas imensas rugindo, tentando entrar, e um vento negro derrubando os mastros e rasgando as velas em longas tiras tremulantes! Ele desembarcaria em Melbourne, daria um educado adeus ao capitão e partiria imediatamente rumo às minas de ouro. No máximo dentro de uma semana, ele encontraria uma grande pepita de ouro puro, a maior pepita jamais descoberta, e a levaria para a costa em uma carroça protegida por seis policiais montados. Os renegados atacariam três vezes e seriam derrotados em um grande massacre. Ou não. Ele não iria a mina de ouro nenhuma. Eram todos lugares horrendos, onde os homens se intoxicavam e se baleavam nos bares e usavam termos chulos. Ele seria, isso sim, um simpático criador de ovelhas, e uma tarde, enquanto voltava para casa a cavalo, veria uma bela herdeira sendo raptada por um ladrão em um cavalo preto, e o perseguiria e a salvaria. Evidentemente, ela se apaixonaria por ele, e ele por ela, e eles se casariam, e voltariam, e viveriam em uma imensa casa em Londres. Sim, o futuro ainda lhe reservava coisas magníficas. Mas ele precisaria ser muito bom e não perder a cabeça, nem gastar seu dinheiro estupidamente. Ela era apenas um ano mais velha que ele, mas conhecia muito mais da vida. Ele deveria também lhe escrever sempre e sem falta e rezar toda noite antes de dormir. Deus era muito bom e olharia por ele. Ela também rezaria pelo irmão e, dentro de alguns poucos anos, ele voltaria muito rico e feliz.", "h": 0}, {"i": 543, "c": 7, "ct": "Capítulo V", "t": "O rapaz a ouviu desconsoladamente e não disse nada em resposta. Estava sofrendo por ir embora de casa.", "h": 0}, {"i": 544, "c": 7, "ct": "Capítulo V", "t": "Mas não era apenas isso que o deixava tristonho e melancólico. Mesmo inexperiente como era, tinha uma forte noção do perigo da posição de Sibyl. Aquele jovem dândi apaixonado não podia ter nenhuma boa intenção com ela. Tratava-se de um cavalheiro, e ele o odiava por isso, odiava-o por um curioso instinto racial que não saberia explicar, e que justamente por esse motivo era ainda mais dominante dentro de si. Ele conhecia também a futilidade e a vaidade da mãe e nisso enxergava um risco infinito para Sibyl e para a felicidade de Sibyl. As crianças começam amando os pais; conforme vão ficando mais velhas, passam a julgá-los; e às vezes os perdoam.", "h": 0}, {"i": 545, "c": 7, "ct": "Capítulo V", "t": "A mãe! Ele tinha algo para lhe perguntar, algo que ficara ruminando por muitos meses em silêncio. Uma frase entreouvida por acaso no teatro, um comentário maldoso sussurrado que lhe chegara aos ouvidos certa noite enquanto esperava na entrada das coxias, desencadeara uma série de pensamentos horríveis. Ficara com aquilo gravado como o vergão de um chicote de caça em seu rosto. Suas sobrancelhas se juntaram formando um único sulco na testa, e com um esgar de dor ele mordeu o lábio inferior.", "h": 0}, {"i": 546, "c": 7, "ct": "Capítulo V", "t": "– Você não ouviu uma palavra do que eu estou falando, Jim – exclamou Sibyl –,e estou fazendo planos maravilhosos para o seu futuro. Diga alguma coisa.", "h": 0}, {"i": 547, "c": 7, "ct": "Capítulo V", "t": "– O que você quer que eu diga?", "h": 0}, {"i": 548, "c": 7, "ct": "Capítulo V", "t": "– Oh! Que você será um bom menino e não se esquecerá de nós – ela respondeu, sorrindo para ele.", "h": 0}, {"i": 549, "c": 7, "ct": "Capítulo V", "t": "Ele deu de ombros.", "h": 0}, {"i": 550, "c": 7, "ct": "Capítulo V", "t": "– É mais provável você se esquecer de mim do que eu de você, Sibyl.", "h": 0}, {"i": 551, "c": 7, "ct": "Capítulo V", "t": "Ela enrubesceu.", "h": 0}, {"i": 552, "c": 7, "ct": "Capítulo V", "t": "– Como assim, Jim? – ela perguntou.", "h": 0}, {"i": 553, "c": 7, "ct": "Capítulo V", "t": "– Fiquei sabendo que você tem um novo amigo. Quem é ele? Por que você não me contou nada sobre ele? Ele não tem nenhuma boa intenção com você.", "h": 0}, {"i": 554, "c": 7, "ct": "Capítulo V", "t": "– Pare, Jim! – ela exclamou. – Você não pode dizer nada contra ele. Eu o amo.", "h": 0}, {"i": 555, "c": 7, "ct": "Capítulo V", "t": "– Ora, mas você nem sabe o nome dele – respondeu o rapaz. – Quem é ele? Eu tenho o direito de saber.", "h": 0}, {"i": 556, "c": 7, "ct": "Capítulo V", "t": "– Ele se chama Príncipe Encantado. Você não gostou do nome? Oh!, seu menino bobo! Você jamais esqueceria. Se você o conhecesse, acharia que é a pessoa mais maravilhosa do mundo. Algum dia você o conhecerá: quando você voltar da Austrália. Você gostará demais dele. Todo mundo gosta dele, e eu… sou apaixonada por ele. Quem dera você pudesse ir hoje ao teatro. Ele estará lá, e eu farei Julieta. Oh! como a interpretarei! Imagine, Jim, estar apaixonada e fazer Julieta! Com ele sentado ali! Atuar para agradá-lo! Receio até assustar a trupe, assustar ou cativar. Amar é superar a si mesmo. O pobre e pavoroso senhor Isaacs gritará “genial” a seus fregueses no bar. Ele me apregoou como um dogma; hoje me anunciará como uma revelação. Já posso sentir. E isso tudo se deve a ele, apenas a ele, o Príncipe Encantado, meu namorado maravilhoso, meu deus das graças. Mas eu sou pobre ao lado dele. Pobre? Que importa? Quando a pobreza entra pela porta, o amor sai voando pela janela. Nossos provérbios precisam ser reescritos. Eles foram feitos no inverno e agora é verão; para mim é primavera, uma verdadeira dança das flores no céu azul.", "h": 0}, {"i": 557, "c": 7, "ct": "Capítulo V", "t": "– Ele é um cavalheiro – disse o rapaz, soturnamente.", "h": 0}, {"i": 558, "c": 7, "ct": "Capítulo V", "t": "– Um príncipe! – ela exclamou, musicalmente. – O que mais você quer?", "h": 0}, {"i": 559, "c": 7, "ct": "Capítulo V", "t": "– Ele pretende escravizá-la.", "h": 0}, {"i": 560, "c": 7, "ct": "Capítulo V", "t": "– Estremeço só de pensar em ser livre.", "h": 0}, {"i": 561, "c": 7, "ct": "Capítulo V", "t": "– Quero que você tome cuidado.", "h": 0}, {"i": 562, "c": 7, "ct": "Capítulo V", "t": "– Basta vê-lo para idolatrá-lo; conhecê-lo, para confiar nele.", "h": 0}, {"i": 563, "c": 7, "ct": "Capítulo V", "t": "– Sibyl, você ficou louca por esse rapaz.", "h": 0}, {"i": 564, "c": 7, "ct": "Capítulo V", "t": "Ela deu risada e tomou o braço do irmão. – Meu velho e querido Jim, você fala como se tivesse cem anos de idade. Algum dia você também vai se apaixonar. Então vai saber do que estou falando. Não seja tão ranzinza. Você deveria estar contente porque, apesar de você estar indo embora, vai me deixar mais feliz do que eu já fui na vida. A vida foi dura para nós dois, terrivelmente dura e difícil. Mas agora será diferente. Você vai para um novo mundo, e eu também descobri um. Eis aqui duas cadeiras; vamos nos sentar e olhar as pessoas elegantes que passam.", "h": 0}, {"i": 565, "c": 7, "ct": "Capítulo V", "t": "Sentaram-se em meio a uma multidão de observadores. Os canteiros de tulipas margeando a rua flamejavam como anéis de fogo pulsantes. Uma poeira branca, parecendo uma nuvem trêmula de pó de raiz de lírio, pairava no ar pesado. Sombrinhas de cores berrantes subiam e desciam como uma dança de monstruosas borboletas.", "h": 0}, {"i": 566, "c": 7, "ct": "Capítulo V", "t": "Ela obrigou o irmão a falar de si mesmo, de suas esperanças, suas perspectivas. Ele falava lentamente e com esforço. Trocavam palavras como jogadores durante uma partida trocam peças. Sibyl se sentiu oprimida. Não conseguia lhe comunicar sua alegria. Um discreto sorriso curvando aquela boca sombria foi o único eco que ela conseguiu obter dele. Depois de algum tempo, ela se calou. Subitamente, ela viu de relance uma cabeleira dourada e uns lábios sorridentes, e, numa carruagem aberta com duas mulheres, Dorian Gray passou.", "h": 0}, {"i": 567, "c": 7, "ct": "Capítulo V", "t": "Ela se pôs de pé de repente. – Lá está ele! – ela exclamou.", "h": 0}, {"i": 568, "c": 7, "ct": "Capítulo V", "t": "– Quem? – disse Jim Vane.", "h": 0}, {"i": 569, "c": 7, "ct": "Capítulo V", "t": "– O Príncipe Encantado – ela respondeu, procurando a carruagem.", "h": 0}, {"i": 570, "c": 7, "ct": "Capítulo V", "t": "Ele se ergueu com um pulo e a agarrou bruscamente pelo braço.", "h": 0}, {"i": 571, "c": 7, "ct": "Capítulo V", "t": "– Mostre-me quem é. Qual deles? Aponte. Preciso vê-lo! – ele exclamou, mas, nesse exato momento, a carruagem de quatro cavalos do duque de Berwick se interpôs e, quando finalmente se moveu, a outra carruagem havia saído do parque.", "h": 0}, {"i": 572, "c": 7, "ct": "Capítulo V", "t": "– Ele foi embora – murmurou Sibyl, tristemente. – Queria que você o tivesse visto.", "h": 0}, {"i": 573, "c": 7, "ct": "Capítulo V", "t": "– Eu queria tê-lo visto, pois tão certamente quanto existe Deus no céu, se ele algum dia lhe fizer algum mal, vou matá-lo.", "h": 0}, {"i": 574, "c": 7, "ct": "Capítulo V", "t": "Ela olhou para o irmão horrorizada. Ele repetiu as últimas palavras. Elas cortaram o ar como uma faca. As pessoas ao redor se voltaram boquiabertas. Uma senhora parada ao lado dela tentou conter o riso.", "h": 0}, {"i": 575, "c": 7, "ct": "Capítulo V", "t": "– Vamos, Jim; vamos embora – ela sussurrou. Ele a seguiu obstinadamente, passando através da multidão. Estava satisfeito com o que dissera à irmã.", "h": 0}, {"i": 576, "c": 7, "ct": "Capítulo V", "t": "Quando eles chegaram à estátua de Aquiles, ela se virou. Havia uma compaixão em seus olhos, que se tornou sorriso em seus lábios. Ela balançou a cabeça diante dele. – Jim, você é um bobo; completamente bobo; um menino briguento, só isso. Como você pode dizer essas coisas horríveis? Você não sabe do que está falando. Você é simplesmente ciumento e cruel. Ah! Queria que você também se apaixonasse. O amor torna as pessoas boas, e o que você disse foi maldade.", "h": 0}, {"i": 577, "c": 7, "ct": "Capítulo V", "t": "– Tenho dezesseis anos – ele respondeu –, e sei o que digo. A mamãe não vai lhe ajudar em nada. Ela não sabe cuidar de você. Agora eu queria não ir mais para a Austrália. Tive um grande trabalho para deixar tudo acertado. Eu cancelaria tudo se meus papéis já não tivessem sido assinados.", "h": 0}, {"i": 578, "c": 7, "ct": "Capítulo V", "t": "– Ora, não seja tão sério, Jim. Você parece aqueles heróis daqueles melodramas bobos em que a mamãe gostava tanto de atuar. Não vou brigar com você. Eu o vi e, oh! Poder vê-lo é a felicidade total. Não vamos brigar. Sei que você jamais machucaria alguém que eu amo, não é mesmo?", "h": 0}, {"i": 579, "c": 7, "ct": "Capítulo V", "t": "– Não, enquanto você o amar, imagino – foi a resposta taciturna.", "h": 0}, {"i": 580, "c": 7, "ct": "Capítulo V", "t": "– Vou amá-lo para sempre! – ela exclamou.", "h": 0}, {"i": 581, "c": 7, "ct": "Capítulo V", "t": "– E ele?", "h": 0}, {"i": 582, "c": 7, "ct": "Capítulo V", "t": "– Também me amará para sempre!", "h": 0}, {"i": 583, "c": 7, "ct": "Capítulo V", "t": "– É melhor que ame mesmo.", "h": 0}, {"i": 584, "c": 7, "ct": "Capítulo V", "t": "Ela se afastou repugnada. Então deu risada e pôs a mão no braço dele. Ele não passava de um menino.", "h": 0}, {"i": 585, "c": 7, "ct": "Capítulo V", "t": "No Marble Arch, eles tomaram um ônibus, que os deixou bem perto da velha casa da Euston Road. Já passava das cinco, e Sibyl precisava descansar algumas horas antes de entrar em cena. Jim insistiu que ela o fizesse. Disse que preferiria se despedir dela sem que a mãe estivesse presente. Seguramente ela faria uma cena, e ele detestava qualquer tipo de encenação.", "h": 0}, {"i": 586, "c": 7, "ct": "Capítulo V", "t": "No quarto de Sibyl, eles se despediram. Havia ciúmes no coração do rapaz, e um ódio feroz, assassino do desconhecido que aparentemente se interpusera entre eles. No entanto, quando os braços dela envolveram seu pescoço, e ela passou os dedos por seus cabelos, ele amoleceu e a beijou com genuína afeição. Havia lágrimas nos olhos dele quando desceu as escadas.", "h": 0}, {"i": 587, "c": 7, "ct": "Capítulo V", "t": "A mãe o esperava lá embaixo. Ela reclamou da falta de pontualidade do filho, assim que ele entrou na sala. Ele não disse nada, mas sentou para fazer uma parca refeição. As moscas zuniam em volta da mesa e se amontoavam sobre a toalha suja. Em meio ao rumor dos ônibus e o estardalhaço dos bondes, ele ficou ouvindo aquela voz sonolenta devorando cada minuto que lhe restava.", "h": 0}, {"i": 588, "c": 7, "ct": "Capítulo V", "t": "Após algum tempo, ele afastou o prato e levou as mãos à cabeça. Sentia que tinha direito de saber. Deviam ter lhe contado antes, se fosse como ele suspeitava. Carregada de medo, a mãe o observava. As palavras caíram mecanicamente de seus lábios. Um lenço rendado poído se retorcia entre seus dedos. Quando o relógio bateu seis horas, ele se levantou e foi em direção à porta. Então ele se virou e olhou para ela. Seus olhos se encontraram. Nos dela, ele viu um louco apelo por compaixão. Aquilo o enfureceu.", "h": 0}, {"i": 589, "c": 7, "ct": "Capítulo V", "t": "– Mãe, tenho uma coisa para lhe perguntar – ele disse. Os olhos dela divagaram pela sala. Ela não disse nada. – Diga-me a verdade. Eu tenho direito de saber. Você foi casada com meu pai?", "h": 0}, {"i": 590, "c": 7, "ct": "Capítulo V", "t": "Ela deixou escapar um suspiro profundo. Foi um suspiro de alívio. O momento terrível, o momento que noite e dia, por semanas e meses, a deixara apavorada, finalmente havia chegado e, no entanto, ela não sentia mais terror algum. Na verdade, em certa medida, foi uma decepção para ela. A franqueza vulgar da pergunta exigia uma resposta franca. A situação não havia se modificado gradualmente até um clímax. Fora brusca. Parecia um ensaio ruim.", "h": 0}, {"i": 591, "c": 7, "ct": "Capítulo V", "t": "– Não – ela respondeu, refletindo sobre a dura simplicidade da vida.", "h": 0}, {"i": 592, "c": 7, "ct": "Capítulo V", "t": "– Meu pai foi um canalha então? – exclamou o rapaz, cerrando os punhos.", "h": 0}, {"i": 593, "c": 7, "ct": "Capítulo V", "t": "Ela negou com a cabeça. – Eu sabia que ele não era solteiro. Nós nos amávamos muito. Se ele tivesse sobrevivido, teria nos deixado bem de vida. Não fale mal dele, meu filho. Ele era seu pai, e um cavalheiro. Na verdade, ele tinha conexões com a alta sociedade.", "h": 0}, {"i": 594, "c": 7, "ct": "Capítulo V", "t": "Uma praga saiu dos lábios dele. – Não me importo comigo – ele exclamou –, mas não deixe que a Sibyl… Esse outro também é um cavalheiro, esse que está apaixonado por ela, ou diz que está, não é? Muito bem relacionado, também, imagino.", "h": 0}, {"i": 595, "c": 7, "ct": "Capítulo V", "t": "Por um momento, a mãe sentiu uma humilhação medonha. Baixou os olhos. Enxugou-os com as mãos trêmulas. – A Sibyl tem mãe – ela murmurou. – Eu nunca tive.", "h": 0}, {"i": 596, "c": 7, "ct": "Capítulo V", "t": "O rapaz se comoveu. Foi até ela, ajoelhou-se diante dela e a beijou. – Sinto muito por magoá-la perguntando sobre meu pai – ele disse –, mas eu não pude evitar. Preciso ir agora. Adeus. Não se esqueça de que você só tem mais uma filha para cuidar, e pode acreditar que se esse sujeito fizer mal à minha irmã, vou descobrir quem ele é, encontrá-lo e matá-lo como a um cão. Juro.", "h": 0}, {"i": 597, "c": 7, "ct": "Capítulo V", "t": "A insensatez exacerbada da ameaça, o gesto passional que a acompanhou, as loucas palavras melodramáticas pareceram tornar-lhe a vida mais vívida. Ela estava familiarizada com aquela atmosfera. Respirou mais livremente e, pela primeira vez em muitos meses, ela realmente admirou o filho. Teria preferido continuar a cena na mesma escala emocional, mas ele a interrompeu. Precisava descer os baús e procurar os cachecóis. O carregador ficava entrando e saindo. Houve uma negociação com o cocheiro. O momento se perdeu em detalhes vulgares. Foi com renovada sensação de frustração que ela acenou com o velho lenço rendado da janela, enquanto o filho ia embora. Ela se deu conta de que uma grande oportunidade fora desperdiçada. Ela se consolou dizendo a Sibyl como sentia que sua vida seria desolada, agora que só tinha uma filha para cuidar. Lembrou-se da frase dele. Tinha gostado daquela frase. Sobre a ameaça, ela não disse nada. Foi uma frase dita de modo vívido e dramático. Na hora, ela sentiu que um dia dariam risada daquilo.", "h": 0}, {"i": 598, "c": 8, "ct": "Capítulo VI", "t": "Capítulo VI", "h": 1}, {"i": 599, "c": 8, "ct": "Capítulo VI", "t": "– Imagino que você já tenha ouvido a novidade, Basil? – disse lorde Henry naquela noite, enquanto Hallward era introduzido em uma pequena sala reservada no Bristol, onde a mesa do jantar havia sido posta para três.", "h": 0}, {"i": 600, "c": 8, "ct": "Capítulo VI", "t": "– Não, Harry – respondeu o artista, dando o chapéu e o casaco ao garçom que se inclinava. – O que foi? Nada de política, espero? Isso não me interessa. Não há uma única pessoa na Câmara dos Comuns que valha a pena pintar; embora muitos deles merecessem um pouco de cal.", "h": 0}, {"i": 601, "c": 8, "ct": "Capítulo VI", "t": "– Dorian Gray está noivo – disse lorde Henry, observando-o enquanto falava.", "h": 0}, {"i": 602, "c": 8, "ct": "Capítulo VI", "t": "Hallward teve um sobressalto e depois franziu o cenho. – Dorian está noivo! – ele exclamou. – É impossível!", "h": 0}, {"i": 603, "c": 8, "ct": "Capítulo VI", "t": "– É a pura verdade.", "h": 0}, {"i": 604, "c": 8, "ct": "Capítulo VI", "t": "– De quem?", "h": 0}, {"i": 605, "c": 8, "ct": "Capítulo VI", "t": "– Uma atrizinha qualquer.", "h": 0}, {"i": 606, "c": 8, "ct": "Capítulo VI", "t": "– Não acredito. Dorian é sensível demais.", "h": 0}, {"i": 607, "c": 8, "ct": "Capítulo VI", "t": "– Dorian é inteligente demais para não cometer nenhuma tolice de quando em quando, meu caro Basil.", "h": 0}, {"i": 608, "c": 8, "ct": "Capítulo VI", "t": "– O casamento não é algo que se possa fazer de quando em quando, Harry.", "h": 0}, {"i": 609, "c": 8, "ct": "Capítulo VI", "t": "– Exceto na América – retomou lorde Henry, languidamente. – Mas eu não disse que ele se casou. Disse que estava noivo. Existe uma grande diferença. Tenho uma clara lembrança de ter me casado, mas não me lembro de nenhum noivado. Creio que nunca fiquei noivo na vida.", "h": 0}, {"i": 610, "c": 8, "ct": "Capítulo VI", "t": "– Mas imagine alguém com o berço, a posição e a riqueza do Dorian. Seria absurdo se casar com alguém tão abaixo.", "h": 0}, {"i": 611, "c": 8, "ct": "Capítulo VI", "t": "– Se você quer que ele se case com essa menina, diga exatamente isso a ele, Basil. Então certamente ele se casará. Quando um homem faz uma coisa completamente estúpida, é sempre pelos motivos mais nobres.", "h": 0}, {"i": 612, "c": 8, "ct": "Capítulo VI", "t": "– Espero que seja uma boa moça, Harry. Não quero ver o Dorian preso a uma criatura vil, capaz de degradar sua natureza e arruinar seu intelecto.", "h": 0}, {"i": 613, "c": 8, "ct": "Capítulo VI", "t": "– Oh, ela é mais do que boa, ela é bonita – murmurou lorde Henry, bebericando uma taça de vermute e bíter cítrico. – Dorian disse que ela é bonita e ele não costuma errar nesse tipo de coisa. O retrato aguçou sua percepção da aparência das outras pessoas. Esse foi um efeito excelente, entre outros. Vamos assisti-la hoje à noite, se o menino não esquecer nosso compromisso.", "h": 0}, {"i": 614, "c": 8, "ct": "Capítulo VI", "t": "– Você está falando sério?", "h": 0}, {"i": 615, "c": 8, "ct": "Capítulo VI", "t": "– Muito sério, Basil. Seria uma desgraça se um dia eu fosse mais sério do que estou sendo neste momento.", "h": 0}, {"i": 616, "c": 8, "ct": "Capítulo VI", "t": "– Mas você aprova esse casamento, Harry? – perguntou o pintor, andando pela sala, tentando se controlar. – Você não pode aprovar. Trata-se de uma paixão tola.", "h": 0}, {"i": 617, "c": 8, "ct": "Capítulo VI", "t": "– Hoje em dia eu nunca aprovo nem desaprovo nada. Trata-se de uma atitude absurda diante da vida. Não somos postos no mundo para externar nossos preconceitos morais. Jamais presto atenção ao que dizem as pessoas comuns, e jamais interfiro no que as pessoas encantadoras fazem. Se uma personalidade me fascina, qualquer modo de expressão que essa personalidade escolhe é absolutamente delicioso para mim. Dorian Gray se apaixonou por uma menina bonita que faz Julieta e quer se casar com ela. Por que não? Se ele estivesse noivo de Messalina não seria menos interessante. Você sabe que eu não sou exatamente um paladino do casamento. A única desvantagem do casamento é que torna a pessoa menos egoísta. E as pessoas sem egoísmo perdem a cor. Falta-lhes individualidade. Ainda assim, existem certos temperamentos que o casamento torna mais complexos. Eles conservam seu egoísmo e acrescentam muitos outros egos. São obrigados a ter mais de uma vida. Tornam-se altamente organizados, e ser altamente organizado é, a meu ver, o objetivo da existência de um homem. Além do mais, toda experiência tem seu valor, e, diga-se o que se disser contra o casamento, certamente é uma experiência. Espero que Dorian Gray faça dessa menina sua esposa, que ele a adore apaixonadamente por seis meses e depois, subitamente, fique fascinado por outra pessoa. Seria um objeto de estudo maravilhoso.", "h": 0}, {"i": 618, "c": 8, "ct": "Capítulo VI", "t": "– Você não acredita em nenhuma palavra disso, Harry. Se a vida de Dorian Gray fosse desperdiçada, ninguém lamentaria mais que você. Você é muito melhor do que finge ser.", "h": 0}, {"i": 619, "c": 8, "ct": "Capítulo VI", "t": "Lorde Henry deu risada. – O motivo pelo qual gostamos de pensar bem dos outros é que tememos por nós mesmos. A base do otimismo é o puro terror. Pensamos ser generosos porque atribuímos ao vizinho a posse de virtudes que provavelmente seriam benéficas para nós. Louvamos o banqueiro para que possamos sacar além do que temos em conta, e encontramos qualidades no assaltante na esperança de que não mexa no nosso bolso. Acredito em tudo o que eu disse. Tenho o maior desprezo pelo otimismo. Quanto à vida desperdiçada, o único desperdício é interromper o crescimento de uma vida. Se você quer estragar uma pessoa, basta tentar consertá-la. Quanto ao casamento, evidentemente que seria uma tolice, mas existem outros vínculos, mais interessantes, entre homens e mulheres. Certamente irei encorajá-los. Eles possuem o encanto da moda. Mas eis que chega o próprio Dorian. Ele lhe dirá melhor do que eu.", "h": 0}, {"i": 620, "c": 8, "ct": "Capítulo VI", "t": "– Meu querido Harry, meu querido Basil, vocês dois precisam me cumprimentar! – disse o rapaz, tirando a capa com abas debruadas em cetim, apertando as mãos, alternadamente, de seus amigos.", "h": 0}, {"i": 621, "c": 8, "ct": "Capítulo VI", "t": "– Nunca estive tão feliz. Claro, foi de repente; todas as coisas realmente deliciosas são súbitas. E ao mesmo tempo me parece ser justamente aquilo que estive a vida inteira procurando. – Ele estava corado de excitação e prazer e extraordinariamente belo.", "h": 0}, {"i": 622, "c": 8, "ct": "Capítulo VI", "t": "– Espero que você seja sempre muito feliz, Dorian – disse Hallward –, mas não sei se conseguirei perdoar você não ter me contado do noivado. Você contou ao Harry.", "h": 0}, {"i": 623, "c": 8, "ct": "Capítulo VI", "t": "– E eu não perdoo você ter se atrasado para o jantar – interveio lorde Henry, com a mão no ombro do rapaz, e sorrindo enquanto falava. – Venha, vamos nos sentar e provar que tal é o novo chefe, e depois você nos conta como foi que tudo aconteceu.", "h": 0}, {"i": 624, "c": 8, "ct": "Capítulo VI", "t": "– Na verdade, não há muito o que contar – exclamou Dorian, enquanto se sentavam em volta da pequena mesa redonda. – O que aconteceu foi simplesmente o seguinte. Depois que saí da sua casa ontem à noite, Harry, troquei de roupa, jantei em um pequeno restaurante italiano na Rupert Street que você me apresentou e desci às oito para o teatro. Sibyl estava fazendo Rosalinda. É claro que o cenário era horrível, e o Orlando absurdo. Mas a Sibyl! Vocês precisavam vê-la! Quando entrou em cena com roupas de menino, ela estava perfeitamente maravilhosa. Ela estava com um justilho cor de musgo de veludo e mangas cor de canela, calça justa marrom com amarrações cruzadas nas pernas, um belo chapeuzinho verde com uma pena de gavião presa em uma joia e uma capa com capuz debruado em vermelho-claro. Nunca a vi tão elegante. Tinha toda a graça delicada daquela estatueta de Tânagra que você tem no estúdio, Basil. O cabelo preso ao redor do rosto como as folhas escuras de uma rosa clara. Quanto à boa atuação, vocês a verão hoje à noite. Ela é simplesmente uma artista nata. Fiquei sentado naquele camarote sujo absolutamente extasiado. Esqueci que estava em Londres e no século XIX . Eu estava fora com minha amada em uma floresta onde nenhum homem jamais esteve. Depois da apresentação, fui ao camarim e falei com ela. Quando estávamos sentados conversando, de repente notei nos olhos dela uma expressão que nunca tinha visto ali antes. Meus lábios se aproximaram dos dela. Nós nos beijamos. Não saberia descrever o que senti naquele momento. Parecia que a minha vida inteira havia se estreitado até um único ponto perfeito de uma alegria cor-de-rosa. Seu corpo inteiro estremeceu e se agitou como um narciso branco. Então ela se pôs de joelhos e beijou minhas mãos. Sinto que não deveria lhes contar tudo isso, mas não posso evitar. Claro que nosso noivado é totalmente secreto. Ela não contou ainda nem para a própria mãe. Não sei o que meus tutores vão dizer. Lorde Radley certamente ficará furioso. Não me importa. Chegarei à maioridade em menos de um ano e depois poderei fazer o que quiser da vida. Eu fiz bem de encontrar o amor na poesia e descobrir minha esposa em peças de Shakespeare, não é, Basil? Lábios que Shakespeare ensinou a falar sussurraram seu segredo no meu ouvido. Os braços de Rosalinda me abraçaram e beijei Julieta na boca.", "h": 0}, {"i": 625, "c": 8, "ct": "Capítulo VI", "t": "– Sim, Dorian, acho que você fez bem – disse Hallward, lentamente.", "h": 0}, {"i": 626, "c": 8, "ct": "Capítulo VI", "t": "– Você a viu hoje? – perguntou lorde Henry.", "h": 0}, {"i": 627, "c": 8, "ct": "Capítulo VI", "t": "Dorian Gray negou com a cabeça. – Deixei-a na floresta de Arden, devo encontrá-la em um pomar em Verona.", "h": 0}, {"i": 628, "c": 8, "ct": "Capítulo VI", "t": "Lorde Henry bebericou seu champanhe de modo meditativo. – Em que contexto exatamente você mencionou a palavra casamento, Dorian? E o que ela respondeu? Talvez você tenha se esquecido de toda essa parte.", "h": 0}, {"i": 629, "c": 8, "ct": "Capítulo VI", "t": "– Meu querido Harry, não tratei isso como uma transação comercial e não fiz nenhuma proposta formal. Eu disse que a amo, e ela disse que era indigna de ser minha esposa. Indigna! Ora, a própria palavra não significa nada se comparada a ela.", "h": 0}, {"i": 630, "c": 8, "ct": "Capítulo VI", "t": "– As mulheres são maravilhosamente práticas – murmurou lorde Henry –, muito mais práticas do que nós. Em situações desse tipo, nós geralmente nos esquecemos de falar em casamento, e elas sempre fazem questão de nos lembrar.", "h": 0}, {"i": 631, "c": 8, "ct": "Capítulo VI", "t": "Hallward pôs a mão no braço dele. – Não, Harry. Você deixou o Dorian aborrecido. Ele não é como os outros homens. Ele jamais causaria mal a ninguém. Tem uma natureza delicada demais para isso.", "h": 0}, {"i": 632, "c": 8, "ct": "Capítulo VI", "t": "Lorde Henry olhou para o outro lado da mesa. – Dorian nunca se aborrece comigo – ele respondeu. – Perguntei, aliás, pela melhor das razões, pelo único motivo, na verdade, que permite que alguém faça qualquer pergunta – por pura curiosidade. Tenho uma teoria de que é sempre a mulher quem nos propõe, e de que não somos nós que pedimos a mulher em casamento. Exceto, é claro, na classe média. Mas, bem, a classe média não é moderna.", "h": 0}, {"i": 633, "c": 8, "ct": "Capítulo VI", "t": "Dorian Gray deu risada e balançou a cabeça para trás. – Você é incorrigível, Harry; mas não se preocupe. É impossível ficar bravo com você. Quando você vir Sibyl Vane, entenderá que um homem capaz de lhe fazer mal seria um animal, um animal sem coração. Não compreendo como alguém pode querer envergonhar aquilo que ama. Amo Sibyl Vane. Desejo colocá-la em um pedestal de ouro e ver o mundo adorar a mulher que é minha. O que é o casamento? Um juramento irrevogável. Você zomba disso. Ah!, eu não zombo. A confiança dela em mim me dá fé, e a sua crença em mim me torna bom. Quando estou com ela, lamento tudo o que você me ensinou. Fico diferente daquilo que você sabe que eu sou. Estou mudado, e um simples toque da mão de Sibyl Vane me faz esquecer de você e de todas as suas teorias equivocadas, fascinantes, venenosas e deliciosas.", "h": 0}, {"i": 634, "c": 8, "ct": "Capítulo VI", "t": "– E quais seriam elas? – perguntou lorde Henry, servindo-se de salada.", "h": 0}, {"i": 635, "c": 8, "ct": "Capítulo VI", "t": "– Oh, as suas teorias sobre a vida, as suas teorias sobre o amor, as suas teorias sobre o prazer. Todas as suas teorias, na verdade, Harry.", "h": 0}, {"i": 636, "c": 8, "ct": "Capítulo VI", "t": "– O prazer é a única coisa sobre a qual vale a pena ter uma teoria – ele respondeu, com sua voz lenta e melodiosa. – Mas receio não poder reivindicar essa teoria como minha. Ela pertence à Natureza, não a mim. O prazer é a prova da Natureza, seu sinal de aprovação. Quando estamos felizes, sempre somos bons, mas quando somos bons nem sempre estamos felizes.", "h": 0}, {"i": 637, "c": 8, "ct": "Capítulo VI", "t": "– Ah, mas o que você entende por bons? – exclamou Basil Hallward.", "h": 0}, {"i": 638, "c": 8, "ct": "Capítulo VI", "t": "– Exatamente – ecoou Dorian, recostando-se na cadeira, e olhando para lorde Henry por cima dos pesados ramos de íris de lábios roxos postados no centro da mesa –, o que você quer dizer com bons, Harry?", "h": 0}, {"i": 639, "c": 8, "ct": "Capítulo VI", "t": "– Ser bom é estar em harmonia consigo mesmo – ele respondeu, tocando a haste fina de sua taça com seus dedos pálidos e afilados. – Dissonante é ser forçado a estar em harmonia com os outros. O importante é a nossa própria vida. Quanto à vida do vizinho, se ele quer ser pudico ou puritano, podemos alardear nossas próprias opiniões morais sobre ele, mas não temos nada com isso. Além do mais, o individualismo possui na verdade uma meta mais elevada. A moralidade moderna consiste em aceitar o padrão da própria época. Na minha opinião, para um homem culto, aceitar o padrão da própria época é a mais grosseira imoralidade.", "h": 0}, {"i": 640, "c": 8, "ct": "Capítulo VI", "t": "– Mas, sem dúvida, paga-se um preço terrível para se viver exclusivamente para si mesmo, não é, Harry? – sugeriu o pintor.", "h": 0}, {"i": 641, "c": 8, "ct": "Capítulo VI", "t": "– Sim, pagamos demais por tudo hoje em dia. Eu diria que a verdadeira tragédia do pobre é que a única coisa a que ele pode se permitir é a negação de si mesmo. Os belos pecados, como todas as coisas belas, são privilégio dos ricos.", "h": 0}, {"i": 642, "c": 8, "ct": "Capítulo VI", "t": "– Pode-se pagar de outras maneiras além do dinheiro.", "h": 0}, {"i": 643, "c": 8, "ct": "Capítulo VI", "t": "– De que maneira, Basil?", "h": 0}, {"i": 644, "c": 8, "ct": "Capítulo VI", "t": "– Oh! Eu diria que com remorso, com sofrimento, bem… com a consciência da degradação.", "h": 0}, {"i": 645, "c": 8, "ct": "Capítulo VI", "t": "Lorde Henry deu de ombros. – Meu caro colega, a arte medieval é encantadora, mas as emoções medievais estão fora de moda. Podemos usá-las, é claro, na ficção. Mas afinal as únicas coisas que podemos usar na ficção são coisas que deixaram de existir na realidade. Acredite, o homem civilizado jamais lamenta um prazer, e o selvagem jamais saberá o que é o prazer.", "h": 0}, {"i": 646, "c": 8, "ct": "Capítulo VI", "t": "– Eu sei o que é o prazer – exclamou Dorian Gray. – É adorar alguém.", "h": 0}, {"i": 647, "c": 8, "ct": "Capítulo VI", "t": "– Isso é certamente melhor do que ser adorado – ele respondeu, brincando com as frutas. – Ser adorado é incômodo. As mulheres nos tratam como a humanidade trata seus deuses. Elas nos idolatram e estão sempre nos pedindo para fazer alguma coisa.", "h": 0}, {"i": 648, "c": 8, "ct": "Capítulo VI", "t": "– Eu diria que tudo o que as mulheres nos pedem elas nos deram primeiro – murmurou o rapaz, gravemente. – Elas criam o amor dentro de nós. Elas têm direito de exigi-lo de volta.", "h": 0}, {"i": 649, "c": 8, "ct": "Capítulo VI", "t": "– Isso é absoluta verdade, Dorian – exclamou Hallward.", "h": 0}, {"i": 650, "c": 8, "ct": "Capítulo VI", "t": "– Nada é absolutamente verdade – disse lorde Henry.", "h": 0}, {"i": 651, "c": 8, "ct": "Capítulo VI", "t": "– Isso é – interrompeu Dorian. – Você há de admitir, Harry, que as mulheres dão aos homens o ouro de suas vidas.", "h": 0}, {"i": 652, "c": 8, "ct": "Capítulo VI", "t": "– Provavelmente – ele suspirou –, mas invariavalmente elas querem esse ouro de volta. Trocado em notas bem pequenas. Eis a questão. As mulheres, como disse um francês muito sagaz, nos inspiram o desejo de fazer obras-primas e sempre nos impedem de fazê-las.", "h": 0}, {"i": 653, "c": 8, "ct": "Capítulo VI", "t": "– Harry, você é horrível! Não sei por que eu gosto tanto de você.", "h": 0}, {"i": 654, "c": 8, "ct": "Capítulo VI", "t": "– Você sempre gostará de mim, Dorian – ele respondeu. – Vocês vão querer café, meus caros? Garçom, traga café, e um bom champanhe, e alguns cigarros. Não: não precisa de cigarro; eu trouxe. Basil, não posso permitir que você fume charuto. Você tem que fumar cigarro. O cigarro é o tipo perfeito de um prazer perfeito. É delicioso, e deixa o fumante insatisfeito. O que mais se pode querer? Sim, Dorian, você sempre gostará de mim. Eu represento para você todos os pecados que você nunca teve coragem de cometer.", "h": 0}, {"i": 655, "c": 8, "ct": "Capítulo VI", "t": "– Que absurdo você está dizendo, Harry! – exclamou o rapaz, usando a chama de um dragão de prata que o garçom deixara na mesa. – Vamos ao teatro. Quando Sibyl entrar em cena, vocês terão uma nova ideia da vida. Ela representará uma coisa que vocês nunca viram.", "h": 0}, {"i": 656, "c": 8, "ct": "Capítulo VI", "t": "– Eu já vi de tudo – disse lorde Henry, com uma expressão cansada nos olhos –, mas estou sempre pronto para uma nova emoção. Receio, contudo, que, de qualquer modo, para mim, isso não existe. Mesmo assim, a sua maravilhosa menina pode me entusiasmar. Adoro teatro. É muito mais real que a vida. Vamos. Dorian, você vem comigo. Sinto muito, Basil, mas só há espaço para dois na berlinda. Você vai atrás de nós de fiacre.", "h": 0}, {"i": 657, "c": 8, "ct": "Capítulo VI", "t": "Levantaram-se e vestiram os casacos, bebendo o café em pé. O pintor estava calado e preocupado. Tinha uma expressão de tristeza no semblante. Não podia tolerar aquele casamento, mas lhe pareceu melhor do que muitas outras coisas que poderiam ter acontecido. Alguns minutos depois, todos desceram. Ele foi sozinho, conforme o combinado, e ficou observando as luzes piscando na pequena berlinda à sua frente. Teve uma estranha sensação de perda. Sentiu que Dorian Gray jamais seria para ele tudo o que havia sido no passado. A vida se interpusera entre eles… Seus olhos ensombreceram, e as ruas cheias, faiscantes, viraram uma única mancha. Quando o cocheiro parou em frente ao teatro, sentia-se anos mais velho.", "h": 0}, {"i": 658, "c": 9, "ct": "Capítulo VII", "t": "Capítulo VII", "h": 1}, {"i": 659, "c": 9, "ct": "Capítulo VII", "t": "Por um motivo qualquer, a casa estava lotada aquela noite, e o gordo gerente judeu que os recebeu na porta estava sorrindo de orelha a orelha, com um sorriso untuoso e trêmulo. Ele os acompanhou até o camarote com uma espécie de humildade pomposa, acenando com os dedos gordos cobertos de anéis, e falando em voz alta. Dorian Gray odiou-o mais do que nunca. Sentiu-se vindo encontrar Miranda e encontrando Caliban. Lorde Henry, por outro lado, gostou dele. Ao menos foi o que disse, e insistiu em apertar-lhe a mão, e lhe disse que era uma honra conhecer um homem que havia descoberto um verdadeiro gênio e sido arruinado por encenar um poeta. Hallward divertiu-se observando os rostos da plateia. O calor era terrivelmente opressivo, e o imenso refletor do sol ardia como uma dália monstruosa com pétalas de fogo amarelo. Os jovens na galeria haviam tirado os paletós e coletes e os penduravam no balaústre. Em pleno teatro, conversavam e dividiam suas laranjas com as garotas vulgares sentadas ao lado. Algumas mulheres gargalhavam no fosso da plateia. Sua vozes eram horrivelmente estridentes e destoantes. Ouvia-se o estouro de rolhas vindo do bar.", "h": 0}, {"i": 660, "c": 9, "ct": "Capítulo VII", "t": "– Mas que lugar para encontrar uma divindade! – disse lorde Henry.", "h": 0}, {"i": 661, "c": 9, "ct": "Capítulo VII", "t": "– Sim! – respondeu Dorian Gray. – Foi aqui que eu a encontrei, e ela é divina acima de todas as coisas vivas. Quando ela entrar em cena, você se esquecerá de tudo. Essas pessoas comuns, rudes, com seus rostos grosseiros e gestos brutais, ficam muito diferentes quando ela sobe ao palco. Sentam-se calados e ficam assistindo. Choram e riem segundo a vontade dela. Ela os torna sensíveis como um violino. Ela os espiritualiza, sentimos que eles são feitos da mesma carne e do mesmo sangue que nós.", "h": 0}, {"i": 662, "c": 9, "ct": "Capítulo VII", "t": "– Eles terão o mesmo sangue que nós? Oh, espero que não! – exclamou lorde Henry, que estava esquadrinhando os ocupantes da galeria com seu binóculo de ópera.", "h": 0}, {"i": 663, "c": 9, "ct": "Capítulo VII", "t": "– Não preste atenção nele – disse o pintor. – Entendo o que você quer dizer, e acredito nessa menina. Qualquer pessoa que você ame deve ser maravilhosa, e qualquer menina que causa o efeito que você descreveu deve ser bela e nobre. Espiritualizar a época – isso valeria a pena fazer. Se essa menina for capaz de dar alma àqueles que sempre viveram sem, se ela puder inculcar a noção de beleza em pessoas cujas vidas sempre foram sórdidas e feias, se ela conseguir arrancar deles o egoísmo e lhes emprestar lágrimas por tristezas que nunca foram suas, ela é digna de toda a sua adoração, digna da adoração do mundo inteiro. Esse casamento é perfeito. A princípio, achei que não, mas agora admito que é. Os deuses fizeram Sibyl Vane para você. Sem ela, você seria incompleto.", "h": 0}, {"i": 664, "c": 9, "ct": "Capítulo VII", "t": "– Obrigado, Basil – respondeu Dorian Gray, apertando a mão dele.", "h": 0}, {"i": 665, "c": 9, "ct": "Capítulo VII", "t": "– Eu sabia que você acabaria me entendendo. O Harry é tão cínico, ele me aterroriza. Mas eis a orquestra. É pavorosa, mas dura só uns cinco minutos. Depois a cortina sobe e você verá a menina a quem entregarei a minha vida, a quem eu dei tudo o que há de bom em mim.", "h": 0}, {"i": 666, "c": 9, "ct": "Capítulo VII", "t": "Quinze minutos depois, em meio a um extraordinário alvoroço de aplausos, Sibyl Vane entrou em cena. Sim, ela era certamente adorável de se olhar – uma das criaturas mais adoráveis, lorde Henry pensou, que ele já tinha visto na vida. Havia algo faunesco em sua graça meiga e em seus olhos arregalados. Um discreto rubor, como a sombra de uma rosa em um espelho de prata, surgiu em suas faces quando ela olhou para a plateia lotada, entusiasmada. Recuou alguns passos, e seus lábios pareceram estremecer. Basil Hallward se pôs subitamente em pé e começou a aplaudir. Imóvel, como se sonhasse, Dorian Gray continuou sentado a contemplá-la. Lorde Henry espiou pelo binóculo, murmurando: – Encantadora! Encantadora!", "h": 0}, {"i": 667, "c": 9, "ct": "Capítulo VII", "t": "O cenário era o salão da casa dos Capuletos, e Romeu em seu traje de peregrino havia acabado de entrar com Mercúcio e seus outros amigos. A orquestra, em seguida, atacou alguns compassos de música, e o baile começou. Em meio ao grupo de atores desengonçados e deselegantes, Sibyl Vane se movia como uma criatura de um mundo mais belo. Seu corpo balançava, enquanto dançava, como uma planta na água. As curvas de seu pescoço eram as curvas de um lírio branco. As mãos dela pareciam feitas de marfim fresco.", "h": 0}, {"i": 668, "c": 9, "ct": "Capítulo VII", "t": "No entanto, ela estava curiosamente impassível. Não mostrava nenhum sinal de alegria quando seus olhos pousavam em Romeu. As poucas palavras que ela tinha de dizer –", "h": 0}, {"i": 669, "c": 9, "ct": "Capítulo VII", "t": "Bom peregrino, pecas demais contra tua mão,", "h": 0}, {"i": 670, "c": 9, "ct": "Capítulo VII", "t": "Que polida devoção demonstra assim;", "h": 0}, {"i": 671, "c": 9, "ct": "Capítulo VII", "t": "Pois santos têm mãos que mãos de peregrinos tocam;", "h": 0}, {"i": 672, "c": 9, "ct": "Capítulo VII", "t": "E palma com palma é o beijo dos romeiros", "h": 0}, {"i": 673, "c": 9, "ct": "Capítulo VII", "t": "–, com o breve diálogo que se seguia, foram ditas de maneira inteiramente artificial. A voz era magnífica, mas do ponto de vista do tom soava absolutamente falsa. Errava no timbre. Tirava toda a vida do verso. Tornava a paixão irreal.", "h": 0}, {"i": 674, "c": 9, "ct": "Capítulo VII", "t": "Dorian Gray empalidecia enquanto a assistia. Estava perplexo e angustiado. Nenhum dos amigos ousou dizer nada. Ela lhes pareceu absolutamente incompetente. Eles estavam horrivelmente decepcionados.", "h": 0}, {"i": 675, "c": 9, "ct": "Capítulo VII", "t": "No entanto, achavam que a verdadeira prova de qualquer Julieta é a cena do balcão no segundo ato. Eles aguardaram. Se ela fracassasse naquela cena, não teria mesmo nenhum talento.", "h": 0}, {"i": 676, "c": 9, "ct": "Capítulo VII", "t": "Ela estava encantadora quando saiu ao luar. Isso não se podia negar. Mas a teatralidade de sua atuação era insuportável, e foi ficando pior conforme ela continuou. Seus gestos se tornaram absurdamente artificiais. Ela enfatizava excessivamente tudo o que tinha para dizer. A bela passagem –", "h": 0}, {"i": 677, "c": 9, "ct": "Capítulo VII", "t": "Sabes que a máscara da noite cobre meu rosto,", "h": 0}, {"i": 678, "c": 9, "ct": "Capítulo VII", "t": "Ou rubor de donzela pintaria minha face", "h": 0}, {"i": 679, "c": 9, "ct": "Capítulo VII", "t": "Pelo que me ouviste dizer esta noite", "h": 0}, {"i": 680, "c": 9, "ct": "Capítulo VII", "t": "– foi declamada com a dolorosa precisão de uma estudante que aprendeu na escola a recitar com um professor de pronúncia de segunda classe. Ao se inclinar sobre o balcão, na altura dessa maravilhosa fala –", "h": 0}, {"i": 681, "c": 9, "ct": "Capítulo VII", "t": "Embora contigo me alegre,", "h": 0}, {"i": 682, "c": 9, "ct": "Capítulo VII", "t": "Nada me alegra nosso contrato desta noite:", "h": 0}, {"i": 683, "c": 9, "ct": "Capítulo VII", "t": "Muito afoito, impensado, súbito;", "h": 0}, {"i": 684, "c": 9, "ct": "Capítulo VII", "t": "Muito semelhante ao relâmpago, que some", "h": 0}, {"i": 685, "c": 9, "ct": "Capítulo VII", "t": "Antes que se possa dizer “relampejou”. Querido, boa noite!", "h": 0}, {"i": 686, "c": 9, "ct": "Capítulo VII", "t": "Que este botão, ao sopro amadurecedor do verão,", "h": 0}, {"i": 687, "c": 9, "ct": "Capítulo VII", "t": "Abra-se em bela flor quando nos virmos outra vez", "h": 0}, {"i": 688, "c": 9, "ct": "Capítulo VII", "t": "–, ela disse as palavras como se não fizesse nenhum sentido para si mesma. Não era nervosismo. Na verdade, longe de estar nervosa, ela estava absolutamente contida. Era simplesmente arte ruim. Ela era um completo fiasco.", "h": 0}, {"i": 689, "c": 9, "ct": "Capítulo VII", "t": "Até o público comum, sem instrução, da plateia e da galeria, perdeu o interesse na peça. Começaram a ficar inquietos e a falar alto e assobiar. O gerente judeu, que estava de pé atrás do camarim, batia o pé e xingava com raiva. A única pessoa impassível era a própria garota.", "h": 0}, {"i": 690, "c": 9, "ct": "Capítulo VII", "t": "Quando o segundo ato acabou, veio uma vaia estrondosa, e lorde Henry se levantou da cadeira e vestiu o sobretudo. – Ela é muito bonita, Dorian – ele disse –, mas não sabe atuar. Vamos embora.", "h": 0}, {"i": 691, "c": 9, "ct": "Capítulo VII", "t": "– Vou assistir até o fim – respondeu o rapaz, com uma voz ríspida, amarga. – Sinto terrivelmente ter estragado a sua noite, Harry. Peço desculpas aos dois.", "h": 0}, {"i": 692, "c": 9, "ct": "Capítulo VII", "t": "– Meu querido Dorian, eu diria que a senhorita Vane estava doente – interrompeu Hallward. – Vamos voltar outra noite.", "h": 0}, {"i": 693, "c": 9, "ct": "Capítulo VII", "t": "– Quem dera ela estivesse doente – retomou ele. – Mas ela me pareceu simplesmente ausente e fria. Ela estava totalmente alterada. Ontem à noite ela era uma grande artista. Hoje ela foi apenas uma atriz comum, medíocre.", "h": 0}, {"i": 694, "c": 9, "ct": "Capítulo VII", "t": "– Não fale assim sobre alguém que você ama, Dorian. O amor é uma coisa ainda mais maravilhosa que a arte.", "h": 0}, {"i": 695, "c": 9, "ct": "Capítulo VII", "t": "– Ambos são simplesmente formas de imitação – observou lorde Henry. – Mas vamos embora. Dorian, você não deve ficar aqui nem mais um minuto. Não faz bem para o ânimo assistir a uma atuação ruim. Além disso, não creio que você quisesse que sua esposa atuasse. Então, que importância tem se ela interpreta Julieta como uma marionete de madeira? Ela é extremamente adorável e, se ela souber tão pouco da vida quanto sabe de teatro, será uma experiência deliciosa. Só existem dois tipos de pessoas realmente fascinantes – as pessoas que sabem absolutamente tudo e as pessoas que não sabem absolutamente nada. Céus, meu querido menino, não seja tão trágico! O segredo de permanecer jovem é nunca sentir uma emoção que não nos caia bem. Venha ao clube com Basil e comigo. Vamos fumar cigarros e brindar à beleza de Sibyl Vane. Ela é bonita. O que mais você pode querer?", "h": 0}, {"i": 696, "c": 9, "ct": "Capítulo VII", "t": "– Vá embora, Harry – exclamou o rapaz. – Quero ficar sozinho. Basil, você precisa ir. Ah! Você não está vendo que meu coração está partido? – Lágrimas ardentes brotaram nos olhos dele. Seus lábios estremeceram, e, correndo para o fundo do camarote, ele se inclinou junto à parede, escondendo o rosto nas mãos.", "h": 0}, {"i": 697, "c": 9, "ct": "Capítulo VII", "t": "– Vamos embora, Basil – disse lorde Henry, com estranha ternura na voz; e os dois saíram juntos.", "h": 0}, {"i": 698, "c": 9, "ct": "Capítulo VII", "t": "Alguns momentos depois, as luzes do palco se acenderam, e a cortina subiu para o terceiro ato. Dorian Gray voltou ao seu assento. Estava pálido, altivo e indiferente. A peça se arrastou e pareceu interminável. Metade do público foi embora, pisando com botas pesadas e dando risada. Foi tudo um completo fracasso. O último ato foi encenado para uma plateia quase vazia. A cortina desceu entre risos de escárnio e alguns bocejos.", "h": 0}, {"i": 699, "c": 9, "ct": "Capítulo VII", "t": "Assim que o espetáculo acabou, Dorian Gray correu para os bastidores e entrou no camarim. A menina estava ali em pé sozinha, com uma expressão de triunfo no rosto. Seus olhos estavam iluminados por um fogo magnífico. Estava radiante. Os lábios entreabertos sorriam de algum segredo apenas seu.", "h": 0}, {"i": 700, "c": 9, "ct": "Capítulo VII", "t": "Quando ele entrou, ela olhou para ele, e uma expressão de alegria infinita se formou em seu semblante. – Como atuei mal esta noite, Dorian! – ela exclamou.", "h": 0}, {"i": 701, "c": 9, "ct": "Capítulo VII", "t": "– Horrivelmente! – ele respondeu, encarando-a com espanto – horrivelmente! Foi pavoroso. Você está doente? Você não faz ideia de como foi. Você não calcula o que eu sofri.", "h": 0}, {"i": 702, "c": 9, "ct": "Capítulo VII", "t": "A menina sorriu. – Dorian – ela respondeu, demorando-se em dizer o nome dele com música na voz arrastada, como se fosse doce como mel às pétalas vermelhas da boca. – Dorian, você devia ter entendido. Mas agora você entendeu, não é?", "h": 0}, {"i": 703, "c": 9, "ct": "Capítulo VII", "t": "– Entender o quê? – ele perguntou irritado.", "h": 0}, {"i": 704, "c": 9, "ct": "Capítulo VII", "t": "– Por que eu estava tão ruim esta noite. Por que serei sempre assim ruim. Por que nunca mais atuarei bem de novo.", "h": 0}, {"i": 705, "c": 9, "ct": "Capítulo VII", "t": "Ele deu de ombros. – Você está doente, imagino. Quando se está doente, não se deve atuar. Você se torna ridícula. Meus amigos ficaram entediados. Eu fiquei entediado.", "h": 0}, {"i": 706, "c": 9, "ct": "Capítulo VII", "t": "Ela parecia nem ouvir o que ele dizia. Estava transfigurada de alegria. Foi dominada por um êxtase de felicidade.", "h": 0}, {"i": 707, "c": 9, "ct": "Capítulo VII", "t": "– Dorian, Dorian – ela exclamou –, antes de conhecê-lo, atuar era a única realidade da minha vida. Eu só vivia no teatro. Eu pensava que era tudo verdade. Eu era Rosalinda uma noite, e Pórcia na outra. A alegria de Beatriz era minha alegria, e as tristezas de Cordélia também eram as minhas. Eu acreditava em tudo. As pessoas comuns que atuavam comigo me pareciam divinas. Os cenários pintados eram o meu mundo. Eu só conhecia as sombras e pensava que fossem reais. Veio você, oh, meu lindo amor! e você libertou minha alma da prisão. Você me ensinou o que a realidade realmente é. Esta noite, pela primeira vez na minha vida, eu consegui enxergar a superficialidade, o engodo, a insensatez do espetáculo vazio em que sempre atuei. Hoje, pela primeira vez, eu me dei conta de que Romeu era horrível, e velho, e maquiado, de que o luar no pomar era falso, de que o cenário era vulgar, e de que as palavras que eu dizia eram irreais, não eram minhas, não era o que eu queria dizer. Você me trouxe algo mais elevado, algo do qual a arte é um mero reflexo. Você me fez entender o que o amor realmente é. Meu amor! meu amor! Príncipe Encantado! Príncipe da vida! Estou farta de sombras. Você é mais para mim do que toda arte jamais poderá ser. Que tenho eu com as marionetes de uma peça? Quando entrei em cena hoje, não sei como, tudo fugia de mim. Pensei que seria maravilhoso. Descobri que não conseguia fazer nada. Subitamente entendi na minha alma o que significava tudo aquilo. Saber disso foi delicioso. Ouvi o público vaiar e sorri. O que eles poderiam saber de um amor como o nosso? Leve-me embora, Dorian, leve-me consigo, aonde possamos ficar a sós. Odeio o palco. Posso fingir uma paixão que não sinto, mas não posso fingir esta que me arde como fogo. Oh, Dorian, Dorian, você entende agora o que isso significa? Mesmo que eu conseguisse, seria uma profanação para mim fingir estar apaixonada. Você me fez ver isso.", "h": 0}, {"i": 708, "c": 9, "ct": "Capítulo VII", "t": "Ele se atirou no sofá e virou o rosto. – Você matou meu amor – ele murmurou.", "h": 0}, {"i": 709, "c": 9, "ct": "Capítulo VII", "t": "Ela olhou para ele espantada e deu risada. Ele não disse nada. Ela veio até ele e, com seus pequenos dedos, lhe fez um carinho no cabelo. Ela se ajoelhou e pôs as mãos dele em seus lábios. Ele tirou as mãos e sentiu um calafrio.", "h": 0}, {"i": 710, "c": 9, "ct": "Capítulo VII", "t": "Então ele se pôs de pé e foi até porta. – Sim – ele exclamou –, você matou o meu amor. Você costumava atiçar minha imaginação. Agora você não desperta nem minha curiosidade. Você simplesmente não produz nenhum efeito. Eu a amei porque você foi maravilhosa, porque você tinha gênio e intelecto, porque você realizava o sonho dos grandes poetas e dava forma e substância às sombras da arte. Você jogou tudo isso fora. Você é superficial e estúpida. Meu Deus! Como pude ser louco de me apaixonar por você! Como fui tolo! Você não significa nada para mim agora. Nunca mais nos veremos. Não pensarei nunca mais em você. Jamais mencionarei o seu nome. Você não sabe o que significou para mim um dia. Ora, um dia… Oh, não suporto sequer pensar nisso! Melhor seria nunca tê-la conhecido! Você estragou o romance da minha vida. Como você sabe pouco do amor a ponto de dizer que o amor prejudicou a sua arte! Sem a sua arte, você não é nada. Eu a teria tornado famosa, esplêndida, magnífica. O mundo inteiro a teria idolatrado, e você teria o meu nome. O que você é agora? Uma atriz de terceira categoria com um rosto bonito.", "h": 0}, {"i": 711, "c": 9, "ct": "Capítulo VII", "t": "A menina empalideceu e ficou trêmula. Ela entrelaçou os dedos, e sua voz parecia presa na garganta. – Você não está falando sério, não é, Dorian? – ela murmurou. – Você está fazendo uma cena.", "h": 0}, {"i": 712, "c": 9, "ct": "Capítulo VII", "t": "– Cena! Deixo isso para você. Você faz isso muito bem – ele respondeu amargamente.", "h": 0}, {"i": 713, "c": 9, "ct": "Capítulo VII", "t": "Ela se levantou do chão onde estava ajoelhada e, com expressão compungida de dor no semblante, foi até ele. Pôs a mão no braço dele e olhou-o bem nos olhos. Ele a repudiou. – Não toque em mim! – ele exclamou.", "h": 0}, {"i": 714, "c": 9, "ct": "Capítulo VII", "t": "Ela deixou escapar um gemido baixo, e se atirou aos pés dele, e ali ficou como uma flor pisoteada. – Dorian, Dorian, não me abandone! – ela sussurrou. – Lamento tanto não ter atuado bem. Eu estava pensando em você o tempo inteiro. Mas eu vou tentar, de verdade, vou tentar. Foi tão de repente que me ocorreu, o meu amor por você. Creio que jamais teria conhecido o amor se você não tivesse me beijado – se não tivéssemos nos beijado. Beije-me outra vez, meu amor. Não vá embora. Eu não suportaria. Oh!, não me deixe. Meu irmão me… Não; não importa. Ele não sabia o que dizia. Devia estar brincando… Mas, você! você não pode me perdoar por esta noite? Vou trabalhar duro e tentarei melhorar. Não seja cruel comigo porque meu amor por você é mais do que qualquer coisa no mundo. Afinal, só não o agradei uma única vez. Mas você tem razão, Dorian. Eu deveria ter me apresentado mais como artista. Foi uma tolice minha; e no entanto não pude evitar. Oh, não me abandone, não me abandone – um acesso de soluços apaixonados a sufocou. Ela se agachou no chão como uma criatura ferida, e Dorian Gray, com seus belos olhos, olhou para ela, e franziu seus lábios cinzelados com requintado desdém. Há sempre algo de ridículo nas emoções das pessoas que deixamos de amar. Sibyl Vane lhe pareceu absurdamente melodramática. Suas lágrimas e soluços agora o aborreciam.", "h": 0}, {"i": 715, "c": 9, "ct": "Capítulo VII", "t": "– Estou indo – ele disse por fim, com sua voz calma e clara. – Não quero ser cruel, mas não posso mais vê-la. Você me decepcionou.", "h": 0}, {"i": 716, "c": 9, "ct": "Capítulo VII", "t": "Ela chorou calada, e não respondeu, mas se arrastou para perto dele. Suas mãozinhas estendidas às cegas pareciam tentar alcançá-lo. Ele se virou e saiu. No momento seguinte, ele estava fora do teatro.", "h": 0}, {"i": 717, "c": 9, "ct": "Capítulo VII", "t": "Aonde ia, ele mal saberia dizer. Ele se lembraria de perambular pela penumbra das ruas, passar por arcos desolados e sombrios e por casas de aparência maligna. Mulheres de vozes roucas e risadas cruéis chamaram por ele. Bêbados passavam cambaleando e xingando, falando sozinhos como símios monstruosos. Viu crianças grotescas acocoradas nos degraus das entradas e ouviu gritos e impropérios vindos de pátios escuros.", "h": 0}, {"i": 718, "c": 9, "ct": "Capítulo VII", "t": "Quando começava a raiar o dia, ele se viu próximo de Covent Garden. A escuridão havia passado, e, corado por fogos atenuados, o céu se esvaziara em uma pérola perfeita. Imensas carroças cheias de lírios balouçantes passaram lentamente pela lustrosa rua vazia. O ar estava carregado do perfume das flores e essa beleza serviu de paliativo a sua dor. Ele entrou no mercado e observou os homens descarregando as carroças. Um carroceiro de avental branco lhe ofereceu cerejas. Ele agradeceu, perguntando-se por que o sujeito se recusara a receber por elas, e começou a comê-las distraidamente. Haviam sido colhidas à meia-noite e o frio da lua havia penetrado nelas. Uma longa fileira de meninos levando caixas de tulipas listradas e rosas amarelas e vermelhas desfilou na frente dele, serpenteando através das pilhas verde-jade de hortaliças. Debaixo do pórtico, com seus pilares cinza descorados pelo sol, uma tropa de meninas desmazeladas e sem chapéu aguardava o final do leilão. Outros se amontoavam junto às portas do café na Piazza. Os pesados cavalos de carga derrapavam ao pisar as pedras irregulares, balançando seus sinos e arreios. Alguns dos cocheiros estavam dormindo sobre uma pilha de sacas. Com pescoços iridescentes e pés rosados, os pombos ciscavam por ali suas sementes.", "h": 0}, {"i": 719, "c": 9, "ct": "Capítulo VII", "t": "Pouco depois, ele parou um fiacre e seguiu para casa. Durante alguns momentos, ficou parado na entrada, olhando para a praça silenciosa, com suas janelas vazias, fechadas, e suas venezianas a espreitá-lo. O céu agora estava inteiramente opalino, e os telhados das casas, em contraste, reluziam feito prata. De alguma chaminé do outro lado, uma fina espiral de fumaça subia. Enovelou-se, uma faixa roxa, através do ar nacarado.", "h": 0}, {"i": 720, "c": 9, "ct": "Capítulo VII", "t": "Na imensa lanterna veneziana dourada, espólio da barca de algum doge, que pendia do teto do grandioso saguão revestido de painéis de carvalho, ainda ardiam luzes bruxuleantes de três bicos de gás: pareciam finas pétalas azuis de labaredas debruadas de fogo branco. Apagou-as, passou pela biblioteca em direção à porta de seu quarto, uma grande câmara octogonal no térreo que, em seu recém-nascido desejo de luxos, ele mesmo havia decorado, revestindo-a com curiosas tapeçarias renascentistas, descobertas guardadas em um sótão esquecido em Selby Royal. Quando ele estava girando a maçaneta da porta, seus olhos depararam com o retrato que Basil Hallward havia feito dele. Ele teve um sobressalto, como de surpresa. Então entrou em seu quarto, com expressão algo intrigada. Depois de desabotoar o sobretudo, ele pareceu hesitar. Finalmente, ele voltou, aproximou-se do quadro e examinou-o. Na penumbra daquela luz contida que se esforçava para penetrar por entre as cortinas de seda creme, o rosto lhe pareceu um pouco alterado. A expressão parecia diferente. Seria possível dizer que havia um toque de crueldade na boca. Era certamente estranho.", "h": 0}, {"i": 721, "c": 9, "ct": "Capítulo VII", "t": "Ele se virou, e, caminhando até a janela, afastou as cortinas. A clara madrugada invadiu o quarto e varreu as sombras fantásticas para os cantos obscuros, onde ficaram estremecidas. Mas a estranha expressão que ele notara no rosto do retrato permaneceu ali, até mais intensificada. A trêmula e ardente luz do sol lhe mostrou as marcas da maldade ao redor da boca tão claramente quanto se ele estivesse olhando para um espelho depois de fazer algo pavoroso.", "h": 0}, {"i": 722, "c": 9, "ct": "Capítulo VII", "t": "Ele franziu os olhos e, tirando da mesa um espelho oval com moldura de cupidos de marfim, um dos muitos presentes de lorde Henry, olhou rapidamente para a profundidade polida. Nenhuma linha marcava seus lábios vermelhos. O que significava aquilo?", "h": 0}, {"i": 723, "c": 9, "ct": "Capítulo VII", "t": "Ele esfregou os olhos, se aproximou mais do quadro e tornou a examiná-lo. Não havia de fato nenhum sinal de alteração quando ele olhou para a pintura, e, no entanto, sem dúvida, a expressão como um todo havia se alterado. Não se tratava de mera fantasia sua. Era horrivelmente aparente.", "h": 0}, {"i": 724, "c": 9, "ct": "Capítulo VII", "t": "Ele se atirou em uma poltrona e se pôs a pensar. De repente, relampejou em sua mente aquilo que ele dissera no estúdio de Basil Hallward no dia em que o quadro foi terminado. Sim, ele se lembrou perfeitamente. Ele pronunciara um louco desejo de que pudesse permanecer jovem, e que apenas o retrato envelhecesse; de que sua própria beleza pudesse ficar intacta, e o rosto na tela suportasse o fardo de suas paixões e de seus pecados; de que a imagem pintada pudesse ser marcada com as rugas do sofrimento e do pensamento, e de que ele pudesse conservar todo o delicado viço e o encanto da adolescência de que acabava de se tornar consciente. Seu desejo não poderia ter sido satisfeito? Essas coisas eram impossíveis. Parecia monstruoso sequer pensar nisso. E, no entanto, lá estava o quadro diante dele, com a marca da maldade na boca.", "h": 0}, {"i": 725, "c": 9, "ct": "Capítulo VII", "t": "Maldade! Será que ele havia sido mau? Era culpa da menina, não dele. Ele havia sonhado que ela era uma grande artista, dera-lhe seu amor porque pensara que ela era grandiosa. Então ela o decepcionara. Mostrara-se fútil e indigna. E, no entanto, veio-lhe uma sensação de remorso infinito quando pensou nela ajoelhada a seus pés, soluçando como uma criancinha. Lembrou-se da frieza com que olhara para ela. Por que ele agira assim? Por que lhe coubera uma alma assim? Mas ele também não havia sofrido? Durante as três horas terríveis que durara a peça, ele vivera séculos de angústia, eras e mais eras de tortura. Sua vida valia tanto quanto a dela. Ela o machucara por um momento, enquanto ele a ferira por toda uma vida. Além do mais, as mulheres eram mais aptas a suportar tristezas que os homens. Elas viviam das próprias emoções. Só pensavam nas próprias emoções. Quando tinham amantes, era apenas para ter alguém com quem podiam fazer cenas. Lorde Henry lhe dissera isso, e lorde Henry sabia como eram as mulheres. Por que ele deveria se importar com Sibyl Vane? Ela não era nada para ele agora.", "h": 0}, {"i": 726, "c": 9, "ct": "Capítulo VII", "t": "Mas e o quadro? O que dizer daquilo? O retrato continha o segredo de sua vida e contava sua história. Ensinara-lhe a amar sua própria beleza. Será que lhe ensinaria a odiar a própria alma? Voltaria a olhar para o quadro algum dia?", "h": 0}, {"i": 727, "c": 9, "ct": "Capítulo VII", "t": "Não; era meramente uma ilusão forjada pelos sentidos abalados. A noite horrível que ele passara havia deixado fantasmas em seu rastro. De repente, caíra em seu cérebro aquela minúscula mancha escarlate que ensandece os homens. A pintura não havia mudado. Era loucura pensar assim.", "h": 0}, {"i": 728, "c": 9, "ct": "Capítulo VII", "t": "Contudo o quadro o observava, com seu belo rosto alterado e seu sorriso cruel. Os cabelos claros reluziam à primeira luz da manhã. Os olhos azuis encontraram os seus. Uma sensação infinita de pena, não de si mesmo, mas da própria imagem pintada, dominou-o. O quadro já estava alterado e ainda se alteraria mais. O ouro se tornaria cinza. As rosas rubras e brancas feneceriam. A cada pecado que ele cometesse, uma mancha macularia e arruinaria sua beleza. Mas ele não pecaria. O quadro, mudado ou intacto, seria para ele o emblema visível da consciência. Ele resistiria às tentações. Não veria mais lorde Henry – não daria mais ouvidos, em hipótese nenhuma, àquelas teorias sutis e venenosas que no jardim de Basil Hallward pela primeira vez agitaram dentro de si a paixão pelas coisas impossíveis. Voltaria para Sibyl Vane, faria as pazes com ela, casaria com ela, tentaria amá-la outra vez. Sim, era seu dever fazer isso. Ela devia ter sofrido mais do que ele. Pobre criança! Ele fora egoísta e cruel com ela. O fascínio que ela havia exercido sobre ele voltaria. Seriam felizes juntos. A vida dele com ela seria bela e pura.", "h": 0}, {"i": 729, "c": 9, "ct": "Capítulo VII", "t": "Levantou-se da poltrona e arrastou um grande biombo para frente do retrato, estremecendo ao observá-lo de relance. – Que horror! – murmurou consigo mesmo e caminhou até a janela e a abriu. Quando pisou na grama do jardim, respirou profundamente. O ar fresco da manhã pareceu afastar todas as suas paixões sombrias. Ele pensou apenas em Sibyl. Um eco distante de seu amor voltou. Repetiu diversas vezes o nome dela. Os pássaros que cantavam no jardim coberto de orvalho pareciam dizer às flores coisas sobre ela.", "h": 0}, {"i": 730, "c": 10, "ct": "Capítulo VIII", "t": "Capítulo VIII", "h": 1}, {"i": 731, "c": 10, "ct": "Capítulo VIII", "t": "Passava do meio-dia quando ele acordou. Seu criado entrara no quarto diversas vezes, na ponta dos pés, para ver se ele estava se mexendo, e se perguntara o que fizera o jovem patrão dormir até tão tarde. Finalmente a sineta tocou, e Victor entrou suavemente com uma xícara de chá, e um maço de cartas, sobre uma pequena bandeja de porcelana de Sèvres, e afastou as cortinas de cetim verde-oliva, com suas cintilantes costuras azuis, que ficavam diante das três janelas altas.", "h": 0}, {"i": 732, "c": 10, "ct": "Capítulo VIII", "t": "– Monsieur dormiu a manhã inteira – ele disse, sorrindo.", "h": 0}, {"i": 733, "c": 10, "ct": "Capítulo VIII", "t": "– Que horas são, Victor? – perguntou Dorian Gray, sonolento.", "h": 0}, {"i": 734, "c": 10, "ct": "Capítulo VIII", "t": "– Uma e quinze, monsieur .", "h": 0}, {"i": 735, "c": 10, "ct": "Capítulo VIII", "t": "– Que tarde! – Ele se sentou e, bebericando o chá, conferiu a correspondência. Uma das cartas era de lorde Henry, e havia sido entregue aquela manhã. Ele hesitou por um momento e então deixou-a de lado. As outras, ele abriu apaticamente. Continham a mesma série de cartões, convites para jantares, ingressos para exposições privadas, programas de concertos de caridade e coisas do gênero, que chovem sobre rapazes elegantes a cada manhã durante a temporada. Havia uma conta bastante alta, por um disputado conjunto de toalete à Luís XV , que ele ainda não tivera coragem de mandar para seus tutores, que eram pessoas extremamente antiquadas e não se davam conta de que vivemos em uma época em que os supérfluos são nossas únicas necessidades genuínas; e havia vários comunicados, redigidos de maneira muito cortês, dos agiotas de Jermyn Street, oferecendo imediatamente empréstimos de qualquer quantia mediante as taxas de juros mais razoáveis.", "h": 0}, {"i": 736, "c": 10, "ct": "Capítulo VIII", "t": "Cerca de dez minutos depois, ele se levantou e, vestindo um sofisticado robe de caxemira bordado em seda, passou para o piso de ônix do banheiro. A água fria o refrescou após o longo sono. Ele parecia ter esquecido tudo aquilo que passara. Veio-lhe uma ou duas vezes uma sensação difusa de ter tomado parte em alguma estranha tragédia, mas acompanhada da irrealidade de um sonho.", "h": 0}, {"i": 737, "c": 10, "ct": "Capítulo VIII", "t": "Assim que ele se vestiu, foi à biblioteca e sentou-se para fazer um desjejum francês leve, que havia sido servido em uma pequena mesa redonda junto à janela aberta. Era um belo dia. O ar quente parecia carregado de temperos. Uma abelha entrou pela janela e zumbiu ao redor da tigela branca com um dragão azul pintado, que, cheia de rosas sulfurinas, tinha diante de si. Sentiu-se perfeitamente feliz.", "h": 0}, {"i": 738, "c": 10, "ct": "Capítulo VIII", "t": "De repente, seus olhos depararam com o biombo que colocara diante do retrato, e ele teve um sobressalto.", "h": 0}, {"i": 739, "c": 10, "ct": "Capítulo VIII", "t": "– Está muito frio para monsieur ? – perguntou o criado, sevindo uma omele
