te. – Devo fechar a janela?", "h": 0}, {"i": 740, "c": 10, "ct": "Capítulo VIII", "t": "Dorian negou com a cabeça. – Não estou com frio – ele murmurou.", "h": 0}, {"i": 741, "c": 10, "ct": "Capítulo VIII", "t": "Teria sido tudo verdade? O retrato realmente se transformara? Ou teria sido simplesmente sua imaginação que lhe fizera ver um olhar de maldade onde havia um olhar de alegria? Uma tela pintada podia se alterar sozinha? Era absurdo. Aquilo parecia uma história para contar a Basil algum dia. Basil daria risada.", "h": 0}, {"i": 742, "c": 10, "ct": "Capítulo VIII", "t": "E, no entanto, como ele se lembrava vividamente de tudo! Primeiro na penumbra do poente e depois no raiar da madrugada, ele vira a marca da maldade em volta dos lábios franzidos. Estava quase com medo de que o criado deixasse o recinto. Sabia que se ficasse sozinho acabaria examinando o retrato. Teve medo da certeza. Quando o café e os cigarros foram trazidos e o criado se virou para sair, ele sentiu um louco desejo de lhe pedir que ficasse. Quando a porta estava se fechando, ele o chamou de volta. O criado ficou esperando as ordens. Dorian olhou para ele por um momento. – Não estou para ninguém – ele disse, com um suspiro. O criado fez uma mesura e se retirou.", "h": 0}, {"i": 743, "c": 10, "ct": "Capítulo VIII", "t": "Então ele se levantou da mesa, acendeu um cigarro e se atirou em um sofá luxuosamente estofado que ficava diante do biombo. O biombo era antigo, de couro com douração espanhola, estampado e gravado com um padrão floral à Luís XIV um tanto rebuscado. Ele o esquadrinhou com curiosidade, perguntando-se se já teria algum dia escondido os segredos da vida de um homem.", "h": 0}, {"i": 744, "c": 10, "ct": "Capítulo VIII", "t": "Deveria removê-lo, afinal? Por que não deixá-lo ali? De que adiantaria saber? Se fosse verdade, seria terrível. Se não fosse, por que se incomodar? Mas e se, por alguma fatalidade ou acaso fatídico, outros olhos além dos seus espiassem atrás do biombo e vissem a horrenda transformação? O que ele faria se Basil Hallward viesse e pedisse para ver o próprio quadro? Basil certamente faria isso. Não; era preciso examinar de uma vez a pintura. Qualquer coisa seria melhor que aquela dúvida pavorosa.", "h": 0}, {"i": 745, "c": 10, "ct": "Capítulo VIII", "t": "Ele se levantou e trancou as duas portas. Ao menos ficaria sozinho para olhar para a máscara de sua vergonha. Então ele afastou o biombo e viu-se face a face. Era pura verdade. O retrato havia se alterado.", "h": 0}, {"i": 746, "c": 10, "ct": "Capítulo VIII", "t": "Como ele muitas vezes se lembraria depois, e sempre com grande espanto, ele se viu contemplando o retrato com uma sensação de interesse quase científico. Que essa mudança tivesse ocorrido era algo incrível para ele. E, no entanto, era um fato. Haveria alguma afinidade sutil entre os átomos químicos, moldados em forma e cor sobre a tela, e a alma dentro de si? Seria possível que aquilo que a alma pensava eles realizassem? Que o que ela sonhava, eles tornassem realidade? Ou haveria algum outro motivo mais terrível? Ele estremeceu e sentiu medo e, voltando para o sofá, ali ficou, contemplando o quadro com náuseas de horror.", "h": 0}, {"i": 747, "c": 10, "ct": "Capítulo VIII", "t": "Uma única coisa, contudo, sentia que aquilo fizera por ele. Tornara-o consciente de quão injusto, quão cruel, havia sido com Sibyl Vane. Não era tarde demais para desfazer aquilo. Ela ainda poderia ser sua esposa. Seu amor irreal e egoísta cederia a alguma influência mais elevada, seria transformado em alguma paixão mais nobre, e o retrato que Basil Hallward lhe pintara seria um guia para ele ao longo da vida, seria para ele aquilo que a santidade é para alguns, a consciência é para outros, e o medo de Deus é para todos nós. Havia ópios para o remorso, drogas que podiam embalar e adormecer o sentido moral. Mas ali estava um símbolo visível da degradação do pecado. Ali estava um sinal sempre presente da ruína que os homens podem causar às próprias almas.", "h": 0}, {"i": 748, "c": 10, "ct": "Capítulo VIII", "t": "Bateram três horas, e quatro, e a meia hora soou seu toque duplo, mas Dorian Gray não se moveu. Estava tentando reunir os fios vermelhos da vida e tecê-los em um padrão; para encontrar seu caminho através do labirinto sanguíneo da paixão por onde vagava. Não sabia o que fazer, nem o que pensar. Enfim, foi até a mesa, e escreveu uma carta apaixonada à menina que havia amado, implorando perdão, e acusando a si mesmo de loucura. Encheu páginas e mais páginas de palavras de louca tristeza, e ainda mais loucas palavras de dor. Existe uma luxúria na autocensura. Quando nos culpamos, sentimos que ninguém mais tem o direito de nos culpar. É a confissão, não o padre, que nos absolve. Quando Dorian terminou a carta, sentia-se como se já estivesse perdoado.", "h": 0}, {"i": 749, "c": 10, "ct": "Capítulo VIII", "t": "De repente, bateram na porta, e ele ouviu a voz de lorde Henry lá fora. – Meu caro menino, preciso vê-lo. Deixe-me entrar logo. Não suporto que você se feche assim.", "h": 0}, {"i": 750, "c": 10, "ct": "Capítulo VIII", "t": "A princípio, ele não respondeu, mas ficou imóvel. As batidas continuaram e ficaram mais altas. Sim, era melhor deixar lorde Henry entrar e explicar-lhe sobre a nova vida que iria levar, brigar com ele se fosse necessário brigar, romper com ele se romper fosse inevitável. Ele se levantou com um salto, arrastou rapidamente o biombo para frente do quadro e abriu a porta.", "h": 0}, {"i": 751, "c": 10, "ct": "Capítulo VIII", "t": "– Sinto muito por tudo, Dorian – disse lorde Henry, ao entrar. – Mas você não deve ficar pensando muito nisso.", "h": 0}, {"i": 752, "c": 10, "ct": "Capítulo VIII", "t": "– Você se refere a Sibyl Vane? – perguntou o rapaz.", "h": 0}, {"i": 753, "c": 10, "ct": "Capítulo VIII", "t": "– Sim, é claro – respondeu lorde Henry, desabando em uma poltrona, e lentamente tirando as luvas amarelas. – É horrível, de um certo ponto de vista, mas não foi culpa sua. Diga-me, você foi afinal ao camarim encontrá-la quando a peça acabou?", "h": 0}, {"i": 754, "c": 10, "ct": "Capítulo VIII", "t": "– Sim.", "h": 0}, {"i": 755, "c": 10, "ct": "Capítulo VIII", "t": "– Eu sabia que você iria. Você teve uma desavença com ela?", "h": 0}, {"i": 756, "c": 10, "ct": "Capítulo VIII", "t": "– Fui brutal, Harry, totalmente brutal. Mas agora está tudo certo. Sinto muito por tudo o que aconteceu. Isso me ensinou a me conhecer melhor.", "h": 0}, {"i": 757, "c": 10, "ct": "Capítulo VIII", "t": "– Ah, Dorian, fico tão contente que você tenha entendido assim! Estava com medo de encontrá-lo mergulhado no remorso e arrancando esses seus belos cabelos cacheados.", "h": 0}, {"i": 758, "c": 10, "ct": "Capítulo VIII", "t": "– Eu consegui superar – disse Dorian, balançando a cabeça e sorrindo. – Agora estou perfeitamente feliz. Sei o que significa consciência, antes de mais nada. Não é o que você me disse que era. É a coisa mais divina dentro de nós. Não zombe, Harry, pelo menos não na minha frente. Quero ser bom. Não suporto a ideia de minha alma ser hedionda.", "h": 0}, {"i": 759, "c": 10, "ct": "Capítulo VIII", "t": "– É uma base artística encantadora para a ética, Dorian! Meus parabéns. Mas como você vai começar?", "h": 0}, {"i": 760, "c": 10, "ct": "Capítulo VIII", "t": "– Casando-me com Sibyl Vane.", "h": 0}, {"i": 761, "c": 10, "ct": "Capítulo VIII", "t": "– Casando-se com Sibly Vane! – exclamou lorde Henry, ficando de pé e olhando para ele em perplexo espanto. – Mas, meu querido Dorian…", "h": 0}, {"i": 762, "c": 10, "ct": "Capítulo VIII", "t": "– Sim, Harry, já sei o que você vai dizer. Algo horrível sobre o casamento. Não diga. Nunca mais diga esse tipo de coisa para mim. Há dois dias pedi Sibyl em casamento. Não vou quebrar minha jura. Ela será minha esposa!", "h": 0}, {"i": 763, "c": 10, "ct": "Capítulo VIII", "t": "– Sua esposa!? Dorian!… Você não recebeu minha carta? Escrevi hoje cedo, e meu criado enviou o bilhete.", "h": 0}, {"i": 764, "c": 10, "ct": "Capítulo VIII", "t": "– Sua carta? Oh, sim, agora me lembrei. Não li ainda, Harry. Tive medo de conter algo de que eu não fosse gostar. Você esfacela a vida em seus epigramas.", "h": 0}, {"i": 765, "c": 10, "ct": "Capítulo VIII", "t": "– Então você ainda não sabe?", "h": 0}, {"i": 766, "c": 10, "ct": "Capítulo VIII", "t": "– Como assim?", "h": 0}, {"i": 767, "c": 10, "ct": "Capítulo VIII", "t": "Lorde Henry atravessou a sala e, sentando-se ao lado de Dorian Gray, segurou-lhe as duas mãos, e as apertou firme. – Dorian – ele disse –, a minha carta – não se apavore – dizia que Sibyl Vane morreu.", "h": 0}, {"i": 768, "c": 10, "ct": "Capítulo VIII", "t": "Um grito de dor escapou dos lábios do rapaz, e ele se pôs de pé em um salto, tirando as mãos das de lorde Henry. – Morreu! Sibyl morreu! Não é verdade! É uma mentira horrível! Como você diz uma coisa dessas?", "h": 0}, {"i": 769, "c": 10, "ct": "Capítulo VIII", "t": "– É a pura verdade, Dorian – disse lorde Henry, gravemente. – Está em todos os jornais da manhã. Escrevi para pedir que você não lesse nenhum jornal antes de eu chegar. Haverá uma investigação, é claro, e você não deve se envolver. Esse tipo de coisa torna um homem elegante em Paris. Mas em Londres as pessoas são muito preconceituosas. Aqui, não devemos fazer nosso début na sociedade com um escândalo. Devemos reservar o escândalo para atrair algum interesse na velhice. Imagino que ninguém saiba o seu nome no teatro, não? Se não souberem, está tudo bem. Alguém viu você indo até o camarim? Esse é um ponto importante.", "h": 0}, {"i": 770, "c": 10, "ct": "Capítulo VIII", "t": "Dorian ficou sem resposta por alguns momentos. Estava atordoado de horror. Enfim balbuciou em voz contrita: – Harry, você disse que haveria uma investigação? O que isso quer dizer? Sibyl não…? Oh, Harry, não posso suportar! Mas seja breve. Conte-me logo tudo de uma vez.", "h": 0}, {"i": 771, "c": 10, "ct": "Capítulo VIII", "t": "– Não tenho nenhuma dúvida de que não foi acidente, Dorian, embora essa deva ser a versão divulgada para o público. Parece que ela estava saindo do teatro com a mãe, por volta da meia-noite e meia, e disse que havia esquecido algo lá em cima. Esperaram por algum tempo, mas ela não desceu de volta. Acabaram encontrando-a morta, estendida no chão do camarim. Ela tomou alguma coisa por engano, algo terrível que usam no teatro. Não sei o que era, mas acho que foi ácido prússico ou chumbo branco. Eu diria que foi ácido prússico, pois parece que ela morreu instantaneamente.", "h": 0}, {"i": 772, "c": 10, "ct": "Capítulo VIII", "t": "– Harry, Harry, é terrível! – exclamou o rapaz.", "h": 0}, {"i": 773, "c": 10, "ct": "Capítulo VIII", "t": "– Sim; é bastante trágico, evidentemente, mas você não deve se envolver. Li no Standard que ela tinha dezessete anos. Eu diria que ela parecia ainda mais jovem. Era uma verdadeira criança e parecia não saber quase nada de teatro. Dorian, você não deve deixar que isso afete os seus nervos. Venha jantar comigo e depois vamos à ópera. Esta noite Patti canta, e todo mundo vai. Você pode ficar no camarote da minha irmã. Ela sempre vai com as amigas coquetes.", "h": 0}, {"i": 774, "c": 10, "ct": "Capítulo VIII", "t": "– Então eu matei Sibyl Vane – disse Dorian Gray, em parte consigo mesmo –, matei como se eu mesmo tivesse cortado seu pescoço delicado com uma faca. Contudo as rosas não estão menos adoráveis por isso. Os pássaros cantam felizes no meu jardim da mesma maneira. E hoje à noite vou jantar com você, e depois irei à ópera, e cearemos algures, imagino, mais tarde. Como a vida é extraordinariamente dramática! Se eu tivesse lido isso em um livro, Harry, acho que choraria. De alguma forma, agora que aconteceu de verdade, e comigo, parece maravilhoso demais para chorar. Eis a primeira carta de amor apaixonada que escrevi na vida. Estranho que minha primeira carta de amor tenha sido endereçada a uma menina morta. Será que essas pessoas brancas e caladas que chamamos de mortos, será que elas sentem? Sibyl! Será que ela pode sentir, ou saber, ou ouvir? Oh, Harry, como a amei um dia! Agora me parecem anos. Ela era tudo para mim. Então veio aquela noite pavorosa – será possível que tenha sido mesmo a noite passada? Em que ela atuou tão mal, e meu coração quase partiu. Ela me explicou tudo depois. E foi terrivelmente patético. Mas não me comovi minimamente. Julguei-a fútil. Inesperadamente, aconteceu uma coisa que me deixou com muito medo. Não posso lhe dizer o quê, mas foi terrível. Disse a mim mesmo que voltaria para ela. Senti que agira errado. E agora ela morreu. Meu Deus! Meu Deus! Harry, o que devo fazer? Você não sabe o perigo que estou correndo, e não há nada que possa me endireitar. Ela teria feito isso por mim. Ela não tinha o direito de se matar. Foi egoísta da parte dela.", "h": 0}, {"i": 775, "c": 10, "ct": "Capítulo VIII", "t": "– Meu caro Dorian – respondeu lorde Henry, tirando um cigarro da cigarreira, e sacando uma caixa de fósforos dourada –, a única maneira de uma mulher endireitar um homem é deixando-o tão entediado que ele perde todo possível interesse pela vida. Se você tivesse se casado com essa menina, você estaria desgraçado. Claro, você teria sido bom com ela. Sempre se pode ser bom com quem não nos importa minimamente. Mas ela logo descobriria que você era absolutamente indiferente a ela. E quando uma mulher descobre isso sobre o marido, ou ela se torna pavorosamente deselegante, ou passa a usar chapéus finos pagos pelo marido de outra mulher. Nem digo nada sobre o equívoco social, que teria sido abjeto, algo que, evidentemente, eu não teria permitido, mas que eu lhe garanto que de qualquer modo teria sido um absoluto fracaso.", "h": 0}, {"i": 776, "c": 10, "ct": "Capítulo VIII", "t": "– Imagino que sim – murmurou o rapaz, indo e vindo pelo aposento, com aparência horrivelmente pálida. – Mas achei que era meu dever. Não é minha culpa que essa tragédia terrível tenha me impedido de fazer o que era certo. Lembro-me de você ter dito uma vez que há uma fatalidade nas boas decisões – que é serem tomadas sempre tarde demais. A minha certamente foi.", "h": 0}, {"i": 777, "c": 10, "ct": "Capítulo VIII", "t": "– As boas decisões são tentativas inúteis de interferir em leis científicas. Sua origem é a pura vaidade. Seu resultado, absolutamente nulo. Elas nos dão, de quando em quando, algumas emoções grandiosas e estéreis que possuem um certo apelo para os fracos. Isso é tudo o que se pode dizer sobre elas. São simplesmente cheques sacados em um banco onde não temos conta.", "h": 0}, {"i": 778, "c": 10, "ct": "Capítulo VIII", "t": "– Harry – exclamou Dorian Gray, aproximando-se e sentando-se ao lado dele –, por que será que não consigo sentir essa tragédia tanto quanto gostaria? Não creio que eu seja cruel. O que você acha?", "h": 0}, {"i": 779, "c": 10, "ct": "Capítulo VIII", "t": "– Você fez muitas tolices nas últimas duas semanas para merecer esse adjetivo, Dorian – respondeu lorde Henry, com seu doce e melancólico sorriso.", "h": 0}, {"i": 780, "c": 10, "ct": "Capítulo VIII", "t": "O rapaz franziu o cenho. – Não gostei dessa explicação, Harry – ele continuou –, mas fico contente que você não me ache cruel. Não sou nada disso. Sei que não sou. E, no entanto, devo admitir que isso que aconteceu não me afetou como deveria. Parece-me simplesmente um desfecho maravilhoso de uma peça maravilhosa. Possui toda a terrível beleza de uma tragédia grega, uma tragédia em que desempenhei um grande papel, mas pela qual não fui ferido.", "h": 0}, {"i": 781, "c": 10, "ct": "Capítulo VIII", "t": "– É uma questão interessante – disse lorde Henry, que encontrava um prazer raro em agir sobre o egoísmo inconsciente do rapaz –, uma questão extremamente interessante. Imagino que a verdadeira explicação seja a seguinte. Frequentemente, acontece de as verdadeiras tragédias da vida ocorrerem de maneira tão pouco artísticas, que nos machucam por sua violência crua, sua absoluta incoerência, sua absurda falta de sentido, sua total falta de estilo. Elas nos afetam da mesma maneira que a vulgaridade nos afeta. Elas nos dão a impressão da pura força bruta, e nos revoltamos contra isso. Às vezes, no entanto, uma tragédia que possui elementos artísticos de beleza cruza nossas vidas. Se esses elementos de beleza são reais, a coisa toda simplesmente fala à nossa noção de efeito dramático. Subitamente descobrimos que já não somos mais os atores, mas os espectadores da peça. Ou melhor, somos as duas coisas. Observamos a nós mesmos, e o mero fascínio do espetáculo nos cativa. Neste caso concreto, o que foi que realmente aconteceu? Alguém se matou por amar você. Quem me dera ter tido essa experiência! Teria me tornado um apaixonado pelo amor pelo resto da vida. As pessoas que me adoraram – não foram muitas, mas houve algumas – sempre insistiram em sobreviver, muito depois de eu deixar de me importar com elas, ou elas comigo. Ficaram corpulentas e entediantes, e quando as encontro logo partem para as reminiscências. Que memória medonha têm as mulheres! Que coisa pavorosa! E que total estagnação intelectual isso revela! Devemos absorver a cor da vida, mas nunca lembrar seus detalhes. Os detalhes são sempre vulgares.", "h": 0}, {"i": 782, "c": 10, "ct": "Capítulo VIII", "t": "– Devo plantar papoulas no meu jardim – suspirou Dorian.", "h": 0}, {"i": 783, "c": 10, "ct": "Capítulo VIII", "t": "– Não há nenhuma necessidade – continuou o companheiro. – A vida sempre tem papoulas nas mãos. É claro, de quando em quando, as coisas duram. Houve um tempo em que usei durante uma temporada inteira apenas violetas na lapela, como uma forma de luto artístico por um romance que se recusava a morrer. Enfim, no entanto, acabou morrendo. Esqueci o que foi que o matou. Creio que foi a proposta dela de sacrificar o mundo inteiro por mim. Esse é sempre um momento horrível. Somos dominados pelo terror da eternidade. Bem – quem diria? –, semana passada, na casa de lady Hampshire, eu me vi sentado no jantar ao lado da lady em questão, e ela insistiu em repassar mais uma vez a história toda, escavando o passado e cavoucando o futuro. Enterrei meu romance em um canteiro de asfódelos. Ela o arrancou dali e afirmou que eu havia arruinado a sua vida. Devo dizer que ela jantou com enorme apetite, de modo que não senti nenhuma angústia. Mas que falta de gosto ela demonstrou! O único atrativo do passado é ter passado. Mas as mulheres nunca sabem quando o pano já caiu. Elas sempre querem um sexto ato e, assim que o interesse da peça passou inteiramente, elas propõem uma continuação. Se elas pudessem fazer à sua maneira, toda comédia teria um final trágico e toda tragédia culminaria em uma farsa. Elas são encantadoramente artificiais, mas não têm a menor noção de arte. Você tem mais sorte do que eu. Eu lhe asseguro, Dorian, que nenhuma das mulheres que conheci faria por mim o que Sibyl Vane fez por você. As mulheres comuns sempre se consolam. Algumas se consolam recorrendo aos tons sentimentais. Jamais confie numa mulher usando malva, seja da idade que for, ou numa mulher com mais de trinta e cinco que goste de fita rosa. Isso sempre significa que elas têm uma história pregressa. Outras encontram grande consolo descobrindo subitamente as boas qualidades dos maridos. Ostentam sua felicidade conjugal, como se fosse o pecado mais fascinante. A religião consola algumas. Os mistérios da religião têm o mesmo encanto de um flerte, disse-me uma vez uma mulher; e entendi perfeitamente. Além do mais, nada deixa a pessoa mais cheia de si que ser chamada de pecadora. A consciência nos torna a todos egoístas. Sim; na verdade, não há fim para os consolos que as mulheres encontram na vida moderna. A bem dizer, sequer mencionei o mais importante.", "h": 0}, {"i": 784, "c": 10, "ct": "Capítulo VIII", "t": "– Qual, Harry? – disse o rapaz, sem ênfase.", "h": 0}, {"i": 785, "c": 10, "ct": "Capítulo VIII", "t": "– Oh, o consolo mais óbvio. Tomar o admirador da outra quando perdem o seu. Na boa sociedade, isso sempre recupera a imagem da mulher. Mas, realmente, Dorian, como Sibyl Vane teria sido diferente de todas essas mulheres que se encontram por aí! Existe algo muito bonito na morte dela. Fico contente de viver em um século em que tais prodígios acontecem. Eles nos fazem acreditar na realidade de coisas com as quais todos nós brincamos, como romance, paixão e amor.", "h": 0}, {"i": 786, "c": 10, "ct": "Capítulo VIII", "t": "– Fui terrivelmente cruel com ela. Você se esquece disso.", "h": 0}, {"i": 787, "c": 10, "ct": "Capítulo VIII", "t": "– Receio que as mulheres apreciem a crueldade, a crueldade pura e simples, mais do que qualquer outra coisa. Elas têm instintos maravilhosamente primitivos. Nós as emancipamos, mas elas continuam escravas em busca de senhores como antes. Adoram ser dominadas. Tenho certeza de que você foi esplêndido. Jamais o vi real e absolutamente furioso, mas posso imaginar quão adorável você deve ter sido. E, afinal, você me disse uma coisa antes de ontem que me pareceu na hora mera fantasia, mas que vejo agora que era absolutamente verdadeiro, e que é a chave de tudo.", "h": 0}, {"i": 788, "c": 10, "ct": "Capítulo VIII", "t": "– O que foi, Harry?", "h": 0}, {"i": 789, "c": 10, "ct": "Capítulo VIII", "t": "– Você me disse que Sibyl Vane representou para você todas as heroínas do romance – que ela era Desdêmona uma noite, e Ofélia na noite seguinte; que morria Julieta e ressuscitava Imogênia.", "h": 0}, {"i": 790, "c": 10, "ct": "Capítulo VIII", "t": "– Agora jamais ressuscitará – murmurou o rapaz, escondendo o rosto nas mãos.", "h": 0}, {"i": 791, "c": 10, "ct": "Capítulo VIII", "t": "– Não, ela não voltará à vida. Ela desempenhou seu último papel. Mas você deve pensar nessa morte solitária em um pobre camarim simplesmente como um estranho fragmento apelativo de alguma tragédia jacobita, como uma cena maravilhosa de Webster, Ford ou Cyril Tourneur. A menina nunca chegou a viver realmente e, portanto, tampouco morreu de verdade. Para você ao menos, ela sempre foi um sonho, um fantasma que esvoaçou entre peças de Shakespeare e que as deixou mais adoráveis com sua presença, um sopro através do qual a música de Shakespeare soou mais rica e mais cheia de alegria. No momento em que ela tocou a vida real, ela a arruinou e foi arruinada pela vida real, e assim morreu. Chore por Ofélia, se quiser. Cubra-se de cinzas pois Cordélia foi estrangulada. Grite contra os céus pois a filha de Brabâncio morreu. Mas não desperdice suas lágrimas com Sibyl Vane. Ela foi menos real do que elas ainda são.", "h": 0}, {"i": 792, "c": 10, "ct": "Capítulo VIII", "t": "Fez-se um silêncio. A noite escureceu o ambiente. Silenciosamente, e com pés de prata, as sombras avançaram desde o jardim. As cores se retiraram, exauridas, de todas as coisas.", "h": 0}, {"i": 793, "c": 10, "ct": "Capítulo VIII", "t": "Após algum tempo, Dorian Gray ergueu os olhos. – Você me explicou a mim mesmo, Harry – ele murmurou com algo como um suspiro de alívio. – Senti tudo o que você disse, mas de algum modo fiquei com medo do que senti e não consegui expressar essa sensação para mim mesmo. Você me conhece tão bem! Mas não falaremos mais sobre o que aconteceu. Foi uma experiência maravilhosa. Só isso. Eu me pergunto se a vida ainda me reservará algo de tão maravilhoso.", "h": 0}, {"i": 794, "c": 10, "ct": "Capítulo VIII", "t": "– A vida ainda lhe reserva tudo, Dorian. Não haverá nada que você, com sua boa aparência extraordinária, não consiga fazer.", "h": 0}, {"i": 795, "c": 10, "ct": "Capítulo VIII", "t": "– Mas imagine, Harry, que eu fique acabado, velho, encarquilhado? E depois?", "h": 0}, {"i": 796, "c": 10, "ct": "Capítulo VIII", "t": "– Ah, depois – disse lorde Henry, levantando-se para sair –, depois, meu querido Dorian, você precisará lutar por suas vitórias. No momento, elas são trazidas até você. Não, você precisa conservar sua boa aparência. Vivemos em uma época que lê demais para ser sábia e que pensa demais para ser bela. Não podemos abrir mão de você. E agora é melhor você se vestir, pois vamos ao clube. Estamos um tanto atrasados, na verdade.", "h": 0}, {"i": 797, "c": 10, "ct": "Capítulo VIII", "t": "– Creio que vou encontrá-lo na ópera, Harry. Estou muito cansado para comer. Qual é o número do camarote da sua irmã?", "h": 0}, {"i": 798, "c": 10, "ct": "Capítulo VIII", "t": "– Vinte e sete, suponho. É na primeira fila dos camarotes. Você verá o nome dela na porta. Mas lamento que você não venha jantar.", "h": 0}, {"i": 799, "c": 10, "ct": "Capítulo VIII", "t": "– Não estou disposto – disse Dorian, apático. – Mas agradeço imensamente por tudo o que você me disse. Você é certamente o meu melhor amigo. Ninguém nunca me entendeu como você me entende.", "h": 0}, {"i": 800, "c": 10, "ct": "Capítulo VIII", "t": "– Estamos apenas no início da nossa amizade, Dorian – respondeu lorde Henry, balançando a mão dele. – Adeus. Nós nos veremos antes das nove e meia, espero. Lembre-se, a Patti canta hoje.", "h": 0}, {"i": 801, "c": 10, "ct": "Capítulo VIII", "t": "Assim que fechou a porta atrás dele, Dorian Gray tocou a sineta, e minutos depois Victor apareceu com os lampiões e fechou as cortinas. Esperou impacientemente que ele fosse embora. O criado parecia demorar uma eternidade para fazer as coisas.", "h": 0}, {"i": 802, "c": 10, "ct": "Capítulo VIII", "t": "Assim que o empregado saiu, ele correu até o biombo e o afastou. Não; não havia mais nenhuma mudança no quadro. O retrato recebera a notícia da morte de Sibyl Vane antes que ele. A pintura tomava consciência dos acontecimentos da vida no instante em que ocorriam. A perversa crueldade que estragara as belas linhas da boca, sem dúvida, havia aparecido no exato momento em que a menina bebera o veneno, qualquer que tenha sido. Ou será que o quadro era indiferente aos resultados? Será que meramente tomava conhecimento do que se passava dentro da alma dele? Ele se perguntava se algum dia poderia ver a transformação ocorrendo na tela diante de seus olhos, estremecendo pela expectativa.", "h": 0}, {"i": 803, "c": 10, "ct": "Capítulo VIII", "t": "Pobre Sibyl! Que grande romance havia sido tudo aquilo! Muitas vezes ela imitara a morte no palco. Então a própria morte a tocou e a levou consigo. Como ela teria feito essa pavorosa cena final? Será que o amaldiçoou na hora da morte? Não; ela havia morrido de amor por ele, e o amor seria um sacramento para ele a partir de agora. Ela havia se redimido por tudo, com o sacrifício que fizera da própria vida. Ele não pensaria mais no que ela o fizera sofrer, sobre aquela noite horrível no teatro. Quando pensasse nela, seria como uma maravilhosa figura trágica enviada ao teatro do mundo para mostrar a suprema realidade do amor. Uma maravilhosa figura trágica? Lágrimas lhe vieram aos olhos quando se lembrou da aparência infantil, dos modos cativantes e fantasiosos, da tímida graça trêmula. Enxugou-as bruscamente e tornou a olhar para o retrato.", "h": 0}, {"i": 804, "c": 10, "ct": "Capítulo VIII", "t": "Ele sentiu que realmente havia chegado a hora de fazer sua escolha. Ou será que sua escolha já havia sido feita? Sim, a vida havia decidido por ele – a vida, e sua infinita curiosidade sobre a vida. Vida eterna, paixão infinita, prazeres sutis e secretos, alegrias selvagens e pecados ainda mais selvagens – ele teria todas essas coisas. O retrato haveria de carregar o fardo de sua vergonha: era só isso.", "h": 0}, {"i": 805, "c": 10, "ct": "Capítulo VIII", "t": "Sentiu-se lentamente tomado por uma dor ao pensar na profanação reservada para o belo rosto pintado na tela. Um dia, em uma imitação infantil de Narciso, ele havia beijado, ou fingira beijar, aqueles lábios pintados que agora lhe sorriam tão cruelmente. Inúmeras manhãs, ele se sentara diante do retrato, divagando sobre sua beleza, quase apaixonado por ela, como lhe parecia às vezes. Será que se alteraria agora a cada estado de espírito? Será que se tornaria uma coisa monstruosa e odiosa, que deveria esconder em um quarto trancado, excluído da luz do sol que tantas vezes tornara em ouro mais claro a ondulada maravilha de seus cabelos? Que pena! Que pena!", "h": 0}, {"i": 806, "c": 10, "ct": "Capítulo VIII", "t": "Por um momento, ele pensou em rezar para que a horrível simpatia existente entre ele e o retrato pudesse acabar. A pintura havia se transformado em resposta a uma súplica; talvez pudesse permanecer inalterada em resposta a uma outra. E, no entanto, quem, que soubesse algo sobre a vida, perderia a oportunidade de continuar sempre jovem, por mais fantástica que essa oportunidade possa ser, ou que consequências fatídicas pudesse acarretar? Além disso, será que ele tinha realmente algum controle sobre aquilo? Tinha sido de fato a sua jura que produzira a transformação? Não poderia haver algum motivo científico curioso para tudo aquilo? Se o pensamento podia exercer influência sobre um organismo vivo, não poderia também o pensamento exercer influência sobre as coisas mortas e inorgânicas? Ora, sem o pensamento ou o desejo consciente, seria possível que as coisas externas a nós vibrassem em uníssono com nossos estados de espírito e paixões, átomo com átomo em amor secreto de estranha afinidade? Mas o motivo não tinha importância. Jamais tentaria com outra súplica qualquer potência terrível. Se o retrato fosse se alterar, que se alterasse. Era só isso. Por que investigar ainda mais de perto?", "h": 0}, {"i": 807, "c": 10, "ct": "Capítulo VIII", "t": "Pois haveria uma prazer genuíno em observar acontecer. Ele seria capaz de acompanhar o próprio espírito em seus recantos secretos. Esse retrato seria para ele o mais mágico dos espelhos. Assim como lhe revelara o próprio corpo, revelaria sua própria alma. E quando chegasse o inverno, ele ainda estaria onde estremece a primavera, no limite do verão. Quando o sangue abandonasse o rosto, deixando para trás uma pálida máscara de gesso com olhos de chumbo, ele conservaria o garbo da adolescência. Nenhuma flor de sua graça jamais feneceria. Nenhum pulso de sua vida jamais se enfraqueceria. Como os deuses gregos, ele seria forte, e ágil, e alegre. Que importância tinha o que aconteceria com a imagem colorida sobre a tela? Ele estaria a salvo. Era só isso que importava.", "h": 0}, {"i": 808, "c": 10, "ct": "Capítulo VIII", "t": "Puxou o biombo para a posição anterior, na frente do retrato, sorrindo enquanto o fazia, e entrou no quarto, onde o criado já o aguardava. Uma hora depois, estava na ópera, e lorde Henry se inclinava sobre sua poltrona.", "h": 0}, {"i": 809, "c": 11, "ct": "Capítulo IX", "t": "Capítulo IX", "h": 1}, {"i": 810, "c": 11, "ct": "Capítulo IX", "t": "Quando ele fazia o desjejum na manhã seguinte, Basil Hallward foi trazido pelo criado.", "h": 0}, {"i": 811, "c": 11, "ct": "Capítulo IX", "t": "– Fico contente de tê-lo encontrado, Dorian – ele disse, gravemente. – Vim procurá-lo ontem à noite, e me disseram que você estava na ópera. Evidentemente, eu sabia que era impossível. Mas você podia ter deixado um recado dizendo aonde ia. Passei uma noite terrível, com medo de que uma tragédia pudesse acontecer depois da outra. Acho que você podia ter enviado um telegrama quando soube da notícia. Li por acaso em uma edição vespertina do Globe , que peguei para ler no clube. Vim imediatamente para cá, e foi muito triste não encontrá-lo. Não sei dizer o quanto me parte o coração toda essa história. Sei como você deve estar sofrendo. Mas onde você estava? Você foi visitar a mãe da menina? Por um momento pensei em procurá-lo por lá. Deram o endereço no jornal. Na Euston Road, não? Mas não quis me intrometer em uma tristeza que não posso aliviar. Pobre mulher! Imagine o estado em que ela está! E filha única! O que ela disse?", "h": 0}, {"i": 812, "c": 11, "ct": "Capítulo IX", "t": "– Meu caro Basil, como vou saber? – murmurou Dorian Gray, bebericando um vinho amarelo-claro de uma bela taça veneziana ornada de contas douradas, com semblante terrivelmente entediado. – Eu estava na ópera. Você devia ter ido. Encontrei lady Gwendolen, a irmã do Harry, pela primeira vez. Ficamos no camarote dela. Ela é perfeitamente encantadora; e a Patti cantou divinamente. Não venha com assuntos horríveis. Se não falamos de uma coisa, ela nunca aconteceu. É só a expressão, como Harry diz, que confere a realidade às coisas. Posso lhe dizer que ela não era filha única. Existe um filho, imagino que seja um sujeito encantador. Mas não trabalha em teatro. É marinheiro, ou coisa assim. E agora me conte sobre você e o que está pintando.", "h": 0}, {"i": 813, "c": 11, "ct": "Capítulo IX", "t": "– Você foi à ópera? – disse Hallward, muito lentamente e em tom dolorido. – Você foi à ópera enquanto Sibyl Vane estava morta no chão de um sórdido camarim? Você é capaz de me falar de outras mulheres encantadoras, e que a Patti cantou divinamente, antes mesmo que a menina que você amava sequer tivesse recebido o repouso de uma sepultura? Ora, imagine os horrores reservados para aquele pequeno corpo branco!", "h": 0}, {"i": 814, "c": 11, "ct": "Capítulo IX", "t": "– Pare, Basil! Não quero ouvir! – exclamou Dorian, ficando de pé em um salto. –Você não deve me contar nada. O que foi feito está feito. O que se passou, é passado.", "h": 0}, {"i": 815, "c": 11, "ct": "Capítulo IX", "t": "–Você chama ontem de passado?", "h": 0}, {"i": 816, "c": 11, "ct": "Capítulo IX", "t": "– Que diferença faz o lapso de tempo? Apenas as pessoas fúteis precisam de anos para se livrar de uma emoção. Um homem que é senhor de si mesmo é capaz de acabar com a tristeza com a mesma facilidade com que inventa um prazer. Não quero ficar à mercê das minhas emoções. Quero usá-las, desfrutá-las e dominá-las.", "h": 0}, {"i": 817, "c": 11, "ct": "Capítulo IX", "t": "– Dorian, isto é horrível! Alguma coisa o transformou completamente. Você parece exatamente o mesmo menino maravilhoso que todo dia costumava vir ao meu estúdio posar para o seu retrato. Mas antes você era simples, natural e afetuoso. Você era a criatura mais imaculada do mundo. Agora, não sei o que aconteceu com você. Você fala como se não tivesse coração, compaixão. Isso é tudo influência do Harry. Isso eu sei.", "h": 0}, {"i": 818, "c": 11, "ct": "Capítulo IX", "t": "O rapaz corou e, aproximando-se da janela, olhou por alguns momentos para o verde e cintilante jardim rajado de sol. – Devo muito a Harry, Basil – ele disse, enfim –, ainda mais do que devo a você. Você só me ensinou a ser fútil.", "h": 0}, {"i": 819, "c": 11, "ct": "Capítulo IX", "t": "– Bem, estou sendo punido por isso, Dorian – ou serei um dia.", "h": 0}, {"i": 820, "c": 11, "ct": "Capítulo IX", "t": "– Não sei do que você está falando, Basil – ele exclamou, virando-se. – Não sei o que você quer. O que você quer?", "h": 0}, {"i": 821, "c": 11, "ct": "Capítulo IX", "t": "– Quero o Dorian Gray que eu costumava pintar – disse o artista, tristemente.", "h": 0}, {"i": 822, "c": 11, "ct": "Capítulo IX", "t": "– Basil – disse o rapaz, indo até ele e pondo a mão no ombro dele –, você chegou tarde. Ontem, quando fiquei sabendo que Sibyl Vane havia cometido suicídio…", "h": 0}, {"i": 823, "c": 11, "ct": "Capítulo IX", "t": "– Suicídio! Céus! já não há nenhuma dúvida quanto a isso? – exclamou Hallward, olhando para ele com expressão de horror.", "h": 0}, {"i": 824, "c": 11, "ct": "Capítulo IX", "t": "– Meu caro Basil! Ou você acha que foi um acidente qualquer? Claro que ela se matou.", "h": 0}, {"i": 825, "c": 11, "ct": "Capítulo IX", "t": "O amigo mais velho cobriu o rosto com as mãos. – Que coisa pavorosa – ele murmurou, e um calafrio percorreu seu corpo.", "h": 0}, {"i": 826, "c": 11, "ct": "Capítulo IX", "t": "– Não – disse Dorian Gray –, não há nada de pavoroso nisso. Trata-se de uma das grandes tragédias românticas dos nossos tempos. Em geral, artistas de teatro levam as vidas mais banais. São bons maridos, esposas fiéis, ou algo assim tedioso. Você sabe –virtudes de classe média, esse tipo de coisa. Como Sibyl era diferente! Ela viveu sua melhor tragédia. Sempre foi uma heroína. Em sua última noite em cena – quando você a viu – ela atuou mal porque havia descoberto a realidade do amor. Quando descobriu a irrealidade desse amor, ela morreu, como Julieta teria morrido. Ela passou novamente para a esfera da arte. Há nela algo de mártir. Sua morte tem toda a inutilidade patética do martírio, toda essa beleza desperdiçada. Mas, como eu dizia, não pense que não sofri. Se você tivesse vindo ontem em um determinado momento por volta das cinco e meia, talvez, quinze para as seis, teria me visto aos prantos. Nem mesmo o Harry, que esteve aqui e me trouxe a notícia, na verdade, não fazia ideia do que eu estava passando. Sofri imensamente. Depois passou. Não consigo repetir uma emoção. Ninguém consegue, exceto os sentimentais. E você está sendo terrivelmente injusto, Basil. Você veio aqui me consolar. É muita delicadeza da sua parte. Mas você me encontra consolado e fica furioso. Que tipo de solidariedade é essa? Isso me lembrou de uma história que o Harry me contou de um certo filantropo que passou vinte anos tentando redimir uma ofensa, ou alterar alguma lei, não me lembro exatamente. Enfim ele conseguiu, e nada foi capaz de superar sua frustração. Não tinha absolutamente mais nada para fazer, quase morreu de ennui e se tornou um rematado misantropo. E, além disso, meu bom e velho Basil, se você quer mesmo me consolar, ensine-me a esquecer o que aconteceu, ou a ver tudo de um ponto de vista propriamente artístico. Não era Gautier que costumava falar da consolation des arts ? Lembro-me de ter visto em um volumezinho com capa de velino no seu estúdio um dia e por acaso li essa frase deliciosa. Bem, não sou mais como aquele rapaz que você me contou um dia quando estávamos em Marlow, aquele que costumava dizer que o cetim amarelo era capaz de consolar todas as desgraças da vida. Eu adoro coisas belas que se possa tocar e manusear. Velhos brocados, bronzes esverdeados, entalhes laqueados, marfins, ambientes sofisticados, luxo, pompa, há muito o que absorver disso tudo. Mas o temperamento artístico que essas coisas criam, ou revelam em alguma medida, é ainda mais importante para mim. Tornar-se espectador da própria vida, como diz Harry, é escapar do sofrimento da vida. Sei que você está surpreso com o que estou falando. Você não se deu conta de quanto evoluí. Eu era um menino quando você me conheceu. Agora sou um homem. Tenho novas paixões, novos pensamentos, novas ideias. Estou diferente, mas você não deve gostar menos de mim por isso. Estou mudado, mas você deve continuar para sempre meu amigo. É claro que gosto muito do Harry. Mas sei que você é uma pessoa melhor do que ele. Você não é mais forte – você tem medo da vida –, mas é uma pessoa melhor. E como fomos felizes juntos! Não me abandone, Basil, e não brigue comigo. Sou o que sou. Não há mais o que dizer.", "h": 0}, {"i": 827, "c": 11, "ct": "Capítulo IX", "t": "O pintor sentiu-se estranhamente comovido. Tinha um carinho infinito pelo rapaz, e a personalidade dele havia sido o grande ponto de inflexão de sua arte. Não conseguiu suportar mais a ideia de censurá-lo. Afinal, sua indiferença provavelmente era apenas um estado de espírito que passaria. Havia muita coisa boa nele, muita coisa nobre.", "h": 0}, {"i": 828, "c": 11, "ct": "Capítulo IX", "t": "– Bem, Dorian – ele disse, enfim, com um sorriso tristonho –, a partir de hoje, não falarei mais sobre essa coisa horrível. Só espero que o seu nome não seja associado a ela. A investigação deve começar hoje à tarde. Você já recebeu a intimação?", "h": 0}, {"i": 829, "c": 11, "ct": "Capítulo IX", "t": "Dorian negou com a cabeça e um esgar de irritação percorreu seu semblante quando a palavra investigação foi mencionada. Havia algo de brutal e vulgar nesse tipo de coisa. – Eles não sabem o meu nome – ele respondeu.", "h": 0}, {"i": 830, "c": 11, "ct": "Capítulo IX", "t": "– Mas decerto ela sabia, não?", "h": 0}, {"i": 831, "c": 11, "ct": "Capítulo IX", "t": "– Apenas o nome de batismo, e tenho certeza de que ela nunca disse a ninguém. Ela me disse uma vez que estavam todos curiosos para saber quem eu era, e que ela sempre dizia que eu era o Príncipe Encantado. Era gracioso da parte dela. Basil, você precisa me fazer um retrato da Sibyl. Eu gostaria de ter mais do que a lembrança de alguns poucos beijos e algumas palavras patéticas entrecortadas.", "h": 0}, {"i": 832, "c": 11, "ct": "Capítulo IX", "t": "– Vou tentar fazer alguma coisa, Dorian, se é do seu agrado. Mas você também precisa me visitar e posar de novo. Não posso continuar sem você.", "h": 0}, {"i": 833, "c": 11, "ct": "Capítulo IX", "t": "– Nunca mais posarei para você, Basil. É impossível! – ele exclamou, recuando sobressaltado.", "h": 0}, {"i": 834, "c": 11, "ct": "Capítulo IX", "t": "O pintor olhou para ele. – Meu querido menino, que absurdo! – exclamou ele.", "h": 0}, {"i": 835, "c": 11, "ct": "Capítulo IX", "t": "– Quer dizer que você não gostou do retrato que eu fiz? Onde está? Por que você pôs esse biombo na frente do quadro? Deixe-me ver. É o melhor quadro que já fiz. Tire esse biombo, Dorian. É deselegante da parte do seu empregado esconder meu trabalho assim. Senti que a sala ficou diferente quando entrei.", "h": 0}, {"i": 836, "c": 11, "ct": "Capítulo IX", "t": "– Meu empregado não tem nada a ver com isso, Basil. Ou você acha que eu deixo que ele arrume a sala para mim? Ele arruma as minhas flores, às vezes, e só. Não; eu mesmo pus o biombo. A luz estava forte demais no retrato.", "h": 0}, {"i": 837, "c": 11, "ct": "Capítulo IX", "t": "– Forte demais! Certamente não, meu caro! É um lugar admirável para o quadro. Deixe-me vê-lo – e Hallward caminhou até o canto da sala.", "h": 0}, {"i": 838, "c": 11, "ct": "Capítulo IX", "t": "Um grito de horror escapou dos lábios de Dorian Gray, e ele correu para se interpor entre o pintor e o biombo.", "h": 0}, {"i": 839, "c": 11, "ct": "Capítulo IX", "t": "– Basil – ele disse, muito empalidecido –, você não pode olhar para o retrato. Não quero que você veja.", "h": 0}, {"i": 840, "c": 11, "ct": "Capítulo IX", "t": "– Não posso ver o meu próprio trabalho? Você não está falando sério! Por que eu não poderia?! – exclamou Hallward, dando risada.", "h": 0}, {"i": 841, "c": 11, "ct": "Capítulo IX", "t": "– Se você tentar ver, Basil, palavra de honra, nunca mais falarei com você enquanto eu viver. Estou falando muito sério. Não darei nenhuma explicação, e você não vai querer que eu explique. Mas, lembre-se, se você tocar nesse biombo, estará tudo acabado entre nós.", "h": 0}, {"i": 842, "c": 11, "ct": "Capítulo IX", "t": "Hallward ficou atordoado. Ele olhou para Dorian Gray absolutamente perplexo. Nunca o vira assim antes. O rapaz estava de fato pálido de raiva. Suas mãos crispadas, e as pupilas pareciam discos de fogo azul. Tremia dos pés à cabeça.", "h": 0}, {"i": 843, "c": 11, "ct": "Capítulo IX", "t": "– Dorian!", "h": 0}, {"i": 844, "c": 11, "ct": "Capítulo IX", "t": "– Não diga nada!", "h": 0}, {"i": 845, "c": 11, "ct": "Capítulo IX", "t": "– Mas o que houve? Claro que não olharei se você não quiser que eu olhe – ele disse, um tanto friamente, fazendo meia-volta e aproximando-se da janela. – Mas, realmente, é um tanto absurdo que eu não possa ver o meu próprio trabalho, especialmente porque vou expôr esse retrato em Paris no outono. Provavelmente precisarei dar outra demão de verniz antes da exposição, de modo que precisarei vê-lo algum dia, por que não hoje?", "h": 0}, {"i": 846, "c": 11, "ct": "Capítulo IX", "t": "– Exposição? Você quer expor esse quadro!? – exclamou Dorian Gray, sentindo-se dominar lentamente por uma estranha sensação de terror. O mundo afinal conheceria seu segredo? As pessoas ficariam boquiabertas diante do mistério da sua vida? Isso era impossível. Alguma coisa – ele não sabia o que ainda – precisava ser feita logo.", "h": 0}, {"i": 847, "c": 11, "ct": "Capítulo IX", "t": "– Sim; imagino que você não vá fazer nenhuma objeção. George Petit reunirá meus melhores quadros para uma exposição especial na Rue de Sèze, que abre na primeira semana de outubro. O quadro só ficará fora por um mês. Imagino que você possa abrir mão dele nesse ínterim. A bem da verdade, você estará fora da cidade. E, se você sempre esconde o quadro atrás de um biombo, não é possível que se importe tanto assim com ele.", "h": 0}, {"i": 848, "c": 11, "ct": "Capítulo IX", "t": "Dorian Gray passou a mão pela testa. Havia gotas de suor. Sentiu-se à beira de um perigo horrível. – Você me disse um mês atrás que jamais exporia esse quadro – ele exclamou. – Por que você mudou de ideia? Vocês, que se dizem coerentes, têm tantos caprichos quanto as outras pessoas. A única diferença é que os seus caprichos são caprichos sem sentido. Não é possível que você tenha se esquecido de que me prometeu solenemente que nada no mundo o faria enviá-lo para nenhuma exposição. Você disse exatamente a mesma coisa ao Harry – ele parou subitamente e um raio de luz se acendeu em seus olhos. Ele se lembrou de algo que lorde Henry lhe dissera uma vez, com um misto de seriedade e brincadeira: – Se você quiser criar um constrangimento de quinze minutos, peça para o Basil contar por que ele não quer expor o seu retrato. Ele me disse por que, e foi uma revelação para mim. – Sim, talvez Basil também tivesse seus segredos. Ele perguntaria e tentaria descobrir.", "h": 0}, {"i": 849, "c": 11, "ct": "Capítulo IX", "t": "– Basil – ele disse, aproximando-se muito e olhando-o bem nos olhos –, nós dois temos segredos. Conte-me o seu e eu contarei o meu. Qual foi o motivo para você se recusar a expor o meu retrato?", "h": 0}, {"i": 850, "c": 11, "ct": "Capítulo IX", "t": "O pintor estremeceu descontroladamente. – Dorian, se eu lhe contasse, talvez você gostasse menos de mim e, certamente, riria de mim. Eu não suportaria nenhuma das duas coisas. Se você quiser que eu nunca mais olhe para o seu retrato, obedecerei contente. Sempre poderei olhar para você. Se você quiser que o melhor quadro que eu já fiz na vida fique escondido do mundo, acatarei de bom grado. Sua amizade é mais importante para mim do que a fama ou a reputação.", "h": 0}, {"i": 851, "c": 11, "ct": "Capítulo IX", "t": "– Não, Basil, você deve me contar – insistiu Dorian Gray. – Acho que tenho o direito de saber. – A sensação de terror havia passado, e a curiosidade tomou seu lugar. Estava decidido a descobrir o mistério de Basil Hallward.", "h": 0}, {"i": 852, "c": 11, "ct": "Capítulo IX", "t": "– Vamos nos sentar, Dorian – disse o pintor, perturbado. – Vamos nos sentar. E só me responda a uma pergunta. Você reparou em algo curioso no retrato? Algo que provavelmente não o impressionou a princípio, mas que talvez tenha se revelado subitamente para você?", "h": 0}, {"i": 853, "c": 11, "ct": "Capítulo IX", "t": "– Basil! – exclamou o rapaz, agarrando os braços da poltrona com mãos trêmulas e encarando-o com olhos arregalados.", "h": 0}, {"i": 854, "c": 11, "ct": "Capítulo IX", "t": "– Estou vendo que sim. Não diga nada. Espere até ouvir o que eu tenho para dizer. Dorian, desde que o conheci, sua personalidade teve uma influência extraordinária sobre mim. Eu me vi dominado, alma, pensamento e força, por você. Você se tornou para mim a encarnação visível do ideal jamais visto cuja lembrança assombra os artistas como um sonho magnífico. Passei a idolatrá-lo. Passei a sentir ciúmes de todas as pessoas que falavam com você. Quis tê-lo só para mim. Só estava feliz quando estava com você. Quando você não estava comigo, ainda assim estava presente na minha arte… Claro, jamais deixei que você soubesse disso. Teria sido impossível. Você não teria entendido. Eu mesmo não entendia direito. Eu só sabia que tinha visto a perfeição de perto, e que o mundo havia se tornado maravilhoso aos meus olhos – maravilhoso demais talvez, pois nessa louca idolatria há sempre um risco, o risco de perder o ídolo, assim como o risco de conservá-lo… As semanas foram se passando, e fui cada vez mais sendo absorvido por você. Então surgiu um novo desenvolvimento. Eu havia lhe desenhado como Páris de armadura, e como Adônis com a capa de caçador e a lança polida. Coroado de flores de lótus, você sentou na proa da barca de Adriano, contemplando o verde turvo do Nilo. Você se abaixou junto a um lago imóvel de um bosque grego e viu na prata silenciosa da água a maravilha de seu próprio rosto. E a sua beleza era tudo o que a arte deve ser, inconsciente, ideal e remota. Um dia, um dia fatídico, penso às vezes, resolvi pintar um retrato maravilhoso seu, como você é de fato, não em trajes de uma época morta, mas com suas próprias roupas e em sua própria época. Não sei se foi o realismo do método, ou o mero fascínio da sua própria personalidade, diretamente apresentado para mim sem brumas ou véus. Mas sei que enquanto estava pintando, cada película e camada de cor me pareciam revelar meu segredo. Fiquei com receio de que outros soubessem da minha adoração. Senti, Dorian, que havia me revelado em excesso, que me pusera demais no quadro. Foi por isso que decidi jamais permitir que o quadro fosse exposto. Você ficou um pouco irritado na ocasião; mas não se deu conta de tudo o que ele significava para mim. Harry, quando lhe contei isso, riu da minha cara. Mas não me importei. Quando o quadro ficou pronto, e fiquei a sós com ele, percebi que eu tinha razão… Bem, depois de alguns dias a tela deixou meu estúdio, e assim que me livrei do insuportável fascínio de sua presença, pareceu-me tolice imaginar que tivesse visto qualquer coisa nessa pintura, além do fato de você ser extremamente bonito, e que eu sabia pintar. Mesmo agora não posso evitar de achar que é um erro pensar que a paixão que se sente na criação realmente está expressa na obra que se cria. A arte é sempre mais abstrata do que imaginamos. Formas e cores nos falam de formas e cores – isso é tudo. Muitas vezes me parece que a arte esconde o artista, mais do que o revela. E então, quando recebi esse convite de Paris, resolvi fazer do seu retrato a principal obra da exposição. Jamais me ocorreu que você pudesse se recusar. Agora vejo que você tinha razão. O quadro não pode ser exposto. Você não deve se irritar comigo, Dorian, pelo que eu disse. Como eu contei ao Harry uma vez, você nasceu para ser adorado.", "h": 0}, {"i": 855, "c": 11, "ct": "Capítulo IX", "t": "Dorian Gray respirou fundo. A cor voltou a suas faces, e um sorriso se formou em seus lábios. O risco havia passado. Ele estava seguro por ora. No entanto, não pôde deixar de sentir uma pena infinita do pintor que acabara de lhe fazer aquela estranha confissão, e se perguntou se ele mesmo seria capaz de se deixar dominar assim pela personalidade de um amigo. Lorde Henry tinha o fascínio de alguém muito perigoso. Mas era só isso. Era sagaz e cínico demais para realmente gostar de alguém. Algum dia haveria alguém capaz de lhe inspirar tamanha idolatria? Seria essa uma das coisas que a vida lhe reservara?", "h": 0}, {"i": 856, "c": 11, "ct": "Capítulo IX", "t": "– É extraordinário, Dorian – disse Hallward –, que você tenha visto isso tudo no retrato. Você realmente percebeu tudo isso?", "h": 0}, {"i": 857, "c": 11, "ct": "Capítulo IX", "t": "– Vi uma coisa nesse retrato – ele respondeu –, uma coisa que me pareceu muito curiosa.", "h": 0}, {"i": 858, "c": 11, "ct": "Capítulo IX", "t": "– Bem, você não se importa que eu o veja agora?", "h": 0}, {"i": 859, "c": 11, "ct": "Capítulo IX", "t": "Dorian negou com a cabeça. – Você não deve me pedir mais isso, Basil. É impossível permitir que você fique diante daquele quadro.", "h": 0}, {"i": 860, "c": 11, "ct": "Capítulo IX", "t": "– Mas algum dia decerto você deixará?", "h": 0}, {"i": 861, "c": 11, "ct": "Capítulo IX", "t": "– Jamais.", "h": 0}, {"i": 862, "c": 11, "ct": "Capítulo IX", "t": "– Bem, talvez você tenha razão. E agora adeus, Dorian. Você foi a única pessoa na minha vida que realmente influenciou a minha arte. Se fiz algo de bom, devo a você. Ah! você não sabe quanto me custou contar tudo o que lhe contei.", "h": 0}, {"i": 863, "c": 11, "ct": "Capítulo IX", "t": "– Meu caro Basil – disse Dorian –, o que foi que você me contou? Simplesmente que sentiu que me admirava demais. Isso não chega sequer a ser um elogio.", "h": 0}, {"i": 864, "c": 11, "ct": "Capítulo IX", "t": "– A intenção não era fazer um elogio. Foi uma confissão. Agora que confessei, algo parece ter saído de mim. Talvez não se deva nunca traduzir em palavras uma adoração.", "h": 0}, {"i": 865, "c": 11, "ct": "Capítulo IX", "t": "– Foi uma confissão bastante decepcionante.", "h": 0}, {"i": 866, "c": 11, "ct": "Capítulo IX", "t": "– Ora, o que você esperava, Dorian? Você não viu mais nada no retrato? Não havia mais nada?", "h": 0}, {"i": 867, "c": 11, "ct": "Capítulo IX", "t": "– Não; não havia nada para se ver. Por que você pergunta? Mas você não devia falar em idolatria. É uma tolice. Você e eu somos amigos, Basil, e devemos continuar assim para sempre.", "h": 0}, {"i": 868, "c": 11, "ct": "Capítulo IX", "t": "– Você tem o Harry – disse o pintor, tristonho.", "h": 0}, {"i": 869, "c": 11, "ct": "Capítulo IX", "t": "– Oh, o Harry! – exclamou o rapaz, dando uma risada. – O Harry passa o dia dizendo coisas incríveis, e a noite fazendo coisas improváveis. Justamente o tipo de vida que eu gostaria de viver. Mas mesmo assim não creio que eu fosse procurar o Harry se estivesse com problemas. Eu preferiria procurar você, Basil.", "h": 0}, {"i": 870, "c": 11, "ct": "Capítulo IX", "t": "– Você posará para mim de novo?", "h": 0}, {"i": 871, "c": 11, "ct": "Capítulo IX", "t": "– É impossível!", "h": 0}, {"i": 872, "c": 11, "ct": "Capítulo IX", "t": "– Você arruína a minha vida como artista ao se recusar, Dorian. Ninguém encontra duas coisas ideais na vida. Já é raro encontrar uma.", "h": 0}, {"i": 873, "c": 11, "ct": "Capítulo IX", "t": "– Não posso explicar, Basil, mas não devo jamais posar de novo. Há algo fatal nesse retrato. Ele tem vida própria. Irei visitá-lo e tomar chá. Será tão agradável quanto posar.", "h": 0}, {"i": 874, "c": 11, "ct": "Capítulo IX", "t": "– Só se for tão agradável para você, na verdade – murmurou Hallward, pesaroso. – E agora, adeus. Lamento que você não me permita olhar para o quadro mais uma vez. Mas não há o que fazer quanto a isso. Entendo como você se sente.", "h": 0}, {"i": 875, "c": 11, "ct": "Capítulo IX", "t": "Quando ele saiu da sala, Dorian Gray sorriu sozinho. Pobre Basil! Nem desconfia do verdadeiro motivo! E como era estranho que, em vez de ser obrigado a revelar seu segredo, ele conseguira, como por acaso, arrancar um segredo do amigo! Aquela estranha confissão explicou muita coisa. Os absurdos acessos de ciúmes do pintor, sua louca devoção, seus extravagantes panegíricos, suas curiosas reticências – ele entendia agora tudo aquilo e lamentava. Parecia-lhe algo trágico uma amizade assim colorida pelo romance.", "h": 0}, {"i": 876, "c": 11, "ct": "Capítulo IX", "t": "Ele suspirou e tocou a sineta. O retrato precisava ser escondido a todo custo. Ele não poderia correr aquele risco de ser descoberto outra vez. Tinha sido loucura permitir que aquilo ficasse, uma hora que fosse, em um ambiente ao qual todos os seus amigos tinham acesso.", "h": 0}, {"i": 877, "c": 12, "ct": "Capítulo X", "t": "Capítulo X", "h": 1}, {"i": 878, "c": 12, "ct": "Capítulo X", "t": "Quando o criado entrou, ele o encarou fixamente e se perguntou se não teria espiado atrás do biombo. O sujeito se mostrou bastante impassível e aguardou as ordens. Dorian acendeu um cigarro e caminhou até o espelho e se mirou. Podia ver perfeitamente o reflexo do rosto de Victor. Era uma máscara plácida do servilismo. Não havia nada a temer. No entanto ele achou melhor ficar atento.", "h": 0}, {"i": 879, "c": 12, "ct": "Capítulo X", "t": "Falando muito lentamente, ele pediu que fosse chamar a governanta, pois queria vê-la, e depois que fosse ao moldureiro e pedisse que enviasse dois homens. Pareceu-lhe que, ao sair da sala, os olhos do criado se dirigiram ao biombo. Ou seria sua imaginação?", "h": 0}, {"i": 880, "c": 12, "ct": "Capítulo X", "t": "Momentos depois, em seu vestido preto de seda, com antiquadas luvas de tricô nas mãos enrugadas, a senhora Leaf entrou na biblioteca. Ele pediu a ela a chave da antiga sala de aula no sótão.", "h": 0}, {"i": 881, "c": 12, "ct": "Capítulo X", "t": "– A antiga sala de aulas, senhor Dorian? – ela exclamou. – Ora, mas está toda empoeirada. Preciso mandar arrumar e deixar pronta para o senhor entrar. Não está preparada para recebê-lo, senhor. Longe disso, na verdade.", "h": 0}, {"i": 882, "c": 12, "ct": "Capítulo X", "t": "– Não quero que arrume, Leaf. Só quero a chave.", "h": 0}, {"i": 883, "c": 12, "ct": "Capítulo X", "t": "– Está bem, senhor, mas o senhor ficará coberto de teias de aranha se entrar lá. Ora, não é aberta há quase cinco anos, desde a morte do lorde.", "h": 0}, {"i": 884, "c": 12, "ct": "Capítulo X", "t": "Ele franziu os olhos à menção do avô. Tinha lembranças horríveis dele. – Não importa – ele respondeu. – Simplesmente quero ver o lugar – só isso. Dê-me a chave.", "h": 0}, {"i": 885, "c": 12, "ct": "Capítulo X", "t": "– Aqui está, senhor – disse a velha senhora, procurando em seu molho com mãos trêmulas e inseguras. – A chave está aqui. Vou tirá-la do molho, um momento. Mas o senhor não está pensando em mudar lá para cima, tão confortavelmente aqui instalado, não é?", "h": 0}, {"i": 886, "c": 12, "ct": "Capítulo X", "t": "– Não, não – ele exclamou, petulante. – Obrigado, Leaf. Era só isso.", "h": 0}, {"i": 887, "c": 12, "ct": "Capítulo X", "t": "Ela se demorou por alguns momentos e tagarelou sobre algum detalhe da casa. Ele suspirou e lhe disse que fizesse como julgasse melhor. Ela saiu da sala, engalanada de sorrisos. Quando a porta se fechou, Dorian pôs a chave no bolso e olhou para o aposento. Seus olhos depararam com uma grande colcha de cetim roxo densamente bordada em ouro, uma esplêndida peça veneziana do final do século XVII que seu avô havia encontrado em um convento próximo a Bolonha. Sim, aquilo serviria para embalar o pavoroso objeto. Talvez tivesse servido amiúde como mortalha. Agora serviria para ocultar algo que possuía sua própria corrupção, pior que a corrupção da própria morte – algo que engendraria horrores e no entanto jamais morreria. O que o verme era para o cadáver, seus pecados seriam para a imagem pintada na tela. Corromperiam a beleza e devorariam a graça. Poluiriam e tornariam vergonhosa a pintura. E o quadro estaria sempre vivo.", "h": 0}, {"i": 888, "c": 12, "ct": "Capítulo X", "t": "Ele estremeceu e, por um momento, lamentou não ter contado a Basil o verdadeiro motivo de ter escondido o retrato. Basil o teria ajudado a resistir à influência de lorde Henry, e às influências ainda mais venenosas oriundas de seu próprio temperamento. O amor que Basil sentia por ele – pois era realmente amor – não tinha nada que não fosse nobre e intelectual. Não se tratava da mera admiração física que nasce dos sentidos e que morre quando os sentidos se exaurem. Era aquele tipo de amor que Michelangelo conheceu, e Montaigne, e Winckelman, e o próprio Shakespeare. Sim, Basil poderia tê-lo salvado. Mas agora era tarde demais. O passado sempre poderia ser aniquilado. Remorso, recusa ou esquecimento seriam capazes de fazê-lo. Mas o futuro era inevitável. Havia paixões dentro de si que encontrariam sua terrível vazão, sonhos que tornariam real a sombra de suas maldades.", "h": 0}, {"i": 889, "c": 12, "ct": "Capítulo X", "t": "Ele retirou do sofá o grandioso tecido roxo e dourado que o cobria e, segurando-o nas mãos, passou para o outro lado do biombo. O rosto na tela estava ainda mais vil do que antes? Pareceu-lhe inalterado; e, no entanto, seu ódio do quadro foi intensificado. Os cabelos dourados, os olhos azuis, os lábios róseos estavam todos lá. Era simplesmente a expressão que havia se alterado. Esta era horrível em sua crueldade. Comparado ao que ele vira ali de censura ou repreensão, como eram fúteis os reproches de Basil sobre Sibyl Vane! Tão fúteis, e tão descabidos! A sua própria alma o fitava da tela e o convocava a julgamento. Um olhar de dor percorreu seu semblante, e ele cobriu o retrato com a bela mortalha. Enquanto o fazia, bateram na porta. Ele se afastou do quadro quando o criado entrou.", "h": 0}, {"i": 890, "c": 12, "ct": "Capítulo X", "t": "– Eles chegaram, monsieur .", "h": 0}, {"i": 891, "c": 12, "ct": "Capítulo X", "t": "Sentiu que era preciso se livrar logo do criado. Victor não podia saber aonde o quadro seria levado. Parecia um tanto sonso, e os olhos eram pensativos e traiçoeiros. Sentando-se à escrivaninha, ele escreveu um recado a lorde Henry, pedindo que ele lhe enviasse algo para ler e lembrando-o de que se encontrariam às oito e quinze. – Espere a resposta – ele disse, estendendo o bilhete ao criado –, e peça que eles entrem.", "h": 0}, {"i": 892, "c": 12, "ct": "Capítulo X", "t": "Dois ou três minutos depois, bateram novamente na porta, e o senhor Hubbard em pessoa, o célebre moldureiro de South Audley Street, entrou com um jovem assistente de aparência simplória. O senhor Hubbard era um rubicundo sujeitinho de suíças ruivas, cuja admiração pela arte era consideravelmente moderada pela inveterada penúria da maioria dos artistas que lidavam consigo. Em geral, ele nunca saía da oficina. Costumava esperar as pessoas irem até ele. Mas sempre abria uma exceção para Dorian Gray. Havia alguma coisa em Dorian que encantava a todos. Era um prazer até mesmo apenas vê-lo.", "h": 0}, {"i": 893, "c": 12, "ct": "Capítulo X", "t": "– O que posso fazer pelo senhor, senhor Gray? – ele disse, esfregando as mãozinhas gordas e sardentas. – Achei melhor ter a honra de vir pessoalmente. Acabei de receber uma moldura linda, senhor. Arrematei em um leilão. Florentina antiga. Imagino que tenha vindo de Fonthill. Admiravelmente apropriada para um tema religioso, senhor Gray.", "h": 0}, {"i": 894, "c": 12, "ct": "Capítulo X", "t": "– Lamento ter lhe dado o trabalho de vir pessoalmente, senhor Hubbard. Seguramente passarei para ver essa moldura – embora eu não me interesse mais tanto por arte religiosa –, mas hoje só preciso que levem um quadro até o alto da casa para mim. É um tanto pesado, então pensei em lhe pedir que me emprestasse dois dos seus homens.", "h": 0}, {"i": 895, "c": 12, "ct": "Capítulo X", "t": "– Não é nenhum trabalho, senhor Gray. É um prazer lhe ser útil de alguma forma. Onde está a obra de arte, senhor?", "h": 0}, {"i": 896, "c": 12, "ct": "Capítulo X", "t": "– É este quadro – respondeu Dorian, afastando o biombo. – O senhor pode levá-lo, assim coberto mesmo? Não quero que arranhe na escada.", "h": 0}, {"i": 897, "c": 12, "ct": "Capítulo X", "t": "– Não será nada difícil, senhor – disse o solícito moldureiro, começando, com ajuda do assistente, a desenganchar o quadro das longas correntes de latão que o suspendiam. – E agora, senhor Gray, para onde devemos levá-lo?", "h": 0}, {"i": 898, "c": 12, "ct": "Capítulo X", "t": "– Vou lhes mostrar o caminho, senhor Hubbard. Se o senhor fizer a gentileza de me acompanhar. Ou talvez seja melhor que o senhor vá na frente. Receio que seja lá no alto da casa. Vamos subir pela escada da frente, que é mais larga.", "h": 0}, {"i": 899, "c": 12, "ct": "Capítulo X", "t": "Ele segurou a porta aberta para eles, e passaram ao salão e começaram a subir. O caráter elaborado da moldura tornara o quadro extremamente volumoso, e de quando em quando, apesar dos obsequiosos protestos do senhor Hubbard, que tinha o genuíno desgosto dos comerciantes de ver um cavalheiro fazer qualquer coisa de útil, Dorian emprestou sua força e os ajudou.", "h": 0}, {"i": 900, "c": 12, "ct": "Capítulo X", "t": "– É um peso e tanto para se carregar, senhor – ofegou o homenzinho, quando chegaram ao topo da escada. E ele enxugou a testa reluzente.", "h": 0}, {"i": 901, "c": 12, "ct": "Capítulo X", "t": "– Receio que seja um tanto pesado – murmurou Dorian, destrancando a porta que dava para o recinto que guardaria para ele o curioso segredo de sua vida e ocultaria sua alma dos olhos dos homens.", "h": 0}, {"i": 902, "c": 12, "ct": "Capítulo X", "t": "Ele não entrava ali havia mais de quatro anos – não, na verdade, desde que fizera dali seu primeiro quarto de brinquedos quando criança e depois como sala de aulas quando ficou um pouco mais velho. Era um cômodo amplo, bem proporcionado, especialmente construído pelo último lorde Kelso para seu netinho, que, por estranha semelhança com a mãe, e também por outros motivos, ele sempre odiara e desejara manter a distância. O ambiente pareceu a Dorian não ter mudado muito. Havia um imenso cassone italiano, com painéis fantasticamente pintados e ornamentos dourados sem lustro, onde tantas vezes ele se escondera quando menino. Lá estava a estante de livros de mogno cheia com seus livros de pontas dobradas. Na parede atrás da estante, estava pendurada a mesma velha tapeçaria flamenga, onde um rei e uma rainha desbotados jogam xadrez no jardim, enquanto uma companhia de falcoeiros cavalga ao largo, levando aves encapuzadas nos punhos enluvados. Como se lembrava bem de tudo aquilo! Todos os momentos de sua infância solitária retornaram quando ele olhou para aquele quarto. Lembrou-se da imaculada pureza de quando era menino, e lhe pareceu horrível que o retrato fatal fosse ali escondido. Naqueles dias mortos, ele quase não pensava em tudo o que a vida lhe reservava!", "h": 0}, {"i": 903, "c": 12, "ct": "Capítulo X", "t": "Mas não havia outro lugar na casa mais protegido dos olhos curiosos do que ali. Ele estava com a chave, e ninguém mais poderia entrar. Por baixo do manto roxo, o rosto pintado na tela poderia ficar bestial, marcado e impuro. Que importância isso tinha? Ninguém poderia vê-lo. Ele mesmo não o veria mais. Por que deveria assistir à hedionda corrupção de sua alma? Ele conservaria sua juventude – isso era o bastante. E, além do mais, sua natureza não poderia melhorar afinal? Não havia motivo para que o futuro fosse repleto de vergonha. Algum amor poderia surgir em sua vida, e purificá-lo, e protegê-lo dos pecados que já pareciam se agitar em seu espírito e em sua carne – curiosos pecados jamais retratados cujo mistério lhes confere sutileza e encanto. Talvez, algum dia, o olhar cruel sumisse da rubra boca sensível, e ele mostrasse ao mundo a obra-prima de Basil Hallward.", "h": 0}, {"i": 904, "c": 12, "ct": "Capítulo X", "t": "Não; era impossível. Hora a hora, e semana após semana, a criatura sobre a tela estava envelhecendo. O retrato podia escapar da hediondez do pecado, mas a hediondez da idade lhe estava reservada. As faces ficariam vincadas ou flácidas. Pés de galinha amarelados lentamente rodeariam os olhos enfraquecidos e os tornariam horríveis. O cabelo perderia o brilho, a boca frouxa penderia, seria uma boca ridícula ou grotesca, como a dos velhos. Haveria o pescoço enrugado, as mãos frias e cobertas de veias azuis, o corpo encurvado, que ele se lembrava no avô que fora tão austero em sua infância. O retrato precisava ser escondido. Não havia como evitar.", "h": 0}, {"i": 905, "c": 12, "ct": "Capítulo X", "t": "– Traga-o, senhor Hubbard, por favor – ele disse, exausto, virando de lado. – Lamento pela demora. Estava pensando em outra coisa.", "h": 0}, {"i": 906, "c": 12, "ct": "Capítulo X", "t": "– É sempre bom descansar um pouco, senhor Gray – respondeu o moldureiro, ainda ofegante. – Onde o colocamos, senhor?", "h": 0}, {"i": 907, "c": 12, "ct": "Capítulo X", "t": "– Oh, em qualquer lugar. Aqui está bom. Não quero que pendure. Simplesmente encoste-o na parede. Obrigado.", "h": 0}, {"i": 908, "c": 12, "ct": "Capítulo X", "t": "– Podemos ver a obra de arte, senhor?", "h": 0}, {"i": 909, "c": 12, "ct": "Capítulo X", "t": "Dorian teve um sobressalto. – Não iria interessá-lo, senhor Hubbard – ele disse, com os olhos fixos no sujeito. Sentiu-se prestes a saltar sobre ele e derrubá-lo no chão, se ele ousasse erguer o belo manto que escondia o segredo da sua vida. – Não quero incomodá-lo mais. Fico muito agradecido pela sua gentileza de ter vindo.", "h": 0}, {"i": 910, "c": 12, "ct": "Capítulo X", "t": "– Não foi nada, não foi nada, senhor Gray. Estou sempre às ordens para qualquer coisa que o senhor precisar. – E o senhor Hubbard desceu pisando firme as escadas, seguido pelo ajudante, que olhou de novo para Dorian com expressão de tímido deslumbramento em seu semblante rude e desagradável. Nunca tinha visto alguém tão maravilhoso.", "h": 0}, {"i": 911, "c": 12, "ct": "Capítulo X", "t": "Quando o som de seus passos passou, Dorian trancou a porta e pôs a chave no bolso. Estava seguro agora. Ninguém jamais olharia para aquela coisa horrível. Nenhum olho humano veria sua vergonha.", "h": 0}, {"i": 912, "c": 12, "ct": "Capítulo X", "t": "Ao chegar à biblioteca, descobriu que eram mais de cinco horas, e que o chá já havia sido servido. Em uma mesinha de ébano perfumado e incrustações de madrepérola, presente de lady Radley, esposa de seu tutor, uma bela inválida profissional que passara o inverno anterior no Cairo, havia um bilhete de lorde Henry, e, ao lado, um livro de capa amarela, ligeiramente amassado nas bordas e com os cantos sujos. Um exemplar da terceira edição da St. James’s Gazette havia sido deixado na bandeja do chá. Era evidente que Victor havia voltado. Ele se perguntou se o criado teria encontrado os homens quando saíam da casa, e se teria extraído deles a informação sobre o que haviam feito. Certamente ele daria falta do quadro – sem dúvida já notara sua ausência enquanto servia o chá. O biombo não havia sido devolvido ao lugar, e um espaço vazio era visível na parede. Talvez alguma noite ele o encontrasse espiando lá em cima e tentando forçar a porta do sótão. Era uma coisa horrível ter um espião dentro da própria casa. Ouvira falar de ricos que foram chantageados a vida inteira por algum criado que leu alguma carta, ou entreouviu alguma conversa, ou guardou um cartão com um endereço, ou encontrou embaixo de um travesseiro uma flor seca ou um pedaço de renda amassado.", "h": 0}, {"i": 913, "c": 12, "ct": "Capítulo X", "t": "Ele suspirou e, depois de se servir de chá, abriu o bilhete de lorde Henry. Era simplesmente para dizer que lhe enviava o jornal da tarde, e um livro que talvez lhe interessasse, e que ele estaria no clube às oito e quinze. Abriu a St. James’s languidamente, e passou os olhos. Uma marca em lápis vermelho na página cinco chamou sua atenção. Apontava para o seguinte parágrafo:", "h": 0}, {"i": 914, "c": 12, "ct": "Capítulo X", "t": "INVESTIGAÇÃO DE UMA ATRIZ . Uma investigação foi iniciada esta manhã na taberna Bell, em Hoxton Road, pelo senhor Danby, legista do distrito, no corpo de Sibyl Vane, uma jovem atriz que estava em cartaz no Royal Theatre de Holborn. O veredito de morte acidental foi declarado. Houve manifestações de solidariedade à mãe da falecida, que se mostrou muito abalada durante seu depoimento, e o do doutor Birrell, que fez o exame post-mortem da falecida.", "h": 0}, {"i": 915, "c": 12, "ct": "Capítulo X", "t": "Ele franziu o cenho e rasgou o jornal, atravessou a sala e jogou fora os pedaços. Que horror era aquilo tudo! E como a verdadeira feiura transformava horrivelmente as coisas! Ficou um pouco irritado com lorde Henry por ter lhe enviado a notícia. E certamente era estúpido da parte dele havê-la destacado com lápis vermelho. Victor podia ter lido. O sujeito lia mais do que o suficiente.", "h": 0}, {"i": 916, "c": 12, "ct": "Capítulo X", "t": "Talvez ele tivesse lido e começasse a desconfiar de alguma coisa. E, no entanto, que importância tinha aquilo? O que Dorian Gray tinha a ver com a morte de Sibyl Vane? Não havia nada a temer. Dorian Gray não a havia matado.", "h": 0}, {"i": 917, "c": 12, "ct": "Capítulo X", "t": "Seus olhos depararam com o livro amarelo que lorde Henry lhe enviara. Perguntou-se o que seria aquilo. Caminhou até a pequena estante octogonal cor de pérola, que sempre lhe parecera obra de algum tipo estranho de abelhas egípcias que lavravam prata, e, pegando o volume, atirou-se em uma poltrona e começou a folheá-lo. Em poucos minutos já estava absorto pelo livro. Era o livro mais estranho que já havia lido. Pareceu-lhe ricamente encadernado e, ao som delicado de flautas, os pecados do mundo foram passando diante dele como um espetáculo tolo. Coisas que sonhara difusamente se tornaram subitamente reais para ele. Coisas com as quais sequer sonhara foram-lhe aos poucos reveladas.", "h": 0}, {"i": 918, "c": 12, "ct": "Capítulo X", "t": "Era uma novela sem enredo e com apenas um personagem, sendo, na verdade, simplesmente um estudo psicológico de um certo jovem parisiense, que passava a vida tentando realizar no século XIX todas as paixões e os modos de pensamento de todos os séculos exceto o seu, e resumir, na verdade, em si mesmo os vários estados de espírito pelos quais o espírito do mundo já passou desde o início dos tempos, adorando tanto a mera artificialidade das renúncias que os homens equivocadamente chamaram de virtude, como as rebeliões naturais que os sábios ainda chamam de pecado. O estilo em que fora escrito era de uma ourivesaria curiosa, vívida e obscura ao mesmo tempo, cheio de argot e arcaísmos, de expressões técnicas e elaboradas paráfrases, que caracteriza a obra dos melhores artistas da escola francesa dos Symbolistes . Havia metáforas monstruosas como orquídeas, e da mesma sutileza de cores. A vida dos sentidos era descrita nos termos da filosofia mística. Não se sabia, às vezes, se se estava lendo os êxtases espirituais de algum santo medieval ou as mórbidas confissões de um pecador moderno. Era um livro venenoso. Um forte odor de incenso parecia pairar em suas páginas e perturbar o cérebro. A mera cadência das frases, a sutil monotonia de sua música, tão cheia de complexos refrões e movimentos elaboradamente repetidos, produzia na cabeça do rapaz, conforme ele passava os capítulos, uma forma de devaneio, um torpor de sonho, que o deixou inconsciente do final do dia e do lento avanço das sombras.", "h": 0}, {"i": 919, "c": 12, "ct": "Capítulo X", "t": "Desanuviado e perfurado por uma única estrela solitária, um céu verde-acobreado reluzia através das janelas. Ele ficou lendo àquela luz esmaecida até não conseguir mais enxergar. Então, depois que o criado o lembrou diversas vezes do avançado da hora, ele se levantou e, passando para o quarto ao lado, deixou o livro na mesinha florentina que sempre mantinha ao lado da cama, e começou a se vestir para o jantar.", "h": 0}, {"i": 920, "c": 12, "ct": "Capítulo X", "t": "Eram quase nove horas quando ele chegou ao clube, onde encontrou lorde Henry sentado sozinho, na sala de espera, parecendo muito entediado.", "h": 0}, {"i": 921, "c": 12, "ct": "Capítulo X", "t": "– Sinto muito, Harry – ele exclamou –, mas a culpa é inteiramente sua. O livro que você me enviou me deixou tão fascinado que me esqueci que as horas se passaram.", "h": 0}, {"i": 922, "c": 12, "ct": "Capítulo X", "t": "– Sim; imaginei que você fosse gostar – respondeu o anfitrião, erguendo-se da poltrona.", "h": 0}, {"i": 923, "c": 12, "ct": "Capítulo X", "t": "– Eu não disse que gostei, Harry. Eu disse que fiquei fascinado. Há uma grande diferença.", "h": 0}, {"i": 924, "c": 12, "ct": "Capítulo X", "t": "– Ah, você descobriu isso? – murmurou lorde Henry. E passaram ao salão de jantar.", "h": 0}, {"i": 925, "c": 13, "ct": "Capítulo XI", "t": "Capítulo XI", "h": 1}, {"i": 926, "c": 13, "ct": "Capítulo XI", "t": "Durante anos, Dorian Gray não conseguiu se livrar da influência desse livro. Ou talvez fosse mais exato dizer que jamais tentou se livrar. Ele mandou vir de Paris nada menos que nove exemplares em formato grande da primeira edição, e os mandou encadernar em cores diferentes, de modo que pudesse se adequar a seus diversos estados de espírito e à imaginação cambiante de uma natureza sobre a qual ele parecia, às vezes, ter perdido totalmente o controle. O herói, o maravilhoso jovem parisiense, em quem os temperamentos romântico e científico eram tão estranhamente mesclados, tornou-se uma espécie de tipo que prefigurava a ele mesmo. E, a bem dizer, o livro como um todo lhe pareceu conter a história de sua própria vida, escrita antes que ele a tivesse vivido.", "h": 0}, {"i": 927, "c": 13, "ct": "Capítulo XI", "t": "Em um aspecto, ele teve mais sorte que o fantástico herói do romance. Ele jamais teve – nunca, na verdade, teve motivos para ter – aquele pavor, algo grotesco de espelhos e superfícies de metal polidas e águas paradas, que acometera o jovem parisiense tão cedo na vida, e que foi ocasionado pela súbita decadência de uma beleza que, aparentemente, havia sido notável um dia. Era com uma alegria quase cruel – e talvez em quase toda alegria, como certamente em todo prazer, haja alguma crueldade – que ele costumava ler a parte final do livro, com seu relato realmente trágico, ainda que algo excessivamente enfatizado, da tristeza e do desespero de alguém que perdeu aquilo que sempre julgara mais importante nos outros e no mundo.", "h": 0}, {"i": 928, "c": 13, "ct": "Capítulo XI", "t": "Pois a beleza maravilhosa que tanto fascinara Basil Hallward, e muitos outros além dele, parecia que jamais o abandonaria. Mesmo aqueles que ouviam as piores coisas sobre ele, e de quando em quando surgiam estranhos rumores sobre seu estilo de vida e que viravam assunto nos clubes londrinos, não conseguiam acreditar em nada que o desonrasse quando o viam pessoalmente. Ele parecia sempre alguém que se mantivera intocado pelo mundo. Homens que falavam grosserias se calavam quando Dorian Gray entrava no recinto. Havia algo na pureza de seu rosto que os refutava. Sua mera presença parecia lhes evocar a lembrança da inocência que haviam perdido. Perguntavam-se como alguém tão encantador e gracioso podia ter escapado intacto de uma época que era ao mesmo tempo sórdida e sensual.", "h": 0}, {"i": 929, "c": 13, "ct": "Capítulo XI", "t": "Muitas vezes, voltando para casa de uma dessas misteriosas e prolongadas ausências que davam origem às tais estranhas conjecturas entre seus amigos, ou que assim se julgavam, ele subia sozinho até o sótão trancado, abria a porta com a chave da qual jamais se separava e, com um espelho, parava diante do retrato que Basil Hallward havia pintado, olhando ora para o rosto mau e envelhecido na tela, ora para o belo rosto jovem que lhe sorria de volta do espelho polido. A própria nitidez do contraste costumava acelerar uma sensação de prazer. Ele foi ficando cada vez mais apaixonado pela própria beleza, cada vez mais interessado na corrupção da própria alma. Ele examinaria com cuidado minucioso, e às vezes com um prazer monstruoso e terrível, as linhas hediondas que vincavam a testa enrugada, estendendo-se até a pesada boca sensual, perguntando-se em algumas ocasiões quais eram mais horrendas, as marcas do pecado ou as da idade. Ele punha suas mãos brancas ao lado das mãos inchadas e torpes do retrato e sorria. Zombava do corpo disforme e das pernas fraquejantes.", "h": 0}, {"i": 930, "c": 13, "ct": "Capítulo XI", "t": "Havia momentos, na verdade, à noite, em que, deitado insone em seu próprio quarto delicadamente perfumado, ou no interior sórdido de uma mal-afamada taverna perto das docas, que, sob nome falso, e disfarçado, costumava frequentar, ele pensava na ruína que causara à própria alma, com uma pena que era ainda mais pungente por ser puramente egoísta. Mas esse tipo de momento era raro. Aquela curiosidade sobre a vida que lorde Henry primeiro desepertara nele, quando estavam conversando no jardim de seu amigo, parecia aumentar a cada vez que era satisfeita. Quanto mais sabia, mais ele desejava saber. Sentia fomes loucas que ficavam mais devoradoras conforme ele as saciava.", "h": 0}, {"i": 931, "c": 13, "ct": "Capítulo XI", "t": "No entanto, ele não se tornara realmente imprudente, de maneira nenhuma, em suas relações com a sociedade. Uma ou duas vezes por mês, durante o inverno, e toda noite de quarta-feira ao longo da estação, ele abria ao mundo sua bela casa e convidava os músicos mais célebres do momento pa
