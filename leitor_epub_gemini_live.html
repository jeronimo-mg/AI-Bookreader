let currentBook = BUILTIN_BOOKS[0];

let currentParagraphIndex = 0;
let isPlaying = false;
let autoFollow = true;
let apiKey = localStorage.getItem("gemini_api_key") || "";
let selectedVoice = localStorage.getItem("storyteller_voice_name") || "Sulafat";

// Estado do WebSocket Gemini 3.8 Live, Segmentos de Parágrafos Longos e Web Audio API (24kHz PCM)
let ws = null;
let isSetupComplete = false;
let wsConfigSignature = "";
let sessionOpenedAt = 0;
let pendingSpeakRequest = false;
let utteranceGenId = 0;
let activeSegments = [];
let activeSegmentIndex = 0;
let audioCtx = null;
let nextPlayTime = 0;
let activeAudioSources = [];
let turnFinishTimer = null;

const MAX_SEGMENT_CHARS = 380;
const WINDOW_SIZE = 120;
let renderedWindowStart = -1;
let renderedWindowEnd = -1;

function initApp() {
  document.getElementById("api-key-input").value = apiKey;
  document.getElementById("custom-voice-input").value = selectedVoice;
  document.getElementById("voice-select").value = selectedVoice;
  updateApiKeyBadge();
  const lastBuiltinIdx = parseInt(localStorage.getItem("last_builtin_book_idx") || "0", 10);
  const idx = (lastBuiltinIdx >= 0 && lastBuiltinIdx < BUILTIN_BOOKS.length) ? lastBuiltinIdx : 0;
  document.getElementById("builtin-book-select").value = String(idx);
  applyBook(BUILTIN_BOOKS[idx]);
}

function selectBuiltinBook(idxStr) {
  const idx = parseInt(idxStr, 10);
  if (idx >= 0 && idx < BUILTIN_BOOKS.length) {
    pausePlayback();
    localStorage.setItem("last_builtin_book_idx", String(idx));
    applyBook(BUILTIN_BOOKS[idx]);
  }
}

function updateApiKeyBadge() {
  const btn = document.getElementById("api-key-btn");
  if (apiKey && apiKey.trim().length > 5) {
    btn.className = "icon-btn key-ok";
  } else {
    btn.className = "icon-btn key-missing";
  }
}

function applyBook(book) {
  currentBook = book;
  // IMPORTANTE: Reseta os limites da janela virtualizada para forçar a reconstrução do DOM ao trocar de livro!
  renderedWindowStart = -1;
  renderedWindowEnd = -1;

  const savedPos = parseInt(localStorage.getItem("pos_" + book.bookId) || "0", 10);
  currentParagraphIndex = Math.max(0, Math.min(savedPos, book.paragraphs.length - 1));

  document.getElementById("book-title").textContent = book.title;
  const slider = document.getElementById("progress-slider");
  slider.max = Math.max(0, book.paragraphs.length - 1);
  slider.value = currentParagraphIndex;
  document.getElementById("slider-max-label").textContent = book.paragraphs.length;

  if (savedPos > 0) {
    setStatus("Posição memorizada restaurada no parágrafo #" + (currentParagraphIndex + 1));
  } else {
    setStatus("Livro carregado (" + book.paragraphs.length + " parágrafos)");
  }

  renderChaptersList();
  renderParagraphWindow(currentParagraphIndex, true);
  updateHeaderAndBadges();
}

function updateHeaderAndBadges() {
  const p = currentBook.paragraphs[currentParagraphIndex];
  const chapTitle = p ? p.ct : "";
  document.getElementById("book-subtitle").textContent =
    chapTitle + " • Idioma: " + currentBook.language + " • Voz: " + selectedVoice;
  document.getElementById("current-para-badge").textContent = "#" + (currentParagraphIndex + 1);
  document.getElementById("slider-cur-label").textContent = (currentParagraphIndex + 1);
  document.getElementById("progress-slider").value = currentParagraphIndex;
}

function renderParagraphWindow(centerIndex, scrollIntoViewImmediately) {
  const total = currentBook.paragraphs.length;
  const half = Math.floor(WINDOW_SIZE / 2);
  const start = Math.max(0, centerIndex - half);
  const end = Math.min(total - 1, start + WINDOW_SIZE);

  const container = document.getElementById("reader-container");
  if (start !== renderedWindowStart || end !== renderedWindowEnd) {
    renderedWindowStart = start;
    renderedWindowEnd = end;
    container.innerHTML = "";

    if (start > 0) {
      const prevBtn = document.createElement("button");
      prevBtn.className = "btn secondary";
      prevBtn.textContent = "⬆ Carregar parágrafos anteriores (#1 a #" + start + ")";
      prevBtn.onclick = () => renderParagraphWindow(Math.max(0, start - half), true);
      container.appendChild(prevBtn);
    }

    for (let i = start; i <= end; i++) {
      const p = currentBook.paragraphs[i];
      const card = document.createElement("div");
      card.id = "para-card-" + i;
      card.className = "para-card" + (p.h ? " heading" : "") + (i === currentParagraphIndex ? " active" : "");
      card.onclick = () => selectReadingPoint(i, isPlaying);

      const meta = document.createElement("div");
      meta.className = "para-meta";
      const leftSpan = document.createElement("span");
      leftSpan.textContent = "#" + (i + 1) + " • " + p.ct;
      meta.appendChild(leftSpan);

      const actions = document.createElement("div");
      actions.className = "para-actions";

      const badge = document.createElement("span");
      badge.id = "para-badge-" + i;
      badge.className = "badge-status";
      badge.textContent = (i === currentParagraphIndex) ? (isPlaying ? "NARRANDO AGORA" : "PONTO SALVO") : "";
      actions.appendChild(badge);

      const playHereBtn = document.createElement("button");
      playHereBtn.className = "play-here-btn";
      playHereBtn.textContent = "▶ Ler daqui";
      playHereBtn.onclick = (e) => {
        e.stopPropagation();
        selectReadingPoint(i, true);
      };
      actions.appendChild(playHereBtn);

      meta.appendChild(actions);
      card.appendChild(meta);

      const txt = document.createElement("div");
      txt.className = "para-text";
      txt.textContent = p.t;
      card.appendChild(txt);

      container.appendChild(card);
    }

    if (end < total - 1) {
      const nextBtn = document.createElement("button");
      nextBtn.className = "btn secondary";
      nextBtn.textContent = "⬇ Carregar próximos parágrafos (#" + (end + 2) + " a #" + total + ")";
      nextBtn.onclick = () => renderParagraphWindow(Math.min(total - 1, end + half), true);
      container.appendChild(nextBtn);
    }
  } else {
    const prevActive = container.querySelector(".para-card.active");
    if (prevActive) {
      prevActive.classList.remove("active");
      const oldBadge = prevActive.querySelector(".badge-status");
      if (oldBadge) oldBadge.textContent = "";
    }
    const newActive = document.getElementById("para-card-" + centerIndex);
    if (newActive) {
      newActive.classList.add("active");
      const newBadge = document.getElementById("para-badge-" + centerIndex);
      if (newBadge) newBadge.textContent = isPlaying ? "NARRANDO AGORA" : "PONTO SALVO";
    }
  }

  if (scrollIntoViewImmediately) {
    setTimeout(() => {
      const el = document.getElementById("para-card-" + centerIndex);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
    }, 30);
  }
}

function scrollToCurrentParagraph(forceRender) {
  if (forceRender || currentParagraphIndex < renderedWindowStart || currentParagraphIndex > renderedWindowEnd) {
    renderParagraphWindow(currentParagraphIndex, true);
  } else {
    const el = document.getElementById("para-card-" + currentParagraphIndex);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
  }
}

function savePosition(idx) {
  localStorage.setItem("pos_" + currentBook.bookId, String(idx));
}

function splitIntoSpeechSegments(text) {
  const cleaned = (text || "").trim();
  if (cleaned.length <= MAX_SEGMENT_CHARS) return [cleaned];

  const sentences = cleaned.split(/(?<=[.!?;:])\s+/);
  const segments = [];
  let current = "";

  for (const s of sentences) {
    if (!current) {
      current = s;
    } else if (current.length + 1 + s.length <= MAX_SEGMENT_CHARS) {
      current += " " + s;
    } else {
      segments.push(current);
      current = s;
    }
  }
  if (current) segments.push(current);
  return segments.length > 0 ? segments : [cleaned];
}

function selectReadingPoint(index, startReadingImmediately) {
  const clamped = Math.max(0, Math.min(index, currentBook.paragraphs.length - 1));
  currentParagraphIndex = clamped;
  savePosition(clamped);
  document.getElementById("live-transcript").textContent = "";

  const outsideWindow = clamped < renderedWindowStart + 5 || clamped > renderedWindowEnd - 5;
  renderParagraphWindow(clamped, autoFollow || outsideWindow);
  updateHeaderAndBadges();

  if (startReadingImmediately) {
    if (!apiKey || apiKey.trim().length < 5) {
      showError("Configure sua Gemini API Key (botão 🔑 API & Voz no topo) para iniciar a leitura em voz alta.");
      openModal("settings-modal");
      return;
    }
    isPlaying = true;
    updatePlayButtonUi();
    connectAndSpeakParagraph(clamped);
  }
}

function togglePlayPause() {
  if (isPlaying) {
    pausePlayback();
  } else {
    selectReadingPoint(currentParagraphIndex, true);
  }
}

function pausePlayback() {
  isPlaying = false;
  pendingSpeakRequest = false;
  utteranceGenId++;
  clearTimeout(turnFinishTimer);
  flushWebAudio();
  updatePlayButtonUi();
  renderParagraphWindow(currentParagraphIndex, false);
  setStatus("Pausado no parágrafo #" + (currentParagraphIndex + 1));
}

function updatePlayButtonUi() {
  const btn = document.getElementById("play-pause-btn");
  btn.textContent = isPlaying ? "⏸" : "▶";
}

function skipRelative(offset) {
  selectReadingPoint(currentParagraphIndex + offset, isPlaying);
}

function onSliderInput(val) {
  document.getElementById("slider-cur-label").textContent = parseInt(val, 10) + 1;
}

function onSliderCommit(val) {
  selectReadingPoint(parseInt(val, 10), isPlaying);
}

function toggleAutoFollow() {
  autoFollow = !autoFollow;
  document.getElementById("autofollow-btn").style.color = autoFollow ? "var(--gold)" : "gray";
  if (autoFollow) scrollToCurrentParagraph(false);
}

// Web Audio API (24kHz, 16-bit PCM mono) + WebSocket Gemini 3.8 Live
// ============================================================================
function ensureAudioContext() {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContextClass({ sampleRate: 24000 });
  }
  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }
}

function flushWebAudio() {
  for (const src of activeAudioSources) {
    try { src.stop(); src.disconnect(); } catch (_) {}
  }
  activeAudioSources = [];
  if (audioCtx) {
    nextPlayTime = audioCtx.currentTime;
  }
}

function enqueuePcm24kBase64(b64Data, genId) {
  if (!isPlaying || genId !== utteranceGenId) return;
  ensureAudioContext();

  const binary = atob(b64Data);
  const byteLen = binary.length;
  const sampleCount = Math.floor(byteLen / 2);
  if (sampleCount <= 0) return;

  const float32 = new Float32Array(sampleCount);
  for (let i = 0; i < sampleCount; i++) {
    const lo = binary.charCodeAt(i * 2);
    const hi = binary.charCodeAt(i * 2 + 1);
    let int16 = (hi << 8) | lo;
    if (int16 >= 0x8000) int16 -= 0x10000;
    float32[i] = int16 / 32768.0;
  }

  const audioBuffer = audioCtx.createBuffer(1, sampleCount, 24000);
  audioBuffer.getChannelData(0).set(float32);

  const source = audioCtx.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(audioCtx.destination);

  const now = audioCtx.currentTime;
  if (nextPlayTime < now) {
    nextPlayTime = now + 0.02;
  }
  source.start(nextPlayTime);
  nextPlayTime += audioBuffer.duration;

  activeAudioSources.push(source);
  source.onended = () => {
    const idx = activeAudioSources.indexOf(source);
    if (idx !== -1) activeAudioSources.splice(idx, 1);
  };
}

function connectAndSpeakParagraph(paragraphIndex) {
  ensureAudioContext();
  flushWebAudio();
  clearTimeout(turnFinishTimer);

  const p = currentBook.paragraphs[paragraphIndex];
  if (!p) return;

  activeSegments = splitIntoSpeechSegments(p.t);
  activeSegmentIndex = 0;

  const genId = ++utteranceGenId;
  const sig = apiKey.trim() + "|" + selectedVoice + "|" + currentBook.language;
  const sessionExpired = (Date.now() - sessionOpenedAt) > 12 * 60 * 1000;

  if (!ws || ws.readyState !== WebSocket.OPEN || !isSetupComplete || sig !== wsConfigSignature || sessionExpired) {
    pendingSpeakRequest = true;
    openGeminiLiveWebSocket(sig, genId);
  } else {
    sendCurrentSegmentTurn(genId);
  }
}

function openGeminiLiveWebSocket(sig, genId) {
  if (ws) {
    try { ws.close(); } catch (_) {}
  }
  isSetupComplete = false;
  wsConfigSignature = sig;
  setStatus("Conectando ao Gemini 3.8 Live...");

  const url = "wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=" + encodeURIComponent(apiKey.trim());
  ws = new WebSocket(url);

  ws.onopen = () => {
    sessionOpenedAt = Date.now();
    setStatus("Configurando voz Storyteller (" + currentBook.language + ")...");
    const isPt = currentBook.language.toLowerCase().startsWith("pt");
    const targetLang = isPt ? "pt-BR" : currentBook.language;

    const storytellerInstruction = isPt
      ? "RESPOND IN PORTUGUESE (BRAZIL). YOU MUST RESPOND UNMISTAKABLY IN PORTUGUESE (BRAZIL) WITH AN AUTHENTIC BRAZILIAN PORTUGUESE ACCENT (pt-BR).\nVocê é um narrador profissional de audiolivros (estilo Storyteller) em Português do Brasil (pt-BR).\nREGRAS ESTRITAS:\n1. Leia APENAS e FIELMENTE o trecho enviado pelo usuário, palavra por palavra, do início ao fim.\n2. NUNCA adicione introduções, comentários ou encerramentos.\n3. Use entonação envolvente de contador de histórias (storyteller): dê vida aos diálogos, faça pausas dramáticas naturais e transmita a emoção da cena.\n4. Mesmo que o texto contenha grafia de Portugal (ex: facto, exactas, estava a olhar), pronuncie com sotaque e fonética natural do Português Brasileiro (pt-BR)."
      : "You are a professional audiobook storyteller. Read ONLY the exact text provided by the user verbatim from start to finish with expressive storytelling emotion. Never add remarks.";

    const setupMsg = {
      setup: {
        model: "models/gemini-3.8-live",
        generationConfig: {
          responseModalities: ["AUDIO"],
          speechConfig: {
            languageCode: targetLang,
            voiceConfig: {
              prebuiltVoiceConfig: {
                voiceName: selectedVoice
              }
            }
          }
        },
        systemInstruction: {
          parts: [{ text: storytellerInstruction }]
        },
        realtimeInputConfig: {
          automaticActivityDetection: {
            disabled: true
          }
        },
        outputAudioTranscription: {}
      }
    };
    ws.send(JSON.stringify(setupMsg));
  };

  ws.onmessage = async (event) => {
    let rawText = event.data;
    if (rawText instanceof Blob) {
      rawText = await rawText.text();
    }
    handleServerMessage(rawText);
  };

  ws.onerror = () => {
    showError("Falha na conexão WebSocket com o Gemini 3.8 Live. Verifique sua API Key.");
  };

  ws.onclose = (ev) => {
    isSetupComplete = false;
    if (isPlaying && ev.code !== 1000) {
      setStatus("Reconectando automaticamente...");
      setTimeout(() => {
        if (isPlaying) {
          pendingSpeakRequest = true;
          openGeminiLiveWebSocket(wsConfigSignature, utteranceGenId);
        }
      }, 1200);
    }
  };
}

function sendCurrentSegmentTurn(genId) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const segText = activeSegments[activeSegmentIndex];
  if (!segText) return;

  const partLabel = activeSegments.length > 1
    ? " (parte " + (activeSegmentIndex + 1) + "/" + activeSegments.length + ")"
    : "";
  setStatus("Narrando parágrafo #" + (currentParagraphIndex + 1) + partLabel + " (" + selectedVoice + ")");
  renderParagraphWindow(currentParagraphIndex, autoFollow);

  const msg = {
    clientContent: {
      turns: [
        {
          role: "user",
          parts: [{ text: "NARRE LITERALMENTE ESTE TRECHO:\n\n" + segText }]
        }
      ],
      turnComplete: true
    }
  };
  ws.send(JSON.stringify(msg));
}

function handleServerMessage(rawJson) {
  try {
    const data = JSON.parse(rawJson);

    if (data.setupComplete !== undefined) {
      isSetupComplete = true;
      setStatus("Conectado ao Gemini 3.8 Live");
      if (isPlaying && pendingSpeakRequest) {
        pendingSpeakRequest = false;
        sendCurrentSegmentTurn(utteranceGenId);
      }
      return;
    }

    const sc = data.serverContent;
    if (!sc || !isPlaying) return;
    const currentGen = utteranceGenId;

    if (sc.modelTurn && Array.isArray(sc.modelTurn.parts)) {
      for (const part of sc.modelTurn.parts) {
        if (part.inlineData && part.inlineData.data) {
          enqueuePcm24kBase64(part.inlineData.data, currentGen);
        }
      }
    }

    if (sc.outputTranscription && sc.outputTranscription.text) {
      const el = document.getElementById("live-transcript");
      el.textContent = "🎙️ " + (el.textContent.replace(/^🎙️\s*/, "") + sc.outputTranscription.text).slice(-220);
    }

    if (sc.turnComplete) {
      const remainingSec = audioCtx ? Math.max(0, nextPlayTime - audioCtx.currentTime) : 0;
      const waitMs = Math.ceil(remainingSec * 1000) + 150;
      clearTimeout(turnFinishTimer);
      turnFinishTimer = setTimeout(() => {
        if (!isPlaying || currentGen !== utteranceGenId) return;
        if (activeSegmentIndex + 1 < activeSegments.length) {
          activeSegmentIndex++;
          sendCurrentSegmentTurn(currentGen);
        } else {
          const nextIdx = currentParagraphIndex + 1;
          if (nextIdx < currentBook.paragraphs.length) {
            selectReadingPoint(nextIdx, true);
          } else {
            pausePlayback();
            setStatus("Fim do livro alcançado!");
          }
        }
      }, waitMs);
    }
  } catch (err) {
    console.error("Erro ao processar mensagem Live API:", err);
  }
}

function renderChaptersList() {
  const list = document.getElementById("chapters-list");
  list.innerHTML = "";
  currentBook.chapters.forEach((ch) => {
    const item = document.createElement("div");
    const isCur = currentParagraphIndex >= ch.start && currentParagraphIndex <= ch.end;
    item.className = "list-item" + (isCur ? " current" : "");
    const titleSpan = document.createElement("span");
    titleSpan.textContent = ch.title;
    const numSpan = document.createElement("span");
    numSpan.style.fontSize = "11px";
    numSpan.style.color = "var(--muted)";
    numSpan.textContent = "Parágrafo #" + (ch.start + 1);
    item.appendChild(titleSpan);
    item.appendChild(numSpan);
    item.onclick = () => {
      closeModal("chapters-modal");
      selectReadingPoint(ch.start, isPlaying);
    };
    list.appendChild(item);
  });
}

function jumpToInputNumber() {
  const val = parseInt(document.getElementById("jump-number-input").value || "1", 10);
  closeModal("search-modal");
  selectReadingPoint(val - 1, true);
}

function runSearch(query) {
  const container = document.getElementById("search-results");
  container.innerHTML = "";
  const q = (query || "").trim().toLowerCase();
  if (q.length < 2) return;

  let count = 0;
  for (const p of currentBook.paragraphs) {
    if (p.t.toLowerCase().includes(q)) {
      const item = document.createElement("div");
      item.className = "list-item";
      item.style.flexDirection = "column";
      item.style.alignItems = "flex-start";
      item.style.gap = "4px";
      const st = document.createElement("strong");
      st.style.color = "var(--gold)";
      st.style.fontSize = "11px";
      st.textContent = "#" + (p.i + 1) + " (" + p.ct + ")";
      const sp = document.createElement("span");
      sp.style.fontSize = "12px";
      sp.textContent = p.t.slice(0, 140) + "...";
      item.appendChild(st);
      item.appendChild(sp);
      item.onclick = () => {
        closeModal("search-modal");
        selectReadingPoint(p.i, true);
      };
      container.appendChild(item);
      if (++count >= 40) break;
    }
  }
}

function saveSettings() {
  apiKey = document.getElementById("api-key-input").value.trim();
  selectedVoice = document.getElementById("custom-voice-input").value.trim() || "Sulafat";
  localStorage.setItem("gemini_api_key", apiKey);
  localStorage.setItem("storyteller_voice_name", selectedVoice);
  updateApiKeyBadge();
  updateHeaderAndBadges();
  closeModal("settings-modal");
  hideError();

  if (isPlaying) {
    connectAndSpeakParagraph(currentParagraphIndex);
  }
}

async function fetchExtendedVoices() {
  const key = document.getElementById("api-key-input").value.trim();
  if (!key) {
    alert("Digite sua Gemini API Key primeiro.");
    return;
  }
  try {
    const resp = await fetch("https://generativelanguage.googleapis.com/v1beta/voices?language_code=pt-BR&context=Audiobook&page_size=50", {
      headers: { "x-goog-api-key": key }
    });
    if (!resp.ok) throw new Error("Status " + resp.status);
    const data = await resp.json();
    const voices = data.voices || [];
    const sel = document.getElementById("voice-select");
    let added = 0;
    voices.forEach((v) => {
      const id = v.id || v.name;
      const name = v.displayName || v.display_name || id;
      if (id && !Array.from(sel.options).some(o => o.value === id)) {
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = name + " (Extended Library pt-BR)";
        sel.appendChild(opt);
        added++;
      }
    });
    alert(added > 0 ? added + " vozes pt-BR adicionais carregadas na lista!" : "As vozes pt-BR padrão já estão listadas.");
  } catch (e) {
    alert("Não foi possível consultar /v1beta/voices: " + e.message);
  }
}

async function handleEpubUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  pausePlayback();
  setStatus("Abrindo arquivo EPUB: " + file.name + "...");
  try {
    const zip = await JSZip.loadAsync(file);
    const containerEntry = zip.file("META-INF/container.xml");
    if (!containerEntry) throw new Error("META-INF/container.xml não encontrado no EPUB");
    const containerXml = await containerEntry.async("string");
    const parser = new DOMParser();
    const containerDoc = parser.parseFromString(containerXml, "application/xml");
    const rootfiles = containerDoc.getElementsByTagName("rootfile");
    const rootfile = rootfiles.length > 0 ? rootfiles[0].getAttribute("full-path") : "content.opf";
    const baseDir = rootfile.includes("/") ? rootfile.slice(0, rootfile.lastIndexOf("/") + 1) : "";

    const opfEntry = zip.file(rootfile);
    if (!opfEntry) throw new Error("Arquivo OPF não encontrado: " + rootfile);
    const opfXml = await opfEntry.async("string");
    const opfDoc = parser.parseFromString(opfXml, "application/xml");

    const titleNodes = opfDoc.getElementsByTagNameNS("*", "title");
    const creatorNodes = opfDoc.getElementsByTagNameNS("*", "creator");
    const title = (titleNodes.length > 0 ? titleNodes[0].textContent.trim() : "") || file.name.replace(/\.epub$/i, "");
    const author = (creatorNodes.length > 0 ? creatorNodes[0].textContent.trim() : "") || "Autor";

    const manifest = {};
    const items = opfDoc.getElementsByTagName("item");
    for (let i = 0; i < items.length; i++) {
      const id = items[i].getAttribute("id");
      const href = items[i].getAttribute("href");
      if (id && href) manifest[id] = href;
    }

    const spine = [];
    const itemrefs = opfDoc.getElementsByTagName("itemref");
    for (let i = 0; i < itemrefs.length; i++) {
      const idref = itemrefs[i].getAttribute("idref");
      if (idref) spine.push(idref);
    }

    const paragraphs = [];
    const chapters = [];
    let curChapTitle = "Início / Introdução";
    let curChapIdx = 0;
    let chapStart = 0;

    for (const idref of spine) {
      const href = manifest[idref];
      if (!href) continue;
      const entry = zip.file(baseDir + href) || zip.file(href);
      if (!entry) continue;
      const html = await entry.async("string");
      const htmlDoc = parser.parseFromString(html, "text/html");
      htmlDoc.querySelectorAll("h1, h2, h3, h4, p").forEach(el => {
        const txt = (el.textContent || "").replace(/\s+/g, " ").trim();
        if (txt.length < 2 || txt.startsWith("@page") || txt.toLowerCase() === "index") return;
        const isHeading = /^h[1-4]$/i.test(el.tagName) || /^(PRÓLOGO|PREFÁCIO|POSFÁCIO|EPÍLOGO|CAPÍTULO\s+(?:\d+|[IVXLCDM]+|UM|DOIS|TRÊS|QUATRO|CINCO|SEIS|SETE|OITO|NOVE|DEZ))\b/i.test(txt);
        const idx = paragraphs.length;
        if (isHeading && idx > chapStart) {
          chapters.push({ index: curChapIdx, title: curChapTitle, start: chapStart, end: idx - 1 });
          curChapIdx++;
          curChapTitle = txt;
          chapStart = idx;
        } else if (isHeading && idx === 0) {
          curChapTitle = txt;
        }
        paragraphs.push({ i: idx, c: curChapIdx, ct: curChapTitle, t: txt, h: isHeading ? 1 : 0 });
      });
    }
    if (paragraphs.length > 0) {
      chapters.push({ index: curChapIdx, title: curChapTitle, start: chapStart, end: paragraphs.length - 1 });
    }

    applyBook({
      bookId: "custom_" + file.name + "_" + paragraphs.length,
      title: title,
      author: author,
      language: "pt-BR",
      chapters: chapters,
      paragraphs: paragraphs
    });
  } catch (err) {
    showError("Erro ao abrir EPUB: " + err.message);
  } finally {
    event.target.value = "";
  }
}

function openModal(id) {
  if (id === "chapters-modal") renderChaptersList();
  if (id === "search-modal") {
    document.getElementById("jump-number-input").value = currentParagraphIndex + 1;
  }
  document.getElementById(id).classList.add("open");
}
function closeModal(id) {
  document.getElementById(id).classList.remove("open");
}
function setStatus(msg) {
  document.getElementById("conn-status").textContent = msg;
}
function showError(msg) {
  const b = document.getElementById("error-banner");
  document.getElementById("error-text").textContent = msg;
  b.style.display = "flex";
}
function hideError() {
  document.getElementById("error-banner").style.display = "none";
}
